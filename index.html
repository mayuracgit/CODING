@id: jdbc-transactions
@module: jdbc
@title: Transactions, Batching & Connection Pooling
@level: 4
@time: 22
@prereq: jdbc-basics
@next: reflection
@tags: transaction, autocommit, commit, rollback, savepoint, isolation level, acid, batch, addbatch, connection pool, hikaricp, datasource
===
## Transactions

A **transaction** groups statements into one atomic unit: all succeed (**commit**) or none do (**rollback**). JDBC connections start in **auto-commit mode** — every statement commits immediately — so multi-step operations must disable it.

```java
public void transfer(long fromId, long toId, BigDecimal amount) throws SQLException {
    try (Connection con = dataSource.getConnection()) {
        con.setAutoCommit(false);                          // begin a transaction
        try (PreparedStatement debit = con.prepareStatement(
                 "UPDATE account SET balance = balance - ? WHERE id = ? AND balance >= ?");
             PreparedStatement credit = con.prepareStatement(
                 "UPDATE account SET balance = balance + ? WHERE id = ?")) {

            debit.setBigDecimal(1, amount); debit.setLong(2, fromId); debit.setBigDecimal(3, amount);
            if (debit.executeUpdate() != 1) throw new SQLException("Insufficient funds or account missing");

            credit.setBigDecimal(1, amount); credit.setLong(2, toId);
            credit.executeUpdate();

            con.commit();                                  // both updates become permanent together
        } catch (SQLException | RuntimeException e) {
            con.rollback();                                // undo everything since setAutoCommit(false)
            throw e;
        } finally {
            con.setAutoCommit(true);                       // restore before returning to the pool
        }
    }
}
```

**ACID**: Atomicity (all or nothing), Consistency (constraints hold), Isolation (concurrent transactions don't see each other's partial work, to a configurable degree), Durability (committed data survives crashes).

`Savepoint`s allow partial rollback within a transaction (`con.setSavepoint()`, `con.rollback(sp)`).

## Isolation levels

| Level | Dirty read | Non-repeatable read | Phantom read |
|---|---|---|---|
| `READ_UNCOMMITTED` | Possible | Possible | Possible |
| `READ_COMMITTED` (PostgreSQL, Oracle, SQL Server default) | Prevented | Possible | Possible |
| `REPEATABLE_READ` (MySQL InnoDB default) | Prevented | Prevented | Possible per SQL standard (InnoDB largely prevents it) |
| `SERIALIZABLE` | Prevented | Prevented | Prevented |

Set with `con.setTransactionIsolation(Connection.TRANSACTION_READ_COMMITTED)`. Higher isolation = fewer anomalies but more locking/aborts.

## Batch operations

Sending 10,000 inserts one by one means 10,000 network round trips. Batching groups them:

```java
con.setAutoCommit(false);
try (PreparedStatement ps = con.prepareStatement("INSERT INTO stock_move(sku, qty) VALUES (?, ?)")) {
    int count = 0;
    for (StockMove m : moves) {
        ps.setString(1, m.sku());
        ps.setInt(2, m.qty());
        ps.addBatch();
        if (++count % 500 == 0) ps.executeBatch();     // flush in chunks to bound memory
    }
    ps.executeBatch();
    con.commit();
}
```

(For MySQL, add `rewriteBatchedStatements=true` to the JDBC URL so the driver rewrites the batch into multi-row inserts.)

## Connection pooling

Opening a physical DB connection is expensive (TCP + TLS handshake + authentication, often 10–100 ms). A **connection pool** keeps a set of open connections: `getConnection()` borrows one, `close()` **returns it to the pool** instead of closing it.

- **HikariCP** is Spring Boot's default pool (`spring.datasource.hikari.maximum-pool-size`, default 10).
- Pool size should reflect what the **database** can handle, not the number of application threads. A common starting formula from HikariCP's docs: `connections ≈ (cores × 2) + effective_spindle_count` on the DB server; then measure.
- Symptoms of pool exhaustion: requests waiting and failing with `Connection is not available, request timed out after 30000ms` — usually caused by leaks (connections not closed), long transactions, or slow queries.

:::project Spring and transactions
With `@Transactional`, Spring obtains a pooled connection, calls `setAutoCommit(false)`, binds it to the current thread (ThreadLocal) so all repository calls share it, and commits or rolls back when the method returns or throws (unchecked exceptions by default). Understanding raw JDBC explains the classic pitfalls: self-invocation bypassing the proxy, long transactions holding connections, and checked exceptions not rolling back.
:::

## Interview questions

:::qa intermediate
? How do you manage transactions in JDBC?
Disable auto-commit on the connection, execute the statements, call `commit()` if all succeed or `rollback()` in the catch block on failure, and restore auto-commit (or return the connection to the pool) in `finally`.
--- followup What is the default auto-commit mode?
True — each statement is committed immediately unless you turn it off.
:::

:::qa intermediate
? Why use connection pooling?
Creating connections is slow and resource-intensive for both application and database. A pool reuses a bounded number of open connections, reducing latency and protecting the database from being overwhelmed. `close()` returns the connection to the pool.
--- followup What happens if code forgets to close connections?
They leak: the pool runs out, and new requests block until the configured timeout and then fail. HikariCP's `leakDetectionThreshold` logs where leaked connections were borrowed.
:::

:::qa scenario
? A nightly import inserting 200,000 rows takes 40 minutes. How would you speed it up with JDBC?
Use a single transaction (or chunked commits) instead of auto-commit per row, `PreparedStatement` batching (e.g. 500–1000 rows per batch) with driver options like MySQL's `rewriteBatchedStatements=true`, disable unneeded per-row lookups (preload reference data into maps), and consider the database's bulk-load tools for very large volumes.
:::

:::quiz
? What does `connection.close()` do when the connection came from a HikariCP pool?
- Closes the TCP connection
+ Returns the connection to the pool for reuse
- Commits the transaction permanently
- Nothing
--- explain
Pools hand out proxy connections whose `close()` resets state and returns the physical connection to the pool.
:::
</script>

@id: reflection
@module: advanced
@title: Reflection
@level: 4
@time: 22
@prereq: classes-objects, annotations
@next: annotations
@tags: reflection, class, getdeclaredmethods, field, method, constructor, setaccessible, dynamic proxy, invocationhandler, frameworks
===
## Introduction

**Reflection** (`java.lang.reflect`) lets a running program **inspect and use classes, fields, methods and constructors it didn't know about at compile time**: list a class's methods, read a private field, call a method by name, create instances dynamically.

Why does it exist? Frameworks need it. Spring discovers `@Component` classes and injects dependencies, Hibernate maps entity fields to columns, Jackson converts objects to JSON, JUnit finds `@Test` methods — none of them know your classes at compile time.

## Getting a Class object

```java
Class<?> c1 = String.class;                    // class literal
Class<?> c2 = "hello".getClass();              // from an instance
Class<?> c3 = Class.forName("java.util.ArrayList");   // by name (loads and initialises the class)
```

## Inspecting and invoking

```java title="ReflectDemo.java"
import java.lang.reflect.*;
import java.util.Arrays;

public class ReflectDemo {
    static class Invoice {
        private String number = "INV-1";
        private double amount;
        public Invoice() {}
        public Invoice(double amount) { this.amount = amount; }
        public double withGst(double rate) { return amount * (1 + rate); }
        private String secret() { return "internal"; }
    }

    public static void main(String[] args) throws Exception {
        Class<Invoice> type = Invoice.class;
        System.out.println(type.getSimpleName() + " fields: " +
            Arrays.stream(type.getDeclaredFields()).map(Field::getName).toList());   // [number, amount]

        Constructor<Invoice> ctor = type.getConstructor(double.class);
        Invoice inv = ctor.newInstance(1000.0);                     // dynamic instantiation

        Method m = type.getMethod("withGst", double.class);          // public method by name + param types
        System.out.println(m.invoke(inv, 0.18));                     // ≈ 1180.0

        Field f = type.getDeclaredField("number");                   // private field
        f.setAccessible(true);                                       // bypass access checks
        f.set(inv, "INV-99");
        System.out.println(f.get(inv));                              // INV-99

        Method hidden = type.getDeclaredMethod("secret");
        hidden.setAccessible(true);
        System.out.println(hidden.invoke(inv));                      // internal
        System.out.println(Modifier.isPrivate(hidden.getModifiers())); // true
    }
}
```

| API | Returns |
|---|---|
| `getMethods()` | Public methods, including inherited |
| `getDeclaredMethods()` | All methods declared in this class (any access), not inherited |
| `getFields()` / `getDeclaredFields()` | Same pattern for fields |
| `getConstructors()` / `getDeclaredConstructors()` | Constructors |
| `getAnnotation(X.class)` | Runtime-retained annotation |
| `getSuperclass()`, `getInterfaces()`, `getModifiers()` | Hierarchy and modifiers |

## Dynamic proxies

`java.lang.reflect.Proxy` creates, at runtime, an object implementing given interfaces whose every call goes to an `InvocationHandler` — the basis of AOP-style cross-cutting behaviour.

```java title="ProxyDemo.java"
import java.lang.reflect.Proxy;

public class ProxyDemo {
    interface PaymentService { String pay(String orderId, double amount); }

    public static void main(String[] args) {
        PaymentService real = (id, amt) -> "paid " + id;
        PaymentService timed = (PaymentService) Proxy.newProxyInstance(
            PaymentService.class.getClassLoader(),
            new Class<?>[]{PaymentService.class},
            (proxy, method, methodArgs) -> {
                long start = System.nanoTime();
                try {
                    return method.invoke(real, methodArgs);          // delegate to the real object
                } finally {
                    System.out.println(method.getName() + " took " + (System.nanoTime() - start) / 1000 + " µs");
                }
            });
        System.out.println(timed.pay("O-1", 499));
    }
}
```

Spring uses JDK dynamic proxies (for interfaces) or CGLIB/ByteBuddy-generated subclasses (for classes) to implement `@Transactional`, `@Cacheable`, `@Async` and security annotations.

## Costs and limits

- **Performance**: reflective calls were historically much slower; since Java 18 (JEP 416) core reflection is reimplemented on method handles and the JIT optimises hot reflective calls well, but lookup (`getMethod`) is still expensive — cache `Method` objects.
- **Safety**: bypasses compile-time checks; typos in names fail at runtime.
- **Encapsulation**: `setAccessible(true)` on JDK internals is blocked by default since Java 16/17 (strong encapsulation); modules must `open` packages for deep reflection.
- **Native images** (GraalVM) require reflection configuration up front.

## Interview questions

:::qa intermediate
? What is reflection and where is it used?
The ability to inspect and manipulate classes, methods, fields and constructors at runtime. It powers frameworks: dependency injection (Spring), ORM (Hibernate), serialisation (Jackson), test runners (JUnit), and dynamic proxies for AOP.
--- followup Disadvantages?
Slower than direct calls (especially lookups), loses compile-time type checking, breaks encapsulation, complicates refactoring and ahead-of-time compilation, and is restricted by the module system.
:::

:::qa tricky
? Can reflection break a singleton? How do you prevent it?
Yes — `getDeclaredConstructor().setAccessible(true)` then `newInstance()` creates a second instance of a private-constructor singleton. Prevent it by throwing from the constructor if an instance already exists, or use an `enum` singleton, which reflection cannot instantiate.
:::

:::quiz
? Which method returns a class's private methods?
- `getMethods()`
+ `getDeclaredMethods()`
- `getPrivateMethods()`
- `getAllMethods()`
--- explain
`getDeclaredMethods` returns all methods declared by the class regardless of access (excluding inherited ones).
:::
</script>

@id: annotations
@module: advanced
@title: Annotations & Custom Annotations
@level: 3
@time: 18
@java: 5+
@prereq: interfaces
@next: reflection, cloning
@tags: annotation, @override, @deprecated, @functionalinterface, retention, target, custom annotation, meta annotation, annotation processor, lombok
===
## Introduction

An **annotation** is metadata attached to code — classes, methods, fields, parameters — that doesn't change the code's logic by itself but can be read by the **compiler**, by **annotation processors** at build time, or by **frameworks via reflection** at runtime.

Before annotations (Java 5), such metadata lived in XML files (Hibernate mappings, Spring bean XML, `web.xml`) far from the code it described.

## Built-in annotations

| Annotation | Purpose |
|---|---|
| `@Override` | Compiler verifies the method actually overrides/implements something |
| `@Deprecated(since="…", forRemoval=true)` | Marks APIs to avoid; compiler warns callers |
| `@SuppressWarnings("unchecked")` | Silences specific compiler warnings |
| `@FunctionalInterface` | Compiler enforces exactly one abstract method |
| `@SafeVarargs` | Asserts a generic varargs method is safe |

## Meta-annotations — annotations for annotations

| Meta-annotation | Controls |
|---|---|
| `@Retention` | How long it's kept: `SOURCE` (discarded by javac, e.g. `@Override`, Lombok), `CLASS` (in class file, not at runtime — default), `RUNTIME` (readable via reflection — what frameworks need) |
| `@Target` | Where it can appear: `TYPE`, `METHOD`, `FIELD`, `PARAMETER`, `CONSTRUCTOR`, `TYPE_USE`… |
| `@Documented` | Included in Javadoc |
| `@Inherited` | Class annotations inherited by subclasses |
| `@Repeatable` | Can be applied more than once (Java 8) |

## A custom annotation processed at runtime

```java title="AuditDemo.java"
import java.lang.annotation.*;
import java.lang.reflect.Method;

public class AuditDemo {
    @Retention(RetentionPolicy.RUNTIME)          // must be RUNTIME to read via reflection
    @Target(ElementType.METHOD)
    @interface Audited {
        String action();                          // element (required: no default)
        boolean logArgs() default false;          // element with a default
    }

    static class SupplierService {
        @Audited(action = "SUPPLIER_BLOCK", logArgs = true)
        public void block(String supplierId) { System.out.println("blocking " + supplierId); }

        public void list() { }
    }

    public static void main(String[] args) throws Exception {
        SupplierService svc = new SupplierService();
        for (Method m : SupplierService.class.getDeclaredMethods()) {
            Audited a = m.getAnnotation(Audited.class);
            if (a != null) {
                System.out.println("AUDIT " + a.action() + " args logged: " + a.logArgs());
                m.invoke(svc, "SUP-17");
            }
        }
    }
}
```

Annotation elements may be primitives, `String`, `Class`, enums, other annotations, or arrays of these — never arbitrary objects, and values must be compile-time constants.

## Three ways annotations get processed

1. **Compiler** — `@Override`, `@FunctionalInterface`.
2. **Annotation processors at compile time** — generate code or validate: Lombok (`@Getter`, `@Builder`), MapStruct mappers, JPA static metamodel, Dagger.
3. **Reflection at runtime** — Spring (`@Component`, `@Autowired`, `@Transactional`), JPA (`@Entity`, `@Column`), Jackson (`@JsonProperty`), Bean Validation (`@NotNull`, `@Valid`), JUnit (`@Test`).

:::project How a Spring annotation actually "works"
`@Transactional` does nothing on its own. At startup Spring scans beans, finds methods carrying it via reflection, and wraps the bean in a proxy whose interceptor opens and commits transactions around the call. That's also why `@Transactional` on a **private** method, or a call from another method of the **same** class (self-invocation), has no effect — the call never passes through the proxy.
:::

## Interview questions

:::qa intermediate
? What are annotations and how are they processed?
Metadata attached to program elements. They're processed by the compiler (e.g. `@Override`), by annotation processors during compilation to generate or verify code (Lombok, MapStruct), or at runtime via reflection by frameworks (Spring, JPA, Jackson) — the latter requires `@Retention(RUNTIME)`.
--- followup How do you create a custom annotation?
Declare `@interface Name { … }` with elements (methods with optional `default` values), and meta-annotate it with `@Retention` and `@Target` to control lifetime and allowed locations.
:::

:::qa tricky
? Why does a custom annotation return null from `getAnnotation` at runtime?
Its retention is `CLASS` (the default) or `SOURCE`, so it isn't available to reflection. It needs `@Retention(RetentionPolicy.RUNTIME)`.
:::

:::quiz
? Which retention policy makes an annotation visible to reflection?
- `SOURCE`
- `CLASS`
+ `RUNTIME`
- `REFLECTION`
--- explain
Only `RUNTIME` annotations are stored in the class file and exposed by the reflection API.
:::
</script>

<script type="text/x-java-topic">
@id: cloning
@module: advanced
@title: Object Cloning: Shallow vs Deep Copy
@level: 3
@time: 15
@prereq: object-class, immutability
@next: jvm-architecture
@tags: clone, cloneable, shallow copy, deep copy, copy constructor, clonenotsupportedexception, prototype
===
## Introduction

Sometimes you need an independent copy of an object — to modify a draft without touching the original, or to snapshot state. Java offers `Object.clone()`, but it has a famously awkward design; copy constructors and factory methods are usually better.

## How clone() works

- `Object.clone()` is `protected` and **native**: it allocates a new object of the same class and copies every field bit-for-bit — a **shallow copy**.
- It works only if the class implements the marker interface **`Cloneable`**; otherwise it throws `CloneNotSupportedException` (a checked exception).
- No constructor is called.

## Shallow vs deep copy

```java title="CopyDemo.java"
import java.util.ArrayList;
import java.util.List;

public class CopyDemo {
    static class Order implements Cloneable {
        String id;
        List<String> items = new ArrayList<>();

        Order(String id) { this.id = id; }

        Order(Order other) {                               // copy constructor: explicit deep copy
            this.id = other.id;                            // String is immutable → sharing is fine
            this.items = new ArrayList<>(other.items);     // new list with the same (immutable) elements
        }

        @Override
        public Order clone() {                             // covariant return, public, no checked exception
            try {
                Order copy = (Order) super.clone();        // shallow: copy.items == this.items!
                copy.items = new ArrayList<>(items);       // make it deep for the mutable field
                return copy;
            } catch (CloneNotSupportedException e) {
                throw new AssertionError(e);               // can't happen: we implement Cloneable
            }
        }
    }

    public static void main(String[] args) {
        Order original = new Order("O-1");
        original.items.add("pen");

        Order shallow = new Order("tmp");
        shallow.items = original.items;                    // what a pure shallow copy would do
        shallow.items.add("book");
        System.out.println(original.items);                // [pen, book] — changed through the shared list

        Order deep = original.clone();
        deep.items.add("bag");
        Order copy = new Order(original);
        copy.items.clear();
        System.out.println(original.items + " " + deep.items + " " + copy.items);   // [pen, book] [pen, book, bag] []
    }
}
```

| | Shallow copy | Deep copy |
|---|---|---|
| Primitive fields | Copied | Copied |
| Reference fields | **Reference copied** — both objects share the referenced object | Referenced mutable objects are copied recursively |
| Independence | Changes to shared mutable objects affect both | Fully independent |
| Cost | Cheap | Proportional to the object graph |

## Why clone() is considered broken

- `Cloneable` has no `clone()` method — it merely changes the behaviour of a protected method in `Object`.
- The checked `CloneNotSupportedException` and casts add noise.
- It bypasses constructors, so invariants and `final` fields can't be set properly (a `final List` field can't be reassigned to a deep copy).
- Every class in a hierarchy must cooperate by calling `super.clone()`.

Prefer **copy constructors** (`new ArrayList<>(list)`), **static factory methods** (`List.copyOf`), or **immutable objects** that never need copying. Arrays are the exception: `array.clone()` works well and is idiomatic.

## Interview questions

:::qa intermediate
? What is the difference between shallow and deep copy?
A shallow copy duplicates the object's fields as-is, so reference fields point to the same objects as the original. A deep copy also copies the objects those references point to (recursively for mutable parts), making the copy fully independent.
--- followup How is clone() implemented by default?
`Object.clone()` performs a shallow field-by-field copy, only if the class implements `Cloneable`; otherwise it throws `CloneNotSupportedException`.
:::

:::qa tricky
? Why is Cloneable called a "broken" interface?
It declares no methods; it only changes the behaviour of `Object`'s protected `clone()`. Cloning bypasses constructors, doesn't work with final fields that need deep copies, requires casts and a checked exception, and depends on every superclass implementing it correctly. Copy constructors or factories are preferred.
:::

:::quiz
? `int[] b = a.clone();` for `int[] a = {1, 2};` then `b[0] = 9;` — what is `a[0]`?
+ 1
- 9
- Compile error
- `CloneNotSupportedException`
--- explain
Array clone creates a new array. For primitive arrays that's effectively a deep copy. (For arrays of objects, the elements' references are shared.)
:::
</script>

<script type="text/x-java-topic">
@id: jvm-architecture
@module: jvm
@title: JVM Architecture
@level: 4
@time: 30
@prereq: compilation-execution
@next: class-loading, memory-areas
@tags: jvm, architecture, class loader subsystem, runtime data areas, heap, stack, metaspace, pc register, native method stack, execution engine, interpreter, jit, c1, c2, jni, code cache
===
## Introduction

The **Java Virtual Machine** is the engine that runs bytecode. Understanding its architecture explains start-up time, memory errors (`OutOfMemoryError: Metaspace` vs `Java heap space` vs `StackOverflowError`), thread dumps, GC pauses and why the same code gets faster after warm-up.

## The big picture

:::diagram HotSpot JVM
[a] Class Loader Subsystem :: Loading (Bootstrap → Platform → Application loaders) · Linking (Verify → Prepare → Resolve) · Initialization (static initialisers)
[w] Heap (shared) :: all objects & arrays · Young gen (Eden + Survivors) · Old gen || [w] Method Area / Metaspace (shared, native memory) :: class metadata · method bytecode · runtime constant pool
[g] Java Stack (per thread) :: frames: local variables · operand stack · frame data || [g] PC Register (per thread) :: address of the current bytecode instruction || [g] Native Method Stack (per thread) :: frames for native (C/C++) methods
[v] Execution Engine :: Interpreter · JIT compilers (C1, C2) · Garbage Collector || [t] Native Interface (JNI) & libraries :: bridge to OS / C code · code cache for compiled methods
:::

## 1. Class loader subsystem

Loads `.class` files on demand, **links** them (verification of bytecode safety, preparation of static fields with defaults, resolution of symbolic references) and **initialises** them (runs `<clinit>`: static blocks and static field initialisers). Details in [Class loading](#class-loading).

## 2. Runtime data areas

| Area | Per thread / shared | Stores | Error when exhausted |
|---|---|---|---|
| **Heap** | Shared | All objects and arrays (including the string pool and static field values) | `OutOfMemoryError: Java heap space` |
| **Method area** (HotSpot: **Metaspace**, native memory, Java 8+) | Shared | Class structures: fields/method metadata, bytecode, runtime constant pool | `OutOfMemoryError: Metaspace` |
| **Java stack** | Per thread | One **frame** per method call: local variables, operand stack, reference to constant pool, return info | `StackOverflowError` (or OOM if a new thread's stack can't be allocated) |
| **PC register** | Per thread | Address of the current bytecode instruction (undefined for native methods) | — |
| **Native method stack** | Per thread | Frames for native (JNI) code | `StackOverflowError` |
| **Code cache** (HotSpot) | Shared | JIT-compiled native code | JIT stops compiling: "CodeCache is full" warning |
| **Direct / off-heap memory** | Shared | `ByteBuffer.allocateDirect`, Netty buffers | `OutOfMemoryError: Direct buffer memory` |

### A stack frame in detail

```java
int add(int a, int b) { int c = a + b; return c; }
```

- **Local variable array**: slot 0 = `this` (instance methods), 1 = a, 2 = b, 3 = c.
- **Operand stack**: `iload_1`, `iload_2` push a and b; `iadd` pops both and pushes the sum; `istore_3` stores it into c.
- **Frame data**: link to the runtime constant pool, return address, exception table reference.

## 3. Execution engine

- **Interpreter** — executes bytecode instruction by instruction; starts immediately, runs slowly.
- **JIT compilers** — HotSpot's **tiered compilation**: C1 (client) compiles warm methods quickly with profiling; C2 (server) recompiles hot methods with aggressive optimisations: method **inlining**, **escape analysis** (scalar replacement: objects that never escape a method may not be heap-allocated at all), loop unrolling, lock elision, dead-code elimination, intrinsics (hand-written CPU instructions for `System.arraycopy`, `Math` functions, string methods). Speculative optimisations can be undone (**deoptimisation**).
- **Garbage collector** — reclaims unreachable objects. See [Garbage Collection](#garbage-collection).

Useful flags to observe: `-XX:+PrintCompilation`, `-Xlog:gc`, `-XX:TieredStopAtLevel=1` (C1 only — faster start-up for short-lived tools).

## 4. Native interface

**JNI** lets Java call C/C++ libraries and vice versa (used internally by the JDK for file I/O, networking, threads). Java 22 finalised the **Foreign Function & Memory API** (Project Panama) as a safer, faster alternative.

## Real-life example

:::analogy A factory
The **class loader** is receiving: it accepts raw materials (class files), inspects them for safety (verification) and shelves them. **Metaspace** is the blueprint library. The **heap** is the shared warehouse where products (objects) are stored. Each worker (**thread**) has a personal workbench (**stack**) and a clipboard showing which instruction they're on (**PC register**). The **execution engine** is the workforce: new workers read instructions step by step (interpreter); experienced ones turn frequent tasks into muscle memory (JIT). The **GC** is the cleaning crew clearing out products nobody will ever collect.
:::

:::project Mapping errors to areas in production
- `java.lang.OutOfMemoryError: Java heap space` → heap too small or a leak; take a heap dump (`-XX:+HeapDumpOnOutOfMemoryError`).
- `OutOfMemoryError: Metaspace` → too many classes loaded, typically class-loader leaks on repeated redeploys or runaway dynamic proxy/bytecode generation.
- `StackOverflowError` → deep or infinite recursion (e.g. bidirectional JPA relationships serialised by Jackson, or `toString()` calling each other).
- `OutOfMemoryError: unable to create native thread` → too many threads / OS limits.
In containers, set heap as a percentage (`-XX:MaxRAMPercentage=75`) — the JVM is container-aware since Java 10 (and 8u191).
:::

## Interview questions

:::qa advanced
? Explain the JVM architecture.
It has a class loader subsystem (loading, linking, initialisation), runtime data areas (shared heap and method area/Metaspace; per-thread stacks, PC registers and native method stacks), an execution engine (interpreter, JIT compilers C1/C2, garbage collector), and the native interface for calling platform code.
--- followup What is stored on the stack vs the heap?
The stack holds per-invocation frames — primitive local variables, references, operand stacks — and is private to a thread. The heap holds all objects and arrays, shared by all threads and managed by the GC.
--- followup What replaced PermGen and why?
Java 8 replaced PermGen with Metaspace in native memory. PermGen had a fixed maximum size that was hard to tune and caused frequent `OutOfMemoryError: PermGen space` (e.g. on redeploys); Metaspace grows dynamically (capped with `-XX:MaxMetaspaceSize`) and interned strings/static values moved to the heap.
:::

:::qa intermediate
? What is the JIT compiler and why does Java get faster after warm-up?
It compiles frequently executed bytecode to optimised native code at runtime, using profiling data gathered while interpreting. Early requests run interpreted or lightly optimised; once hot paths are compiled by C2, execution is much faster.
:::

:::qa tricky
? Are all objects always allocated on the heap?
Semantically yes, but the JIT's escape analysis can apply scalar replacement: if an object provably never escapes a method, its fields may be kept in registers/stack slots and no heap allocation happens. It's an optimisation invisible to program behaviour.
:::

:::quiz
? Which runtime area is shared between threads?
- Java stack
- PC register
+ Heap
- Native method stack
--- explain
Heap and method area are shared; stacks and PC registers are per thread.
:::
</script>

<script type="text/x-java-topic">
@id: class-loading
@module: jvm
@title: Class Loading & Parent Delegation
@level: 4
@time: 20
@prereq: jvm-architecture
@next: memory-areas
@tags: class loader, bootstrap, platform, extension, application, parent delegation, linking, verification, initialization, custom class loader, noclassdeffounderror, classnotfoundexception
===
## Introduction

Classes are not all loaded at start-up. The JVM loads each class **lazily**, the first time it's needed, via **class loaders**. Understanding them explains `ClassNotFoundException` vs `NoClassDefFoundError`, why two "identical" classes can be incompatible (`ClassCastException: com.x.A cannot be cast to com.x.A`), and how servers and Spring Boot load applications from nested JARs.

## The built-in loaders (Java 9+)

| Loader | Loads | Implemented in |
|---|---|---|
| **Bootstrap** | Core platform modules (`java.base`: `java.lang`, `java.util`…) | Native code; represented as `null` in Java |
| **Platform** (was *Extension* before Java 9) | Other Java SE / JDK modules (`java.sql`, `java.xml.crypto`…) | Java |
| **Application / System** | Your classpath and module path | Java |

Custom loaders (servlet containers, OSGi, Spring Boot's `LaunchedClassLoader`) sit below the application loader.

## Parent delegation model

:::flow
Request: load com.shop.Order :: application class loader receives it
delegate to parent :: platform loader → delegates to bootstrap
bootstrap :: not a core class → can't find it → returns to child
platform :: can't find it → returns to child
* application loader :: finds com/shop/Order.class on the classpath → defines the class
:::

Each loader **first asks its parent**; only if the parent can't find the class does it look itself. Benefits:

- **Security/consistency** — core classes like `java.lang.String` always come from the bootstrap loader; a JAR can't replace them.
- **No duplicates** — a class is loaded once by the highest loader that can see it.

A class's runtime identity is **(fully qualified name + defining class loader)**. The same `.class` bytes loaded by two loaders produce two distinct, incompatible types. (Servlet containers deliberately invert delegation for web-app classes — "child-first" — so each app can use its own library versions.)

## Loading → linking → initialisation

1. **Loading** — find the binary, create the class's internal representation in Metaspace and a `java.lang.Class` object.
2. **Linking**
   - *Verification* — bytecode verifier checks type safety, stack consistency, valid branches.
   - *Preparation* — allocate static fields and set **default** values.
   - *Resolution* — turn symbolic references into direct ones (often lazily, at first use).
3. **Initialisation** — run the class initialiser (`static` field assignments and `static {}` blocks in textual order), exactly once, under a lock. Triggered by first *active use*: `new`, static method call, non-constant static field access, reflection (`Class.forName`), initialising a subclass, or being the main class.

```java title="InitTrigger.java"
public class InitTrigger {
    static class Config {
        static final int TIMEOUT = 30;                       // compile-time constant: inlined, no init
        static final String REGION = System.getenv().getOrDefault("REGION", "ap-south-1");  // not a constant
        static { System.out.println("Config initialised"); }
    }

    public static void main(String[] args) throws Exception {
        System.out.println(Config.TIMEOUT);     // prints 30 — "Config initialised" NOT printed
        System.out.println(Config.REGION);      // triggers initialisation first
        Class.forName("java.util.ArrayList");   // loads & initialises by name
    }
}
```

## ClassNotFoundException vs NoClassDefFoundError

| | `ClassNotFoundException` | `NoClassDefFoundError` |
|---|---|---|
| Type | Checked exception | Error (LinkageError) |
| When | Explicit loading by name (`Class.forName`, `loadClass`) fails | A class present at compile time can't be found/defined at runtime while resolving a reference |
| Typical cause | Missing driver JAR, typo in class name | Missing dependency at runtime; or the class's static initialiser failed earlier (`ExceptionInInitializerError` first, then NCDFE on later uses) |

## Interview questions

:::qa advanced
? What is the parent delegation model?
When a class loader is asked to load a class, it first delegates to its parent; only if the parent (and ultimately the bootstrap loader) can't find it does the child search its own locations. This keeps core classes trusted and avoids loading the same class multiple times.
--- followup Can two classes with the same name coexist in a JVM?
Yes, if loaded by different class loaders — each is a distinct runtime type. Casting between them fails with `ClassCastException`. This is how application servers isolate deployed applications.
:::

:::qa intermediate
? When is a class initialised?
On first active use: creating an instance, invoking a static method, reading or writing a static field that isn't a compile-time constant, reflective loading via `Class.forName`, initialising a subclass, or when it's the main class. Referencing a `static final` compile-time constant doesn't trigger it, since the value is inlined.
:::

:::quiz
? Which loader loads `java.lang.String`?
+ Bootstrap class loader
- Platform class loader
- Application class loader
- Whichever loader requested it
--- explain
Core `java.base` classes are always defined by the bootstrap loader, thanks to parent delegation.
:::
</script>

<script type="text/x-java-topic">
@id: memory-areas
@module: memory
@title: Stack vs Heap & the Java Memory Layout
@level: 3
@time: 20
@prereq: jvm-architecture
@next: garbage-collection
@tags: stack, heap, memory, young generation, old generation, eden, survivor, metaspace, tlab, xmx, xms, xss, escape analysis
===
## Stack vs heap

```java title="MemoryLayout.java"
public class MemoryLayout {
    static class Invoice {
        long id; double amount; String customer;
        Invoice(long id, double amount, String customer) { this.id = id; this.amount = amount; this.customer = customer; }
    }

    static double withTax(Invoice inv, double rate) {   // new frame: inv (ref), rate (value), result
        double result = inv.amount * (1 + rate);
        return result;
    }

    public static void main(String[] args) {
        int count = 1;                                      // stack: primitive value
        Invoice inv = new Invoice(7, 1000, "Asha");         // stack: reference; heap: Invoice + "Asha"
        double total = withTax(inv, 0.18);                  // frame pushed, then popped
        System.out.println(count + " " + total);
    }
}
```

:::diagram During withTax(inv, 0.18)
[a] main's stack (thread "main") :: frame main: args, count = 1, inv → #1, total · frame withTax: inv → #1, rate = 0.18, result
[w] Heap (shared) :: #1 Invoice{id=7, amount=1000.0, customer → #2} · #2 String "Asha" (pooled literal)
:::

| | Stack | Heap |
|---|---|---|
| Holds | Frames: primitive locals, references, partial results | Objects and arrays |
| Scope | One per thread; private | Shared by all threads |
| Lifetime | Frame popped on method return | Until unreachable and collected by GC |
| Allocation | Very fast (move a pointer) | Fast (bump pointer in a TLAB) but needs GC later |
| Size | Small (`-Xss`, typically 512 KB – 1 MB per platform thread) | Large (`-Xms` initial / `-Xmx` max) |
| Error | `StackOverflowError` | `OutOfMemoryError: Java heap space` |
| Thread safety | Inherently thread-confined | Needs synchronisation when shared |

**TLAB (Thread-Local Allocation Buffer):** each thread gets a private chunk of Eden and allocates objects by simply bumping a pointer — no locking. That's why `new` is cheap in Java.

## The generational heap

Most objects **die young** (the *weak generational hypothesis*): request DTOs, temporary strings, iterators. Collectors therefore split the heap:

:::diagram Heap generations (G1 uses regions, but the same logical generations)
[g] Young generation :: Eden (new objects) · Survivor S0 · Survivor S1 — collected often, quickly (minor GC) || [w] Old (tenured) generation :: long-lived objects promoted after surviving several minor GCs — collected rarely (major/mixed GC)
[v] Metaspace (outside the heap, native memory) :: class metadata — not part of the generations
:::

Object journey: allocated in **Eden** → survives a minor GC → copied to a **Survivor** space, age +1 → bounces between S0/S1 each minor GC → after reaching the tenuring threshold (up to 15), **promoted** to **Old**. Very large objects may be allocated directly in old (or, in G1, "humongous" regions).

## Key memory flags

| Flag | Meaning |
|---|---|
| `-Xms512m` / `-Xmx2g` | Initial / maximum heap |
| `-Xss1m` | Thread stack size |
| `-XX:MaxMetaspaceSize=256m` | Cap Metaspace (unbounded by default) |
| `-XX:MaxRAMPercentage=75` | Heap as % of container memory |
| `-XX:+HeapDumpOnOutOfMemoryError` | Write a heap dump when OOM happens |
| `-Xlog:gc*` | Unified GC logging (Java 9+) |

## Interview questions

:::qa basic
? Difference between stack and heap memory in Java?
The stack is per thread and stores method frames with primitive locals and references; it's freed automatically when methods return and overflows with `StackOverflowError`. The heap is shared, stores all objects and arrays, is managed by the garbage collector, and runs out with `OutOfMemoryError`.
--- followup Where is a local variable that references an object stored?
The reference is in the stack frame; the object is on the heap.
:::

:::qa intermediate
? Why is the heap divided into young and old generations?
Because most objects die young. Collecting the small young generation frequently with a copying collector is cheap — cost depends on *live* objects, which are few — while long-lived objects are promoted to the old generation and scanned rarely.
:::

:::quiz
? Where are new objects normally allocated?
+ Eden space of the young generation (in the thread's TLAB)
- Old generation
- Metaspace
- The thread's stack
--- explain
Most allocation happens in Eden through thread-local allocation buffers; large objects may go elsewhere depending on the collector.
:::
</script>

<script type="text/x-java-topic">
@id: garbage-collection
@module: memory
@title: Garbage Collection: Reachability, Generations & Collectors
@level: 4
@time: 32
@prereq: memory-areas
@next: memory-leaks
@tags: garbage collection, gc roots, reachability, mark sweep compact, minor gc, major gc, full gc, stop the world, g1, zgc, shenandoah, parallel gc, serial gc, weak reference, soft reference, finalize, system.gc
===
## Introduction

**Garbage collection** automatically reclaims memory occupied by objects the program can no longer use. It eliminates manual `free()` bugs (dangling pointers, double frees, most leaks) but introduces its own concerns: pause times, throughput and memory overhead. Knowing how it works lets you read GC logs, choose a collector and avoid accidental leaks.

## When is an object garbage? Reachability

The JVM does **not** use reference counting (which can't collect cycles). It uses **reachability tracing**: starting from **GC roots**, it follows references; everything reached is **live**, everything else is garbage — even cyclic structures.

**GC roots** include:

- Local variables and parameters in the stack frames of all live threads.
- Static fields of loaded classes.
- Active Java threads themselves.
- JNI references held by native code.
- Objects used as monitors (in `synchronized`), and JVM-internal references (system class loader, etc.).

```java title="Reachability.java"
public class Reachability {
    static class Node { Node next; byte[] payload = new byte[1024]; }
    static Node cache;                               // static field → GC root

    public static void main(String[] args) {
        Node a = new Node();                         // reachable from main's stack frame
        Node b = new Node();
        a.next = b; b.next = a;                      // a cycle
        a = null; b = null;                          // cycle now unreachable → collectable (no ref counting!)

        cache = new Node();                          // reachable from a static root → stays alive
        for (int i = 0; i < 1_000; i++) {
            Node tmp = new Node();                   // each becomes garbage when the iteration ends
        }
        System.out.println("done");
    }
}
```

## Object lifecycle

:::flow
Created :: new → Eden (TLAB)
In use (strongly reachable) :: referenced from a GC root chain
Unreachable :: last reference dropped / goes out of scope
* Collected :: memory reclaimed during a GC cycle (no destructor runs)
:::

## Basic algorithms

| Algorithm | Idea | Trade-off |
|---|---|---|
| **Mark–sweep** | Mark live objects, sweep the rest into free lists | Fragmentation |
| **Mark–compact** | Mark, then slide live objects together | No fragmentation; moving costs time |
| **Copying** | Copy live objects to an empty space; the old space is freed wholesale | Fast when few survive (young gen); needs spare space |
| **Generational** | Young gen via copying (often), old gen via mark-compact (rarely) | Exploits "most objects die young" |

## Minor, major and full GC

- **Minor GC** — collects the young generation. Frequent, usually short. Live objects are copied to survivor space or promoted.
- **Major / mixed GC** — collects the old generation (G1's *mixed* collections clean young plus some old regions).
- **Full GC** — collects the entire heap (and metaspace), traditionally with a long **stop-the-world** pause. Frequent full GCs signal an undersized heap, a leak, or `System.gc()` calls.

**Stop-the-world (STW)**: all application threads pause at a *safepoint* while the GC does work that can't run concurrently. Modern collectors minimise STW by doing most marking (and even compaction) **concurrently**.

## The collectors in HotSpot (Java 17 → 21)

| Collector | Flag | Design | Best for |
|---|---|---|---|
| **Serial** | `-XX:+UseSerialGC` | Single-threaded, STW | Small heaps, single-core containers, CLIs |
| **Parallel** | `-XX:+UseParallelGC` | Multi-threaded STW, maximises throughput | Batch jobs where pauses don't matter |
| **G1** (default since Java 9) | `-XX:+UseG1GC` | Heap split into equal **regions**; concurrent marking; collects regions with most garbage first; pause-time goal (`-XX:MaxGCPauseMillis=200`) | General-purpose servers — the sensible default |
| **ZGC** | `-XX:+UseZGC` | Concurrent marking **and relocation** with coloured pointers & load barriers; sub-millisecond pauses independent of heap size; production-ready in **Java 15**, **generational in Java 21** (default mode from 23) | Large heaps, latency-sensitive services |
| **Shenandoah** | `-XX:+UseShenandoahGC` | Concurrent compaction (Red Hat) | Low-latency, available in most OpenJDK builds |
| **Epsilon** | `-XX:+UseEpsilonGC` | No-op: allocates, never collects | Testing, very short-lived jobs |

CMS (Concurrent Mark Sweep) was deprecated in Java 9 and **removed in Java 14**.

## Reference types

| Type | Collected when | Use |
|---|---|---|
| Strong (normal) | Never while reachable | Everyday references |
| `SoftReference` | Only when memory is tight | Memory-sensitive caches (use with care) |
| `WeakReference` | At the next GC once only weakly reachable | `WeakHashMap` keys, canonicalising maps, listeners |
| `PhantomReference` | After finalisation; used with a `ReferenceQueue` | Post-mortem cleanup (`java.lang.ref.Cleaner`) |

## finalize() and System.gc()

- `finalize()` ran at an unpredictable time (or never), slowed GC, and could resurrect objects. **Deprecated since Java 9, deprecated for removal since Java 18.** Use try-with-resources or `Cleaner`.
- `System.gc()` is only a **hint**. By default HotSpot usually performs a full GC, which is rarely what you want in production; `-XX:+DisableExplicitGC` ignores it.

## Real-life example

:::analogy Cleaning an office
Imagine an office where nobody throws anything away. Every evening the cleaner (GC) starts from the employees' desks, the notice board and the filing cabinets (**GC roots**) and tags every document still connected to something in use — anything referenced from a desk, or referenced from a document that is. Untagged paper, even if two sheets are stapled to each other (a cycle), goes in the bin. The in-tray (**young generation**) is cleared nightly because most papers there are drafts; the archive room (**old generation**) is audited rarely. Old cleaners asked everyone to stand up while they worked (**stop-the-world**); modern ones (ZGC) clean around you while you keep working.
:::

:::project
Most Spring Boot services run well on **G1** with defaults — size the heap (`-XX:MaxRAMPercentage`) and enable GC logging (`-Xlog:gc*:file=gc.log`). Look at pause times and allocation rate in the logs or with tools like GCeasy, JDK Mission Control, or Micrometer's `jvm.gc.pause` metrics. Consider **Generational ZGC** (Java 21) for latency-critical APIs with large heaps.
:::

## Interview questions

:::qa advanced
? How does garbage collection work in Java?
The GC traces reachability from GC roots (thread stacks, static fields, JNI refs, active threads). Reachable objects are live; everything else is garbage and its memory is reclaimed. HotSpot collectors are generational: new objects go to Eden, survivors of minor GCs move through survivor spaces and are promoted to the old generation, which is collected less often. Different collectors (Serial, Parallel, G1, ZGC, Shenandoah) trade throughput, pause time and memory overhead.
--- followup What are GC roots?
The starting points of reachability analysis: local variables/operands in live thread stacks, static fields, active threads, JNI global references, monitor-held objects and JVM-internal references.
--- followup Can objects in a reference cycle be collected?
Yes. Java uses tracing, not reference counting, so a cycle unreachable from any root is garbage.
:::

:::qa intermediate
? Minor GC vs major GC vs full GC?
Minor GC cleans the young generation — frequent and fast. Major GC cleans the old generation. Full GC cleans the whole heap (and usually metaspace), typically with a long stop-the-world pause; frequent full GCs indicate memory pressure or leaks.
:::

:::qa intermediate
? Which garbage collector is the default and why?
G1 since Java 9 (for server-class machines). It balances throughput and predictable pause times by dividing the heap into regions, marking concurrently, and incrementally collecting the regions with the most garbage to meet a pause-time goal.
--- followup When would you choose ZGC?
For large heaps (tens or hundreds of GB) or latency-sensitive services where pauses must stay around a millisecond regardless of heap size, accepting some throughput and memory overhead. In Java 21+ use generational ZGC.
:::

:::qa tricky
? Does calling System.gc() force garbage collection?
No. It's a request the JVM may ignore (e.g. with `-XX:+DisableExplicitGC`). With default HotSpot settings it usually triggers a full GC, which is why calling it in production is discouraged.
:::

:::quiz
? Which is NOT a GC root?
- A local variable in a running thread's stack frame
- A static field of a loaded class
+ An object referenced only by another unreachable object
- An active thread
--- explain
Being referenced by garbage doesn't make an object live; reachability must trace back to a root.
:::

:::quiz
? Which collector was removed in Java 14?
- G1
+ CMS
- Parallel
- Serial
--- explain
Concurrent Mark Sweep was deprecated in Java 9 and removed in Java 14 (JEP 363).
:::
</script>

@id: memory-leaks
@module: memory
@title: Memory Leaks & OutOfMemoryError
@level: 4
@time: 22
@prereq: garbage-collection
@next: performance
@tags: memory leak, outofmemoryerror, heap dump, eclipse mat, jmap, static collection, listener, threadlocal leak, classloader leak, unclosed resources
===
## Can Java leak memory?

Yes — not by forgetting to `free`, but by **keeping references to objects you'll never use again**. The GC can only collect unreachable objects; a forgotten reference from a live structure keeps a whole object graph alive.

## Common leak patterns

| Pattern | Example | Fix |
|---|---|---|
| **Unbounded static collections / caches** | `static Map<String, Report> CACHE` that only grows | Bounded caches with eviction (Caffeine, `LinkedHashMap` LRU), TTLs |
| **Listeners / callbacks never removed** | Registering an observer with a long-lived publisher | Unregister, or use weak references |
| **ThreadLocal in thread pools** | `ThreadLocal.set()` without `remove()` | `try { … } finally { tl.remove(); }` |
| **Inner / anonymous classes capturing outer objects** | A lambda or anonymous `Runnable` submitted to a long-lived scheduler holding a big controller | Static nested classes; capture only what's needed |
| **Mutable keys in hash collections** | Key's hash changes → entry unreachable but retained | Immutable keys |
| **Unclosed resources** | Streams, connections, `Files.lines` | try-with-resources |
| **Class-loader leaks** | App server redeploys leave threads/ThreadLocals/JDBC drivers referencing old app classes | Deregister drivers, stop threads on shutdown |
| **Huge in-memory result sets** | `findAll()` on a million-row table | Pagination, streaming |
| **String/substring or interning misuse** | Interning unbounded dynamic strings | Don't intern user input |

```java title="LeakDemo.java"
import java.util.ArrayList;
import java.util.List;

public class LeakDemo {
    // Simulated leak: an ever-growing static "audit buffer"
    private static final List<byte[]> AUDIT = new ArrayList<>();

    static void handleRequest(int id) {
        byte[] payload = new byte[10_000];
        AUDIT.add(payload);                  // reference kept forever → never collectable
    }

    public static void main(String[] args) {
        Runtime rt = Runtime.getRuntime();
        for (int i = 1; i <= 5_000; i++) {
            handleRequest(i);
            if (i % 1_000 == 0) {
                long usedMb = (rt.totalMemory() - rt.freeMemory()) / (1024 * 1024);
                System.out.println(i + " requests, heap used ≈ " + usedMb + " MB");   // keeps climbing
            }
        }
    }
}
```

## Kinds of OutOfMemoryError

| Message | Meaning |
|---|---|
| `Java heap space` | Heap full of live objects (leak or undersized heap) |
| `GC overhead limit exceeded` | Parallel/Serial GC spending >98% of time in GC recovering <2% of heap |
| `Metaspace` | Too much class metadata — class-loader leaks, runaway proxy/bytecode generation |
| `unable to create native thread` | OS thread limit or not enough native memory for thread stacks |
| `Direct buffer memory` | Off-heap `ByteBuffer`s exhausted (`-XX:MaxDirectMemorySize`) |
| `Requested array size exceeds VM limit` | Trying to allocate an array larger than the VM supports |

## Diagnosing a leak — a practical workflow

1. **Observe** — heap usage after each GC keeps rising (a "staircase" in GC logs / metrics) and full GCs become frequent.
2. **Capture** — heap dump: `jcmd <pid> GC.heap_dump /tmp/heap.hprof` (or `jmap -dump:live,format=b,file=heap.hprof <pid>`), or automatically with `-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps`.
3. **Analyse** — Eclipse MAT, VisualVM or IntelliJ's profiler: sort by **retained size**, run the "Leak Suspects" report, inspect **paths to GC roots** to see *who* keeps the objects alive.
4. **Quick look** — `jcmd <pid> GC.class_histogram` shows instance counts per class; compare two snapshots over time.
5. **Fix** and verify under load.

:::project
A classic production leak in Spring services: a `@Service` singleton with a `private final Map<String, Object> cache = new HashMap<>()` that stores per-request data "temporarily" and never evicts it — plus it isn't thread-safe. Replace with a bounded concurrent cache (Spring Cache + Caffeine with `maximumSize` and `expireAfterWrite`).
:::

## Interview questions

:::qa intermediate
? Can there be memory leaks in Java? Give examples.
Yes — objects that are no longer needed but still reachable. Examples: unbounded static caches, unremoved listeners, `ThreadLocal`s not cleared in pooled threads, inner classes retaining outer instances, mutable hash keys, unclosed resources, class-loader leaks on redeploys.
--- followup How would you find one?
Watch post-GC heap trend, take heap dumps (`jcmd GC.heap_dump` or `HeapDumpOnOutOfMemoryError`), analyse with Eclipse MAT for dominators and paths to GC roots, then fix the retaining reference.
:::

:::qa scenario
? A service's memory grows steadily and it crashes with OutOfMemoryError every three days; restarting fixes it temporarily. What do you do?
Treat it as a leak: enable `HeapDumpOnOutOfMemoryError` and GC logging, take heap dumps at intervals (e.g. day 1 and day 2) and compare class histograms, open the dump in MAT, find the largest retained objects and their paths to GC roots (often a static map, cache, ThreadLocal or listener list), fix the retention (bounded cache, cleanup), and verify with a load test.
:::

:::quiz
? `OutOfMemoryError: Metaspace` most likely points to:
- Too many strings
+ Too many loaded classes / class-loader leak
- Deep recursion
- A large array allocation
--- explain
Metaspace holds class metadata; repeated redeploys or excessive dynamic class generation exhaust it.
:::
</script>

@id: performance
@module: memory
@title: Java Performance Fundamentals
@level: 4
@time: 20
@prereq: garbage-collection, collections-overview
@next: pattern-singleton
@tags: performance, profiling, jmh, benchmarking, jfr, jmc, allocation, string concatenation, boxing, big o, connection pool, caching, n+1
===
## Principles

1. **Measure first.** Intuition about bottlenecks is usually wrong. Profile real workloads.
2. **Algorithms and I/O dominate.** An O(n²) loop or an N+1 query pattern dwarfs any micro-optimisation.
3. **Allocation is cheap, but not free.** Reducing garbage reduces GC frequency.
4. **Optimise the hot path** — the small fraction of code where most time is spent.

## Tools

| Tool | Use |
|---|---|
| **JMH** (Java Microbenchmark Harness) | Correct micro-benchmarks — handles warm-up, dead-code elimination, forking |
| **Java Flight Recorder (JFR)** + **JDK Mission Control** | Low-overhead production profiling: CPU hotspots, allocations, locks, GC, I/O (`-XX:StartFlightRecording` or `jcmd <pid> JFR.start`) |
| async-profiler, VisualVM, IntelliJ Profiler | CPU/allocation flame graphs |
| `jcmd`, `jstack`, `jstat` | Thread dumps, heap info, GC statistics |
| GC logs (`-Xlog:gc*`) | Pause times, allocation rate, promotion |
| APM / Micrometer + Prometheus | Latency percentiles, JVM metrics in production |

:::warn Naive benchmarks lie
`long t = System.nanoTime(); for (…) work(); …` suffers from JIT warm-up, on-stack replacement, dead-code elimination (unused results optimised away) and GC noise. Use JMH for anything you want to trust.
:::

## Common Java-level wins

| Issue | Better |
|---|---|
| String `+=` in loops | `StringBuilder` (pre-sized) |
| Boxing in hot loops (`Long sum`, `List<Integer>` math) | Primitives, `IntStream`, primitive arrays |
| `list.contains` inside a loop (O(n²)) | Build a `HashSet` once |
| Un-sized collections for known counts | `new ArrayList<>(n)`, `HashMap.newHashMap(n)` (19+) |
| Exceptions for control flow | Return values / `Optional` |
| `LinkedList.get(i)` loops | `ArrayList` / iterators |
| Regex compiled repeatedly (`String.matches`, `split` with complex patterns) | `static final Pattern` |
| Excessive logging string building | Parameterised logging: `log.debug("id={}", id)` |
| Synchronised hot shared state | Reduce sharing, `ConcurrentHashMap`, `LongAdder` |
| Reflection lookups per call | Cache `Method`/`MethodHandle` |

## Back-end performance is mostly about I/O

- **N+1 queries** — loading 100 orders then lazily loading each order's lines = 101 queries. Use joins/fetch joins, `@EntityGraph`, or batch fetching.
- **Missing indexes** — check query plans (`EXPLAIN`).
- **Chatty remote calls** — batch APIs, parallel calls with timeouts, caching.
- **Pool sizing** — DB connection pool, HTTP client pool and thread pools consistent with downstream capacity.
- **Serialisation size** — paginate, return only needed fields.
- **Caching** — Caffeine for local, Redis for shared caches; always set eviction and TTLs.

## JVM tuning basics

- Right-size the heap: enough headroom so the GC isn't constantly running; in containers use `-XX:MaxRAMPercentage`.
- Keep the default G1 unless measurements show a need (ZGC for latency; Parallel for batch throughput).
- Reduce start-up: Class Data Sharing / AppCDS, `-XX:TieredStopAtLevel=1` for short tasks, CRaC, or GraalVM native image for serverless.
- Java 21 **virtual threads** for high-concurrency blocking I/O workloads.

## Interview questions

:::qa experience
? A REST endpoint that returns 500 purchase orders takes 4 seconds. How do you investigate?
Measure first: enable SQL logging/metrics to count queries and time spent (N+1 lazy loading is the usual culprit), check query plans for missing indexes, profile the JVM with JFR or async-profiler to see CPU and allocation hotspots (mapping, serialisation), and check GC logs for pauses. Typical fixes: fetch joins or DTO projections, pagination, indexes, caching reference data, avoiding per-row remote calls, and reducing payload size.
:::

:::qa intermediate
? How do you write a reliable micro-benchmark in Java?
Use JMH: it runs warm-up iterations so the JIT compiles code, forks JVMs to isolate runs, uses `Blackhole` to prevent dead-code elimination, and reports statistics with error margins. Hand-written `System.nanoTime` loops are misleading.
:::

:::quiz
? The most common cause of slow Spring/JPA endpoints is usually:
- Using `ArrayList` instead of `LinkedList`
+ Inefficient database access such as N+1 queries or missing indexes
- The garbage collector
- Lambda expressions
--- explain
Database and network I/O dominate latency in typical back ends; fix access patterns before micro-optimising Java code.
:::
</script>

@id: pattern-singleton
@module: patterns
@title: Singleton Pattern
@level: 3
@time: 22
@prereq: static-keyword, volatile-jmm
@next: pattern-factory
@tags: singleton, design pattern, creational, lazy initialization, eager, double checked locking, holder idiom, enum singleton, gof
===
## Design patterns in one paragraph

A **design pattern** is a named, reusable solution to a recurring design problem. The 1994 "Gang of Four" (GoF) book catalogued 23 patterns in three groups: **creational** (how objects are created), **structural** (how objects are composed) and **behavioural** (how objects collaborate). Patterns give teams a shared vocabulary — "wrap it in a decorator" — and appear throughout the JDK and Spring.

## Singleton

**Problem:** exactly one instance of a class must exist, with a global access point — a configuration registry, a connection pool manager, a metrics registry.

**Solution:** make the constructor private and expose the single instance through a static member.

## Implementations compared

```java title="Singletons.java"
public class Singletons {

    // 1. Eager: created at class initialisation — simple and thread-safe (JVM guarantees class init safety)
    static final class EagerRegistry {
        private static final EagerRegistry INSTANCE = new EagerRegistry();
        private EagerRegistry() { }
        static EagerRegistry getInstance() { return INSTANCE; }
    }

    // 2. Lazy, synchronized: thread-safe but every call pays for the lock
    static final class SyncRegistry {
        private static SyncRegistry instance;
        private SyncRegistry() { }
        static synchronized SyncRegistry getInstance() {
            if (instance == null) instance = new SyncRegistry();
            return instance;
        }
    }

    // 3. Double-checked locking: lazy + cheap after init; REQUIRES volatile
    static final class DclRegistry {
        private static volatile DclRegistry instance;
        private DclRegistry() { }
        static DclRegistry getInstance() {
            DclRegistry r = instance;
            if (r == null) {
                synchronized (DclRegistry.class) {
                    r = instance;
                    if (r == null) instance = r = new DclRegistry();
                }
            }
            return r;
        }
    }

    // 4. Initialization-on-demand holder: lazy, thread-safe, no locking code (recommended class-based form)
    static final class HolderRegistry {
        private HolderRegistry() { }
        private static class Holder { static final HolderRegistry INSTANCE = new HolderRegistry(); }
        static HolderRegistry getInstance() { return Holder.INSTANCE; }   // Holder initialised on first call
    }

    // 5. Enum: serialization- and reflection-safe (Effective Java's recommendation)
    enum MetricsRegistry {
        INSTANCE;
        private long requests;
        synchronized void hit() { requests++; }
        synchronized long requests() { return requests; }
    }

    public static void main(String[] args) {
        System.out.println(EagerRegistry.getInstance() == EagerRegistry.getInstance());   // true
        System.out.println(HolderRegistry.getInstance() == HolderRegistry.getInstance()); // true
        System.out.println(DclRegistry.getInstance() == DclRegistry.getInstance());       // true
        System.out.println(SyncRegistry.getInstance() == SyncRegistry.getInstance());     // true
        MetricsRegistry.INSTANCE.hit();
        System.out.println(MetricsRegistry.INSTANCE.requests());                          // 1
    }
}
```

| Approach | Lazy | Thread-safe | Survives serialisation | Survives reflection |
|---|---|---|---|---|
| Eager | No | Yes | Needs `readResolve` | No (guard in constructor) |
| Synchronized method | Yes | Yes (slow) | Needs `readResolve` | No |
| Double-checked locking | Yes | Yes with `volatile` | Needs `readResolve` | No |
| Holder idiom | Yes | Yes | Needs `readResolve` | No |
| **Enum** | No (created at enum init) | Yes | **Yes** | **Yes** |

The holder idiom works because a nested class isn't initialised until first referenced, and the JVM guarantees class initialisation is thread-safe and happens once.

## Breaking a singleton (and defending it)

- **Reflection** — `constructor.setAccessible(true); constructor.newInstance()`. Defence: throw in the constructor if an instance exists, or use an enum.
- **Serialisation** — deserialising creates a new object. Defence: `private Object readResolve() { return INSTANCE; }`, or an enum.
- **Cloning** — don't implement `Cloneable` (or throw from `clone()`).
- **Multiple class loaders** — each loader gets its own "singleton".

:::analogy
A country has one official **government** at a time. Everyone who needs to deal with "the government" reaches the same institution through a known address — they don't create their own.
:::

:::project Singletons in Spring
Spring beans are **singleton-scoped by default** — but that means *one instance per application context*, managed by the container, not a GoF singleton with a private constructor and static accessor. Prefer container-managed singletons: they're testable (you can inject mocks) and configurable. Hand-written static singletons create hidden global state and make unit testing hard.
:::

## When to use / not

:::cols
--- col Use when
- Exactly one instance is a true requirement (a registry, a hardware resource manager).
- The instance is stateless or its state is thread-safe.
--- col Avoid when
- You just want "global variables" — it hides dependencies and couples code.
- You need testability — prefer dependency injection.
- State is per user/request.
:::

**Advantages:** controlled single instance, lazy initialisation possible, global access. **Disadvantages:** global state, hidden dependencies, hard to mock, concurrency concerns, violates Single Responsibility (manages its own lifecycle).

## Interview questions

:::qa intermediate
? How do you create a thread-safe singleton?
Eager initialisation in a static final field; the initialization-on-demand holder idiom; double-checked locking with a `volatile` field; or, best overall, a single-element `enum`, which is also safe against serialisation and reflection.
--- followup Why is volatile needed in double-checked locking?
Without it, a thread might see a non-null reference to an object whose constructor writes aren't yet visible — a partially constructed instance — due to reordering. The volatile write/read establishes happens-before.
--- followup How is a Spring singleton different?
It's one instance per Spring container, created and injected by the container; the class has a normal constructor and can be instantiated elsewhere (e.g. in tests).
:::

:::qa tricky
? How can a singleton be broken and how do you prevent it?
Via reflection (calling the private constructor), deserialisation (creates a new instance), cloning, or multiple class loaders. Prevent with a constructor guard, `readResolve()`, not supporting `clone`, or simply using an enum singleton.
:::

:::quiz
? Which singleton implementation is inherently safe against both reflection and serialisation?
- Double-checked locking
- Holder idiom
+ Enum singleton
- Synchronized getInstance
--- explain
The JVM guarantees enum constants are unique: reflection can't instantiate enums and deserialisation resolves them by name.
:::
</script>

@id: pattern-factory
@module: patterns
@title: Factory Method & Abstract Factory
@level: 3
@time: 20
@prereq: interfaces, polymorphism
@next: pattern-builder
@tags: factory, factory method, abstract factory, simple factory, static factory, creational, decoupling, beanfactory
===
## Factory Method

**Problem:** client code creates objects with `new ConcreteClass()`, so adding a new variant means editing every place that creates one, and the client depends on concrete classes.

**Solution:** delegate creation to a **factory** — a method that returns an interface type and decides which concrete class to instantiate. (Strictly, GoF's *Factory Method* lets subclasses override a creation method; in everyday Java the term also covers "simple factories" and static factory methods.)

```java title="NotificationFactory.java"
import java.util.Map;
import java.util.function.Supplier;

public class NotificationFactory {
    interface Notifier { String send(String to, String msg); }

    static class EmailNotifier implements Notifier {
        public String send(String to, String msg) { return "EMAIL to " + to + ": " + msg; }
    }
    static class SmsNotifier implements Notifier {
        public String send(String to, String msg) { return "SMS to " + to + ": " + msg; }
    }
    static class WhatsAppNotifier implements Notifier {
        public String send(String to, String msg) { return "WHATSAPP to " + to + ": " + msg; }
    }

    // Registry-based factory: adding a channel = one new line, no if/else chain
    private static final Map<String, Supplier<Notifier>> REGISTRY = Map.of(
        "EMAIL", EmailNotifier::new,
        "SMS", SmsNotifier::new,
        "WHATSAPP", WhatsAppNotifier::new);

    static Notifier create(String channel) {
        Supplier<Notifier> s = REGISTRY.get(channel.toUpperCase());
        if (s == null) throw new IllegalArgumentException("Unknown channel: " + channel);
        return s.get();
    }

    public static void main(String[] args) {
        Notifier n = create("sms");                      // client depends only on the interface
        System.out.println(n.send("+91-98xxxxxx", "PO-17 approved"));
    }
}
```

JDK examples: `Calendar.getInstance()`, `NumberFormat.getInstance(locale)`, `List.of(...)`, `Executors.newFixedThreadPool(n)`, `Path.of(...)`, `Charset.forName(...)`.

### Static factory methods vs constructors (Effective Java, Item 1)

They have **names** (`Money.ofRupees(10)`), can **return cached instances** (`Integer.valueOf`, `Boolean.valueOf`), can **return subtypes** (`List.of` returns hidden implementation classes), and can choose the implementation based on arguments (`EnumSet.of` returns `RegularEnumSet` or `JumboEnumSet` depending on size).

## Abstract Factory

**Problem:** you need to create **families of related objects** that must be used together (e.g. UI widgets for Light/Dark themes, or database-specific DAO sets), without the client knowing the concrete classes.

**Solution:** an interface with one creation method per product; each concrete factory produces a consistent family.

```java
interface ReportFactory {                        // abstract factory
    Header createHeader();
    Table createTable();
    Footer createFooter();
}
class PdfReportFactory implements ReportFactory { /* creates PdfHeader, PdfTable, PdfFooter */ }
class ExcelReportFactory implements ReportFactory { /* creates ExcelHeader, ExcelTable, ExcelFooter */ }

class ReportService {
    private final ReportFactory factory;          // chosen once (e.g. by config)
    ReportService(ReportFactory factory) { this.factory = factory; }
    Report build(Data d) {
        return new Report(factory.createHeader(), factory.createTable(), factory.createFooter());  // always a matching set
    }
}
```

JDK/framework examples: `DocumentBuilderFactory`, `TransformerFactory`, JDBC's `Connection` (creates statement objects for a specific vendor), Spring's `BeanFactory` (a factory of everything).

| | Factory Method | Abstract Factory |
|---|---|---|
| Creates | One product | A family of related products |
| Structure | A method (often static or overridable) | An interface with several creation methods |
| Goal | Decouple client from a concrete class | Guarantee products are compatible with each other |

:::analogy
A **factory method** is a restaurant counter: you order "a pizza" and the kitchen decides which oven and recipe to use. An **abstract factory** is a furniture showroom offering complete sets — choose "Scandinavian" and the table, chairs and cabinet all match.
:::

:::project
Payment-gateway selection (`PaymentProcessorFactory.forMethod(UPI)`), export-format selection (CSV/Excel/PDF), and Spring itself: `@Bean` methods in `@Configuration` classes are factory methods, and `FactoryBean<T>` lets you plug custom creation logic into the container.
:::

**Advantages:** decoupling from concrete classes, single place for creation logic, Open/Closed (add types without touching clients). **Disadvantages:** more classes/indirection; a big `switch`-based factory can itself become a maintenance hotspot.

## Interview questions

:::qa intermediate
? What is the Factory pattern and why use it?
It centralises object creation behind a method that returns an abstraction, so clients don't depend on concrete classes or creation details. It simplifies adding new implementations and hides complex construction, caching or selection logic.
--- followup Factory Method vs Abstract Factory?
Factory Method creates one product (often via an overridable or static method). Abstract Factory is an object with several factory methods creating a family of related products that must be used together.
:::

:::quiz
? `Integer.valueOf(100)` returning a cached instance is an example of:
+ A static factory method
- A constructor
- The Builder pattern
- The Adapter pattern
--- explain
Static factory methods can return cached instances instead of always creating new ones — a key advantage over constructors.
:::
</script>
