@id: pattern-builder
@module: patterns
@title: Builder & Prototype
@level: 3
@time: 18
@prereq: immutability, cloning
@next: pattern-structural
@tags: builder, fluent, telescoping constructor, lombok builder, prototype, clone, creational, immutable
===
## Builder

**Problem:** objects with many parameters, several optional. Telescoping constructors (`new Order(a, b)`, `new Order(a, b, c)`, `new Order(a, b, c, d, e)…`) are unreadable (`new Order("C1", null, true, false, 0, null)` — which flag is which?), and JavaBean setters leave objects temporarily inconsistent and prevent immutability.

**Solution:** a separate **builder** object collects values through named, chainable methods and creates the finished (typically immutable) object in `build()`, where validation happens.

```java title="HttpRequestSpec.java"
import java.time.Duration;
import java.util.LinkedHashMap;
import java.util.Map;

public final class HttpRequestSpec {
    private final String url;                      // required
    private final String method;                   // optional (default GET)
    private final Map<String, String> headers;
    private final Duration timeout;
    private final int retries;

    private HttpRequestSpec(Builder b) {           // only the builder can construct
        this.url = b.url;
        this.method = b.method;
        this.headers = Map.copyOf(b.headers);
        this.timeout = b.timeout;
        this.retries = b.retries;
    }

    public static Builder builder(String url) { return new Builder(url); }

    public static final class Builder {
        private final String url;
        private String method = "GET";
        private final Map<String, String> headers = new LinkedHashMap<>();
        private Duration timeout = Duration.ofSeconds(10);
        private int retries = 0;

        private Builder(String url) { this.url = url; }
        public Builder method(String m) { this.method = m; return this; }            // fluent: return this
        public Builder header(String k, String v) { headers.put(k, v); return this; }
        public Builder timeout(Duration t) { this.timeout = t; return this; }
        public Builder retries(int r) { this.retries = r; return this; }

        public HttpRequestSpec build() {                                            // validate once, at the end
            if (url == null || !url.startsWith("http")) throw new IllegalStateException("invalid url");
            if (retries < 0 || retries > 5) throw new IllegalStateException("retries must be 0..5");
            return new HttpRequestSpec(this);
        }
    }

    @Override public String toString() {
        return method + " " + url + " headers=" + headers + " timeout=" + timeout + " retries=" + retries;
    }

    public static void main(String[] args) {
        HttpRequestSpec req = HttpRequestSpec.builder("https://api.example.com/orders")
            .method("POST")
            .header("Content-Type", "application/json")
            .timeout(Duration.ofSeconds(5))
            .retries(2)
            .build();
        System.out.println(req);
    }
}
```

JDK/framework examples: `StringBuilder`, `HttpRequest.newBuilder()` (Java 11 HTTP client), `Stream.builder()`, `Locale.Builder`, Spring's `UriComponentsBuilder`, `ResponseEntity.ok().header(...).body(...)`, `WebClient.builder()`, Lombok's `@Builder`.

**Advantages:** readable construction, immutability, validation in one place, optional parameters with defaults. **Disadvantages:** more code (unless generated by Lombok), an extra object per construction.

## Prototype

**Problem:** creating an object from scratch is expensive or complex (loaded from DB, heavy configuration), and you need many similar copies.

**Solution:** create new objects by **copying an existing prototype** and then tweaking the copy — via a copy constructor, a `copy()` method, or `clone()`.

```java
record ReportTemplate(String title, List<String> columns, String footer) {
    ReportTemplate withTitle(String t) {                    // prototype-style copy with one change
        return new ReportTemplate(t, List.copyOf(columns), footer);
    }
}
ReportTemplate monthly = loadTemplateFromDb("monthly");     // expensive once
ReportTemplate sept = monthly.withTitle("September 2026");  // cheap copies
```

JDK example: `Object.clone()` / `Cloneable`, `ArrayList`'s copy constructor. Spring's **prototype scope** returns a *new* bean instance on each request from the container (a related but different idea: the container creates a fresh instance instead of sharing a singleton).

:::analogy
**Builder**: ordering a custom sandwich — you specify bread, then filling, then sauce, step by step, and only at the end is the sandwich assembled and wrapped. **Prototype**: photocopying an approved form template and filling in a few fields, instead of designing the form again.
:::

## Interview questions

:::qa intermediate
? When would you use the Builder pattern?
When a class has many parameters, especially optional ones, and you want readable, immutable construction with validation — instead of telescoping constructors or mutable setters.
--- followup Builder vs constructor with many parameters?
Builders name each parameter at the call site, allow defaults and any order, and validate in `build()`; long constructors are error-prone because arguments of the same type are easily swapped.
:::

:::qa intermediate
? What is the Prototype pattern?
Creating new objects by copying an existing instance (prototype) rather than constructing from scratch — useful when construction is expensive or configuration-heavy. Implemented with copy constructors, copy methods or `clone()`.
:::

:::quiz
? Which JDK API follows the Builder pattern?
- `Integer.valueOf`
+ `HttpRequest.newBuilder().uri(...).GET().build()`
- `Collections.sort`
- `Thread.start`
--- explain
The Java 11 HTTP client's request builder configures options fluently and produces an immutable `HttpRequest` in `build()`.
:::
</script>

<script type="text/x-java-topic">
@id: pattern-structural
@module: patterns
@title: Adapter, Decorator, Facade & Proxy
@level: 4
@time: 28
@prereq: interfaces, polymorphism
@next: pattern-behavioral
@tags: adapter, decorator, facade, proxy, structural, wrapper, composition, aop, spring proxy
===
All four are **wrappers** — one object sits in front of another — but for different purposes.

| Pattern | Intent | Interface to the client |
|---|---|---|
| **Adapter** | Make an incompatible interface usable | *Different* from the wrapped object's |
| **Decorator** | Add responsibilities dynamically | *Same* as the wrapped object's |
| **Facade** | Simplify a complex subsystem | *New, simpler* interface over many objects |
| **Proxy** | Control access (lazy loading, security, remote, caching, transactions) | *Same* as the real subject |

## Adapter

**Problem:** you have code expecting interface `PaymentGateway`, and a third-party SDK with a totally different API.
**Solution:** an adapter implements the expected interface and translates calls to the SDK.

```java title="AdapterDemo.java"
public class AdapterDemo {
    interface PaymentGateway { boolean charge(String orderId, long paise); }       // what our code expects

    static class LegacyBankSdk {                                                  // third-party, can't change
        int makePayment(String reference, double rupees, String currency) { return 200; }
    }

    static class LegacyBankAdapter implements PaymentGateway {                      // the adapter
        private final LegacyBankSdk sdk = new LegacyBankSdk();
        public boolean charge(String orderId, long paise) {
            int status = sdk.makePayment("ORD-" + orderId, paise / 100.0, "INR");  // translate call + units
            return status == 200;
        }
    }

    public static void main(String[] args) {
        PaymentGateway gw = new LegacyBankAdapter();
        System.out.println(gw.charge("17", 49_900));   // true
    }
}
```

JDK: `Arrays.asList` (array → List), `InputStreamReader` (byte stream → character reader), `Collections.enumeration`. Spring MVC's `HandlerAdapter` adapts different handler types to the DispatcherServlet.

## Decorator

**Problem:** add behaviour (logging, caching, compression, retries) to objects without subclassing every combination.
**Solution:** a decorator implements the same interface, holds a reference to another instance, and adds behaviour before/after delegating. Decorators stack.

```java title="DecoratorDemo.java"
public class DecoratorDemo {
    interface PriceCalculator { double price(double base); }

    static class BasePrice implements PriceCalculator { public double price(double base) { return base; } }

    static class GstDecorator implements PriceCalculator {
        private final PriceCalculator inner;
        GstDecorator(PriceCalculator inner) { this.inner = inner; }
        public double price(double base) { return inner.price(base) * 1.18; }
    }

    static class DiscountDecorator implements PriceCalculator {
        private final PriceCalculator inner; private final double pct;
        DiscountDecorator(PriceCalculator inner, double pct) { this.inner = inner; this.pct = pct; }
        public double price(double base) { return inner.price(base) * (1 - pct / 100); }
    }

    public static void main(String[] args) {
        PriceCalculator calc = new GstDecorator(new DiscountDecorator(new BasePrice(), 10));  // stack at runtime
        System.out.printf("%.2f%n", calc.price(1000));   // 1000 → -10% = 900 → +18% GST = 1062.00
    }
}
```

JDK: the `java.io` streams (`new BufferedReader(new InputStreamReader(new FileInputStream(f)))`), `Collections.unmodifiableList`, `Collections.synchronizedMap`.

## Facade

**Problem:** a subsystem has many classes and steps (inventory, pricing, payment, shipping, notification); clients shouldn't orchestrate them all.
**Solution:** a facade offers a few high-level methods and coordinates the subsystem internally.

```java
public class CheckoutFacade {
    private final InventoryService inventory;
    private final PricingService pricing;
    private final PaymentService payments;
    private final ShippingService shipping;
    private final NotificationService notifications;

    public OrderConfirmation placeOrder(Cart cart, PaymentDetails pay) {
        inventory.reserve(cart.items());
        Money total = pricing.total(cart);
        payments.charge(pay, total);
        Shipment s = shipping.schedule(cart);
        notifications.orderPlaced(cart.customer(), s);
        return new OrderConfirmation(s.trackingId(), total);
    }
}
```

Examples: SLF4J (a facade over Logback/Log4j2), Spring's `JdbcTemplate` (hides connection/statement/result-set handling), a service-layer method that orchestrates several repositories.

## Proxy

**Problem:** control access to an object — create it lazily, check permissions, cache results, call it remotely, or wrap calls in transactions — without changing it or its clients.
**Solution:** a proxy with the same interface that performs the extra control and forwards to the real subject.

```java
class CachingSupplierRepository implements SupplierRepository {        // proxy
    private final SupplierRepository real;
    private final Map<Long, Supplier> cache = new ConcurrentHashMap<>();
    CachingSupplierRepository(SupplierRepository real) { this.real = real; }

    @Override public Supplier findById(long id) {
        return cache.computeIfAbsent(id, real::findById);               // control: cache before delegating
    }
}
```

Examples: Spring AOP proxies for `@Transactional`/`@Cacheable`/`@Async`/`@PreAuthorize`; Hibernate **lazy-loading** proxies (`getReference()`, lazy `@ManyToOne` returns a proxy that hits the DB on first access); RMI stubs; `java.lang.reflect.Proxy`.

### Decorator vs Proxy

Structurally similar; the difference is intent. A **decorator** adds features and is typically composed by the client, often stacked. A **proxy** controls access to a subject, usually created by infrastructure (framework, container), and the client normally doesn't know it's talking to a proxy.

:::analogy
- **Adapter**: a travel plug adapter — Indian plug, UK socket.
- **Decorator**: gift wrapping — same gift, extra layers, stackable.
- **Facade**: a hotel concierge — one person arranges taxi, restaurant and tickets for you.
- **Proxy**: a company receptionist — you reach the manager only through them; they may check your appointment or take a message.
:::

## Interview questions

:::qa intermediate
? Difference between Adapter and Decorator?
An adapter converts one interface into another so incompatible classes can work together; the client sees a different interface than the adaptee. A decorator keeps the same interface and adds behaviour, and decorators can be stacked.
:::

:::qa advanced
? How does Spring use the Proxy pattern?
For AOP features — transactions, caching, security, async, retry — Spring wraps beans in JDK dynamic proxies (interface-based) or CGLIB/ByteBuddy subclasses. Calls go through the proxy, which runs interceptors (e.g. begin/commit a transaction) around the real method.
--- followup Why doesn't @Transactional work on a method called from the same class?
The internal call uses `this`, not the proxy, so no interceptor runs. Move the method to another bean, inject the proxy (self-injection), or use `TransactionTemplate`.
:::

:::quiz
? `new BufferedInputStream(new FileInputStream(f))` illustrates which pattern?
- Adapter
+ Decorator
- Facade
- Singleton
--- explain
`BufferedInputStream` has the same `InputStream` interface as what it wraps and adds buffering behaviour.
:::
</script>

@id: pattern-behavioral
@module: patterns
@title: Observer, Strategy, Template Method & Command
@level: 4
@time: 28
@prereq: interfaces, lambdas
@next: modules
@tags: observer, strategy, template method, command, behavioral, event, listener, applicationevent, pub sub, undo, queue
===
## Strategy

**Problem:** an algorithm varies (discount rules, tax calculation, shipping cost, sorting) and you don't want `if/else` chains growing with every new variant.
**Solution:** define a strategy interface, one class (or lambda) per algorithm, and let the context use whichever strategy it's given.

```java title="StrategyDemo.java"
import java.math.BigDecimal;
import java.math.RoundingMode;
import java.util.Map;

public class StrategyDemo {
    interface DiscountStrategy { BigDecimal apply(BigDecimal amount); }

    static final Map<String, DiscountStrategy> STRATEGIES = Map.of(
        "NONE", amt -> amt,
        "FESTIVE", amt -> amt.multiply(new BigDecimal("0.85")),                    // 15% off
        "FLAT500", amt -> amt.subtract(new BigDecimal("500")).max(BigDecimal.ZERO));

    static BigDecimal checkout(BigDecimal cart, String code) {                     // the context
        DiscountStrategy s = STRATEGIES.getOrDefault(code, STRATEGIES.get("NONE"));
        return s.apply(cart).setScale(2, RoundingMode.HALF_UP);
    }

    public static void main(String[] args) {
        System.out.println(checkout(new BigDecimal("2000"), "FESTIVE"));   // 1700.00
        System.out.println(checkout(new BigDecimal("2000"), "FLAT500"));   // 1500.00
    }
}
```

JDK: `Comparator` passed to `sort`, `ThreadPoolExecutor`'s `RejectedExecutionHandler`. Spring: inject `List<PaymentProcessor>` or `Map<String, PaymentProcessor>` beans and select at runtime.

## Observer

**Problem:** when one object changes (an order is placed), several others need to react (send email, update inventory, notify analytics) — but the publisher shouldn't depend on each of them.
**Solution:** subscribers register with a subject; the subject notifies all registered observers of events.

```java title="ObserverDemo.java"
import java.util.List;
import java.util.concurrent.CopyOnWriteArrayList;
import java.util.function.Consumer;

public class ObserverDemo {
    record OrderPlaced(String orderId, double amount) {}

    static class OrderEvents {                                          // subject / publisher
        private final List<Consumer<OrderPlaced>> listeners = new CopyOnWriteArrayList<>();
        void subscribe(Consumer<OrderPlaced> l) { listeners.add(l); }
        void publish(OrderPlaced e) { listeners.forEach(l -> l.accept(e)); }
    }

    public static void main(String[] args) {
        OrderEvents events = new OrderEvents();
        events.subscribe(e -> System.out.println("Email: order " + e.orderId() + " confirmed"));
        events.subscribe(e -> System.out.println("Inventory: reserve items for " + e.orderId()));
        events.subscribe(e -> { if (e.amount() > 50_000) System.out.println("Fraud check for " + e.orderId()); });
        events.publish(new OrderPlaced("O-101", 72_000));
    }
}
```

Examples: Swing/JavaFX listeners, Spring's `ApplicationEventPublisher` + `@EventListener` / `@TransactionalEventListener`, message brokers (Kafka, RabbitMQ) as distributed pub/sub. (`java.util.Observable` is deprecated since Java 9.)

## Template Method

**Problem:** several classes share the same algorithm skeleton but differ in some steps (import CSV vs Excel: open → parse rows → validate → save → report).
**Solution:** an abstract class defines the skeleton in a `final` method and calls abstract/hook methods that subclasses implement. (See the `ReportGenerator` example in [Abstraction](#abstraction).)

```java
abstract class DataImporter {
    public final ImportResult run(InputStream in) {       // the template — fixed order
        List<Row> rows = parse(in);                        // varies
        List<Row> valid = rows.stream().filter(this::validate).toList();   // hook, may vary
        save(valid);                                       // common
        return new ImportResult(rows.size(), valid.size());
    }
    protected abstract List<Row> parse(InputStream in);
    protected boolean validate(Row r) { return r.isComplete(); }        // default hook
    private void save(List<Row> rows) { /* common persistence */ }
}
class CsvImporter extends DataImporter { protected List<Row> parse(InputStream in) { /* … */ return List.of(); } }
```

Examples: `AbstractList`, `HttpServlet.service()` → `doGet`/`doPost`, Spring's `JdbcTemplate`/`RestTemplate`/`TransactionTemplate` (a callback-based variant: the template handles resources and you supply the varying step as a lambda).

## Command

**Problem:** you want to treat requests as objects — queue them, log them, retry them, schedule them, or undo them — decoupling the invoker from the receiver.
**Solution:** encapsulate an action and its parameters in a command object with an `execute()` (and optionally `undo()`) method.

```java title="CommandDemo.java"
import java.util.ArrayDeque;
import java.util.Deque;

public class CommandDemo {
    interface Command { void execute(); void undo(); }

    static class Document { final StringBuilder text = new StringBuilder(); }

    record AppendCommand(Document doc, String s) implements Command {
        public void execute() { doc.text.append(s); }
        public void undo() { doc.text.setLength(doc.text.length() - s.length()); }
    }

    public static void main(String[] args) {
        Document doc = new Document();
        Deque<Command> history = new ArrayDeque<>();
        for (String part : new String[]{"Purchase ", "Order ", "Draft"}) {
            Command c = new AppendCommand(doc, part);
            c.execute();
            history.push(c);
        }
        System.out.println(doc.text);          // Purchase Order Draft
        history.pop().undo();                  // undo last action
        System.out.println(doc.text);          // Purchase Order
    }
}
```

Examples: `Runnable`/`Callable` submitted to executors (commands queued for later execution), job queues, UI undo stacks, CQRS command handlers, transactional outbox messages.

## Summary

| Pattern | Key idea | Java/Spring example |
|---|---|---|
| Strategy | Swap algorithms behind an interface | `Comparator`, injected strategy beans |
| Observer | Publish events to many subscribers | `@EventListener`, Kafka |
| Template Method | Fixed skeleton, varying steps | `HttpServlet`, `JdbcTemplate` |
| Command | Requests as objects | `Runnable` in executors, undo stacks |

:::analogy
**Strategy**: choosing a route in a maps app — fastest, shortest or no tolls — same trip, different algorithm. **Observer**: a YouTube channel notifying subscribers. **Template Method**: a franchise recipe card — steps are fixed, but each outlet chooses the local sauce. **Command**: a restaurant order slip — written once, queued for the kitchen, and can be cancelled.
:::

## Interview questions

:::qa intermediate
? Strategy vs Template Method?
Both vary part of an algorithm. Strategy uses **composition**: the whole algorithm is an interchangeable object chosen at runtime. Template Method uses **inheritance**: a base class fixes the skeleton and subclasses override specific steps at compile time. Strategy is generally more flexible.
:::

:::qa intermediate
? How is the Observer pattern used in Spring?
Beans publish events with `ApplicationEventPublisher.publishEvent(event)`; other beans receive them with `@EventListener` methods (optionally `@Async`, or `@TransactionalEventListener` to run after commit). The publisher doesn't know who listens.
:::

:::quiz
? Submitting `Runnable` tasks to an `ExecutorService` queue is an example of:
+ Command
- Observer
- Adapter
- Singleton
--- explain
Each `Runnable` encapsulates a request as an object that the executor (invoker) can queue and run later.
:::
</script>

@id: modules
@module: modern
@title: Java Platform Module System (Java 9)
@level: 4
@time: 18
@java: 9+
@prereq: packages-access, class-loading
@next: modern-syntax
@tags: jpms, module, module-info, requires, exports, opens, jlink, strong encapsulation, classpath hell
===
## Introduction

The **Java Platform Module System (JPMS, Project Jigsaw, Java 9)** adds **modules** — named groups of packages with explicit dependencies and an explicit public API — above packages.

Why? Before Java 9:

- The JDK was one monolithic `rt.jar`; every app shipped with everything, including CORBA and Swing.
- `public` meant public to **everyone** — internal APIs like `sun.misc.Unsafe` were used widely because nothing stopped it.
- The classpath had no notion of dependencies: missing or duplicate JARs failed late at runtime ("JAR hell").

## module-info.java

```java
module com.shop.billing {
    requires java.sql;                          // depends on this module
    requires transitive com.shop.common;        // consumers of billing also get common
    exports com.shop.billing.api;               // ONLY this package is accessible to other modules
    opens com.shop.billing.model to com.fasterxml.jackson.databind;   // allow deep reflection (for frameworks)
    uses com.shop.billing.spi.TaxProvider;      // ServiceLoader consumer
    provides com.shop.billing.spi.TaxProvider with com.shop.billing.impl.GstProvider;
}
```

| Directive | Meaning |
|---|---|
| `requires` | Compile-time and runtime dependency |
| `requires transitive` | Implied readability for downstream modules |
| `exports` | Makes a package's public types accessible |
| `opens` | Allows reflective access (including private members) at runtime |
| `uses` / `provides … with` | Service provider interface via `ServiceLoader` |

## Benefits

- **Strong encapsulation** — non-exported packages are inaccessible, even their public classes. The JDK uses this to hide internals (enforced by default since Java 16/17).
- **Reliable configuration** — missing modules are detected at start-up, not mid-request.
- **Smaller runtimes** — `jlink` builds a custom runtime image with only the modules you need (great for containers).
- The JDK itself is modular: `java --list-modules` shows `java.base`, `java.sql`, `java.net.http`, …

## Adoption reality

Most applications (including typical Spring Boot apps) still run on the **classpath** as the "unnamed module"; modules are opt-in. What affects everyone is the **JDK's** strong encapsulation: libraries doing deep reflection into JDK internals need `--add-opens` flags or updates.

:::qa intermediate
? What is the Java module system and what problems does it solve?
JPMS (Java 9) groups packages into modules declared in `module-info.java` with explicit `requires` dependencies and `exports`. It provides strong encapsulation (non-exported packages are inaccessible), reliable configuration (dependencies checked at start-up), and enables smaller custom runtimes via `jlink`. It also let the JDK hide its internal APIs.
--- followup exports vs opens?
`exports` grants compile-time and runtime access to public types of a package. `opens` grants runtime reflective access, including to private members, which frameworks like Jackson and Hibernate need.
:::

:::quiz
? A public class in a package that its module does not export is accessible to other modules?
- Yes, because it is public
+ No — non-exported packages are encapsulated
- Only through inheritance
- Only in the same JAR
--- explain
With modules, `public` is only effective across modules for exported packages.
:::
</script>

<script type="text/x-java-topic">
@id: modern-syntax
@module: modern
@title: var, Text Blocks, Switch Expressions & API Additions (9–17)
@level: 2
@time: 18
@java: 10–17
@prereq: variables, switch
@next: records
@tags: var, text blocks, switch expression, helpful nullpointerexception, string methods, list.of, http client, collection factory, stream tolist, java 11, java 17
===
## Language features by version

| Version | Feature | Example |
|---|---|---|
| 9 | Private interface methods | helpers for default methods |
| 9 | Diamond with anonymous classes, try-with-resources on effectively final vars | `try (reader) { … }` |
| 10 | **`var`** local variable type inference | `var orders = new ArrayList<Order>();` |
| 11 | `var` in lambda parameters | `(var a, var b) -> a + b` |
| 14 | **Switch expressions** (standard) | `int d = switch (m) { case 2 -> 28; default -> 31; };` |
| 14 | **Helpful NullPointerExceptions** | *Cannot invoke "String.length()" because "customer.name" is null* |
| 15 | **Text blocks** | `"""` multi-line strings |
| 16 | **Records** (standard) | `record Point(int x, int y) {}` |
| 16 | **Pattern matching for instanceof** (standard) | `if (o instanceof String s)` |
| 17 | **Sealed classes** (standard) | `sealed interface Shape permits Circle, Square` |
| 17 (preview) | Pattern matching for switch | final in 21 |

## var — when it helps and when it hurts

```java
var supplierMap = new HashMap<Long, List<PurchaseOrder>>();   // good: type obvious, avoids repetition
for (var entry : supplierMap.entrySet()) { … }                  // good
var result = service.process(x);                                // questionable: what type is result?
var list = new ArrayList<>();                                   // trap: infers ArrayList<Object>
```

`var` is compile-time inference only; the variable is statically typed. Use it where the type is obvious from the right-hand side.

## Text blocks (Java 15)

```java title="TextBlocks.java"
public class TextBlocks {
    public static void main(String[] args) {
        String sql = """
            SELECT po.id, s.name, po.total
            FROM purchase_order po
            JOIN supplier s ON s.id = po.supplier_id
            WHERE po.status = ?
            ORDER BY po.created_at DESC
            """;                                   // indentation relative to the closing """ is stripped
        String json = """
            {
              "orderId": "%s",
              "amount": %.2f
            }""".formatted("PO-17", 12500.5);
        System.out.print(sql);
        System.out.println(json);
    }
}
```

Incidental leading whitespace is removed based on the least-indented line (including the closing delimiter); `\` at a line end joins lines, `\s` keeps a trailing space.

## Useful API additions

| Version | API |
|---|---|
| 9 | `List.of`, `Set.of`, `Map.of`; `Optional.ifPresentOrElse/or/stream`; `Stream.takeWhile/dropWhile/ofNullable/iterate(seed, hasNext, next)`; `ProcessHandle` |
| 10 | `List.copyOf`, `Collectors.toUnmodifiableList`, `Optional.orElseThrow()` |
| 11 | `String.isBlank/strip/lines/repeat`, `Files.readString/writeString`, **`java.net.http.HttpClient`** (standard), `Predicate.not`, single-file source launch |
| 12 | `Collectors.teeing`, `String.indent/transform` |
| 16 | `Stream.toList()`, `Stream.mapMulti` |
| 17 | `RandomGenerator` API, `HexFormat`, context-specific deserialization filters |

```java
HttpClient client = HttpClient.newHttpClient();                          // Java 11
HttpRequest req = HttpRequest.newBuilder(URI.create("https://api.example.com/rates"))
        .timeout(Duration.ofSeconds(5)).GET().build();
HttpResponse<String> resp = client.send(req, HttpResponse.BodyHandlers.ofString());
List<String> nonBlank = lines.stream().filter(Predicate.not(String::isBlank)).toList();
```

:::qa basic
? What are the important features between Java 8 and Java 17?
Modules (9), `var` (10), the standard HTTP client and new String/Files helpers (11), switch expressions and helpful NPEs (14), text blocks (15), records, `instanceof` pattern matching and `Stream.toList()` (16), sealed classes and strong encapsulation of JDK internals (17), plus GC improvements (G1 default, ZGC/Shenandoah production-ready) and container awareness.
:::

:::qa tricky
? Is `var` allowed for fields, method parameters or return types?
No. Only local variables with initialisers, enhanced-for and classic for loop variables, try-with-resources variables, and (since 11) lambda parameters.
:::

:::quiz
? `var x = null;` — result?
- x is Object
+ Compile error
- x is String
- Runtime error
--- explain
`null` has no specific type to infer from, so `var` can't determine x's type.
:::
</script>

<script type="text/x-java-topic">
@id: records
@module: modern
@title: Records
@level: 3
@time: 18
@java: 16+
@prereq: immutability, equals-hashcode
@next: sealed-classes
@tags: record, data class, compact constructor, canonical constructor, immutable, dto, value object, accessor
===
## Introduction

A **record** (standard in Java 16) is a concise way to declare a class whose purpose is to carry immutable data. You declare the **components**; the compiler generates the rest.

```java
public record Money(BigDecimal amount, String currency) { }
```

is roughly equivalent to a final class with:

- `private final` fields `amount` and `currency`;
- a **canonical constructor** `Money(BigDecimal amount, String currency)`;
- **accessor methods** `amount()` and `currency()` (not `getAmount()`);
- `equals()` and `hashCode()` based on all components;
- `toString()` → `Money[amount=100.00, currency=INR]`.

## Customising a record

```java title="RecordDemo.java"
import java.math.BigDecimal;
import java.util.List;

public class RecordDemo {
    record Money(BigDecimal amount, String currency) {
        Money {                                            // COMPACT canonical constructor: validation/normalisation
            if (amount == null || amount.signum() < 0) throw new IllegalArgumentException("amount >= 0 required");
            currency = currency == null ? "INR" : currency.toUpperCase();   // reassign the parameter, not the field
        }
        Money(String amount) { this(new BigDecimal(amount), "INR"); }       // extra constructors must delegate
        static Money zero() { return new Money(BigDecimal.ZERO, "INR"); }   // static factory
        Money plus(Money o) {                                                // instance methods are allowed
            if (!currency.equals(o.currency)) throw new IllegalArgumentException("currency mismatch");
            return new Money(amount.add(o.amount), currency);
        }
    }

    record OrderSummary(String id, List<String> items) {
        OrderSummary { items = List.copyOf(items); }       // defensive copy → deep immutability for the list
    }

    public static void main(String[] args) {
        Money a = new Money("100.50"), b = new Money(new BigDecimal("20.25"), "inr");
        System.out.println(a.plus(b));                     // Money[amount=120.75, currency=INR]
        System.out.println(a.equals(new Money("100.50"))); // true — value-based equality
        System.out.println(a.amount());                    // accessor: 100.50
        System.out.println(new OrderSummary("O-1", List.of("pen")).items());
    }
}
```

## Rules and restrictions

- Records are implicitly **`final`** and extend `java.lang.Record` — they can't extend other classes, but **can implement interfaces**.
- Fields are `private final`; you **cannot declare additional instance fields** (static fields are allowed).
- Records are **shallowly immutable**: a `List` component can still be mutated unless you copy it.
- Can be nested, local (declared inside methods), and generic (`record Pair<A, B>(A a, B b)`).
- Can have annotations on components (`record CreateSupplier(@NotBlank String name, @Email String email)`).

## Records vs Lombok vs regular classes

| | Record | Lombok `@Value`/`@Data` | Hand-written class |
|---|---|---|---|
| Boilerplate | None (language feature) | None (annotation processor) | Lots |
| Mutability | Immutable | `@Value` immutable / `@Data` mutable | Your choice |
| Inheritance | Can't extend classes | Can | Can |
| Getter naming | `amount()` | `getAmount()` | Your choice |
| JPA entity | **No** (entities need mutability, no-arg constructor, proxies) | Yes | Yes |

:::project Where records shine in a Spring Boot app
Request/response **DTOs** (Jackson 2.12+ supports records), query projections (`List<SupplierSummary>` from Spring Data), configuration properties (`@ConfigurationProperties` records, Spring Boot 2.6+), event payloads, map keys, and method results returning multiple values. Keep JPA entities as regular classes.
:::

## Interview questions

:::qa intermediate
? What is a record and what does the compiler generate?
A special final class for immutable data carriers. From its component list the compiler generates private final fields, a canonical constructor, accessor methods named after the components, and `equals`, `hashCode` and `toString` based on all components.
--- followup Can a record have extra fields or extend a class?
No extra instance fields (static ones are fine), and it can't extend a class (it implicitly extends `Record`), but it can implement interfaces and declare methods and static factories.
--- followup What is a compact constructor?
A canonical constructor without a parameter list, used for validation or normalisation; field assignments happen automatically after its body runs.
:::

:::qa tricky
? Are records fully immutable?
Shallowly. Component references can't be reassigned, but a mutable component (a `List`, an array, a `Date`) can be modified unless you defensively copy it in the compact constructor.
:::

:::quiz
? The accessor for component `amount` in `record Money(BigDecimal amount, String currency)` is:
- `getAmount()`
+ `amount()`
- `amount` (public field)
- `getamount()`
--- explain
Record accessors use the component name without a `get` prefix.
:::
</script>

@id: sealed-classes
@module: modern
@title: Sealed Classes & Interfaces
@level: 4
@time: 15
@java: 17+
@prereq: records, interfaces
@next: pattern-matching
@tags: sealed, permits, non-sealed, final, closed hierarchy, algebraic data types, exhaustiveness
===
## Introduction

A **sealed** class or interface (standard in **Java 17**) restricts **which classes may extend or implement it**. It sits between `final` (no subclasses) and open (anyone can extend).

Why? Many domain concepts have a **fixed set of variants**: a payment result is `Success`, `Declined` or `Error`; a shape is `Circle`, `Rectangle` or `Triangle`. Sealing documents that, lets the compiler enforce it, and — with pattern matching — lets the compiler check that a `switch` handles **every** case.

```java title="SealedDemo.java"
public class SealedDemo {
    sealed interface PaymentResult permits Success, Declined, Failed { }

    record Success(String txnId, long paise) implements PaymentResult { }     // records are implicitly final
    record Declined(String reason) implements PaymentResult { }
    record Failed(Exception cause) implements PaymentResult { }

    static String describe(PaymentResult r) {
        if (r instanceof Success s) return "Paid " + s.paise() / 100.0 + " (txn " + s.txnId() + ")";
        if (r instanceof Declined d) return "Declined: " + d.reason();
        if (r instanceof Failed f) return "Error: " + f.cause().getMessage();
        throw new IllegalStateException();   // needed in Java 17; a Java 21 pattern switch makes this unnecessary
    }

    public static void main(String[] args) {
        System.out.println(describe(new Success("T-9", 49_900)));
        System.out.println(describe(new Declined("Insufficient balance")));
    }
}
```

## Rules

- The `permits` clause lists the allowed direct subtypes. (It can be omitted if all subtypes are in the same source file.)
- Each permitted subclass must be in the same module (or the same package if unnamed module) and must declare one of:
  - **`final`** — no further extension (records and enums are implicitly final);
  - **`sealed`** — its own restricted set of subclasses;
  - **`non-sealed`** — reopens the hierarchy from that point.

## Why it matters with pattern matching (Java 21)

```java
static String describe(PaymentResult r) {
    return switch (r) {                              // exhaustive: compiler knows all permitted subtypes
        case Success s -> "Paid " + s.paise();
        case Declined d -> "Declined: " + d.reason();
        case Failed f -> "Error: " + f.cause().getMessage();
    };                                               // no default needed; adding a 4th subtype → compile error here
}
```

That combination — sealed hierarchies of records plus exhaustive switch — gives Java **algebraic data types**, a style common in functional languages for modelling domain states.

:::qa intermediate
? What are sealed classes and why use them?
Classes or interfaces that restrict which classes can extend/implement them via `permits` (Java 17). They model closed sets of variants, make hierarchies explicit, protect invariants from unexpected subclasses, and enable compiler-checked exhaustive pattern matching in switch.
--- followup What modifiers must permitted subclasses have?
Each must be `final`, `sealed` or `non-sealed`.
:::

:::quiz
? A permitted subclass of a sealed class is declared without `final`, `sealed` or `non-sealed`. Result?
+ Compile error
- It defaults to final
- It defaults to non-sealed
- Runtime error
--- explain
The compiler requires permitted subclasses to state explicitly how they continue (or stop) the hierarchy. Records and enums are implicitly final, so they satisfy the rule.
:::
</script>

<script type="text/x-java-topic">
@id: pattern-matching
@module: modern
@title: Pattern Matching: instanceof, switch & Record Patterns
@level: 4
@time: 18
@java: 16 / 21
@prereq: sealed-classes, switch
@next: virtual-threads
@tags: pattern matching, instanceof, type pattern, switch pattern, guard, when, record pattern, deconstruction, case null, exhaustive
===
## Pattern matching for instanceof (Java 16, standard)

```java
// Before
if (obj instanceof String) {
    String s = (String) obj;                  // redundant cast
    System.out.println(s.length());
}
// Java 16+
if (obj instanceof String s && !s.isBlank()) {   // test + cast + bind in one step; s in scope where the match is certain
    System.out.println(s.length());
}
if (!(obj instanceof Invoice inv)) return;
process(inv);                                   // flow scoping: inv is definitely matched here
```

This is standard in **Java 17** — use it freely.

## Pattern matching for switch (Java 21, standard)

:::version Preview in Java 17
Pattern matching for `switch` was a **preview** feature in Java 17–20 (requires `--enable-preview`) and became **standard in Java 21** (JEP 441). Record patterns became standard in Java 21 too (JEP 440). The examples below need Java 21+.
:::

```java
static String format(Object o) {
    return switch (o) {
        case null -> "null";                                       // explicit null handling (no NPE)
        case Integer i when i > 1_000_000 -> "large int " + i;     // guard with 'when'
        case Integer i -> "int " + i;
        case String s -> "text of length " + s.length();
        case int[] arr -> "array of " + arr.length;
        default -> "other " + o.getClass().getSimpleName();
    };
}
```

- **Type patterns** in case labels (`case String s`).
- **Guards** refine a case with `when`.
- **`case null`** — otherwise a null selector still throws NPE.
- **Dominance**: more specific cases must come first (`case Integer i when …` before `case Integer i`), or the compiler reports an error.
- **Exhaustiveness**: required for switch *expressions* and pattern switches — satisfied by `default` or by covering all permitted subtypes of a sealed type.

## Record patterns (Java 21)

Deconstruct a record directly in a pattern — and nest patterns:

```java
record Point(int x, int y) {}
record Line(Point from, Point to) {}

static double length(Object o) {
    if (o instanceof Line(Point(var x1, var y1), Point(var x2, var y2))) {   // nested deconstruction
        return Math.hypot(x2 - x1, y2 - y1);
    }
    return 0;
}

sealed interface Shape permits Circle, Rect {}
record Circle(double r) implements Shape {}
record Rect(double w, double h) implements Shape {}

static double area(Shape s) {
    return switch (s) {
        case Circle(double r) -> Math.PI * r * r;
        case Rect(double w, double h) when w == h -> w * w;         // a square
        case Rect(double w, double h) -> w * h;
    };
}
```

Java 22 added **unnamed variables and patterns** (`_`) for components you don't need: `case Rect(double w, _) -> …`.

## Why it matters

Pattern matching replaces chains of `instanceof` + casts and Visitor-pattern boilerplate with concise, compiler-checked code — especially powerful with sealed hierarchies of records modelling domain states (API responses, events, commands).

:::qa intermediate
? What is pattern matching for instanceof?
A Java 16 feature combining the type test, cast and variable binding: `if (obj instanceof Order o) { … }`. The binding `o` is in scope only where the match is guaranteed, avoiding redundant casts and ClassCastException risks.
:::

:::qa advanced
? Is pattern matching for switch available in Java 17?
Only as a preview feature (needs `--enable-preview` and isn't meant for production). It became standard in Java 21, together with record patterns. In Java 17, `instanceof` patterns are standard.
--- followup How does a switch on a sealed interface avoid a default branch?
The compiler knows all permitted subtypes; if each has a case, the switch is exhaustive. If a new subtype is added later, the switch stops compiling, pointing you to every place that must handle it.
:::

:::quiz
? In Java 21, what happens when a pattern `switch` without `case null` receives null?
+ It throws `NullPointerException`
- It goes to `default`
- It returns null
- Compile error
--- explain
For compatibility, null still throws NPE unless a `case null` label is present.
:::
</script>

@id: virtual-threads
@module: modern
@title: Virtual Threads (Java 21) & What Came After
@level: 4
@time: 22
@java: 21+
@prereq: executors, completablefuture
@next: interview-basics
@tags: virtual threads, project loom, platform thread, carrier thread, pinning, structured concurrency, scoped values, java 21, java 25, sequenced collections
===
## The problem virtual threads solve

A classic server handles each request on a **platform thread** — a thin wrapper around an OS thread, with a ~1 MB stack and expensive context switches. You can afford a few thousand at most. When each request spends most of its time **waiting** on I/O (DB, HTTP calls), those scarce threads sit idle, and throughput is capped by the thread count. The workaround — asynchronous/reactive code (`CompletableFuture`, WebFlux) — scales but is harder to write, debug and profile.

## What a virtual thread is

A **virtual thread** (Project Loom; **standard in Java 21**, JEP 444) is a `java.lang.Thread` managed by the JVM rather than the OS:

- Cheap to create — you can have **millions**; its stack lives on the heap and grows/shrinks as needed.
- It runs on a small pool of **carrier** (platform) threads — a `ForkJoinPool` sized to the number of cores.
- When it performs a blocking operation (socket read, `Thread.sleep`, `BlockingQueue.take`, JDBC over sockets), the JVM **unmounts** it from the carrier and parks it; the carrier runs another virtual thread. When the I/O completes, it's rescheduled.

Result: simple, blocking, thread-per-request code with the scalability of async code.

```java
// Java 21+
try (ExecutorService executor = Executors.newVirtualThreadPerTaskExecutor()) {
    List<Future<String>> results = new ArrayList<>();
    for (int i = 0; i < 10_000; i++) {
        int id = i;
        results.add(executor.submit(() -> {
            Thread.sleep(Duration.ofSeconds(1));      // blocking — but only parks the virtual thread
            return "done " + id;
        }));
    }
    // 10,000 concurrent blocking tasks complete in about 1 second on a few carrier threads
}   // ExecutorService is AutoCloseable since Java 19: close() waits for tasks

Thread vt = Thread.ofVirtual().name("report-", 0).start(() -> generateReport());
Thread.startVirtualThread(() -> sendEmail());
```

## Platform vs virtual threads

| | Platform thread | Virtual thread |
|---|---|---|
| Managed by | OS | JVM |
| Cost | ~1 MB stack, kernel resources | A few hundred bytes to KBs, heap-allocated |
| Practical count | Thousands | Millions |
| Blocking I/O | Blocks the OS thread | Parks; carrier is freed |
| Best for | CPU-bound work, long-lived tasks | High-concurrency **I/O-bound** tasks |
| Pooling | Pool them (expensive) | **Don't pool** — create one per task |
| `ThreadLocal` | Fine | Works, but costly with millions of threads → Scoped Values |

## Caveats

- **CPU-bound work gets no speedup** — the number of cores is still the limit.
- **Pinning**: in Java 21–23, blocking inside a `synchronized` block/method (or native code) pins the virtual thread to its carrier, reducing scalability. Java 21 advice was to prefer `ReentrantLock` around blocking calls; **Java 24 (JEP 491)** removed pinning for `synchronized`.
- Downstream resources are still finite: 10,000 virtual threads will happily wait on a DB pool of 10 connections — use semaphores or pool limits to protect them.
- Avoid huge `ThreadLocal` caches per thread.

:::project Spring Boot 3.2+
With Java 21, set `spring.threads.virtual.enabled=true`: Tomcat's request handling, `@Async` task execution and several integrations switch to virtual threads — a big throughput gain for typical blocking JDBC/HTTP back ends with no code changes. Measure, and keep DB connection pool sizing in mind.
:::

## Other notable Java 21 features

| Feature | Status in 21 |
|---|---|
| Virtual threads | Standard |
| Pattern matching for switch, record patterns | Standard |
| **Sequenced collections** — `getFirst()`, `getLast()`, `reversed()` on `List`, `Deque`, `LinkedHashSet`/`Map` (`SequencedCollection`, `SequencedMap`) | Standard |
| Generational ZGC | Standard (opt-in) |
| Structured concurrency, scoped values | **Preview** |
| String templates | Preview (later withdrawn) |
| Unnamed classes & instance main methods | Preview |

## After Java 21 (to Java 25 LTS, Sept 2025)

Highlights that became standard: unnamed variables & patterns `_` (22), Foreign Function & Memory API (22), stream gatherers (24), `synchronized` without pinning (24), module import declarations, compact source files & instance `main` methods, flexible constructor bodies, and scoped values (all 25). Always check the version before using a feature, and never ship preview features to production.

## Interview questions

:::qa advanced
? What are virtual threads and when should you use them?
Lightweight threads implemented by the JVM (Java 21) and scheduled onto a small pool of carrier OS threads. Blocking operations unmount them instead of blocking an OS thread, so millions can exist. Use them for high-concurrency I/O-bound workloads written in simple blocking style (web requests, DB and HTTP calls); they don't speed up CPU-bound work and shouldn't be pooled.
--- followup What is pinning?
A situation where a virtual thread can't unmount from its carrier while blocked — in Java 21–23 inside `synchronized` blocks or native frames — so the carrier is blocked too. Java 24 removed the `synchronized` case.
--- followup Do virtual threads make reactive programming obsolete?
For many request/response services they remove the main motivation (scalability of blocking I/O) with simpler code. Reactive libraries still offer back-pressure and streaming composition that some workloads need.
:::

:::quiz
? Should virtual threads be pooled in a fixed-size pool?
- Yes, like platform threads
+ No — create a new virtual thread per task; they're cheap
- Only for CPU-bound work
- Only in Spring
--- explain
Pooling exists to amortise the cost of expensive platform threads. Virtual threads are cheap; limit concurrency on scarce resources with semaphores instead.
:::
</script>

@id: interview-basics
@module: interview
@title: Basic Java Interview Questions
@level: 2
@time: 30
@prereq: what-is-java, jdk-jre-jvm
@next: interview-core
@tags: interview, basics, fresher, jvm, jdk, main, platform independent, wrapper, string, static
===
## How to use this section

Each question has a **short answer** you can say in 20–30 seconds, then a **detailed explanation** for depth, plus the **follow-ups** interviewers typically ask next. Practise saying the short answer aloud, then be ready to go deeper. Links point to the full lessons.

:::tip The answer structure interviewers like
1. One-sentence definition. 2. Why it exists / what problem it solves. 3. How it works (one level deeper). 4. A concrete example — ideally from a project. 5. A trade-off or pitfall.
:::

## Questions

:::qa basic
? What is Java and what makes it platform independent?
Java is a statically typed, object-oriented language whose source is compiled to bytecode that runs on the JVM. Bytecode is platform-neutral; each OS has its own JVM that executes it — so the same `.class` files run anywhere a JVM exists.
--- detail
Platform independence applies to bytecode, not the JVM (which is native per platform). Portability is reinforced by fixed primitive sizes and a defined memory model. See [Compilation & execution](#compilation-execution).
--- followup Is the JVM platform independent?
No — it's a native program built for each OS/CPU combination.
:::

:::qa basic
? Explain JDK, JRE and JVM.
JVM executes bytecode; JRE = JVM + standard libraries (enough to run); JDK = JRE + development tools like `javac`, `jar`, `jshell` (needed to develop).
--- followup What's different since Java 11?
Separate JRE downloads were dropped by Oracle; you install a JDK and can build a minimal runtime with `jlink`.
:::

:::qa basic
? Why is main public static void?
`public` so the launcher can access it, `static` so it can run without creating an object, `void` because the program's exit status isn't returned from `main` (use `System.exit`). It takes `String[]` command-line arguments.
--- followup Can main be overloaded? Can it be private?
It can be overloaded, but only `public static void main(String[])` is the entry point. A private main compiles but the launcher can't use it.
:::

:::qa basic
? What are the primitive data types? What are their default values?
`byte`, `short`, `int`, `long` (default 0), `float`, `double` (0.0), `char` (`'\u0000'`), `boolean` (`false`). Default values apply to fields and array elements — local variables have no default and must be assigned.
:::

:::qa basic
? What is the difference between == and equals()?
`==` compares primitive values or object references (identity). `equals()` compares logical equality as defined by the class — e.g. `String` compares characters.
--- example
```java
String a = new String("hi"), b = new String("hi");
a == b;        // false
a.equals(b);   // true
```
--- followup What must you do if you override equals?
Override `hashCode` consistently, otherwise hash-based collections break. See [equals & hashCode](#equals-hashcode).
:::

:::qa basic
? What are wrapper classes and autoboxing?
Object versions of primitives (`Integer`, `Double`, …) used in collections and generics. Autoboxing/unboxing is the compiler's automatic conversion between them.
--- followup Pitfall?
`Integer` caching (−128..127) makes `==` unreliable, and unboxing `null` throws NPE.
:::

:::qa basic
? What is the difference between String, StringBuilder and StringBuffer?
`String` is immutable and thread-safe; `StringBuilder` is mutable and not synchronised (fast, single thread); `StringBuffer` is mutable and synchronised (legacy).
:::

:::qa basic
? What is the static keyword?
It makes a member belong to the class rather than to instances: one shared copy of static variables, static methods callable without an object, static blocks run once at class initialisation, static nested classes without an outer instance.
--- followup Can we override static methods?
No — they're hidden, and resolved by the reference's declared type at compile time.
:::

:::qa basic
? What is a constructor? How is it different from a method?
A special block run by `new` to initialise an object; same name as the class, no return type, not inherited, can be overloaded and chained with `this()`/`super()`.
:::

:::qa basic
? What is the difference between break and continue? Between while and do-while?
`break` exits the loop; `continue` skips to the next iteration. `while` checks before the body (may run zero times); `do-while` checks after (runs at least once).
:::

:::qa basic
? What is an array? How is it different from ArrayList?
A fixed-size, indexed container that can hold primitives, with `length`. `ArrayList` is a resizable, generic list of objects backed by an array, with `size()` and many helper methods.
:::

:::qa basic
? What are access modifiers?
`private` (class), default/package-private (package), `protected` (package + subclasses), `public` (everywhere). They implement encapsulation.
:::

:::quiz
? Which is NOT a feature of Java?
- Platform-independent bytecode
- Automatic garbage collection
+ Explicit pointer arithmetic
- Built-in multithreading support
--- explain
Java has references but no pointer arithmetic, which improves safety.
:::
</script>

<script type="text/x-java-topic">
@id: interview-core
@module: interview
@title: Core Java & OOP Interview Questions
@level: 3
@time: 40
@prereq: polymorphism, interfaces, string-basics
@next: interview-collections
@tags: interview, core java, oop, polymorphism, abstraction, interface, immutable, string, final, pass by value, object class
===
## Core Java

:::qa intermediate
? Is Java pass-by-value or pass-by-reference?
Always pass-by-value. For objects, the value copied is the reference, so a method can mutate the object but can't make the caller's variable refer to another object.
--- example
```java
void change(StringBuilder sb) { sb.append("!"); sb = new StringBuilder("new"); }
StringBuilder s = new StringBuilder("hi");
change(s);   // s is "hi!" — mutation visible, reassignment not
```
--- followup How would you prove it in an interview?
Show that a `swap(a, b)` method can't swap the caller's references.
:::

:::qa intermediate
? Why is String immutable, and what is the String pool?
Immutability enables safe sharing via the pool, security (paths, class names, credentials can't change after checks), thread safety and hash-code caching. The pool is a heap-resident table of canonical strings used for literals and `intern()`.
--- followup How many objects does `new String("a")` create?
Up to two: the pooled literal (if not already present) and a new heap object.
:::

:::qa intermediate
? What is the difference between final, finally and finalize?
`final`: modifier preventing reassignment/overriding/extension. `finally`: block that always runs after try/catch (except `System.exit`, JVM crash). `finalize()`: deprecated GC hook — don't use; use try-with-resources or `Cleaner`.
:::

:::qa intermediate
? What happens if you don't override hashCode after overriding equals?
Equal objects may have different hash codes, so `HashMap`/`HashSet` put them in different buckets — lookups fail and sets contain duplicates.
:::

:::qa intermediate
? How do you make a class immutable?
Final class, private final fields, no setters, full initialisation in the constructor, defensive copies of mutable inputs/outputs, and methods that return new instances. Or use a record (plus copying mutable components).
:::

:::qa tricky
? Can we have a try without catch? A catch without try? Code after a return inside try?
Try with only `finally` (or try-with-resources) is legal. Catch requires try. Code directly after `return` in the same block is unreachable (compile error), but `finally` still runs after the return.
:::

## OOP

:::qa intermediate
? Explain polymorphism with a real project example.
Polymorphism lets one call behave differently based on the object's runtime type. In a payment module, the service calls `processor.process(request)` on a `PaymentProcessor` interface; UPI, card and net-banking implementations each handle it. Adding a new method is a new class, with no changes to the service. Overloading is the compile-time form.
--- followup How does the JVM decide which method to call?
Dynamic dispatch: `invokevirtual`/`invokeinterface` looks up the implementation in the runtime class's method table (vtable/itable), heavily optimised by JIT inlining.
:::

:::qa intermediate
? Abstract class vs interface — when do you use each?
Interface for a capability/contract that unrelated classes can implement (multiple inheritance of type, lambdas, easy mocking). Abstract class when subclasses share state and code, need constructors or protected hooks (Template Method). Often both: interface + abstract base.
--- followup What changed in Java 8 and 9 for interfaces?
Default and static methods (8), private methods (9). Interfaces still can't hold instance state.
:::

:::qa intermediate
? What is the difference between overloading and overriding?
Overloading: same name, different parameters, same class, resolved at compile time. Overriding: subclass redefines an inherited method with the same signature, resolved at runtime; return type may be covariant; access can't be narrower; can't add broader checked exceptions.
:::

:::qa tricky
? Can we override a static or private method? Can we overload main?
Static methods are hidden, not overridden; private methods aren't inherited so they can't be overridden. `main` can be overloaded.
:::

:::qa intermediate
? Composition vs inheritance?
Inheritance is IS-A and couples the child to the parent's implementation. Composition is HAS-A: the class holds and delegates to other objects — looser coupling, runtime flexibility, easier testing. Prefer composition unless there's a genuine IS-A that honours Liskov substitution.
:::

:::qa intermediate
? What is the diamond problem and how does Java handle it?
Ambiguity when a class inherits the same member from two parents. Java forbids multiple class inheritance. For interfaces with conflicting default methods, the implementing class must override and choose explicitly with `A.super.method()`.
:::

:::qa tricky
? Explain SOLID briefly with an example of each.
S: an `InvoiceService` shouldn't also format PDFs. O: add a new `DiscountRule` class instead of editing a switch. L: `ReadOnlyList` shouldn't extend a mutable list and throw on `add`. I: split `Printer` and `Scanner` interfaces rather than one `Machine`. D: services depend on `PaymentGateway`, with implementations injected.
:::

:::quiz
? `Parent p = new Child(); p.staticMethod();` calls:
+ `Parent.staticMethod()`
- `Child.staticMethod()`
- Compile error
- Both
--- explain
Static methods bind at compile time to the declared type.
:::
</script>

<script type="text/x-java-topic">
@id: interview-collections
@module: interview
@title: Collections & Generics Interview Questions
@level: 3
@time: 40
@prereq: hashmap-internals, concurrent-collections
@next: interview-exceptions
@tags: interview, collections, hashmap, arraylist, linkedlist, hashset, treemap, concurrenthashmap, fail fast, comparable, generics
===
:::qa advanced
? How does HashMap work internally?
Array of buckets (power-of-two size). `put` spreads the key's hashCode, computes index `(n-1) & hash`, then either inserts a node or walks the bucket comparing hash + `equals` to replace or append. Buckets with more than 8 nodes become red-black trees (if capacity ≥ 64). When size exceeds capacity × 0.75, the table doubles and entries are split. `get` follows the same path.
--- followup What changed in Java 8?
Treeification of large buckets (worst case O(log n)), a simpler hash-spreading function, lazy table allocation, and an order-preserving resize that fixed the concurrent-resize infinite loop (though HashMap is still not thread-safe).
--- followup What if a key's hashCode changes after insertion?
The entry becomes unreachable in its old bucket: `get` returns null while the entry still occupies memory.
:::

:::qa intermediate
? ArrayList vs LinkedList?
ArrayList: dynamic array, O(1) random access, amortised O(1) append, O(n) inserts/removes in the middle, cache-friendly. LinkedList: doubly linked list, O(n) access, O(1) at the ends, higher memory. ArrayList is the default choice; ArrayDeque for queues.
:::

:::qa intermediate
? HashMap vs Hashtable vs ConcurrentHashMap?
HashMap: unsynchronised, one null key allowed. Hashtable: legacy, every method synchronised, no nulls. ConcurrentHashMap: thread-safe with lock-free reads and per-bin locking/CAS for writes, no nulls, weakly consistent iterators, atomic `compute`/`merge`.
:::

:::qa intermediate
? HashSet vs TreeSet vs LinkedHashSet?
All unique elements. HashSet: hash table, O(1), no order. LinkedHashSet: plus insertion order. TreeSet: red-black tree, O(log n), sorted, uses `compareTo`/comparator for uniqueness, no null.
--- followup How does HashSet ensure uniqueness?
It stores elements as keys in a backing HashMap; `add` returns false if the key already existed.
:::

:::qa intermediate
? What is a fail-fast iterator?
One that throws `ConcurrentModificationException` when the collection is structurally modified after the iterator was created (except via the iterator's own `remove`), using a `modCount` check. Concurrent collections provide fail-safe/weakly consistent iterators instead.
:::

:::qa intermediate
? Comparable vs Comparator?
`Comparable.compareTo` defines a class's natural order inside the class. `Comparator.compare` defines external orders; Java 8's `comparing`/`thenComparing`/`reversed` make multi-key sorting easy.
:::

:::qa intermediate
? How would you sort a list of employees by department, then salary descending?
```java
employees.sort(Comparator.comparing(Employee::getDept)
        .thenComparing(Employee::getSalary, Comparator.reverseOrder()));
```
:::

:::qa tricky
? Why can't you add to a `List<? extends Number>`?
The actual list might be `List<Double>`, so adding an `Integer` could corrupt it. Upper-bounded wildcards are read-only producers (PECS: producer extends, consumer super).
:::

:::qa tricky
? What is type erasure and one practical consequence?
Generic type arguments are removed after compilation; at runtime `List<String>` and `List<Integer>` are the same class. You can't do `new T()`, `instanceof List<String>`, or overload methods differing only by type argument.
:::

:::qa scenario
? You need to remove duplicates from a list while preserving the original order. How?
`new ArrayList<>(new LinkedHashSet<>(list))` or `list.stream().distinct().toList()` — both keep first occurrences in order and rely on `equals`/`hashCode`.
:::

:::qa scenario
? Which collection would you use for: (a) an LRU cache, (b) a leaderboard sorted by score, (c) a job queue between threads, (d) checking whether an id was already processed?
(a) `LinkedHashMap` with access order and `removeEldestEntry` (or Caffeine). (b) `TreeMap`/`TreeSet` or a `PriorityQueue` depending on access pattern. (c) a `BlockingQueue` (`LinkedBlockingQueue`/`ArrayBlockingQueue`). (d) a `HashSet` (or `ConcurrentHashMap.newKeySet()` if concurrent).
:::

:::quiz
? What happens when you call `List.of(1, 2).add(3)`?
- Returns true
+ Throws `UnsupportedOperationException`
- Compile error
- Returns a new list
--- explain
`List.of` returns an unmodifiable list.
:::
</script>

<script type="text/x-java-topic">
@id: interview-exceptions
@module: interview
@title: Exception Handling Interview Questions
@level: 3
@time: 25
@prereq: custom-exceptions, try-with-resources
@next: interview-multithreading
@tags: interview, exception, checked, unchecked, finally, throw, throws, custom exception, try with resources, transactional rollback
===
:::qa basic
? Checked vs unchecked exceptions?
Checked exceptions (subclasses of `Exception` except `RuntimeException`) must be caught or declared — for recoverable external failures (I/O, SQL). Unchecked (`RuntimeException`, `Error`) need not be — usually programming errors or business rule violations.
:::

:::qa basic
? throw vs throws?
`throw` raises an exception instance inside a method. `throws` declares, in the signature, the checked exceptions a method may propagate.
:::

:::qa intermediate
? What is the exception hierarchy?
`Throwable` → `Error` (JVM/system problems) and `Exception` → `RuntimeException` (unchecked) and other checked exceptions.
:::

:::qa tricky
? What is returned by `try { return 1; } finally { return 2; }` and why is it bad?
2 — the finally return overrides the pending one and would also swallow any exception from the try. Returning from finally hides errors.
:::

:::qa intermediate
? What is try-with-resources and what are suppressed exceptions?
It automatically closes `AutoCloseable` resources in reverse order. If both the body and `close()` throw, the body's exception propagates and the close exception is attached via `getSuppressed()`.
:::

:::qa intermediate
? How do you design exception handling in a Spring Boot REST API?
Throw meaningful unchecked domain exceptions from services (`ResourceNotFoundException`, `BusinessRuleException` with error codes), preserve causes when wrapping, and handle them centrally in a `@RestControllerAdvice` mapping each to an HTTP status and a consistent error body (e.g. `ProblemDetail`); log unexpected exceptions once at that boundary and never expose stack traces to clients.
--- followup Does @Transactional roll back on checked exceptions?
Not by default — only on unchecked exceptions and errors, unless `rollbackFor` is configured.
:::

:::qa tricky
? ClassNotFoundException vs NoClassDefFoundError?
The first is a checked exception when loading a class by name fails (`Class.forName`). The second is an Error when a class available at compile time is missing at runtime or failed static initialisation earlier.
:::

:::qa tricky
? Can we catch StackOverflowError or OutOfMemoryError?
Technically yes (they're Throwables), but it's rarely sensible: the JVM state may be compromised. Fix causes (recursion depth, leaks, heap size) and let top-level handlers log.
:::

:::qa scenario
? A colleague wraps everything in `catch (Exception e) { e.printStackTrace(); }`. What's wrong?
It swallows failures (execution continues with bad state), catches bugs you'd want to see, prints to stderr instead of the logging system, loses context, and makes callers think the operation succeeded. Catch specific exceptions where you can handle them, otherwise let them propagate to a central handler.
:::

:::quiz
? Which statement about `finally` is true?
- It runs only when an exception occurs
+ It runs whether or not an exception occurs, except for cases like `System.exit()` or a JVM crash
- It cannot contain a try-catch
- It runs before the catch block
--- explain
`finally` executes after try/catch in all normal and exceptional completions; only abrupt JVM termination prevents it.
:::
</script>

<script type="text/x-java-topic">
@id: interview-multithreading
@module: interview
@title: Multithreading & Concurrency Interview Questions
@level: 4
@time: 45
@prereq: synchronization, executors, concurrency-problems
@next: interview-java8
@tags: interview, multithreading, concurrency, thread, synchronized, volatile, deadlock, executorservice, completablefuture, runnable, callable, wait, notify, sleep, lock
===
:::qa basic
? Process vs thread?
A process has its own memory space; threads are execution paths within a process that share the heap but each have their own stack and program counter.
:::

:::qa basic
? Runnable vs Callable?
`Runnable.run()` returns nothing and can't throw checked exceptions. `Callable.call()` returns a value (via `Future`) and can throw checked exceptions.
:::

:::qa intermediate
? sleep() vs wait()?
`sleep` is a static Thread method that pauses without releasing locks. `wait` is an Object method called while holding the monitor; it releases the monitor until notified, interrupted or timed out.
:::

:::qa intermediate
? notify() vs notifyAll()?
`notify` wakes one arbitrary waiter; `notifyAll` wakes all waiters to re-check their conditions. `notifyAll` is safer when waiters wait for different conditions.
:::

:::qa intermediate
? synchronized vs Lock (ReentrantLock)?
Both give mutual exclusion and visibility and are reentrant. `synchronized` is simpler and releases automatically. `ReentrantLock` adds tryLock with timeout, interruptible locking, fairness and multiple Conditions, but must be unlocked in `finally`.
:::

:::qa advanced
? What does volatile guarantee?
Visibility of writes across threads and ordering (happens-before) — but not atomicity of compound actions like `count++`.
--- followup Where have you used it?
Stop flags for background workers, publishing an immutable configuration snapshot via a volatile reference, and double-checked locking.
:::

:::qa intermediate
? What is a race condition? A deadlock?
A race condition is a correctness bug caused by unsynchronised interleaving of threads on shared state. A deadlock is threads waiting forever for locks held by each other in a cycle.
--- followup How do you prevent deadlocks?
Consistent lock ordering, `tryLock` with timeouts, minimal lock scope, no calls to foreign code while holding locks, and higher-level concurrency utilities.
:::

:::qa advanced
? Explain ThreadPoolExecutor parameters and what happens when the pool is saturated.
core size, max size, keep-alive, work queue, thread factory, rejection handler. Tasks start core threads first, then queue, then extra threads up to max when the queue is full, then the rejection policy runs (Abort by default; CallerRuns provides back-pressure).
--- followup Why is `Executors.newFixedThreadPool` risky in servers?
It uses an unbounded queue — under overload, tasks accumulate until memory runs out instead of being rejected.
:::

:::qa intermediate
? Future vs CompletableFuture?
`Future` offers only blocking `get` and cancellation. `CompletableFuture` supports non-blocking composition (`thenApply`, `thenCompose`, `thenCombine`, `allOf`), error handling (`exceptionally`, `handle`), timeouts and manual completion.
:::

:::qa intermediate
? How does ConcurrentHashMap achieve concurrency?
Java 8+: lock-free reads, CAS to insert into empty bins, `synchronized` on the first node of a bin for updates, cooperative resizing, striped counters for size.
:::

:::qa intermediate
? What is ThreadLocal and its main risk?
Per-thread variables stored in each thread's map. In thread pools, values persist across tasks unless removed — causing memory leaks and data leaking between requests.
:::

:::qa tricky
? What happens if you call start() twice or run() instead of start()?
Second `start()` throws `IllegalThreadStateException`. Calling `run()` executes on the current thread — no new thread.
:::

:::qa advanced
? What are virtual threads?
Java 21 lightweight threads scheduled by the JVM onto a few carrier threads; blocking I/O parks them instead of blocking an OS thread, allowing millions of concurrent tasks with simple blocking code. Great for I/O-bound services, not for CPU-bound work; don't pool them.
:::

:::qa scenario
? Your service must call 5 downstream APIs per request, each ~200 ms. How do you design it?
Call them concurrently using `CompletableFuture.supplyAsync` with a dedicated bounded executor (or virtual threads), apply per-call timeouts (`orTimeout`), fallbacks (`exceptionally`), then `allOf` and combine. Latency becomes roughly the slowest call. Consider bulkheads/circuit breakers (Resilience4j) and limit concurrency to protect downstream services.
:::

:::qa coding
? Print numbers 1–10 alternately from two threads (odd/even).
Share a lock and a counter; each thread waits while it's not its turn (`counter % 2`), prints, increments and `notifyAll()`s. See the exercise in [wait/notify](#wait-notify). Alternatives: two `Semaphore`s passing a permit back and forth.
:::

:::quiz
? Which is NOT thread-safe?
- `ConcurrentHashMap`
- `AtomicInteger`
+ `SimpleDateFormat`
- `DateTimeFormatter`
--- explain
`SimpleDateFormat` keeps mutable internal state (a `Calendar`); sharing it across threads corrupts results. `DateTimeFormatter` is immutable.
:::
</script>
