@id: variables
@module: basics
@title: Variables: Local, Instance & Static
@level: 1
@time: 18
@prereq: hello-world
@next: data-types
@tags: variable, local, instance, static, class variable, scope, default value, final, constant, var
===
## Introduction

A **variable** is a named storage location with a **type**. The type fixes what values it can hold and which operations are legal. Java is statically typed, so the compiler knows every variable's type and rejects mismatches before the program runs.

Java has three kinds of variables, and the difference between them — *where they live, how long they live, and whether they get a default value* — is a favourite interview topic.

## The three kinds

```java title="Counter.java"
public class Counter {
    static int totalCreated = 0;      // static (class) variable: one copy per class
    int value;                        // instance variable: one copy per object, default 0

    Counter() {
        totalCreated++;
    }

    void add(int amount) {            // amount: parameter (a local variable)
        int before = value;           // local variable: must be assigned before use
        value = before + amount;
    }

    public static void main(String[] args) {
        Counter a = new Counter();
        Counter b = new Counter();
        a.add(5);
        b.add(2);
        System.out.println(a.value + " " + b.value + " " + Counter.totalCreated); // 5 2 2
    }
}
```

| Aspect | Local variable | Instance variable (field) | Static variable (class field) |
|---|---|---|---|
| Declared | Inside a method, constructor or block | In the class, without `static` | In the class, with `static` |
| Copies | One per method invocation | One per object | One per class (per class loader) |
| Stored in | The thread's **stack frame** (primitives, or the *reference*) | Inside the object on the **heap** | With the class's static storage (on the heap, alongside the `Class` object, since Java 8) |
| Lifetime | Until the block/method ends | As long as the object is reachable | As long as the class is loaded |
| Default value | **None** — must be definitely assigned | Yes (`0`, `false`, `null`…) | Yes |
| Access modifiers | Not allowed (only `final`) | Allowed | Allowed |
| Thread safety | Each thread has its own copy | Shared if the object is shared | Shared by all threads |

## Default values

Fields are zero-initialised when the object (or class) is created; local variables are not.

| Type | Default |
|---|---|
| `byte`, `short`, `int`, `long` | `0` / `0L` |
| `float`, `double` | `0.0f` / `0.0` |
| `char` | `'\u0000'` (the null character) |
| `boolean` | `false` |
| Any reference type (`String`, arrays, objects) | `null` |

```java
void demo() {
    int x;
    // System.out.println(x);   // compile error: variable x might not have been initialized
    if (Math.random() > 0.5) x = 1; else x = 2;
    System.out.println(x);      // OK: x is definitely assigned on every path
}
```

**Why the difference?** Fields are allocated in memory the JVM zeroes anyway (cheap and safe). Local variables live in stack frames that are reused; rather than silently exposing a stale value, the compiler performs **definite assignment analysis** and refuses to compile reads that might happen before a write.

## Scope and shadowing

A variable is visible from its declaration to the end of the enclosing block. A local variable or parameter with the same name as a field **shadows** it — which is why constructors write `this.value = value;`.

```java
class Account {
    private double balance;
    void setBalance(double balance) {
        balance = balance;          // BUG: assigns the parameter to itself
        this.balance = balance;     // correct: 'this.balance' is the field
    }
}
```

## Constants and `final`

```java
static final int MAX_LOGIN_ATTEMPTS = 3;   // compile-time constant
final LocalDate today = LocalDate.now();   // final: assigned once, cannot be reassigned
```

`final` prevents **reassignment of the variable**, not mutation of the object it refers to: a `final List<String>` can still have elements added.

## `var` — local variable type inference (Java 10+)

```java
var names = new ArrayList<String>();   // type is ArrayList<String>, inferred at compile time
var count = 10;                        // int
// var x;                              // error: cannot infer without an initializer
// var n = null;                       // error: null has no specific type
```

`var` is still **static typing** — the compiler infers the type once and it can never change. It works only for local variables with an initializer (and loop variables, lambda parameters in Java 11), never for fields, parameters or return types.

## Real-life example

:::analogy Hotel rooms
- A **static variable** is the hotel's lobby noticeboard — one board, every guest sees and can change the same board.
- An **instance variable** is the minibar in each room — every room (object) has its own, stocked with defaults when the room is prepared.
- A **local variable** is a sticky note you write while standing at the reception desk — it exists only during that visit (method call) and nobody else sees it.
:::

:::project
In a Spring `@Service`, instance fields are shared across all requests because the service is a **singleton** bean used by many threads. Storing per-request data (`currentUser`, `tempTotal`) in fields causes data leaking between users. Per-request data belongs in **local variables** or method parameters.
:::

## Common mistakes

:::mistake
- Reading a local variable before assigning it.
- Forgetting `this.` in setters/constructors (self-assignment).
- Using `static` fields for per-user or per-request state in a web application — a concurrency bug.
- Assuming `final` makes an object immutable.
:::

## Interview questions

:::qa basic
? What are the types of variables in Java?
Local variables (inside methods/blocks, on the stack, no default value), instance variables (per object, on the heap, default-initialised), and static/class variables (one per class, shared by all instances, default-initialised).
--- followup Why do local variables not get default values?
The compiler's definite-assignment rule forces you to initialise them, preventing bugs from reading meaningless values. Fields get defaults because object memory is zeroed on allocation.
:::

:::qa intermediate
? Where are static variables stored in Java 8+?
Since Java 8 removed PermGen, class metadata lives in native memory (Metaspace), while static field *values* are stored on the heap, associated with the class's `java.lang.Class` mirror object. Objects referenced from static fields are ordinary heap objects that stay reachable as long as the class is loaded.
--- followup Can static variables cause memory leaks?
Yes. A static collection that only grows (e.g. a cache without eviction) keeps every entry reachable for the life of the class loader, so the GC can never reclaim them.
:::

:::qa tricky
? Is `var` dynamic typing like JavaScript?
No. `var` only asks the compiler to infer the static type from the initializer. `var x = 10; x = "text";` is a compile error because `x` is an `int`.
:::

:::quiz
? What is the default value of an `int` instance variable?
- `null`
+ `0`
- undefined
- a garbage value
--- explain
Instance and static fields are zero-initialised: numeric types get 0, `boolean` gets `false`, references get `null`. Only *local* variables have no default.
:::

:::quiz
? What does `final List<String> list = new ArrayList<>();` guarantee?
- The list can never change
+ `list` can never be reassigned to another list, but its contents can change
- The list is thread-safe
- The strings inside are final
--- explain
`final` applies to the variable (the reference), not to the object. Use `List.of(...)` or `Collections.unmodifiableList` for an unmodifiable list.
:::

:::exercise beginner
? Count objects
Create a class `Student` with an instance field `name` and a static field `count` that tracks how many `Student` objects have been created. Print the count after creating three students.
--- solution
```java title="Student.java"
public class Student {
    private static int count = 0;
    private final String name;

    public Student(String name) {
        this.name = name;
        count++;
    }

    public static int getCount() {
        return count;
    }

    public static void main(String[] args) {
        new Student("Asha");
        new Student("Ravi");
        new Student("Meera");
        System.out.println("Students created: " + Student.getCount()); // 3
    }
}
```
--- explanation
`count` is shared by the class, so every constructor call increments the same variable. `name` is per object. In multi-threaded code, `count++` is not atomic — you would use `AtomicInteger`.
:::
</script>

<script type="text/x-java-topic">
@id: data-types
@module: basics
@title: Data Types: Primitives, References & Literals
@level: 2
@time: 25
@prereq: variables
@next: type-casting, wrapper-classes
@tags: primitive, byte, short, int, long, float, double, char, boolean, reference type, literal, overflow, bigdecimal, unicode
===
## Introduction

Every value in Java is either a **primitive** (a raw number, character or boolean stored directly) or a **reference** (a pointer-like handle to an object on the heap). This split exists for performance: primitives avoid object overhead for the most common operations, while references give you the full power of objects.

## The eight primitive types

| Type | Size | Range | Default | Example literal |
|---|---|---|---|---|
| `byte` | 8 bit | −128 to 127 | 0 | `(byte) 10` |
| `short` | 16 bit | −32,768 to 32,767 | 0 | `(short) 300` |
| `int` | 32 bit | −2³¹ to 2³¹−1 (≈ ±2.1 billion) | 0 | `42`, `1_000_000`, `0x1F`, `0b1010`, `017` (octal!) |
| `long` | 64 bit | −2⁶³ to 2⁶³−1 | 0L | `9_000_000_000L` |
| `float` | 32 bit | ≈ ±3.4×10³⁸, ~7 significant digits | 0.0f | `3.14f` |
| `double` | 64 bit | ≈ ±1.8×10³⁰⁸, ~15–16 significant digits | 0.0 | `3.14`, `1e-9` |
| `char` | 16 bit | `'\u0000'` to `'￿'` (0–65,535, unsigned) | `'\u0000'` | `'A'`, `'\n'`, `'₹'` (₹) |
| `boolean` | JVM-dependent | `true` / `false` | false | `true` |

Sizes are fixed by the language specification on **every platform** — that is part of Java's portability. `boolean` has no specified size; HotSpot uses one byte per `boolean` in arrays and typically 4 bytes as a local on the operand stack.

## Reference types

Everything else — classes, interfaces, arrays, enums, records — is a **reference type**. A reference variable holds a reference to an object (or `null`), not the object itself.

```java
int a = 10;
int b = a;              // copies the VALUE 10
b = 20;                 // a is still 10

int[] x = {1, 2, 3};
int[] y = x;            // copies the REFERENCE: x and y point to the same array
y[0] = 99;              // x[0] is now 99 too
```

:::diagram Stack vs heap for the code above
[a] Stack (method frame) :: a = 10 · b = 20 · x → ref#7 · y → ref#7
[g] Heap :: ref#7 → int[3] { 99, 2, 3 }
:::

## Literals worth knowing

```java
int million   = 1_000_000;     // underscores for readability (Java 7+)
int hex       = 0xFF;          // 255
int binary    = 0b1010_1010;   // 170 (Java 7+)
int octal     = 010;           // 8 — a leading zero means OCTAL!
long big      = 3_000_000_000L;// L suffix required: the literal doesn't fit in int
float price   = 99.99f;        // f suffix required: 99.99 is a double literal
char rupee    = '₹';      // Unicode escape
String block  = """
    Multi-line
    text block""";             // Java 15+
```

## Integer overflow — silent wrap-around

```java
int max = Integer.MAX_VALUE;     // 2147483647
System.out.println(max + 1);      // -2147483648  (wraps, no exception)
System.out.println(Math.addExact(max, 1)); // throws ArithmeticException: integer overflow
long ok = (long) max + 1;         // 2147483648 — widen BEFORE adding
```

Integer arithmetic uses two's complement and **wraps silently**. Use `Math.addExact`/`multiplyExact` when overflow must be detected, or `long`/`BigInteger` for larger ranges.

## Floating point is binary — not for money

```java
System.out.println(0.1 + 0.2);            // 0.30000000000000004
System.out.println(1.0 / 0);              // Infinity (no exception for floating point)
System.out.println(0.0 / 0);              // NaN
System.out.println(Double.NaN == Double.NaN); // false!
System.out.println(1 / 0);                // ArithmeticException: / by zero (integer division)

BigDecimal total = new BigDecimal("0.10").add(new BigDecimal("0.20"));  // 0.30 exactly
```

`float` and `double` follow IEEE 754 binary floating point, which cannot represent 0.1 exactly. For currency use **`BigDecimal`** constructed from a `String` (not from a `double`: `new BigDecimal(0.1)` carries the binary error), or store amounts in the smallest unit (paise) as `long`.

:::project
In an ERP purchase module, invoice amounts, GST and totals should be `BigDecimal` with an explicit `RoundingMode` (e.g. `setScale(2, RoundingMode.HALF_UP)`), mapped to `DECIMAL(15,2)` in the database. Using `double` leads to totals that are off by a paisa and reconciliation failures.
:::

## char is a number

`char` is an unsigned 16-bit UTF-16 code unit, so arithmetic works on it:

```java
char c = 'A';
c++;                        // 'B'
int code = 'a';             // 97
System.out.println('a' + 'b');   // 195 — char + char is int arithmetic, not concatenation
System.out.println("" + 'a' + 'b'); // "ab"
```

Characters outside the Basic Multilingual Plane (many emoji) need **two** `char`s (a surrogate pair), which is why `"😀".length()` is 2.

## Real-life example

:::analogy Containers of fixed size
Primitive types are like fixed-size containers in a kitchen: a `byte` is an espresso cup, an `int` a mug, a `long` a jug. Pour more than the container holds and it overflows — in Java, integer values silently wrap around. A reference is like a **locker key**: copying the key doesn't copy the locker's contents; two people with copies of the key open the same locker.
:::

## Common mistakes

:::mistake
- Using `double` for money.
- `long x = 3_000_000_000;` without `L` — compile error *integer number too large*.
- `float f = 1.5;` — compile error: `1.5` is a `double` literal; write `1.5f`.
- Leading zeros: `int pin = 0123;` is octal 83.
- Comparing doubles with `==` after computation; compare with a tolerance or use `BigDecimal.compareTo`.
- `int percent = 7 / 2 * 100;` → 300, because `7 / 2` is integer division (3).
:::

## Interview questions

:::qa basic
? How many primitive types does Java have? Name them with sizes.
Eight: `byte` (8-bit), `short` (16), `int` (32), `long` (64), `float` (32), `double` (64), `char` (16-bit unsigned UTF-16 code unit) and `boolean` (size not specified by the spec).
--- followup Why does Java have primitives if it is object-oriented?
Performance. A primitive `int` is 4 bytes stored inline; an `Integer` object needs a header (12–16 bytes) plus the value, plus a reference to it, and adds GC pressure and pointer indirection.
:::

:::qa intermediate
? Why shouldn't you use `double` for monetary calculations? What do you use instead?
`double` is binary floating point and cannot represent most decimal fractions exactly (0.1 + 0.2 = 0.30000000000000004), so rounding errors accumulate. Use `BigDecimal` created from strings with explicit scale and `RoundingMode`, or integer minor units (paise/cents) in a `long`.
--- followup Why is `new BigDecimal(0.1)` wrong?
The `double` 0.1 is already inexact before `BigDecimal` sees it; the result is `0.1000000000000000055511151231257827…`. Use `new BigDecimal("0.1")` or `BigDecimal.valueOf(0.1)` (which uses the double's canonical string representation).
--- followup Why does `new BigDecimal("2.0").equals(new BigDecimal("2.00"))` return false?
`equals` compares value **and scale**. Use `compareTo(...) == 0` to compare numerically.
:::

:::qa tricky
? What does `System.out.println(Integer.MAX_VALUE + 1)` print?
`-2147483648`. Integer arithmetic overflows silently by wrapping around in two's complement. No exception is thrown unless you use `Math.addExact`.
:::

:::qa tricky
? What does `System.out.println('a' + 1)` print? And `(char)('a' + 1)`?
`98` — `char` is promoted to `int` in arithmetic. `(char)('a' + 1)` prints `b`.
:::

:::quiz
? What is printed by `System.out.println(0.1 + 0.2 == 0.3);`?
- true
+ false
- compile error
- It depends on the platform
--- explain
0.1 + 0.2 evaluates to 0.30000000000000004 in IEEE 754 double arithmetic. The result is identical on every platform because Java mandates IEEE 754 semantics (strictly so since Java 17, JEP 306).
:::

:::quiz
? `int x = 010;` — what is `x`?
- 10
+ 8
- 2
- compile error
--- explain
A leading 0 makes an integer literal octal. 010 in octal is 8 in decimal.
:::

:::exercise intermediate
? Safe percentage calculation
Given `int obtained = 437` and `int total = 500`, compute the percentage as a `double` with two decimals (87.40). Then compute a GST of 18% on ₹1234.56 using `BigDecimal`, rounded half-up to 2 decimals.
--- hints
- Avoid integer division: convert one operand to `double` first.
- `BigDecimal.multiply` then `setScale(2, RoundingMode.HALF_UP)`.
--- solution
```java title="Percent.java"
import java.math.BigDecimal;
import java.math.RoundingMode;

public class Percent {
    public static void main(String[] args) {
        int obtained = 437, total = 500;
        double pct = obtained * 100.0 / total;
        System.out.printf("%.2f%n", pct);                       // 87.40

        BigDecimal amount = new BigDecimal("1234.56");
        BigDecimal gst = amount.multiply(new BigDecimal("0.18"))
                               .setScale(2, RoundingMode.HALF_UP);
        System.out.println("GST = " + gst);                      // 222.22
        System.out.println("Total = " + amount.add(gst));        // 1456.78
    }
}
```
--- explanation
`obtained * 100.0` promotes the expression to `double` before dividing. With `BigDecimal`, 1234.56 × 0.18 = 222.2208 exactly; rounding to scale 2 gives 222.22.
:::
</script>

<script type="text/x-java-topic">
@id: type-casting
@module: basics
@title: Type Conversion & Casting
@level: 2
@time: 15
@prereq: data-types
@next: operators
@tags: widening, narrowing, cast, promotion, implicit, explicit, upcasting, downcasting, classcastexception
===
## Introduction

Converting a value from one type to another happens constantly — assigning an `int` to a `long`, dividing an `int` by a `double`, treating a `Dog` as an `Animal`. Java distinguishes **safe** conversions it does automatically from **potentially lossy** conversions you must request explicitly with a cast.

## Primitive widening (implicit)

A value moves to a type with a larger range. No cast needed.

:::flow row
byte
short
int
long
float
double
:::

`char` also widens to `int`, `long`, `float`, `double`.

```java
int i = 100;
long l = i;          // widening: automatic
double d = l;        // automatic
float f = 16_777_217;  // automatic, but LOSES precision: f == 1.6777216E7
```

:::warn Widening can still lose precision
`int` → `float` and `long` → `float`/`double` are "widening" (range grows) but can lose low-order digits because `float` has only 24 bits of mantissa and `double` 53.
:::

## Primitive narrowing (explicit cast)

```java
double price = 99.99;
int rupees = (int) price;        // 99 — fraction truncated toward zero (not rounded)
int big = 300;
byte b = (byte) big;             // 44 — keeps the low 8 bits: 300 - 256
long huge = 5_000_000_000L;
int i = (int) huge;              // 705032704 — high bits discarded
int r = (int) Math.round(99.5);  // 100 — round explicitly if you want rounding
```

## Numeric promotion in expressions

In arithmetic, `byte`, `short` and `char` are promoted to **`int`** first; then if either operand is `long`, `float` or `double`, the other is promoted to the wider type.

```java
byte a = 10, b = 20;
// byte c = a + b;        // compile error: a + b is an int
byte c = (byte) (a + b);  // OK
a += 5;                   // OK: compound assignment includes an implicit cast
short s = 10;
s = s + 1;                // compile error
s += 1;                   // compiles: equivalent to s = (short)(s + 1)
```

## Reference casting: upcasting and downcasting

```java
Object o = "hello";            // upcast: String IS-A Object — implicit and always safe
String s = (String) o;         // downcast: explicit; checked at RUNTIME
Integer n = (Integer) o;       // compiles, but throws ClassCastException at runtime

if (o instanceof String str) { // Java 16+ pattern matching: test + cast + bind
    System.out.println(str.length());
}
```

A reference cast **never changes the object** — it only changes how the compiler lets you view it. The JVM checks downcasts with the `checkcast` instruction.

## Real-life example

:::analogy Pouring between glasses
Widening is pouring a small glass into a big jug — always fits. Narrowing is pouring a jug into a small glass — you must decide to do it (the cast), and what doesn't fit is spilled (truncated bits). Reference casting is like calling a person "employee" (upcast, always true) versus claiming "this employee is a manager" (downcast) — HR checks at runtime and raises an objection (`ClassCastException`) if it isn't true.
:::

## Interview questions

:::qa basic
? What is the difference between implicit and explicit casting?
Implicit (widening) conversions happen automatically when no information about magnitude can be lost, e.g. `int` → `long`. Explicit (narrowing) conversions require a cast operator because data may be lost, e.g. `(int) 3.99` → 3.
:::

:::qa tricky
? Why does `short s = 1; s = s + 1;` fail to compile but `s += 1;` compile?
`s + 1` is promoted to `int`, and assigning an `int` to a `short` needs an explicit cast. Compound assignment operators are defined as `s = (short)(s + 1)` — they include an implicit narrowing cast.
--- followup What does `byte b = 127; b++;` produce?
-128. `++` on a `byte` also includes the implicit cast, so it wraps around.
:::

:::qa intermediate
? What happens with `(int) 3.99` and `(int) -3.99`?
3 and -3. Casting a floating-point value to an integer type truncates toward zero. Use `Math.round`, `Math.floor` or `Math.ceil` for other behaviours.
:::

:::quiz
? What is `(byte) 200`?
- 200
- 127
+ -56
- compile error
--- explain
200 = 1100 1000 in binary; interpreted as a signed 8-bit value it is 200 − 256 = −56.
:::

:::quiz
? `Object o = 42; String s = (String) o;` — what happens?
- Compile error
- `s` becomes "42"
+ `ClassCastException` at runtime
- `s` is null
--- explain
The compiler allows downcasting from `Object` to `String`, but at runtime the object is an `Integer`, so `checkcast` fails. Use `String.valueOf(o)` to convert.
:::
</script>

<script type="text/x-java-topic">
@id: operators
@module: basics
@title: Operators & Expressions
@level: 2
@time: 22
@prereq: type-casting
@next: input-output
@tags: arithmetic, relational, logical, bitwise, shift, ternary, increment, precedence, short circuit, instanceof, modulus
===
## Introduction

Operators combine values into expressions. Most are familiar from maths, but several Java-specific details — integer division, short-circuit evaluation, pre- vs post-increment, `==` on objects, bit shifts — appear constantly in bugs and interview puzzles.

## Operator categories

| Category | Operators | Notes |
|---|---|---|
| Arithmetic | `+ - * / %` | `/` on integers truncates; `%` result takes the sign of the dividend. |
| Unary | `+ - ++ -- !` | Pre (`++i`) vs post (`i++`) increment. |
| Assignment | `= += -= *= /= %= &= |= ^= <<= >>= >>>=` | Compound forms include an implicit cast. |
| Relational | `== != < > <= >=` | `==` on objects compares **references**. |
| Logical | `&& || !` | `&&` and `||` short-circuit. |
| Bitwise | `& | ^ ~` | Also work on `boolean` without short-circuiting. |
| Shift | `<< >> >>>` | `>>` keeps the sign bit; `>>>` fills with zeros. |
| Ternary | `cond ? a : b` | An expression, not a statement. |
| Type | `instanceof` | With pattern matching since Java 16. |

## Arithmetic details

```java
System.out.println(7 / 2);       // 3   integer division truncates
System.out.println(7 / 2.0);     // 3.5 one double operand → double division
System.out.println(-7 / 2);      // -3  truncates toward zero
System.out.println(7 % 3);       // 1
System.out.println(-7 % 3);      // -1  sign follows the dividend
System.out.println(Math.floorMod(-7, 3)); // 2  mathematical modulo
System.out.println("1" + 2 + 3); // 123 left-to-right: String + int → String
System.out.println(1 + 2 + "3"); // 33  (1 + 2) first, then concatenation
```

## Increment and decrement

```java
int i = 5;
int a = i++;   // a = 5, then i = 6   (post: use, then increment)
int b = ++i;   // i = 7, then b = 7   (pre: increment, then use)

int x = 5;
x = x++;       // x is still 5! the old value is saved, x incremented, then old value assigned back
```

## Short-circuit logical operators

```java
if (user != null && user.isActive()) { … }   // safe: second part skipped when user is null
if (user != null & user.isActive()) { … }    // NullPointerException: & evaluates both sides
```

`&&` evaluates the right side only if the left is `true`; `||` only if the left is `false`. This is used deliberately for null checks and to avoid expensive calls.

## Bitwise and shift operators

```java
int flags = 0b0101;
System.out.println(flags & 0b0100);  // 4  → bit 2 is set
System.out.println(flags | 0b0010);  // 7  set bit 1
System.out.println(flags ^ 0b0001);  // 4  toggle bit 0
System.out.println(~0);              // -1 invert every bit
System.out.println(1 << 10);         // 1024  (multiply by 2^10)
System.out.println(-16 >> 2);        // -4    arithmetic shift keeps sign
System.out.println(-16 >>> 28);      // 15    logical shift fills with zeros
boolean isEven = (n & 1) == 0;       // cheap parity check
```

:::info Where bits appear in real code
`HashMap` computes the bucket index as `(n - 1) & hash` (with `n` a power of two) instead of `%`, and spreads hash bits with `h ^ (h >>> 16)`. File permissions, feature flags and network protocols also use bit masks.
:::

## Ternary operator

```java
String label = stock > 0 ? "In stock" : "Out of stock";
int max = a > b ? a : b;
```

## Precedence (highest to lowest, simplified)

| Level | Operators |
|---|---|
| Postfix | `expr++ expr--` |
| Unary | `++expr --expr + - ~ !` and casts |
| Multiplicative | `* / %` |
| Additive | `+ -` |
| Shift | `<< >> >>>` |
| Relational | `< > <= >= instanceof` |
| Equality | `== !=` |
| Bitwise | `&` then `^` then `|` |
| Logical | `&&` then `||` |
| Ternary | `? :` |
| Assignment | `= += -= …` (right-associative) |

:::tip
Use parentheses whenever precedence is not obvious to a reader. `(a & MASK) == 0` is clearer — and different from — `a & MASK == 0` (which does not compile because `==` binds tighter than `&`).
:::

## Real-life example

:::analogy Short-circuit evaluation
"If the shop is open **and** they have my size, I'll buy the shoes." If the shop is closed, you don't bother asking about sizes — that is `&&`. Using `&` is like phoning to ask about sizes even though you already know the shop is closed.
:::

## Interview questions

:::qa basic
? What is the difference between `&` and `&&`?
`&&` is the logical AND with short-circuit evaluation — the right side is skipped when the left is false. `&` evaluates both operands; on booleans it is a non-short-circuit logical AND, on integers it is bitwise AND.
:::

:::qa tricky
? What is the value of `x` after `int x = 5; x = x++ + ++x;`?
12. `x++` yields 5 (x becomes 6), `++x` makes x 7 and yields 7; 5 + 7 = 12 is assigned to x.
--- followup And after `int x = 5; x = x++;`?
5. The post-increment saves 5, increments x to 6, then the assignment stores the saved 5 back into x.
:::

:::qa intermediate
? What is the difference between `>>` and `>>>`?
`>>` is an arithmetic right shift that copies the sign bit, so negative numbers stay negative. `>>>` is a logical right shift that fills the high bits with zeros, so the result is non-negative for `int` shifts of at least 1.
:::

:::quiz
? What does `System.out.println(10 + 20 + "Java" + 10 + 20);` print?
- 3030Java
+ 30Java1020
- 1020Java1020
- 30Java30
--- explain
Evaluation is left to right: 10 + 20 = 30 (int), then "30" + "Java", then string concatenation continues: "30Java10", then "30Java1020".
:::

:::quiz
? What is `-7 % 3` in Java?
+ -1
- 2
- 1
- -2
--- explain
The remainder has the sign of the dividend (-7). `Math.floorMod(-7, 3)` returns 2.
:::

:::exercise beginner
? Swap two numbers without a temporary variable
Swap `a = 7` and `b = 3` using arithmetic, then using XOR.
--- solution
```java title="Swap.java"
public class Swap {
    public static void main(String[] args) {
        int a = 7, b = 3;
        a = a + b;  b = a - b;  a = a - b;          // arithmetic
        System.out.println(a + " " + b);             // 3 7
        a = a ^ b;  b = a ^ b;  a = a ^ b;           // XOR
        System.out.println(a + " " + b);             // 7 3
    }
}
```
--- explanation
Both are classic interview puzzles. In real code, prefer a temporary variable: it is clearer, just as fast after JIT, and the arithmetic version can overflow (harmlessly, thanks to wrap-around, but confusingly).
:::
</script>

<script type="text/x-java-topic">
@id: input-output
@module: basics
@title: Console Input & Output
@level: 1
@time: 15
@prereq: operators
@next: if-else
@tags: scanner, bufferedreader, system.in, printf, string.format, console, nextint, nextline
===
## Introduction

Console I/O is how beginners interact with their programs and how competitive programmers read test data. Java offers several tools with different trade-offs: `System.out` for output, `Scanner` for convenient parsing, and `BufferedReader` for speed.

## Output

```java
System.out.print("No newline ");
System.out.println("with newline");
System.out.printf("%-10s|%6.2f|%05d%n", "Rice", 54.5, 42);   // Rice      | 54.50|00042
String s = String.format("Order #%d for %s", 1001, "Mayur");
String t = "Order #%d for %s".formatted(1001, "Mayur");     // Java 15+
System.err.println("Errors go to the standard error stream");
```

| Specifier | Meaning |
|---|---|
| `%d` | integer |
| `%f`, `%.2f` | floating point, 2 decimals |
| `%s` | string (calls `toString()`) |
| `%n` | platform line separator (prefer over `\n` in `printf`) |
| `%-10s` / `%10s` | left / right aligned in width 10 |
| `%,d` | thousands separators |

## Input with Scanner

```java title="ScannerDemo.java"
import java.util.Scanner;

public class ScannerDemo {
    public static void main(String[] args) {
        try (Scanner sc = new Scanner(System.in)) {    // closes the scanner at the end
            System.out.print("Name: ");
            String name = sc.nextLine();
            System.out.print("Age: ");
            int age = sc.nextInt();
            sc.nextLine();                              // consume the leftover newline!
            System.out.print("City: ");
            String city = sc.nextLine();
            System.out.printf("%s (%d) from %s%n", name, age, city);
        }
    }
}
```

:::mistake The nextInt() + nextLine() trap
`nextInt()` reads the number but leaves the **newline** in the buffer. A following `nextLine()` immediately returns that empty remainder, so "City" appears to be skipped. Fix: call `sc.nextLine()` once after `nextInt()`, or read everything with `nextLine()` and parse with `Integer.parseInt`.
:::

## Fast input with BufferedReader

```java title="FastInput.java"
import java.io.BufferedReader;
import java.io.IOException;
import java.io.InputStreamReader;
import java.util.StringTokenizer;

public class FastInput {
    public static void main(String[] args) throws IOException {
        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
        int n = Integer.parseInt(br.readLine().trim());
        StringTokenizer st = new StringTokenizer(br.readLine());
        long sum = 0;
        for (int i = 0; i < n; i++) sum += Long.parseLong(st.nextToken());
        System.out.println(sum);
    }
}
```

`Scanner` uses regular expressions to parse tokens, which is convenient but slow for millions of numbers. `BufferedReader` reads large chunks and returns raw lines — much faster; you parse yourself.

| | Scanner | BufferedReader |
|---|---|---|
| Parsing | Built in (`nextInt`, `nextDouble`) | Manual (`Integer.parseInt`) |
| Speed | Slower (regex) | Fast (buffered, 8 KB default) |
| Exceptions | Unchecked `InputMismatchException` | Checked `IOException` |
| Thread-safe | No | Yes (methods synchronised) |

:::warn Closing System.in
Closing a `Scanner` that wraps `System.in` also closes `System.in` itself; later attempts to read from the console fail. In larger programs create **one** Scanner for the whole application.
:::

## Interview questions

:::qa basic
? Scanner vs BufferedReader?
`Scanner` parses primitives and tokens using regex — convenient but slower. `BufferedReader` reads lines of text through a buffer — faster but you parse manually and handle `IOException`.
:::

:::qa tricky
? Why does `nextLine()` after `nextInt()` return an empty string?
`nextInt()` consumes only the digits; the line terminator remains. `nextLine()` then reads up to that terminator and returns the empty remainder.
:::

:::quiz
? Which format string prints 3.14159 as `3.14`?
- `%d`
+ `%.2f`
- `%2f`
- `%s`
--- explain
`%.2f` formats a floating-point value with two digits after the decimal point.
:::
</script>

@id: if-else
@module: control
@title: if, else-if & Conditional Logic
@level: 1
@time: 12
@prereq: operators
@next: switch
@tags: if, else, conditional, guard clause, nested if, dangling else
===
## Introduction

Conditional statements let a program choose between paths based on a `boolean` expression. Every business rule — "apply a discount if the order exceeds ₹5000", "reject the login after three attempts" — becomes an `if`.

## Syntax

```java
if (condition) {
    // runs when condition is true
} else if (otherCondition) {
    // first true branch wins; later branches are skipped
} else {
    // runs when nothing above matched
}
```

The condition must be of type `boolean` (or `Boolean`, unboxed). Unlike C, `if (count)` with an `int` does **not** compile — this eliminates the classic `if (x = 5)` bug, because `x = 5` is an `int` expression.

## Example: pricing rule

```java title="Discount.java"
public class Discount {
    static double discountPercent(double orderValue, boolean isPremium) {
        if (orderValue <= 0) {
            throw new IllegalArgumentException("Order value must be positive");
        }
        if (isPremium && orderValue >= 5000) {
            return 15;
        } else if (orderValue >= 5000) {
            return 10;
        } else if (orderValue >= 2000) {
            return 5;
        }
        return 0;
    }

    public static void main(String[] args) {
        System.out.println(discountPercent(6000, true));   // 15.0
        System.out.println(discountPercent(2500, false));  // 5.0
    }
}
```

### Code breakdown

| Line | Why |
|---|---|
| First `if` with `throw` | A **guard clause**: reject invalid input early, so the rest of the method handles only valid data. |
| `isPremium && orderValue >= 5000` | The most specific rule is checked first — order matters in `else-if` chains. |
| `return` inside branches | Returning early avoids deeply nested `else` blocks. |
| Final `return 0` | The compiler requires every path of a non-void method to return a value. |

## Braces and the dangling else

```java
if (a > 0)
    if (b > 0)
        System.out.println("both positive");
else
    System.out.println("?");   // belongs to the INNER if, despite the indentation
```

An `else` binds to the nearest unmatched `if`. Always use braces — most style guides (and Sonar rules) require them.

:::tip Prefer guard clauses over nesting
Deep "arrow code" (`if` inside `if` inside `if`) is hard to read. Invert conditions and return early: `if (user == null) return;` then continue with the happy path at one indentation level.
:::

:::project
Service-layer validation in a Spring application is usually a set of guard clauses that throw domain exceptions (`if (!supplier.isActive()) throw new BusinessException("Supplier inactive");`), which a global exception handler turns into HTTP 400 responses.
:::

## Interview questions

:::qa basic
? Can you use an `int` as the condition of an `if` in Java?
No. The condition must be `boolean`. `if (1)` or `if (count)` is a compile error, unlike C/C++.
--- followup Does `if (flag = true)` compile if `flag` is boolean?
Yes — assignment is an expression whose value is `true`, so the condition is always true and `flag` is overwritten. A reason some developers write `if (flag)` rather than comparing to `true`.
:::

:::quiz
? In `if (a) if (b) x(); else y();` which `if` does the `else` belong to?
- The first `if (a)`
+ The inner `if (b)`
- Neither — compile error
- It depends on indentation
--- explain
Java resolves the dangling else to the nearest `if`. Indentation is ignored by the compiler.
:::
</script>

<script type="text/x-java-topic">
@id: switch
@module: control
@title: switch Statements & switch Expressions
@level: 2
@time: 18
@java: 14+
@prereq: if-else
@next: loops
@tags: switch, case, break, fall through, arrow, yield, switch expression, enum, string switch
===
## Introduction

`switch` selects one of many branches by comparing a value against constants. It exists because long `if-else-if` chains on the same variable are repetitive, and because the JVM can compile a `switch` to a **jump table** (`tableswitch`) or binary search (`lookupswitch`), which is faster than sequential comparisons for many cases.

Java now has two forms: the classic **switch statement** (with fall-through) and the modern **switch expression** (Java 14, standard) that returns a value and has no fall-through.

## Classic switch statement

```java
int day = 3;
String name;
switch (day) {
    case 1:
        name = "Monday";
        break;
    case 2:
        name = "Tuesday";
        break;
    case 6:
    case 7:
        name = "Weekend";        // grouping by fall-through
        break;
    default:
        name = "Midweek";
}
```

Without `break`, execution **falls through** into the next case. That is occasionally useful (grouping) but is a common source of bugs.

Allowed selector types: `byte`, `short`, `char`, `int` and their wrappers, **`String`** (Java 7+), and **enums**. Not `long`, `float`, `double` or `boolean` (in Java 17). Case labels must be compile-time constants, and duplicates are compile errors.

## Modern switch expression (Java 14+)

```java title="SwitchExpr.java"
public class SwitchExpr {
    enum Status { DRAFT, SUBMITTED, APPROVED, REJECTED }

    static String badgeColor(Status s) {
        return switch (s) {
            case DRAFT -> "grey";
            case SUBMITTED -> "blue";
            case APPROVED -> "green";
            case REJECTED -> "red";
        };                                   // exhaustive over the enum: no default needed
    }

    static int daysIn(int month, boolean leap) {
        return switch (month) {
            case 1, 3, 5, 7, 8, 10, 12 -> 31;          // multiple labels, comma-separated
            case 4, 6, 9, 11 -> 30;
            case 2 -> {
                System.out.println("Checking February");
                yield leap ? 29 : 28;                  // yield returns a value from a block
            }
            default -> throw new IllegalArgumentException("Bad month: " + month);
        };
    }

    public static void main(String[] args) {
        System.out.println(badgeColor(Status.APPROVED));   // green
        System.out.println(daysIn(2, true));                // 29
    }
}
```

### What changed and why

| Feature | Classic statement | Switch expression / arrow form |
|---|---|---|
| Returns a value | No | Yes |
| Fall-through | Yes, unless `break` | No — each arrow is independent |
| Multiple labels | Stacked `case` lines | `case 1, 2, 3 ->` |
| Exhaustiveness | Not required | **Required** for expressions (all enum constants or a `default`) |
| Block result | — | `yield value;` |

:::version Version history
- Java 7: `String` in switch.
- Java 12–13: switch expressions in preview.
- **Java 14**: switch expressions and arrow labels standard.
- Java 17: pattern matching for switch in **preview** only.
- **Java 21**: pattern matching for switch standard (`case Circle c ->`, `case null`, guards with `when`). See [Pattern matching](#pattern-matching).
:::

## How a String switch works internally

`javac` compiles a `String` switch into a switch on `s.hashCode()` followed by `equals()` checks to handle hash collisions, then a second switch on the resulting index. A `null` selector throws `NullPointerException` (before Java 21's `case null`).

## Real-life example

:::analogy A lift panel
Pressing a floor button (the selector value) takes you directly to that floor (case) — you don't stop at every floor asking "is this 7?" (an if-else chain). The old switch is like a lift that keeps going down floors until someone says "stop" (`break`); the new arrow form stops exactly where you asked.
:::

## Common mistakes

:::mistake
- Forgetting `break` in a classic switch.
- Switching on a `String` that may be `null` → `NullPointerException`.
- Adding a new enum constant: switch *statements* silently ignore it; switch *expressions* without `default` fail to compile — which is actually a feature, it forces you to handle the new case.
:::

## Interview questions

:::qa basic
? Which types can be used in a switch?
In Java 17: `byte`, `short`, `char`, `int`, their wrapper types, `String` and enums. Java 21 adds pattern matching, allowing any reference type with type patterns.
--- followup Why not long?
Historically `switch` compiles to `tableswitch`/`lookupswitch` bytecodes, which operate on `int`. Supporting `long` would need a different strategy; the language designers chose not to.
:::

:::qa intermediate
? What is the difference between a switch statement and a switch expression?
A switch expression produces a value, must be exhaustive, and uses arrow labels without fall-through (`yield` returns a value from a block). A switch statement performs actions, allows fall-through with colon labels, and need not be exhaustive.
--- followup Is `yield` a keyword?
It is a contextual (restricted) identifier introduced in Java 14; it has special meaning only inside switch expressions.
:::

:::quiz
? What is printed?
```java
int x = 2;
switch (x) {
    case 1: System.out.print("A");
    case 2: System.out.print("B");
    case 3: System.out.print("C");
    default: System.out.print("D");
}
```
- B
+ BCD
- BC
- ABCD
--- explain
Execution jumps to `case 2` and falls through all following cases because there are no `break` statements.
:::
</script>

<script type="text/x-java-topic">
@id: loops
@module: control
@title: Loops: for, while, do-while & for-each
@level: 1
@time: 20
@prereq: if-else
@next: break-continue
@tags: for, while, do-while, enhanced for, for-each, iteration, infinite loop, iterable
===
## Introduction

Loops repeat a block of code. Java has four forms, each suited to a different situation: a known count (`for`), an unknown count checked first (`while`), at-least-once (`do-while`), and iterating over collections (`for-each`).

## The four loop forms

```java title="Loops.java"
import java.util.List;

public class Loops {
    public static void main(String[] args) {
        // 1. for: initialiser; condition; update
        for (int i = 1; i <= 3; i++) {
            System.out.print(i + " ");              // 1 2 3
        }

        // 2. while: condition checked BEFORE each iteration (may run 0 times)
        int balance = 1000;
        while (balance > 0) {
            balance -= 400;
        }
        System.out.println("\nbalance = " + balance);  // -200

        // 3. do-while: body runs at least once, condition checked AFTER
        int attempts = 0;
        do {
            attempts++;
        } while (attempts < 0);
        System.out.println("attempts = " + attempts);   // 1

        // 4. enhanced for (for-each) over arrays and any Iterable
        List<String> cities = List.of("Pune", "Mumbai", "Nagpur");
        for (String city : cities) {
            System.out.println(city);
        }
    }
}
```

| Loop | Use when | Runs at least once? |
|---|---|---|
| `for` | Number of iterations is known / you need the index | No |
| `while` | Repeat until a condition changes (reading input, polling) | No |
| `do-while` | Body must run once before checking (menus, retries) | **Yes** |
| for-each | Visit every element of an array or `Iterable` | No |

## How for-each works internally

For arrays, the compiler generates an indexed `for` loop. For collections, it generates an **Iterator**:

```java
// for (String city : cities) { … }  compiles to:
for (Iterator<String> it = cities.iterator(); it.hasNext(); ) {
    String city = it.next();
    // body
}
```

That is why removing elements from a collection inside a for-each throws `ConcurrentModificationException` — the collection is modified behind the iterator's back. Use `iterator.remove()` or `removeIf`. See [Iterators & fail-fast](#iterators).

## Loop variables and scope

```java
for (int i = 0; i < 3; i++) { }
// System.out.println(i);   // error: i is scoped to the loop

for (int i = 0, j = 10; i < j; i++, j--) { }   // multiple variables of one type
for (;;) { break; }                            // all parts optional: infinite loop
```

## Performance notes

- Hoist invariant work out of the loop condition: `for (int i = 0; i < list.size(); i++)` is fine for `ArrayList` (size is O(1)) but calling `get(i)` on a **`LinkedList`** makes the loop O(n²). Use for-each or an iterator for linked lists.
- String concatenation with `+=` in a loop creates a new `String` each time — use `StringBuilder`.

## Real-life example

:::analogy
- `for` — "Do 20 push-ups": the count is known upfront.
- `while` — "Keep stirring while the milk isn't boiling": check first; if already boiling, do nothing.
- `do-while` — "Taste the curry, and add salt while it's still bland": you always taste at least once.
- for-each — "Greet every guest in the list": you care about each item, not the index.
:::

## Common mistakes

:::mistake
- Off-by-one: `for (int i = 0; i <= arr.length; i++)` → `ArrayIndexOutOfBoundsException` on the last iteration.
- Forgetting to update the loop variable in a `while` → infinite loop.
- Using `float`/`double` as a loop counter: `for (double d = 0; d != 1.0; d += 0.1)` never terminates because of rounding.
- Modifying a collection while iterating with for-each.
:::

## Interview questions

:::qa basic
? What is the difference between while and do-while?
`while` checks the condition before each iteration, so the body can execute zero times. `do-while` checks after, so the body always executes at least once.
:::

:::qa intermediate
? Can you use a for-each loop to modify array elements?
Not by assigning to the loop variable — it is a copy of each element (a primitive value or a reference). `for (int x : arr) x = 0;` leaves the array unchanged. You *can* mutate the objects the references point to (`for (Item it : items) it.setPrice(0);`).
:::

:::quiz
? How many times does the body run? `int i = 10; do { i++; } while (i < 5);`
- 0
+ 1
- 5
- infinite
--- explain
A `do-while` body always executes once; then `11 < 5` is false and the loop ends.
:::

:::exercise beginner
? FizzBuzz
Print numbers 1 to 30. For multiples of 3 print "Fizz", of 5 "Buzz", of both "FizzBuzz".
--- hints
- Check the "both" case first, or build a string.
--- solution
```java title="FizzBuzz.java"
public class FizzBuzz {
    public static void main(String[] args) {
        for (int i = 1; i <= 30; i++) {
            if (i % 15 == 0) System.out.println("FizzBuzz");
            else if (i % 3 == 0) System.out.println("Fizz");
            else if (i % 5 == 0) System.out.println("Buzz");
            else System.out.println(i);
        }
    }
}
```
--- complexity
O(n) time, O(1) space.
:::

:::exercise intermediate
? Reverse the digits of a number
Given `int n = 12345`, produce `54321` using a `while` loop (no strings). Handle negative numbers.
--- solution
```java title="ReverseDigits.java"
public class ReverseDigits {
    static long reverse(int n) {
        long result = 0;
        int x = Math.abs(n);
        while (x > 0) {
            result = result * 10 + x % 10;   // append last digit
            x /= 10;                         // drop last digit
        }
        return n < 0 ? -result : result;
    }
    public static void main(String[] args) {
        System.out.println(reverse(12345));  // 54321
        System.out.println(reverse(-120));   // -21
    }
}
```
--- explanation
`% 10` extracts the last digit and `/ 10` removes it. `long` avoids overflow when reversing large `int`s (e.g. 1_999_999_999). Note `Math.abs(Integer.MIN_VALUE)` is still negative — a known edge case.
--- complexity
O(d) where d is the number of digits.
:::
</script>

<script type="text/x-java-topic">
@id: break-continue
@module: control
@title: break, continue, return & Labels
@level: 2
@time: 10
@prereq: loops
@next: arrays
@tags: break, continue, return, label, labeled break, nested loops, jump
===
## Introduction

Jump statements change the normal flow inside loops and methods.

| Statement | Effect |
|---|---|
| `break` | Exit the innermost loop or `switch` immediately. |
| `continue` | Skip the rest of the current iteration; go to the next one (the `for` update still runs). |
| `return` | Exit the whole method (optionally with a value). |
| `break label` / `continue label` | Apply to an *outer* labeled loop. |

```java title="Jumps.java"
public class Jumps {
    public static void main(String[] args) {
        for (int i = 1; i <= 10; i++) {
            if (i % 2 == 0) continue;     // skip even numbers
            if (i > 7) break;             // stop entirely after 7
            System.out.print(i + " ");    // 1 3 5 7
        }
        System.out.println();

        int[][] grid = {{1, 2, 3}, {4, -1, 6}, {7, 8, 9}};
        search:                            // a label names the outer loop
        for (int r = 0; r < grid.length; r++) {
            for (int c = 0; c < grid[r].length; c++) {
                if (grid[r][c] < 0) {
                    System.out.println("Negative at " + r + "," + c);
                    break search;          // leaves BOTH loops
                }
            }
        }
    }
}
```

:::tip
Labeled breaks are legitimate for searching nested structures, but often a small helper method with `return` reads better: `findNegative(grid)`.
:::

:::info Java has no goto
`goto` is a reserved keyword but not implemented. Labeled `break`/`continue` cover the structured cases where C programmers used `goto`.
:::

:::qa basic
? What is the difference between break and continue?
`break` terminates the loop entirely; `continue` skips only the remainder of the current iteration and proceeds with the next one.
--- followup How do you exit nested loops at once?
Use a labeled `break outerLabel;`, extract the loops into a method and `return`, or use a boolean flag.
:::

:::quiz
? In a `for` loop, after `continue`, what happens next?
- The loop exits
+ The update expression (e.g. `i++`) runs, then the condition is checked
- The condition is checked without running the update
- The method returns
--- explain
`continue` jumps to the end of the loop body; in a `for` loop that means the update clause executes before the next condition check.
:::
</script>

<script type="text/x-java-topic">
@id: arrays
@module: arrays
@title: Arrays: Declaration, Memory & Traversal
@level: 2
@time: 20
@prereq: loops
@next: arrays-multi, arraylist
@tags: array, index, length, default values, arrayindexoutofbounds, contiguous, heap, traversal
===
## Introduction

An **array** is a fixed-length, ordered container of elements of **one type**, stored contiguously and accessed by an integer index starting at 0. Arrays are the lowest-level collection in Java; `ArrayList`, `HashMap`, `String` and many other classes are built on top of them.

Why do they exist? Indexed access into contiguous memory is O(1) and extremely cache-friendly. The price is a fixed size decided at creation.

## Declaration, creation and initialisation

```java
int[] marks;                    // declaration: a reference variable, currently unassigned
marks = new int[5];             // creation: 5 ints on the heap, all 0
int[] primes = {2, 3, 5, 7};    // declaration + creation + initialisation
String[] names = new String[3]; // three null references — no String objects yet
double[] prices = new double[]{9.5, 12.0};   // anonymous array syntax
int legacy[] = new int[2];      // C-style brackets: legal but discouraged
```

## What happens in memory

Arrays are **objects**. `new int[5]` allocates one object on the heap containing an object header, a `length` field and 5 × 4 bytes of element storage, zero-initialised. The variable `marks` on the stack holds a reference to it.

:::diagram int[] marks = new int[5]; String[] names = {"A", "B"};
[a] Stack :: marks → #1 · names → #2
[g] Heap #1: int[5] :: header · length = 5 · [0,0,0,0,0] (values stored inline)
[w] Heap #2: String[2] :: header · length = 2 · [ref→"A", ref→"B"] (references, not strings)
:::

For object arrays, the array stores **references**; the objects live elsewhere on the heap.

## Access and traversal

```java title="ArrayBasics.java"
public class ArrayBasics {
    public static void main(String[] args) {
        int[] marks = {78, 92, 65, 88};
        System.out.println(marks.length);      // 4 — a field, not a method
        System.out.println(marks[0]);          // 78
        marks[2] = 70;

        int total = 0;
        for (int i = 0; i < marks.length; i++) {    // index-based
            total += marks[i];
        }
        int max = Integer.MIN_VALUE;
        for (int m : marks) {                        // for-each
            max = Math.max(max, m);
        }
        System.out.println("avg=" + (double) total / marks.length + " max=" + max);
        // marks[4] = 1;   // ArrayIndexOutOfBoundsException: Index 4 out of bounds for length 4
    }
}
```

## Key properties

| Property | Detail |
|---|---|
| Fixed length | Set at creation; to "grow", allocate a bigger array and copy (`Arrays.copyOf`). |
| Bounds checked | Every access is checked; invalid index → `ArrayIndexOutOfBoundsException`. |
| Default values | Elements are zeroed: `0`, `false`, `'\u0000'`, `null`. |
| Covariant | `String[]` is a subtype of `Object[]` — with a runtime check (see trap below). |
| `length` | A final field, not a method (`String` uses `length()`, collections use `size()`). |
| Max size | Index is an `int`, so at most ~2³¹−1 elements (in practice slightly less). |

:::trap Array covariance and ArrayStoreException
```java
Object[] objs = new String[2];   // compiles: arrays are covariant
objs[0] = 42;                    // compiles, but throws ArrayStoreException at runtime
```
Arrays remember their component type at runtime and check every store. Generics were designed *invariant* (`List<String>` is not a `List<Object>`) precisely to catch this at compile time instead.
:::

## Real-life example

:::analogy A row of numbered lockers
An array is a row of lockers built at once, numbered from 0. You can open any locker instantly by its number (O(1)), but you cannot add a locker to the row — you must build a new, longer row and move everything (copy). A `String[]` row doesn't contain the parcels themselves, only slips saying where each parcel is kept.
:::

## Common mistakes

:::mistake
- Starting from index 1 or looping with `<=` length.
- Printing an array directly: `System.out.println(arr)` prints something like `[I@1b6d3586` (type + identity hash). Use `Arrays.toString(arr)`.
- Comparing arrays with `==` or `equals` (both compare references). Use `Arrays.equals`.
- Forgetting that `new String[3]` contains `null`s → `NullPointerException` on `names[0].length()`.
:::

## Interview questions

:::qa basic
? Why do array indexes start at 0?
Because the index is an **offset** from the start of the element storage: element i is at `base + i × elementSize`. The first element is at offset 0. This is inherited from C.
:::

:::qa intermediate
? Array vs ArrayList?
An array has fixed length, can hold primitives directly, uses `length`, and is covariant with runtime store checks. `ArrayList` is resizable, holds only objects (primitives are boxed), uses `size()`, offers rich methods (`add`, `remove`, `contains`), is generic and type-safe at compile time, and is internally backed by an `Object[]`.
--- followup When would you still choose an array?
For fixed-size data, primitive data where boxing overhead matters (e.g. millions of `int`s), multi-dimensional grids, and performance-critical inner loops.
:::

:::qa tricky
? Is an array a primitive or an object? Where is `length` defined?
An array is an object — it inherits from `Object`, can be assigned to an `Object` variable, and lives on the heap. `length` is not declared in any class source file; it is a special final field of every array type, read with the `arraylength` bytecode.
:::

:::quiz
? What does `new boolean[3]` contain?
- `[null, null, null]`
+ `[false, false, false]`
- `[true, true, true]`
- Uninitialised memory
--- explain
Array elements are always default-initialised: `false` for `boolean`.
:::

:::exercise beginner
? Second largest element
Find the second largest distinct value in `{12, 35, 1, 10, 35, 34}` in a single pass (expected 34).
--- hints
- Track `largest` and `second`. Update `second` only when a value is strictly between them.
--- solution
```java title="SecondLargest.java"
public class SecondLargest {
    static int secondLargest(int[] a) {
        int largest = Integer.MIN_VALUE, second = Integer.MIN_VALUE;
        for (int x : a) {
            if (x > largest) {
                second = largest;
                largest = x;
            } else if (x > second && x != largest) {
                second = x;
            }
        }
        if (second == Integer.MIN_VALUE) throw new IllegalArgumentException("No second largest");
        return second;
    }
    public static void main(String[] args) {
        System.out.println(secondLargest(new int[]{12, 35, 1, 10, 35, 34})); // 34
    }
}
```
--- complexity
O(n) time, O(1) space — better than sorting (O(n log n)).
:::
</script>

@id: arrays-multi
@module: arrays
@title: Multi-dimensional Arrays & the Arrays Utility Class
@level: 2
@time: 18
@prereq: arrays
@next: methods
@tags: 2d array, jagged array, matrix, arrays.sort, arrays.tostring, binarysearch, copyof, fill, aslist, system.arraycopy
===
## Multi-dimensional arrays are arrays of arrays

Java has no true 2-D block of memory. `int[][] m = new int[3][4];` creates **one outer array of 3 references**, each pointing to its own `int[4]`. Rows can therefore have different lengths (**jagged arrays**).

```java title="Matrix.java"
import java.util.Arrays;

public class Matrix {
    public static void main(String[] args) {
        int[][] grid = new int[3][4];          // 3 rows × 4 columns, all 0
        grid[1][2] = 7;

        int[][] jagged = new int[3][];          // only the outer array exists
        jagged[0] = new int[]{1};
        jagged[1] = new int[]{1, 1};
        jagged[2] = new int[]{1, 2, 1};         // Pascal's triangle rows

        for (int[] row : jagged) {
            System.out.println(Arrays.toString(row));
        }
        System.out.println(Arrays.deepToString(grid));  // [[0, 0, 0, 0], [0, 0, 7, 0], [0, 0, 0, 0]]
    }
}
```

:::diagram int[][] grid = new int[3][4]
[a] grid → outer int[][] :: [ref0, ref1, ref2]
[g] row 0 :: int[4] {0,0,0,0} || [g] row 1 :: int[4] {0,0,7,0} || [g] row 2 :: int[4] {0,0,0,0}
:::

:::tip Performance: iterate row-major
Loop `for r` outside and `for c` inside. Each row is contiguous, so row-major traversal is cache-friendly; column-major traversal jumps between separate row arrays and can be several times slower for large matrices.
:::

## java.util.Arrays — the toolbox

| Method | Purpose |
|---|---|
| `Arrays.toString(a)` / `deepToString(a)` | Readable output. |
| `Arrays.sort(a)` | Primitives: Dual-Pivot Quicksort (not stable, O(n log n) average). Objects: TimSort (stable). |
| `Arrays.sort(a, comparator)` | Custom order for object arrays. |
| `Arrays.binarySearch(a, key)` | O(log n) search — array **must be sorted** first. |
| `Arrays.fill(a, v)` | Set every element. |
| `Arrays.copyOf(a, newLen)` / `copyOfRange` | Copy with truncation or zero/null padding. |
| `Arrays.equals(a, b)` / `deepEquals` | Element-wise comparison. |
| `Arrays.asList(T...)` | Fixed-size `List` **view** backed by the array. |
| `Arrays.stream(a)` | Stream over the array (Java 8). |
| `System.arraycopy(src, sp, dst, dp, len)` | Native, fast bulk copy (used inside `ArrayList`). |

```java
Integer[] ids = {42, 7, 19};
Arrays.sort(ids, (a, b) -> b - a);             // descending: [42, 19, 7]
List<Integer> view = Arrays.asList(ids);
view.set(0, 100);                               // writes through to ids[0]
// view.add(5);                                 // UnsupportedOperationException: fixed size
int[] nums = {5, 1, 4};
Arrays.sort(nums);
int idx = Arrays.binarySearch(nums, 4);         // 1
```

:::trap Arrays.asList with primitive arrays
`Arrays.asList(new int[]{1, 2, 3})` returns a `List<int[]>` of **size 1** (the whole array is one element), because generics cannot hold primitives. Use `Arrays.stream(arr).boxed().toList()` or `IntStream`.
:::

## Interview questions

:::qa intermediate
? What is a jagged array?
A multi-dimensional array whose rows have different lengths. It is possible because Java's 2-D arrays are arrays of references to independent 1-D arrays.
:::

:::qa intermediate
? Which algorithm does `Arrays.sort` use?
For primitive arrays, a Dual-Pivot Quicksort (with insertion sort for tiny ranges) — O(n log n) average, not stable (stability is irrelevant for primitives). For object arrays, TimSort — a stable hybrid of merge sort and insertion sort that exploits existing runs, O(n log n) worst case.
--- followup Why must object sorting be stable?
Objects can be equal by the comparator yet distinguishable (two orders with the same amount). Stability preserves their original relative order, which matters when sorting by multiple keys in successive passes.
:::

:::qa tricky
? What happens if you call `binarySearch` on an unsorted array?
The result is undefined — it may return a wrong index or a negative "not found" value even though the element exists. No exception is thrown.
:::

:::quiz
? `List<Integer> l = Arrays.asList(1, 2, 3); l.add(4);` — result?
- `[1, 2, 3, 4]`
+ `UnsupportedOperationException`
- Compile error
- `ArrayIndexOutOfBoundsException`
--- explain
`Arrays.asList` returns a fixed-size list backed by the array; `set` works, `add`/`remove` do not.
:::

:::exercise intermediate
? Rotate a matrix 90° clockwise in place
Rotate an n×n matrix in place.
--- hints
- Transpose (swap `m[i][j]` with `m[j][i]` for j > i), then reverse each row.
--- solution
```java title="Rotate.java"
import java.util.Arrays;

public class Rotate {
    static void rotate(int[][] m) {
        int n = m.length;
        for (int i = 0; i < n; i++)
            for (int j = i + 1; j < n; j++) {
                int t = m[i][j]; m[i][j] = m[j][i]; m[j][i] = t;
            }
        for (int[] row : m)
            for (int l = 0, r = n - 1; l < r; l++, r--) {
                int t = row[l]; row[l] = row[r]; row[r] = t;
            }
    }
    public static void main(String[] args) {
        int[][] m = {{1, 2, 3}, {4, 5, 6}, {7, 8, 9}};
        rotate(m);
        System.out.println(Arrays.deepToString(m)); // [[7, 4, 1], [8, 5, 2], [9, 6, 3]]
    }
}
```
--- complexity
O(n²) time, O(1) extra space.
:::
</script>
