<script type="text/x-java-topic">
@id: methods
@module: methods
@title: Methods: Parameters, Return Values & the Call Stack
@level: 2
@time: 20
@prereq: variables
@next: overloading-varargs, pass-by-value
@tags: method, parameter, argument, return, signature, stack frame, call stack, static method, instance method
===
## Introduction

A **method** is a named block of code that performs a task, optionally takes **parameters**, and optionally **returns** a value. Methods exist to avoid repetition, to give names to ideas (`calculateGst()` explains itself), and to hide details behind a small interface.

## Anatomy of a method

```java
public static double applyGst(double amount, double ratePercent) throws IllegalArgumentException {
    if (amount < 0) throw new IllegalArgumentException("amount < 0");
    return amount + amount * ratePercent / 100;
}
```

| Part | Example | Meaning |
|---|---|---|
| Modifiers | `public static` | Access level; `static` = belongs to the class. |
| Return type | `double` | Type of the returned value, or `void`. |
| Name | `applyGst` | camelCase verb. |
| Parameter list | `(double amount, double ratePercent)` | Inputs; each is a local variable. |
| `throws` clause | `throws IllegalArgumentException` | Exceptions the method may propagate (required only for checked ones). |
| Body | `{ … }` | Statements; `return` ends the method. |

The **signature** is the name plus the parameter types: `applyGst(double, double)`. The return type and `throws` clause are *not* part of the signature — so you cannot overload by return type alone.

*Parameters* are the variables in the declaration; *arguments* are the actual values passed at the call site.

## Static vs instance methods

```java
public class Cart {
    private final List<Double> prices = new ArrayList<>();

    public void add(double price) { prices.add(price); }       // instance: uses object state

    public double total() {                                     // instance
        double sum = 0;
        for (double p : prices) sum += p;
        return sum;
    }

    public static double round2(double v) {                     // static: no object state needed
        return Math.round(v * 100) / 100.0;
    }
}
// usage
Cart c = new Cart();
c.add(10.555);
double t = Cart.round2(c.total());
```

A static method cannot use `this` or access instance fields directly, because no object is involved in the call.

## The call stack — what happens on each call

Every thread has its own **stack**. Each method call pushes a **stack frame** containing the method's local variables (including parameters), an operand stack for intermediate results, and a reference to the constant pool of its class. When the method returns, its frame is popped.

:::flow
main() frame :: args, cart
* total() frame :: this → cart, sum, p  (pushed on call)
return :: frame popped, value placed on caller's operand stack
back in main() :: continues after the call
:::

Too-deep recursion exhausts this stack → `StackOverflowError`. The stack size is set with `-Xss` (commonly 512 KB–1 MB per thread by default).

## Real-life example

:::analogy A coffee machine button
Pressing "Cappuccino" (calling the method) with inputs — sugar level, cup size (arguments) — gives you a cup (return value). You don't need to know about the pump pressure inside (encapsulated body). Every time someone presses the button, the machine works on that request with its own temporary state (a new stack frame).
:::

:::project
In a Spring service, each public method usually represents one **use case** (`createPurchaseOrder`, `approveInvoice`). Small private helper methods (`validateSupplier`, `calculateLineTotal`) keep those use cases readable and unit-testable.
:::

## Best practices

:::tip
- Keep methods short and focused on one thing (Single Responsibility).
- Limit parameters (≤ 3–4). Many parameters → introduce a parameter object or builder.
- Prefer returning empty collections or `Optional` to returning `null`.
- Name booleans as questions: `isEligible()`, `hasStock()`.
:::

## Interview questions

:::qa basic
? What is a method signature?
The method name plus the ordered list of parameter types. Return type, parameter names, modifiers and the `throws` clause are not part of it.
--- followup Can two methods differ only in return type?
No. `int get()` and `String get()` in the same class is a compile error: calls would be ambiguous, and the signature is identical.
:::

:::qa intermediate
? Can a static method call an instance method?
Not directly — there is no `this`. It must first obtain an object reference: `new Cart().total()` or a passed-in instance.
:::

:::quiz
? Where are a method's local variables stored?
+ In that invocation's stack frame on the calling thread's stack
- On the heap, inside the object
- In Metaspace
- In the string pool
--- explain
Local variables (primitives and references) live in the stack frame. Objects they reference are on the heap — although the JIT's escape analysis may avoid heap allocation for objects that never escape the method.
:::
</script>

<script type="text/x-java-topic">
@id: overloading-varargs
@module: methods
@title: Method Overloading & Varargs
@level: 2
@time: 15
@prereq: methods
@next: recursion
@tags: overloading, compile time polymorphism, varargs, ellipsis, overload resolution, ambiguity
===
## Method overloading

**Overloading** means defining several methods with the **same name** but **different parameter lists** (number, types or order of parameters) in the same class. The compiler picks the version at compile time — this is **compile-time (static) polymorphism**.

Why? So one concept has one name: `println(int)`, `println(String)`, `println(Object)` — callers don't need `printlnInt`.

```java title="Printer.java"
public class Printer {
    static void print(int x)          { System.out.println("int: " + x); }
    static void print(long x)         { System.out.println("long: " + x); }
    static void print(double x)       { System.out.println("double: " + x); }
    static void print(Integer x)      { System.out.println("Integer: " + x); }
    static void print(Object x)       { System.out.println("Object: " + x); }
    static void print(int... xs)      { System.out.println("varargs: " + xs.length); }

    public static void main(String[] args) {
        print(5);        // int: 5            exact match
        byte b = 5;
        print(b);        // int: 5            widening byte → int beats boxing
        print(5L);       // long: 5
        print(5.0f);     // double: 5.0       widening float → double
        print("hi");     // Object: hi
        print();         // varargs: 0
        print(1, 2, 3);  // varargs: 3
    }
}
```

### How the compiler resolves overloads (three phases)

1. **Exact match or widening** of primitives / subtype references — no boxing, no varargs.
2. If nothing applies, allow **boxing/unboxing**.
3. If still nothing, allow **varargs**.

Within a phase, the **most specific** method wins; if two are equally specific → *ambiguous method call* compile error. That's why `print(b)` picks `print(int)` (widening, phase 1) over `print(Integer)` (boxing, phase 2).

## Varargs

`Type... name` accepts zero or more arguments; inside the method it is an array.

```java
static int sum(int... nums) {           // nums is an int[]
    int s = 0;
    for (int n : nums) s += n;
    return s;
}
sum();            // 0
sum(4, 5);        // 9
sum(new int[]{1, 2});  // arrays are accepted directly
```

Rules: only **one** varargs parameter per method and it must be **last**. Examples in the JDK: `String.format(String, Object...)`, `List.of(E...)`, `Arrays.asList(T...)`.

:::warn Varargs allocate
Each call creates an array. For hot paths the JDK provides fixed-arity overloads — `List.of` has versions for 0 to 10 elements before falling back to varargs.
:::

## Overloading vs overriding (preview)

| | Overloading | Overriding |
|---|---|---|
| Where | Same class (or inherited) | Subclass redefines a superclass method |
| Parameters | Must differ | Must be the same |
| Resolved | Compile time, by **declared** argument types | Runtime, by **actual** object type |
| Return type | Can differ | Same or covariant subtype |

Full treatment in [Polymorphism](#polymorphism).

## Interview questions

:::qa basic
? What is method overloading?
Declaring multiple methods with the same name but different parameter lists. The compiler chooses one based on the argument types at compile time; it is a form of static polymorphism.
--- followup Can you overload by changing only the return type or only the exception list?
No. Neither is part of the method signature.
:::

:::qa tricky
? Which method is called: `void m(Object o)` or `void m(String s)` for `m(null)`?
`m(String)`. `null` is compatible with both, and `String` is more specific than `Object`. If there were also `m(Integer)`, the call would be ambiguous and fail to compile.
:::

:::qa tricky
? Given `m(long)` and `m(Integer)`, which runs for `m(5)`?
`m(long)`. Widening (`int` → `long`) is considered in phase 1, before boxing (`int` → `Integer`) in phase 2.
:::

:::quiz
? Which declaration is illegal?
- `void f(String s, int... n)`
+ `void f(int... n, String s)`
- `void f(int... n)`
- `void f(String... s)`
--- explain
The varargs parameter must be the last parameter.
:::
</script>

<script type="text/x-java-topic">
@id: recursion
@module: methods
@title: Recursion
@level: 3
@time: 18
@prereq: methods
@next: pass-by-value
@tags: recursion, base case, stack overflow, factorial, fibonacci, memoization, tail call
===
## Introduction

A **recursive** method calls itself to solve a smaller instance of the same problem. It is the natural way to express problems that are recursive by nature — tree and file-system traversal, divide-and-conquer sorting (merge sort, quicksort), parsing nested JSON, permutations and backtracking.

Every recursion needs:

1. A **base case** that stops the recursion.
2. A **recursive case** that moves toward the base case.

## Example: factorial

```java title="Factorial.java"
public class Factorial {
    static long factorial(int n) {
        if (n < 0) throw new IllegalArgumentException("n must be >= 0");
        if (n <= 1) return 1;            // base case
        return n * factorial(n - 1);     // recursive case: smaller problem
    }
    public static void main(String[] args) {
        System.out.println(factorial(5));   // 120
        System.out.println(factorial(20));  // 2432902008176640000 — 21! overflows long
    }
}
```

### What happens on the stack

:::flow
factorial(5) :: waits for 5 × factorial(4)
factorial(4) :: waits for 4 × factorial(3)
factorial(3) :: waits for 3 × factorial(2)
factorial(2) :: waits for 2 × factorial(1)
* factorial(1) :: base case returns 1 — frames now unwind: 2, 6, 24, 120
:::

Each pending call occupies a stack frame. Recursion depth of tens of thousands typically triggers **`StackOverflowError`** (an `Error`, not an `Exception`).

## Exponential recursion and memoisation

```java title="Fib.java"
import java.util.HashMap;
import java.util.Map;

public class Fib {
    static long naive(int n) {                 // O(2^n): recomputes the same values
        return n < 2 ? n : naive(n - 1) + naive(n - 2);
    }

    static final Map<Integer, Long> memo = new HashMap<>();
    static long memoized(int n) {              // O(n): each value computed once
        if (n < 2) return n;
        Long cached = memo.get(n);
        if (cached != null) return cached;
        long v = memoized(n - 1) + memoized(n - 2);
        memo.put(n, v);
        return v;
    }

    static long iterative(int n) {             // O(n) time, O(1) space, no stack risk
        long a = 0, b = 1;
        for (int i = 0; i < n; i++) { long t = a + b; a = b; b = t; }
        return a;
    }

    public static void main(String[] args) {
        System.out.println(naive(30) + " " + memoized(80) + " " + iterative(80));
    }
}
```

:::warn computeIfAbsent and recursion
Writing `memo.computeIfAbsent(n, k -> memoized(k-1) + memoized(k-2))` on a `HashMap` looks elegant but modifies the map inside its own mapping function — since Java 9 `HashMap` detects this and throws `ConcurrentModificationException`. Use the explicit get/put shown above.
:::

## Java and tail calls

Java does **not** perform tail-call optimisation. Even a tail-recursive method (`return helper(n - 1, acc * n)`) uses one stack frame per call. For deep recursion on large inputs, convert to a loop or use an explicit stack (`ArrayDeque`).

## Real-life example

:::analogy Russian nesting dolls
To find the smallest doll, open the outer doll and apply the same step to the doll inside. The base case is the doll that doesn't open. Every opened doll waits on the table (stack frame) until you're done.
:::

:::project
Recursion appears in real back ends when walking hierarchical data: category trees, organisation charts, bill-of-materials explosions in manufacturing ERPs, or nested menu permissions. For deep, user-controlled hierarchies, iterative traversal protects against `StackOverflowError`.
:::

## Interview questions

:::qa basic
? What is recursion and what is a base case?
Recursion is a method solving a problem by calling itself on smaller sub-problems. The base case is the condition under which it returns without recursing; without it the recursion never ends and causes `StackOverflowError`.
:::

:::qa intermediate
? Recursion vs iteration — which is better?
Iteration uses constant stack space and avoids call overhead, so it is usually faster and safer in Java. Recursion is clearer for inherently recursive structures (trees, divide-and-conquer, backtracking). Any recursion can be converted to iteration with an explicit stack.
--- followup Does Java optimise tail recursion?
No. The JVM does not guarantee tail-call elimination, partly because stack frames are used for security checks and stack traces.
:::

:::qa tricky
? Is StackOverflowError an exception you should catch?
It is an `Error`, signalling a resource problem. Catching it is technically possible but rarely sensible — the program state may be inconsistent. Fix the recursion depth or algorithm instead.
:::

:::quiz
? What is the time complexity of the naive recursive Fibonacci?
- O(n)
- O(n log n)
+ O(2ⁿ) (more precisely about O(1.618ⁿ))
- O(n²)
--- explain
Each call spawns two more, recomputing the same sub-problems repeatedly. Memoisation reduces it to O(n).
:::

:::exercise interview
? Check if a string is a palindrome recursively
Write `isPalindrome(String s)` recursively, ignoring case.
--- solution
```java title="Palindrome.java"
public class Palindrome {
    static boolean isPalindrome(String s) {
        return check(s.toLowerCase(), 0, s.length() - 1);
    }
    private static boolean check(String s, int l, int r) {
        if (l >= r) return true;                         // base case
        if (s.charAt(l) != s.charAt(r)) return false;
        return check(s, l + 1, r - 1);                   // shrink toward the middle
    }
    public static void main(String[] args) {
        System.out.println(isPalindrome("Madam"));   // true
        System.out.println(isPalindrome("Java"));    // false
    }
}
```
--- explanation
Passing indices instead of calling `substring` avoids creating a new string on every call.
--- complexity
O(n) time; O(n) stack space (n/2 frames).
:::
</script>

<script type="text/x-java-topic">
@id: pass-by-value
@module: methods
@title: Java Is Always Pass-by-Value
@level: 3
@time: 15
@prereq: methods, data-types
@next: string-basics, oop-intro
@tags: pass by value, pass by reference, reference copy, swap, mutation, parameter passing
===
## Introduction

This is one of the most misunderstood Java topics and a guaranteed interview question. The precise rule:

:::key
**Java is always pass-by-value.** When you pass a primitive, the value is copied. When you pass an object, the value that is copied is the **reference** — so the method can mutate the object the reference points to, but it cannot make the caller's variable point to a different object.
:::

Saying "Java passes objects by reference" is **wrong**, and interviewers use a swap example to prove it.

## Proof by example

```java title="PassByValue.java"
public class PassByValue {
    static class Box { int value; Box(int v) { value = v; } }

    static void changePrimitive(int x) { x = 99; }

    static void mutate(Box b) { b.value = 99; }        // changes the shared object

    static void reassign(Box b) { b = new Box(42); }   // changes only the local copy of the reference

    static void swap(Box a, Box b) { Box t = a; a = b; b = t; }  // swaps local copies only

    public static void main(String[] args) {
        int n = 1;
        changePrimitive(n);
        System.out.println(n);            // 1

        Box box = new Box(1);
        mutate(box);
        System.out.println(box.value);    // 99  — object was mutated through the copied reference

        reassign(box);
        System.out.println(box.value);    // 99  — caller's variable still points to the same object

        Box p = new Box(1), q = new Box(2);
        swap(p, q);
        System.out.println(p.value + " " + q.value);   // 1 2 — not swapped
    }
}
```

:::diagram Inside reassign(box)
[a] main frame :: box → #A
[v] reassign frame :: b → #A (a COPY of the reference) … then b → #B
[g] Heap :: #A Box{value=99} · #B Box{value=42} (unreachable after return)
:::

In true pass-by-reference (C++ `void swap(Box& a, Box& b)`), the parameter is an alias for the caller's variable, and assigning to it changes the caller's variable. Java has no such mechanism.

## Strings and wrappers

```java
static void append(String s) { s = s + "!"; }
String msg = "Hi";
append(msg);
System.out.println(msg);   // "Hi"
```

This is not special String behaviour. `s + "!"` creates a **new** `String` and assigns its reference to the local `s`. Since `String` is immutable, there is no way to mutate the caller's string at all. The same holds for `Integer`, `Long`, `LocalDate` etc.

## Real-life example

:::analogy Sharing a Google Doc link
Passing an object is like sending a colleague a **copy of the link** to your document. They can edit the document (mutate the object) and you'll see the changes. But if they change *their* copy of the link to point to a different document, your link still points to the original. You gave them a copy of the address, not your address book.
:::

:::project
This matters when a service method receives an entity or DTO: calling `order.setStatus(APPROVED)` inside a helper mutates the caller's object (useful — and sometimes a surprising side effect). Reassigning the parameter inside the helper has no effect on the caller; return the new object instead.
:::

## Interview questions

:::qa basic
? Is Java pass-by-value or pass-by-reference?
Always pass-by-value. For objects, the value passed is a copy of the reference, so the method can modify the object's state but cannot change which object the caller's variable refers to.
--- example
```java
void reset(List<String> list) {
    list.clear();                 // visible to the caller: same list object
    list = new ArrayList<>();     // invisible to the caller: local reassignment
}
```
--- followup Then how can a method "return" two values?
Return an object that holds both (a record such as `record MinMax(int min, int max)`), a small array, or mutate a holder object passed in.
:::

:::qa tricky
? Why can't you write a swap(Integer a, Integer b) method in Java?
Because the method receives copies of the references; swapping them inside the method has no effect on the caller's variables, and `Integer` is immutable so its value cannot be changed in place either.
:::

:::quiz
? What does this print?
```java
static void m(StringBuilder sb) { sb.append("B"); sb = new StringBuilder("X"); sb.append("C"); }
StringBuilder s = new StringBuilder("A");
m(s);
System.out.println(s);
```
- A
+ AB
- XC
- ABC
--- explain
`append("B")` mutates the shared object. After reassignment, `sb` points to a new builder; appending "C" affects only that new object.
:::
</script>

<script type="text/x-java-topic">
@id: string-basics
@module: strings
@title: String, the String Pool & Immutability
@level: 3
@time: 28
@prereq: data-types, pass-by-value
@next: string-equality, stringbuilder
@tags: string, string pool, intern, immutable, literal, new string, compact strings, hashcode caching, security
===
## Introduction

`String` is the most used class in Java — names, JSON, SQL, log messages, map keys, file paths. Because it is everywhere, the JVM treats it specially: string literals are **pooled** and shared, and `String` objects are **immutable**. Understanding both explains memory usage, `==` bugs, and why `String` is safe as a `HashMap` key.

## Technical explanation

`java.lang.String` is a `final` class representing an immutable sequence of UTF-16 characters. Internally (Java 9+) it stores a `byte[] value` plus a `coder` flag:

- **Compact Strings (Java 9, JEP 254):** if every character fits in Latin-1, each char takes **1 byte**; otherwise the array stores UTF-16 at 2 bytes per char. Most strings in typical applications are Latin-1, roughly halving their memory compared with Java 8's `char[]`.
- `hash` — the hash code, computed lazily on first `hashCode()` call and **cached** (possible only because the content never changes).

## Creating strings: literal vs `new`

```java title="StringPool.java"
public class StringPool {
    public static void main(String[] args) {
        String a = "java";                 // literal → taken from / added to the string pool
        String b = "java";                 // same literal → SAME pooled object
        String c = new String("java");     // explicitly creates a NEW object on the heap
        String d = c.intern();             // returns the pooled instance

        System.out.println(a == b);        // true   same reference
        System.out.println(a == c);        // false  different objects
        System.out.println(a.equals(c));   // true   same characters
        System.out.println(a == d);        // true   intern() returned the pooled object

        String e = "ja" + "va";            // compile-time constant expression → folded to "java"
        System.out.println(a == e);        // true
        String part = "ja";
        String f = part + "va";            // computed at RUNTIME → new object
        System.out.println(a == f);        // false
    }
}
```

:::diagram Memory after the code above
[a] Stack :: a, b, d, e → #P · c → #H · f → #F
[g] String pool (inside the heap since Java 7) :: #P "java"
[w] Regular heap :: #H "java" (new String) · #F "java" (runtime concatenation)
:::

### The string pool (string constant pool)

The pool is a JVM-wide hash table of **canonical** `String` instances. When a class is loaded and a literal is first resolved, the JVM looks the text up in the pool: if present, it reuses that object; otherwise it adds one. This deduplicates the thousands of identical literals across an application.

- Location: moved from PermGen to the **main heap in Java 7**, so pooled strings are garbage-collected like other objects when unreferenced.
- `intern()` adds a string to the pool (or returns the existing one).
- Pool size can be tuned with `-XX:StringTableSize`.

### How many objects does `new String("java")` create?

Up to **two**: the literal `"java"` in the pool (if not already there, created when the literal is resolved) and a new `String` object on the heap. In Java 9+ the new object usually **shares** the literal's internal `byte[]` rather than copying it.

## Why is String immutable?

Immutability means once created, a `String`'s content can never change; every "modifying" method (`toUpperCase`, `replace`, `concat`, `substring`) returns a **new** `String`.

| Reason | Explanation |
|---|---|
| **String pool safety** | Many variables share one pooled object. If one could modify it, every other holder would see the change. |
| **Security** | Strings hold file paths, URLs, class names, DB credentials. If a string could change after a security check (e.g., checking a path then opening it), attackers could swap the value. Class loading by name relies on this too. |
| **Thread safety** | Immutable objects can be shared across threads without synchronisation. |
| **Hash code caching** | The hash can be computed once and cached, making `String` fast and reliable as a `HashMap` key. A key whose hash changed after insertion would be lost in the map. |
| **Performance of sharing** | Substrings of literals, pooled constants and compile-time folding are all safe because nothing can change. |

How is it enforced? The class is `final` (no subclass can add mutating methods), the `value` array is `private final`, and no method exposes or modifies it — methods that would change content build a new array instead.

```java
String s = "hello";
s.toUpperCase();          // result discarded! s is still "hello"
s = s.toUpperCase();      // correct: reassign the variable to the new object
```

## Real-life example

:::analogy A printed book vs a whiteboard
A `String` is a printed book: once printed, the text never changes. Many readers can share one copy in a library (the pool) safely. If you want a revised edition, you print a new book. A `StringBuilder` is a whiteboard — convenient for drafting, erasing and rewriting, but you wouldn't let the whole office share one whiteboard as the official record.
:::

:::project
Strings dominate heap usage in many back-end services (JSON payloads, logs, cached keys). G1's `-XX:+UseStringDeduplication` can deduplicate the internal arrays of equal strings during GC. Constants such as error codes are best declared as `static final String` so they are literals shared through the pool.
:::

## Common mistakes

:::mistake
- Comparing strings with `==` (works for literals by coincidence, fails for runtime strings — a classic production bug).
- Calling `s.trim()` or `s.replace(...)` without using the returned value.
- Concatenating in loops with `+`, creating many temporary objects. Use `StringBuilder`.
- Calling `intern()` on large numbers of dynamic strings to "save memory" — it adds hash-table overhead and contention.
- Storing passwords in `String`: they stay in memory until GC and may appear in heap dumps; APIs use `char[]` so the array can be wiped.
:::

## Interview questions

:::qa basic
? What is the String pool?
A JVM-maintained table of unique `String` instances. String literals and interned strings are stored there so identical literals share one object, saving memory. Since Java 7 it resides in the main heap.
--- followup How do you put a runtime string into the pool?
Call `intern()`. It returns the canonical pooled instance, adding the string if absent.
:::

:::qa tricky
? Why is String immutable in Java?
For safe sharing through the string pool, security (values used in class loading, file paths, network connections and credentials can't change after validation), inherent thread safety, and to allow caching the hash code, which makes strings reliable and fast `HashMap` keys.
--- detail
Immutability is enforced by making the class `final`, the internal array `private final`, never exposing it, and returning new objects from every transforming method. A consequence is that heavy modification should use `StringBuilder`.
--- followup What advantages does immutability provide in general?
Thread safety without locks, freedom to share and cache instances, simpler reasoning (no defensive copies needed when passing them around), safe use as map keys and set elements, and failure atomicity (an object can't be left half-modified).
--- followup Can you break String immutability?
Only by illegitimate means: reflection into the private `value` field (blocked by default since Java 16's strong encapsulation of JDK internals) or `Unsafe`. Doing so corrupts every holder of a pooled string and is never acceptable.
:::

:::qa tricky
? How many objects are created by `String s = new String("Hello");`?
Two in general: one `"Hello"` in the string pool (if the literal wasn't already pooled) and one new `String` object on the heap referenced by `s`. If the literal was already in the pool, just one new object.
:::

:::qa intermediate
? What changed in String's internal representation in Java 9?
Compact Strings: the backing store changed from `char[]` to `byte[]` plus a coder flag. Latin-1 strings use one byte per character, reducing memory use for most applications. It is transparent to user code.
:::

:::trap Is String thread-safe? Is StringBuilder?
`String` is thread-safe *because it is immutable*, not because of locks. `StringBuilder` is **not** thread-safe; `StringBuffer` is (synchronised methods). Candidates sometimes claim `String` methods are synchronised — they are not.
:::

:::quiz
? What is printed?
```java
String s1 = "Hello";
String s2 = "Hel";
String s3 = s2 + "lo";
System.out.println(s1 == s3);
```
- true
+ false
- compile error
- It depends on the JVM
--- explain
`s2` is not a compile-time constant (not `final`), so `s2 + "lo"` is computed at runtime and creates a new object. If `s2` were declared `final String s2 = "Hel";`, the concatenation would be a constant expression, folded at compile time, and `==` would print `true`.
:::

:::quiz
? `String s = "java"; s.concat(" rocks"); System.out.println(s);` prints?
+ java
- java rocks
- null
- compile error
--- explain
`concat` returns a new string, which is discarded. `s` still refers to the original immutable "java".
:::
</script>

<script type="text/x-java-topic">
@id: string-equality
@module: strings
@title: == vs equals(), compareTo & Common String Methods
@level: 2
@time: 18
@prereq: string-basics
@next: stringbuilder, equals-hashcode
@tags: ==, equals, equalsignorecase, compareto, substring, split, strip, isblank, join, repeat, chars, contains
===
## Introduction

`==` and `equals()` answer different questions:

- `==` → **are these the same object?** (reference identity; for primitives, value equality)
- `equals()` → **do these objects represent the same value?** (logical equality, as defined by the class)

For strings you almost always want `equals`.

## Comparison table

| | `==` | `equals()` |
|---|---|---|
| Type | Operator | Method of `Object` (overridable) |
| Primitives | Compares values | N/A |
| References | Compares addresses (identity) | Compares content if overridden |
| Default in `Object` | — | Same as `==` |
| `String` | True only for the same instance | True if same characters |
| null-safe | `x == null` works | `x.equals(y)` throws NPE if `x` is null |

```java
String input = scanner.nextLine();          // "yes" typed by the user
input == "yes";                              // false — runtime string, different object
input.equals("yes");                         // true
"yes".equals(input);                         // true and null-safe (literal first)
java.util.Objects.equals(input, other);      // null-safe for both sides
input.equalsIgnoreCase("YES");               // true
```

## Ordering: compareTo

```java
"apple".compareTo("banana");   // negative: "apple" sorts first
"b".compareTo("a");            // positive
"Java".compareTo("Java");      // 0
"Zebra".compareTo("apple");    // negative: uppercase letters have lower code points
"Zebra".compareToIgnoreCase("apple"); // positive
```

`compareTo` compares lexicographically by UTF-16 code units. For human-language sorting, use `java.text.Collator`.

## Frequently used methods

| Method | Result for `s = "  Hello, Java  "` | Notes |
|---|---|---|
| `length()` | 15 | Counts UTF-16 units. |
| `trim()` / `strip()` | "Hello, Java" | `strip` (Java 11) is Unicode-aware; `trim` removes chars ≤ U+0020. |
| `isEmpty()` / `isBlank()` | false / false | `isBlank` (11) is true for whitespace-only. |
| `charAt(2)` | 'H' | |
| `indexOf("Java")` | 9 | −1 if absent. |
| `contains("Java")` | true | |
| `substring(2, 7)` | "Hello" | end index exclusive. |
| `replace("Java", "World")` | "  Hello, World  " | Literal replace; `replaceAll` uses regex. |
| `toUpperCase()` | "  HELLO, JAVA  " | Pass `Locale.ROOT` for locale-independent results. |
| `split(",")` | ["  Hello", " Java  "] | Regex! `split(".")` returns an empty array — escape as `"\\."`. |
| `String.join("-", "a", "b")` | "a-b" | |
| `"ab".repeat(3)` | "ababab" | Java 11. |
| `lines()` | Stream of lines | Java 11. |
| `chars()` | `IntStream` of chars | |
| `formatted(...)` | like `String.format` | Java 15. |

:::trap The Turkish locale bug
`"TITLE".toLowerCase()` on a machine with Turkish locale yields `"tıtle"` (dotless ı), breaking comparisons such as `header.toLowerCase().equals("title")`. Use `toLowerCase(Locale.ROOT)` for protocol keys and identifiers.
:::

## Interview questions

:::qa basic
? What is the difference between == and equals() for strings?
`==` checks whether two references point to the same object; `equals()` checks whether the character sequences are equal. Two strings with the same content can be different objects, so use `equals`.
--- followup Why does `"a" == "a"` return true then?
Both literals refer to the same pooled instance. Relying on this is a bug waiting to happen, because strings read from files, requests or built at runtime are not pooled.
:::

:::qa intermediate
? Why write `"CONSTANT".equals(variable)` instead of `variable.equals("CONSTANT")`?
The literal can never be null, so the call can't throw `NullPointerException` if `variable` is null — it simply returns false. `Objects.equals(a, b)` achieves the same for two variables.
:::

:::qa tricky
? What does `"a.b.c".split(".")` return?
An empty array. `split` takes a regular expression, and `.` matches any character, so every character is a delimiter and trailing empty strings are removed. Use `split("\\.")` or `Pattern.quote(".")`.
:::

:::quiz
? `String s = null; System.out.println("x".equals(s));` prints?
+ false
- true
- NullPointerException
- compile error
--- explain
Calling `equals` on the non-null literal with a null argument returns false.
:::

:::exercise interview
? Check whether two strings are anagrams
`"listen"` and `"silent"` are anagrams. Write `isAnagram(a, b)` ignoring case and spaces.
--- hints
- Count characters with an `int[26]` array or a `Map<Character,Integer>`.
- Alternatively sort both char arrays and compare.
--- solution
```java title="Anagram.java"
public class Anagram {
    static boolean isAnagram(String a, String b) {
        String x = a.replaceAll("\\s", "").toLowerCase();
        String y = b.replaceAll("\\s", "").toLowerCase();
        if (x.length() != y.length()) return false;
        int[] counts = new int[26];
        for (int i = 0; i < x.length(); i++) {
            counts[x.charAt(i) - 'a']++;
            counts[y.charAt(i) - 'a']--;
        }
        for (int c : counts) if (c != 0) return false;
        return true;
    }
    public static void main(String[] args) {
        System.out.println(isAnagram("Listen", "Silent"));        // true
        System.out.println(isAnagram("Dormitory", "Dirty room")); // true
        System.out.println(isAnagram("Java", "Javaa"));            // false
    }
}
```
--- explanation
The counting approach assumes letters a–z. For arbitrary Unicode use a `HashMap<Integer,Integer>` over code points. Sorting (`Arrays.sort(x.toCharArray())`) is simpler but O(n log n).
--- complexity
Counting: O(n) time, O(1) space (fixed 26 counters).
:::
</script>

<script type="text/x-java-topic">
@id: stringbuilder
@module: strings
@title: StringBuilder vs StringBuffer
@level: 2
@time: 15
@prereq: string-basics
@next: oop-intro
@tags: stringbuilder, stringbuffer, mutable, append, capacity, concatenation, invokedynamic, thread safe
===
## Introduction

Because `String` is immutable, building text piece by piece with `+` in a loop creates a new object at every step. `StringBuilder` is a **mutable** character buffer designed for exactly this; `StringBuffer` is its older, synchronised twin.

## Internal working

`StringBuilder` extends `AbstractStringBuilder`, which holds a resizable `byte[] value` (compact-string aware) and a `count`. `append` writes into the free space; when full, it grows to roughly **(old capacity × 2) + 2** and copies. Default capacity is 16 characters; construct with `new StringBuilder(expectedSize)` when you know roughly how big the result will be.

```java title="Builder.java"
public class Builder {
    public static void main(String[] args) {
        // O(n^2) character copying: each += copies the whole string built so far
        String slow = "";
        for (int i = 0; i < 5; i++) slow += i + ",";

        // Amortised O(n): one buffer, appended in place
        StringBuilder sb = new StringBuilder(64);
        for (int i = 0; i < 5; i++) {
            sb.append(i).append(',');
        }
        sb.setLength(sb.length() - 1);          // remove trailing comma
        System.out.println(sb);                   // 0,1,2,3,4
        System.out.println(sb.reverse());         // 4,3,2,1,0  (mutates the builder)
        sb.insert(0, "[").append("]");
        System.out.println(sb.toString());        // [4,3,2,1,0]
    }
}
```

## Comparison

| | `String` | `StringBuilder` | `StringBuffer` |
|---|---|---|---|
| Mutable | No | Yes | Yes |
| Thread-safe | Yes (immutable) | **No** | Yes (`synchronized` methods) |
| Performance | Slow for repeated modification | Fastest | Slower than builder (locking) |
| Since | 1.0 | **1.5** | 1.0 |
| `equals` | Content | Identity (not overridden!) | Identity |
| Use | Values, keys, constants | Building strings in one thread (almost always) | Legacy APIs; shared buffer across threads (rare) |

:::trap equals on StringBuilder
`new StringBuilder("a").equals(new StringBuilder("a"))` is **false**: `StringBuilder` does not override `equals`. Compare `sb1.toString().equals(sb2.toString())`, or since Java 11, `sb1.compareTo(sb2) == 0`.
:::

## What about `+` outside loops?

For a single expression like `"Order " + id + " total " + total`, the compiler already optimises. Up to Java 8 it generated a `StringBuilder` chain; since **Java 9 (JEP 280)** it emits an `invokedynamic` call to `StringConcatFactory`, which picks an efficient strategy at runtime. So write readable `+` for one-off concatenation; use `StringBuilder` when concatenating **in a loop**.

## Real-life example

:::analogy
`String` is a printed receipt; `StringBuilder` is the cashier's scratch pad while items are scanned. You print (call `toString()`) once at the end. `StringBuffer` is the same scratch pad chained to the counter with a lock so only one cashier writes at a time — safe, but slower, and rarely needed.
:::

## Interview questions

:::qa basic
? String vs StringBuilder vs StringBuffer?
`String` is immutable and thread-safe. `StringBuilder` is mutable and not synchronised — the fastest choice for building strings in a single thread. `StringBuffer` is mutable and synchronised, safe for multiple threads but slower; it's largely legacy.
--- followup Why would StringBuffer rarely be the right choice even in multi-threaded code?
Individual method calls are atomic, but sequences (check length then append) are not, so you'd need external locking anyway. Usually each thread builds its own string with a `StringBuilder` and results are combined.
:::

:::qa intermediate
? Is using `+` for string concatenation always bad?
No. For a single expression the compiler generates efficient code (`StringConcatFactory` since Java 9). The problem is `+=` in loops, which copies the growing string each iteration — O(n²) character copying.
:::

:::quiz
? Default capacity of `new StringBuilder()`?
- 0
- 10
+ 16
- 32
--- explain
The no-arg constructor allocates capacity for 16 characters. `new StringBuilder("abc")` gets 16 + 3 = 19.
:::

:::exercise beginner
? Reverse each word
Transform `"Java is fun"` into `"avaJ si nuf"`.
--- solution
```java title="ReverseWords.java"
public class ReverseWords {
    public static void main(String[] args) {
        String input = "Java is fun";
        StringBuilder out = new StringBuilder(input.length());
        for (String word : input.split(" ")) {
            if (out.length() > 0) out.append(' ');
            out.append(new StringBuilder(word).reverse());
        }
        System.out.println(out);   // avaJ si nuf
    }
}
```
--- complexity
O(n) time and space.
:::
</script>

<script type="text/x-java-topic">
@id: oop-intro
@module: oop
@title: Object-Oriented Programming: The Big Picture
@level: 2
@time: 15
@prereq: methods
@next: classes-objects
@tags: oop, object oriented, pillars, encapsulation, inheritance, polymorphism, abstraction, procedural, solid
===
## Introduction

**Object-oriented programming (OOP)** organises software around **objects** — bundles of *state* (data) and *behaviour* (methods) that model things in the problem domain: a `Customer`, a `PurchaseOrder`, a `PaymentGateway`.

Why was it introduced? In large **procedural** programs, data structures are global or passed everywhere, and any function can modify them. A change to a data format ripples through hundreds of functions. OOP puts data behind the methods that are allowed to change it, so each part of the system has a small, stable interface and can change internally without breaking others.

## Procedural vs object-oriented

```java
// Procedural style: data and functions are separate; anyone can change 'balance'
double balance = 1000;
balance = withdraw(balance, 200);

// Object-oriented style: the object guards its own data
Account acc = new Account("ACC-1", 1000);
acc.withdraw(200);      // the Account decides whether this is allowed
```

## The four pillars

:::cards
Encapsulation :: Hide internal state; expose controlled operations. *An ATM exposes withdraw/deposit, not the bank database.*
Abstraction :: Model only what matters; hide *how* behind *what*. *You drive with a steering wheel, not by controlling the axle.*
Inheritance :: A new class reuses and extends an existing one (IS-A). *A SavingsAccount is an Account.*
Polymorphism :: One interface, many implementations; the actual object decides behaviour at runtime. *"Pay" works for UPI, card or net-banking.*
:::

Each pillar has its own topic: [Encapsulation](#encapsulation), [Abstraction](#abstraction), [Inheritance](#inheritance), [Polymorphism](#polymorphism).

## Key vocabulary

| Term | Meaning |
|---|---|
| Class | Blueprint/type defining fields and methods. |
| Object / instance | A concrete thing created from a class at runtime with `new`. |
| State | Current values of an object's fields. |
| Behaviour | What an object can do — its methods. |
| Identity | What distinguishes two objects with equal state (their reference). |
| Message | A method call on an object (`order.approve()`). |
| Interface | A contract: what an object can do, without how. |
| Composition | Building objects out of other objects (HAS-A). |

## Design principles that grow out of OOP (SOLID)

| Principle | One-line meaning |
|---|---|
| **S**ingle Responsibility | A class should have one reason to change. |
| **O**pen/Closed | Open for extension, closed for modification (add a new `PaymentMethod` class instead of editing a giant `if`). |
| **L**iskov Substitution | A subclass must be usable wherever its superclass is expected without surprising behaviour. |
| **I**nterface Segregation | Prefer several small interfaces over one fat interface. |
| **D**ependency Inversion | Depend on abstractions (interfaces), not concrete classes — the basis of dependency injection in Spring. |

:::project How OOP shows up in a Spring Boot back end
Controllers, services and repositories are classes; their collaboration is **composition** (a service *has* a repository). Services depend on **interfaces** (`PaymentGateway`), and Spring injects the concrete implementation — **polymorphism + dependency inversion**. Entities **encapsulate** their invariants (`order.addLine()` recalculates totals). JPA repositories are **abstractions** over SQL.
:::

## Interview questions

:::qa basic
? What are the four pillars of OOP?
Encapsulation (bundling state and behaviour and restricting direct access), abstraction (exposing essential behaviour while hiding implementation), inheritance (deriving new classes from existing ones to reuse and extend behaviour), and polymorphism (the same call behaving differently depending on the object's actual type).
--- followup Which is the most important?
Many would argue encapsulation and polymorphism: encapsulation keeps change local, and polymorphism (via interfaces) enables extensible, loosely coupled design. Inheritance is the most over-used — "favour composition over inheritance".
:::

:::qa intermediate
? What is the difference between a class and an object?
A class is a compile-time definition — a type describing fields and methods — loaded once per class loader. An object is a runtime instance of that class, created with `new`, living on the heap with its own copy of the instance fields. One class, many objects.
:::

:::quiz
? Which principle does "depend on the `PaymentGateway` interface, not on `RazorpayGateway`" express?
- Single Responsibility
- Liskov Substitution
+ Dependency Inversion
- Interface Segregation
--- explain
High-level code depends on an abstraction; the concrete implementation is supplied from outside (e.g. by Spring's dependency injection).
:::
</script>

<script type="text/x-java-topic">
@id: classes-objects
@module: oop
@title: Classes & Objects: What Happens on new
@level: 2
@time: 22
@prereq: oop-intro
@next: constructors, encapsulation, inheritance
@tags: class, object, new, instance, reference, heap, object header, tostring, instantiation, anonymous object
===
## Introduction

A **class** is a template; an **object** is a live instance of it. Understanding exactly what `new` does — memory allocation, default initialisation, constructor chaining, returning a reference — is foundational for everything from debugging `NullPointerException`s to reasoning about garbage collection and thread safety.

## A complete class

```java title="Product.java"
public class Product {
    // fields (state)
    private final String sku;
    private String name;
    private double price;
    private int stock;

    // constructor (initialisation)
    public Product(String sku, String name, double price) {
        this.sku = sku;
        this.name = name;
        this.price = price;
    }

    // methods (behaviour)
    public void receive(int qty) {
        if (qty <= 0) throw new IllegalArgumentException("qty must be > 0");
        stock += qty;
    }

    public boolean sell(int qty) {
        if (qty > stock) return false;
        stock -= qty;
        return true;
    }

    public int getStock() { return stock; }

    @Override
    public String toString() {
        return "Product{sku=" + sku + ", name=" + name + ", stock=" + stock + "}";
    }

    public static void main(String[] args) {
        Product p = new Product("SKU-1", "Keyboard", 1499.0);
        p.receive(10);
        p.sell(3);
        System.out.println(p);             // Product{sku=SKU-1, name=Keyboard, stock=7}
        Product q = p;                     // copies the reference, not the object
        q.sell(2);
        System.out.println(p.getStock());  // 5 — p and q refer to the same object
    }
}
```

## What happens when you write `new Product(...)`

:::flow
1. Class check :: load + link + initialise Product if not done yet
2. Allocate :: reserve memory on the heap (usually a fast bump-pointer in the thread's TLAB)
3. Zero fields :: sku = null, name = null, price = 0.0, stock = 0
4. Set header :: mark word (hash, lock, GC age) + class pointer
* 5. Run constructor chain :: Object() → field initialisers & instance blocks → constructor body
6. Return reference :: the address is stored in variable p
:::

Every object has a **header** (on 64-bit HotSpot, 12 bytes with compressed class pointers, or 16 without) followed by its fields, padded to a multiple of 8 bytes. A `new Object()` therefore takes 16 bytes even with no fields.

## Reference variables and `null`

```java
Product p;               // a local reference variable (unassigned)
p = null;                // refers to no object
p.getStock();            // NullPointerException
```

Since Java 14 (JEP 358), helpful NPE messages say exactly which reference was null: *Cannot invoke "Product.getStock()" because "p" is null*.

## Object lifecycle

1. **Created** with `new` (or reflection, cloning, deserialisation).
2. **In use** while reachable from a GC root (a local variable in an active frame, a static field, etc.).
3. **Unreachable** when no live references remain.
4. **Collected** by the garbage collector at some later point — there is no destructor. See [Garbage Collection](#garbage-collection).

## Real-life example

:::analogy Architect's plan and houses
The class is an architect's plan: it defines rooms and wiring but you can't live in it. Each house built from the plan is an object: same layout, but its own furniture (field values) and its own address (reference). Giving a friend your address (copying the reference) doesn't build a second house.
:::

:::project
In a Spring application you rarely call `new` on services — the container creates them once (singletons) and injects them. You *do* call `new` constantly for value objects: DTOs, entities, `BigDecimal`s, `LocalDate`s, collections. Most of these die young, which is exactly what generational GC is optimised for.
:::

## Common mistakes

:::mistake
- Assuming `Product q = p;` makes a copy. It makes an alias.
- Public mutable fields (`public double price;`) — anyone can set a negative price. Use private fields and methods that enforce rules.
- Not overriding `toString()`, leaving logs full of `Product@7a81197d`.
:::

## Interview questions

:::qa basic
? What are the ways to create an object in Java?
`new` (the usual way); reflection (`Constructor.newInstance()`); `clone()`; deserialisation; and factory methods that internally use one of these (`List.of`, `LocalDate.of`, builders). Only `new`, reflection and factory methods call a constructor; `clone()` and deserialisation of `Serializable` classes bypass the class's own constructor.
:::

:::qa intermediate
? What is the default `toString()` output and what does the number mean?
`getClass().getName() + "@" + Integer.toHexString(hashCode())`, e.g. `com.shop.Product@1b6d3586`. The number is the identity hash code in hex — not a memory address (objects move during GC, the hash doesn't).
:::

:::qa tricky
? How much memory does an empty object take?
On 64-bit HotSpot with compressed class pointers (the default for heaps under 32 GB): 12-byte header padded to 16 bytes. Fields are added after the header, and the total is rounded up to a multiple of 8. Tools like JOL (Java Object Layout) show exact layouts.
:::

:::quiz
? After `Product a = new Product(...); Product b = a; a = null;` is the object eligible for GC?
- Yes, because `a` is null
+ No, because `b` still references it
- Only after `System.gc()`
- Objects are never collected while `main` runs
--- explain
An object is collectable only when it is unreachable. `b` is a live reference.
:::
</script>

<script type="text/x-java-topic">
@id: constructors
@module: oop
@title: Constructors & Initialisation Order
@level: 2
@time: 22
@prereq: classes-objects
@next: this-keyword
@tags: constructor, default constructor, no-arg, parameterized, overloading, constructor chaining, this(), super(), initializer block, initialization order, private constructor
===
## Introduction

A **constructor** is a special block that runs when an object is created, putting it into a **valid initial state**. It has the same name as the class and **no return type** (not even `void`).

Why not just set fields afterwards? Because an object that exists in a half-initialised state is a bug magnet. Constructors let a class **require** what it needs (`new Order(customerId)`) and enforce invariants (`if (customerId == null) throw …`) before anyone can use the object.

## Kinds of constructors

```java title="Employee.java"
public class Employee {
    private final String id;
    private final String name;
    private final String department;
    private double salary;

    // Parameterised constructor — the "canonical" one that does the real work
    public Employee(String id, String name, String department, double salary) {
        if (id == null || id.isBlank()) throw new IllegalArgumentException("id required");
        this.id = id;
        this.name = name;
        this.department = department;
        this.salary = salary;
    }

    // Overloaded constructor delegating with this(...) — constructor chaining
    public Employee(String id, String name) {
        this(id, name, "UNASSIGNED", 0.0);    // must be the FIRST statement
    }

    // Copy constructor
    public Employee(Employee other) {
        this(other.id, other.name, other.department, other.salary);
    }

    @Override
    public String toString() { return id + ":" + name + "@" + department; }

    public static void main(String[] args) {
        System.out.println(new Employee("E1", "Asha"));             // E1:Asha@UNASSIGNED
        System.out.println(new Employee("E2", "Ravi", "IT", 90000)); // E2:Ravi@IT
    }
}
```

### Default constructor rules

- If a class declares **no constructor at all**, the compiler adds a **default constructor**: no parameters, same access as the class, body `super();`.
- As soon as you declare **any** constructor, the default is **not** generated. `new Employee()` above does not compile.
- Frameworks (JPA/Hibernate, Jackson) often need a no-arg constructor to instantiate objects via reflection — JPA requires one that is `public` or `protected`.

## Constructor chaining: `this(...)` and `super(...)`

- `this(...)` calls another constructor of the **same** class.
- `super(...)` calls a constructor of the **parent** class.
- One of them is always the first statement. If you write neither, the compiler inserts `super();` — so every constructor ultimately runs `Object()`.
- You cannot use both in the same constructor.

:::version Java 22+ flexible constructor bodies
JEP 447 (preview in 22) and its successors allow some statements (e.g. argument validation that doesn't touch `this`) *before* `super(...)`; finalised in Java 25. In Java 17, `this()`/`super()` must be the very first statement.
:::

## Initialisation order — the classic interview puzzle

```java title="InitOrder.java"
class Parent {
    static { System.out.println("1. Parent static block"); }
    { System.out.println("3. Parent instance block"); }
    Parent() { System.out.println("4. Parent constructor"); }
}

class Child extends Parent {
    static { System.out.println("2. Child static block"); }
    private String name = initName();
    { System.out.println("6. Child instance block"); }

    Child() {
        super();                      // implicit even if omitted
        System.out.println("7. Child constructor");
    }
    private String initName() { System.out.println("5. Child field initialiser"); return "x"; }
}

public class InitOrder {
    public static void main(String[] args) {
        new Child();
        System.out.println("--- second object ---");
        new Child();                  // static blocks do NOT run again
    }
}
```

The rule:

1. **Class initialisation (once):** superclass static initialisers, then subclass static initialisers — in textual order.
2. **Per object:** the constructor is invoked → it calls `super(...)` first (recursively up to `Object`) → then **instance field initialisers and instance blocks run in textual order** → then the rest of the constructor body.

:::warn Don't call overridable methods from constructors
If `Parent`'s constructor calls a method that `Child` overrides, the child's version runs **before the child's fields are initialised** — it sees `null`/`0`. This is a well-known source of bugs; call only `private` or `final` methods from constructors.
:::

## Private constructors

A `private` constructor prevents instantiation from outside. Used for:

- **Utility classes** (`Math`, `Collections`) — only static methods.
- **Singletons** — see [Singleton](#pattern-singleton).
- **Static factory methods** — `LocalDate.of(...)`, `List.of(...)`, `Optional.of(...)` — which can have descriptive names, cache instances, or return subtypes.

## Constructor vs method

| | Constructor | Method |
|---|---|---|
| Name | Same as class | Any |
| Return type | None | Required (`void` or a type) |
| Invoked | Automatically by `new` | Explicitly |
| Inherited | **No** | Yes (non-private) |
| Can be `static`/`abstract`/`final` | No | Yes |

## Real-life example

:::analogy Hiring paperwork
You cannot start working at a company until onboarding is complete: employee ID, name, department. The constructor is that onboarding: the company refuses to have an "employee" without an ID. Constructor chaining is like the company's HR form (child) that first completes the group-level corporate form (parent, `super()`).
:::

## Interview questions

:::qa basic
? What is a default constructor? When does the compiler provide it?
A no-argument constructor inserted by the compiler only when the class declares no constructors. It calls `super()` and has the same access modifier as the class.
--- followup Is a no-arg constructor you write yourself a "default constructor"?
Strictly, no — the JLS uses "default constructor" only for the compiler-generated one. Yours is simply a no-arg constructor.
:::

:::qa intermediate
? Can a constructor be private, final, static or abstract? Can it be inherited or overridden?
It can be private (singletons, factories, utility classes). It cannot be `final`, `static` or `abstract` — those modifiers make no sense for something that isn't inherited. Constructors are not inherited, so they cannot be overridden; they can be overloaded.
:::

:::qa tricky
? What is the order of execution of static blocks, instance blocks and constructors in an inheritance hierarchy?
Once per class: parent static blocks, then child static blocks. For each object: parent instance initialisers and constructor body, then child instance initialisers (fields and blocks, in textual order), then child constructor body.
:::

:::qa tricky
? Can a constructor return a value? What happens with `return;` in a constructor?
It has no return type and cannot return a value, but a bare `return;` is allowed to exit early. If a method is declared `void Employee()` it is an ordinary method that happens to share the class name — not a constructor.
:::

:::quiz
? A class declares only `public Car(String model)`. What happens with `new Car()`?
- The compiler creates a default constructor
+ Compile error: no no-arg constructor exists
- `model` is set to null
- Runtime exception
--- explain
Declaring any constructor suppresses the compiler-generated default constructor.
:::

:::exercise intermediate
? Immutable Money with validation
Create `Money` with `amount` (BigDecimal) and `currency` (String). Validate that amount is non-negative and currency is a 3-letter code. Provide a convenience constructor for INR.
--- solution
```java title="Money.java"
import java.math.BigDecimal;

public final class Money {
    private final BigDecimal amount;
    private final String currency;

    public Money(BigDecimal amount, String currency) {
        if (amount == null || amount.signum() < 0) throw new IllegalArgumentException("amount must be >= 0");
        if (currency == null || !currency.matches("[A-Z]{3}")) throw new IllegalArgumentException("bad currency");
        this.amount = amount;
        this.currency = currency;
    }

    public Money(String amount) {               // INR convenience constructor
        this(new BigDecimal(amount), "INR");
    }

    public Money add(Money other) {
        if (!currency.equals(other.currency)) throw new IllegalArgumentException("currency mismatch");
        return new Money(amount.add(other.amount), currency);
    }

    @Override public String toString() { return currency + " " + amount; }

    public static void main(String[] args) {
        System.out.println(new Money("100.50").add(new Money("20.25")));   // INR 120.75
    }
}
```
--- explanation
All validation lives in the canonical constructor; the INR constructor delegates via `this(...)`, so rules are never duplicated. The class is final with final fields — it is immutable, and `add` returns a new instance.
:::
</script>

<script type="text/x-java-topic">
@id: this-keyword
@module: oop
@title: The this Keyword
@level: 2
@time: 10
@prereq: constructors
@next: static-keyword
@tags: this, current object, shadowing, constructor chaining, fluent, method chaining
===
## Introduction

Inside an instance method or constructor, **`this`** is a reference to the **current object** — the object on which the method was called. The JVM passes it implicitly as local variable slot 0 of every instance method.

## Uses of `this`

```java title="Cart.java"
import java.util.ArrayList;
import java.util.List;

public class Cart {
    private final List<String> items = new ArrayList<>();
    private String owner;

    public Cart(String owner) {
        this.owner = owner;                 // 1. disambiguate field vs parameter
    }

    public Cart() {
        this("guest");                      // 2. call another constructor
    }

    public Cart add(String item) {
        items.add(item);
        return this;                        // 3. return the current object → fluent chaining
    }

    public void register(Registry r) {
        r.track(this);                      // 4. pass the current object to another method
    }

    public static void main(String[] args) {
        Cart c = new Cart().add("pen").add("book");   // chaining works because add returns this
        System.out.println(c.owner + " " + c.items);  // guest [pen, book]
    }
}

class Registry { void track(Cart c) { /* ... */ } }
```

| Use | Example |
|---|---|
| Refer to a shadowed field | `this.owner = owner;` |
| Constructor chaining | `this("guest");` |
| Return current object | `return this;` (builders, fluent APIs such as `StringBuilder.append`) |
| Pass current object | `listener.register(this);` |
| Qualified this in inner classes | `Outer.this.field` |

## Rules

- `this` does not exist in `static` methods or static blocks — there is no current object. Using it is a compile error: *non-static variable this cannot be referenced from a static context*.
- You cannot assign to `this`.

:::warn Escaping `this` from a constructor
Passing `this` to another thread or registry *inside a constructor* publishes a partially constructed object; another thread may see fields before they are set. Register listeners after construction (e.g. in a factory method).
:::

:::qa basic
? What is `this` in Java?
A reference to the current object within an instance method or constructor. It's used to access shadowed fields, call other constructors (`this(...)`), return the current object for chaining, and pass the object to other methods.
--- followup Can we use this in a static method?
No. Static methods belong to the class and are invoked without an object, so there is no current instance.
:::

:::quiz
? What does `return this;` in a setter enable?
- Faster execution
+ Method chaining, e.g. `obj.setA(1).setB(2)`
- Thread safety
- Immutability
--- explain
Returning the current object lets callers chain further calls on it — the fluent/builder style.
:::
</script>

<script type="text/x-java-topic">
@id: static-keyword
@module: oop
@title: The static Keyword
@level: 2
@time: 18
@prereq: this-keyword, variables
@next: final-keyword
@tags: static, class variable, static method, static block, static nested class, static import, utility class, method hiding
===
## Introduction

`static` means **"belongs to the class, not to an instance."** A static member exists once per class (per class loader), is created when the class is initialised, and can be used without creating any object.

Why does Java have it? Some things genuinely aren't per-object: a counter of all orders, a constant like `PI`, a pure function like `Math.max`, or a factory method that decides which object to create.

## What can be static

```java title="Invoice.java"
import static java.lang.Math.max;   // static import: use max(...) without Math.

public class Invoice {
    public static final double GST_RATE = 0.18;      // static constant
    private static int nextNumber;                    // static variable: shared counter
    private static final java.util.Map<String, String> STATE_CODES = new java.util.HashMap<>();

    static {                                           // static initialiser block: runs once
        STATE_CODES.put("27", "Maharashtra");
        STATE_CODES.put("29", "Karnataka");
        nextNumber = 1000;
    }

    private final int number;
    private final double amount;

    private Invoice(double amount) {
        this.number = ++nextNumber;
        this.amount = amount;
    }

    public static Invoice create(double amount) {     // static factory method
        return new Invoice(max(amount, 0));
    }

    public double total() {                            // instance method uses static constant
        return amount * (1 + GST_RATE);
    }

    static class Line {                                // static nested class: no outer instance needed
        String item; double price;
    }

    public static void main(String[] args) {
        Invoice a = Invoice.create(100), b = Invoice.create(250);
        System.out.println(a.number + " " + b.number + " " + b.total());  // 1001 1002 295.0
        System.out.println(STATE_CODES.get("27"));
    }
}
```

| Static member | Meaning |
|---|---|
| Static variable | One shared copy; e.g. counters, caches, constants. |
| Static method | Called on the class; no `this`; cannot directly access instance members. |
| Static block | Runs once during class initialisation; complex static setup. |
| Static nested class | A nested class without a hidden reference to an outer instance. |
| Static import | Import static members to use them unqualified. |

Top-level classes **cannot** be static; local variables cannot be static.

## Static methods are not overridden — they are hidden

```java
class A { static String who() { return "A"; } }
class B extends A { static String who() { return "B"; } }

A ref = new B();
System.out.println(ref.who());   // "A" — resolved by the DECLARED type at compile time
```

Static calls are bound at compile time (`invokestatic`), so there is no runtime polymorphism. Defining a same-signature static method in a subclass **hides** the parent's. Calling static methods through instance references compiles (with a warning) but is misleading — always call via the class name.

## Memory and lifetime

Static fields live as long as the class is loaded — in a typical application, for the whole run. Objects referenced from static fields are never garbage-collected while the class is loaded, which makes **unbounded static collections a classic memory leak**.

## Real-life example

:::analogy A company-wide notice board
Each employee has their own desk (instance fields). The company notice board (static field) exists once and everyone reads the same board. The company phone directory service (static method) can be used without being any particular employee.
:::

:::project Static in real applications
- `private static final Logger log = LoggerFactory.getLogger(OrderService.class);` — one logger per class.
- Utility classes (`StringUtils`, `DateUtils`) with private constructors and static methods.
- Constants classes / enums for status codes.
- **Avoid** static mutable state in Spring beans: it is shared across all requests and threads, is hard to test, and bypasses dependency injection.
:::

## Common mistakes

:::mistake
- Accessing instance fields from `main` (static) → *non-static variable cannot be referenced from a static context*. Create an object first.
- Using static fields to hold request/user data in a web app — concurrency bugs and data leaks between users.
- Unbounded static caches → memory leaks.
- Heavy work or I/O in static blocks: a failure throws `ExceptionInInitializerError`, and every later use of the class throws `NoClassDefFoundError`.
:::

## Interview questions

:::qa basic
? What is the static keyword?
It marks members that belong to the class rather than to instances: static variables are shared by all objects, static methods can be called without an object and have no `this`, static blocks run once at class initialisation, and static nested classes don't need an outer instance.
--- followup Can a static method access instance variables?
Not directly, since there's no current object. It can if it's given or creates an object reference.
:::

:::qa intermediate
? Can we override static methods?
No. A subclass static method with the same signature **hides** the parent method. Which one runs is decided at compile time by the reference's declared type, not the object's runtime type.
--- followup Can a static method be abstract?
No — abstract methods must be overridden, and static methods cannot be.
:::

:::qa tricky
? When exactly is a static block executed?
When the class is initialised: the first time it is actively used — instantiation, calling a static method, or accessing a non-constant static field (or via `Class.forName` with initialisation). Accessing a compile-time constant (`static final int X = 5`) does *not* trigger initialisation because the value is inlined by the compiler.
:::

:::quiz
? What does `ref.who()` print when `A ref = new B();` and both define `static String who()`?
+ The result of `A.who()`
- The result of `B.who()`
- Compile error
- Runtime exception
--- explain
Static methods are resolved using the declared type of the reference at compile time — method hiding, not overriding.
:::
</script>

<script type="text/x-java-topic">
@id: final-keyword
@module: oop
@title: The final Keyword
@level: 2
@time: 12
@prereq: static-keyword
@next: inheritance
@tags: final, final variable, final method, final class, blank final, effectively final, constant, immutable
===
## Introduction

`final` means **"cannot be changed after it is set"** — but what "changed" means depends on where it is applied.

| Applied to | Meaning | Example |
|---|---|---|
| Local variable / parameter | Can be assigned only once | `final int max = 10;` |
| Field | Must be assigned exactly once — at declaration, in an initialiser block, or in every constructor | `private final String id;` |
| Static field | A constant when also initialised with a constant expression | `static final int MAX = 3;` |
| Method | Cannot be overridden by subclasses | `public final void audit()` |
| Class | Cannot be extended | `public final class String` |

## Example

```java title="FinalDemo.java"
import java.util.ArrayList;
import java.util.List;

public class FinalDemo {
    private final String id;                    // blank final: assigned in the constructor
    private final List<String> tags = new ArrayList<>();
    static final int MAX_TAGS = 5;              // compile-time constant (inlined by javac)

    FinalDemo(String id) {
        this.id = id;                           // exactly once
    }

    void addTag(String t) {
        if (tags.size() >= MAX_TAGS) throw new IllegalStateException("too many tags");
        tags.add(t);                            // allowed: the LIST object is mutable
        // tags = new ArrayList<>();            // compile error: cannot reassign final field
    }

    public static void main(String[] args) {
        FinalDemo d = new FinalDemo("A1");
        d.addTag("new");
        final int local = 5;
        // local++;                             // compile error
        System.out.println(d.id + d.tags + local);
    }
}
```

## `final` does not mean immutable

A `final` reference cannot point to another object, but the object itself may be mutable. To make an object immutable, make the class `final`, its fields `private final`, and ensure mutable fields are never exposed or modified (defensive copies, `List.copyOf`). See [Immutable classes](#immutability).

## Effectively final (Java 8)

A local variable that is never reassigned after initialisation is **effectively final**, even without the keyword. Lambdas and anonymous/local classes may only capture local variables that are final or effectively final:

```java
int threshold = 100;                     // effectively final
list.removeIf(x -> x > threshold);       // OK
// threshold = 200;                       // would make the lambda above a compile error
```

Why? The lambda receives a **copy** of the value. If the variable could change later, the copy and the original would silently diverge.

## final and the Java Memory Model

`final` fields have a special **safe-publication** guarantee: once a constructor finishes (without leaking `this`), any thread that sees a reference to the object is guaranteed to see the correct values of its `final` fields, without synchronisation. This is why immutable objects are thread-safe.

## final vs finally vs finalize

| | `final` | `finally` | `finalize()` |
|---|---|---|---|
| Kind | Keyword (modifier) | Keyword (block) | Method of `Object` |
| Purpose | Prevent reassignment / overriding / inheritance | Code that always runs after try/catch | Cleanup hook before GC |
| Status | Core feature | Core feature | **Deprecated since Java 9, deprecated for removal in 18** — use try-with-resources or `Cleaner` |

## Interview questions

:::qa basic
? What is the use of the final keyword?
A final variable can be assigned only once, a final method cannot be overridden, and a final class cannot be subclassed. Final fields also get safe-publication guarantees under the Java Memory Model.
--- followup Why is String final?
To guarantee immutability: a subclass could otherwise add mutable state or override methods, breaking the security and pooling assumptions that rely on strings never changing.
:::

:::qa tricky
? Is `final` the same as immutable?
No. `final` prevents reassigning the variable. If the referenced object is mutable (a `List`, a `Date`), its contents can still change. Immutability is a property of the class design.
:::

:::qa tricky
? What is the difference between final, finally and finalize?
`final` is a modifier for variables, methods and classes. `finally` is a block that runs after `try`/`catch` whether or not an exception occurred. `finalize()` was an `Object` method called by the GC before reclaiming an object — unreliable, slow, deprecated since Java 9 and deprecated for removal since Java 18.
:::

:::quiz
? Where may a blank `final` instance field be assigned?
- Anywhere in the class
+ In its declaration, an instance initialiser block, or every constructor — exactly once
- Only in a static block
- In a setter method
--- explain
The compiler's definite-assignment rules require every constructor path to assign a blank final field exactly once.
:::
</script>
