@id: what-is-java
@module: intro
@title: What is Java?
@level: 1
@time: 12
@next: java-history, jdk-jre-jvm
@tags: introduction, language, platform, wora
===
## Introduction

Java is a **general-purpose, class-based, object-oriented, statically typed programming language** together with a **runtime platform** (the Java Virtual Machine) that executes compiled Java programs. That two-part nature is the single most important thing to understand on day one: when people say "Java" they may mean the *language* (the syntax you type), the *platform* (the JVM plus the standard library), or the whole *ecosystem* (tools, frameworks, build systems).

Why does it exist? In the early 1990s, software was compiled directly to machine code for one CPU and one operating system. Shipping to a new device meant recompiling — and often rewriting — the program. Java was designed so that you compile **once** into a neutral instruction format called *bytecode*, and any machine with a JVM can run it. This is the famous promise *"Write Once, Run Anywhere"* (WORA).

Where is it used today?

- **Enterprise back ends** — banking, insurance, e-commerce, ERP systems (Spring Boot, Jakarta EE).
- **Android** — the Android SDK is Java/Kotlin based (Android uses its own runtime, ART, rather than the standard JVM).
- **Big data** — Hadoop, Kafka, Spark, Elasticsearch, Cassandra are written in Java or run on the JVM.
- **Cloud and microservices**, desktop tools (IntelliJ IDEA itself), trading platforms, and embedded devices.

Why should you learn it? Java has a huge job market, a stable and backwards-compatible platform (code from 2004 still runs), excellent tooling, and it teaches you fundamentals — types, objects, memory, concurrency — that transfer to every other language.

## Technical explanation

Java has four defining technical characteristics:

| Characteristic | What it means in practice |
|---|---|
| Statically typed | Every variable has a type known at compile time. `int count = "hi";` is rejected by the compiler, not discovered in production. |
| Compiled to bytecode | `javac` translates `.java` source into `.class` files containing JVM bytecode, not native machine code. |
| Managed runtime | The JVM loads classes, verifies bytecode, allocates memory, runs the garbage collector and JIT-compiles hot code to native instructions. |
| Object-oriented (mostly) | Code is organised into classes; everything except the 8 primitive types is an object. |

Memory is **managed**: you create objects with `new`, but you never free them. The garbage collector reclaims objects that are no longer reachable. This removes whole categories of bugs common in C/C++ (dangling pointers, double free), at the cost of some runtime overhead.

:::flow
Source code :: HelloWorld.java — human-readable
javac compiler :: checks types and syntax, emits bytecode
Bytecode :: HelloWorld.class — platform-neutral instructions
* JVM :: loads, verifies, interprets and JIT-compiles
Native machine code :: runs on the actual CPU / OS
:::

## Real-life example

:::analogy A universal power adapter
Think of bytecode as a device that uses a single, standard plug. Each country (operating system) has different wall sockets. Instead of building a different device for every country, you carry one device and use a **country-specific adapter** — the JVM. Oracle, Eclipse Adoptium and others ship a JVM "adapter" for Windows, Linux, macOS and several CPU architectures; your `.class` file never changes.
:::

## Your first look at Java code

```java title="Greeting.java"
public class Greeting {
    public static void main(String[] args) {
        String name = "Mayur";
        int years = 3;
        System.out.println("Hello " + name + ", you have " + years + " years of Java experience.");
    }
}
```

Even this tiny program shows the core ideas: code lives inside a **class**, execution starts at `main`, variables have **types** (`String`, `int`), and output goes through the standard library (`System.out`). Each piece is dissected in [Hello World, line by line](#hello-world).

## Java in a real project

:::project Where Java shows up in a Spring Boot back end
A typical REST API request travels through classes you write (controllers, services, repositories), objects from the standard library (`List`, `Map`, `Optional`, `LocalDate`), and JVM features you rarely think about (threads from a pool serve each request, the GC cleans up per-request objects). Every module in this course maps to something you will touch in such a project.
:::

## Common mistakes and misconceptions

:::mistake
- **"Java and JavaScript are related."** They are not. JavaScript was named for marketing reasons in 1995; the languages have different type systems, runtimes and designs.
- **"Java is slow because it is interpreted."** Modern JVMs interpret only briefly, then JIT-compile frequently executed code to optimised native code. Long-running Java services often perform close to C++.
- **"Java is 100% object-oriented."** Primitive types (`int`, `double`…) are not objects, and `static` members belong to classes, not objects. See the interview trap below.
:::

## Interview questions

:::qa basic
? What is Java?
Java is a statically typed, object-oriented, general-purpose language whose programs are compiled to platform-neutral bytecode and executed by the Java Virtual Machine, which provides automatic memory management, security checks and JIT compilation.
--- detail
A good answer mentions both halves: the **language** and the **platform**. The language gives you classes, interfaces, generics, lambdas and strong static typing. The platform gives you the JVM (class loading, bytecode verification, garbage collection, JIT) plus a large standard library (collections, concurrency, I/O, networking, time). Because the compiler targets bytecode instead of a specific CPU, the same `.class` files run on any operating system that has a compatible JVM.
--- followup Is Java compiled or interpreted?
Both. Source is **compiled** by `javac` into bytecode ahead of time. At runtime the JVM initially **interprets** bytecode and then **JIT-compiles** hot methods into native machine code. So the accurate answer is "compiled to bytecode, then interpreted and JIT-compiled by the JVM".
:::

:::qa intermediate
? Why is Java called platform independent? Is the JVM platform independent too?
Java *programs* are platform independent because they compile to bytecode, which any conforming JVM can execute. The JVM itself is **platform dependent** — there is a different JVM build for each OS/CPU combination.
--- detail
Platform independence is achieved by adding a layer: the JVM translates the same bytecode into the instructions of whatever machine it runs on. That is why you download a Windows x64 JDK or a Linux aarch64 JDK — the JVM is native software. Note the nuance: a program that calls native libraries through JNI, hard-codes file paths like `C:\data`, or uses OS-specific commands loses portability even though its bytecode is portable.
--- followup What is WORA?
"Write Once, Run Anywhere" — Sun's 1995 slogan describing this model: compile once to bytecode, run the same artefact on any JVM.
:::

:::trap Is Java a pure object-oriented language?
Many candidates say "yes". The accurate answer is **no, not purely**: Java has 8 primitive types that are not objects, supports `static` methods and fields that exist without any object, and (since Java 8) lambdas. Wrapper classes and autoboxing let primitives *behave* like objects when needed. Languages such as Smalltalk are considered purely object-oriented. A strong answer: "Java is object-oriented but not purely so, mainly for performance reasons — primitives avoid object overhead for numbers and booleans."
:::

:::quiz
? Which component actually makes Java programs portable across operating systems?
- The `javac` compiler produces native code for every OS
+ The JVM, which is implemented separately for each platform and runs the same bytecode
- The Java language syntax
- The garbage collector
--- explain
`javac` produces the *same* bytecode everywhere. Portability comes from the JVM layer: each platform has its own JVM implementation that knows how to execute that bytecode.
:::

:::quiz
? Which statement about Java and JavaScript is correct?
- JavaScript is a lightweight version of Java
- Both run on the JVM
+ They are separate languages with different designs; the name similarity is historical marketing
- Java is compiled JavaScript
--- explain
Netscape named "JavaScript" in 1995 partly to ride Java's popularity. The languages are unrelated in implementation and design.
:::
</script>

<script type="text/x-java-topic">
@id: java-history
@module: intro
@title: History of Java & Release Cadence
@level: 1
@time: 10
@prereq: what-is-java
@next: java-features
@tags: gosling, oak, sun, oracle, lts, release, versions
===
## Introduction

Knowing Java's history is not trivia — it explains *why* the language looks the way it does (C-like syntax, strong backwards compatibility, the `javax` → `jakarta` rename) and it helps you answer "which Java version introduced X?" in interviews.

## Timeline

| Year | Version | Highlights |
|---|---|---|
| 1991 | Project "Green" / Oak | James Gosling's team at Sun Microsystems designs a language for consumer devices. |
| 1996 | JDK 1.0 | Public release. Applets, AWT. Slogan: Write Once, Run Anywhere. |
| 1997 | JDK 1.1 | Inner classes, JDBC, reflection, JavaBeans. |
| 1998 | J2SE 1.2 | Collections Framework, Swing, JIT compiler in the JVM. |
| 2004 | J2SE 5.0 | **Generics, enums, annotations, autoboxing, varargs, enhanced for**, `java.util.concurrent`. |
| 2006 | Java SE 6 | Performance, scripting API. OpenJDK open-sourced (GPL + Classpath Exception). |
| 2010 | — | Oracle acquires Sun. |
| 2011 | Java SE 7 | Try-with-resources, diamond `<>`, strings in switch, NIO.2 (`Path`, `Files`), fork/join. |
| 2014 | **Java SE 8 (LTS)** | **Lambdas, Stream API, `Optional`, `java.time`, default methods.** |
| 2017 | Java SE 9 | Module system (JPMS), JShell, `List.of()`. Six-month release cadence begins. |
| 2018 | Java 10 / **11 (LTS)** | `var` (10). HTTP Client, `String` helpers such as `isBlank()` (11). |
| 2019–20 | 12–15 | Switch expressions (standard in 14), text blocks (15), records & pattern matching previews. |
| 2021 | Java 16 / **17 (LTS)** | Records and `instanceof` pattern matching final (16); **sealed classes** final (17). |
| 2023 | **Java 21 (LTS)** | Virtual threads, record patterns, pattern matching for `switch`, sequenced collections. |
| 2025 | **Java 25 (LTS)** | Latest LTS at the time of writing of this course; builds on the 21 features. |

:::version Why this course uses Java 17 as the reference
Java 17 is the LTS release most enterprise teams standardised on, and Spring Boot 3 requires Java 17 as its minimum. Newer features (Java 21+) are covered in the Modern Java module and are always labelled with their version.
:::

## The release model

Since Java 9 (2017) a new feature release ships **every six months** (March and September). Every few releases one is designated **Long-Term Support (LTS)** by vendors: 8, 11, 17, 21, 25. Companies typically upgrade from LTS to LTS.

Features can go through stages before becoming permanent:

- **Preview** — complete but may change; must be enabled with `--enable-preview`. Not for production.
- **Incubator** — experimental APIs in `jdk.incubator.*` modules.
- **Final / standard** — part of the Java SE specification.

:::warn Preview is not standard
Interviewers sometimes check whether you know that, for example, records were *preview* in Java 14 and 15 and became standard in **16**; pattern matching for `switch` was preview in 17–20 and became standard in **21**. Saying "Java 17 has pattern matching in switch" without the word *preview* is inaccurate.
:::

## OpenJDK and distributions

**OpenJDK** is the open-source reference implementation. Oracle, Eclipse Adoptium (Temurin), Amazon (Corretto), Microsoft, Azul (Zulu), Red Hat and others build and support distributions from it. For almost all purposes they are interchangeable; they differ in licensing, support duration and packaging.

## Interview questions

:::qa basic
? Who created Java and when was it released?
Java was created by James Gosling and his team at Sun Microsystems; development started in 1991 (as "Oak") and JDK 1.0 was publicly released in 1996. Oracle acquired Sun in 2010 and now leads its development through the OpenJDK community.
:::

:::qa intermediate
? Which Java versions are LTS, and why do companies care?
Java 8, 11, 17, 21 and 25 are LTS releases. Companies care because LTS versions receive security and bug-fix updates for many years, whereas non-LTS releases are superseded after six months.
--- followup Which features came with Java 8 that made it such a big release?
Lambda expressions, functional interfaces, the Stream API, `Optional`, the new Date/Time API (`java.time`), default and static methods in interfaces, and method references. It changed how idiomatic Java is written.
:::

:::quiz
? In which version did records become a standard (non-preview) feature?
- Java 14
- Java 15
+ Java 16
- Java 17
--- explain
Records were previewed in 14 and 15 and finalised in Java 16 (JEP 395). They are therefore fully available in Java 17 LTS.
:::
</script>

<script type="text/x-java-topic">
@id: java-features
@module: intro
@title: Features of Java
@level: 1
@time: 12
@prereq: what-is-java
@next: java-editions
@tags: buzzwords, robust, secure, portable, multithreaded, simple
===
## Introduction

Sun described Java with a list of "buzzwords". Interviewers still ask about them, but a strong candidate explains **what mechanism** delivers each feature rather than reciting the list.

## Each feature and the mechanism behind it

| Feature | How Java actually achieves it |
|---|---|
| **Simple** | Familiar C-style syntax, but no pointer arithmetic, no manual `free`, no operator overloading, no multiple inheritance of classes. |
| **Object-oriented** | Classes, objects, inheritance, polymorphism, encapsulation and interfaces are built into the language. |
| **Platform independent / Portable** | Bytecode + JVM. Primitive sizes are fixed by the spec (`int` is always 32-bit), unlike C where `int` size varies. |
| **Robust** | Strong static typing, mandatory exception handling for checked exceptions, array bounds checks, no uninitialised local variables, garbage collection. |
| **Secure** | Bytecode verifier, no raw pointers, class-loader isolation, strong typing; historically the Security Manager (deprecated since Java 17). |
| **Multithreaded** | Threads, `synchronized`, `volatile` and a formal Java Memory Model are part of the language; `java.util.concurrent` adds pools, locks and atomics. |
| **High performance** | JIT compilation (HotSpot C1/C2), adaptive optimisation, efficient garbage collectors. |
| **Distributed** | Networking APIs (`java.net`, HTTP Client), RMI historically. |
| **Dynamic** | Classes are loaded lazily at runtime; reflection and dynamic proxies allow inspection and generation of behaviour at runtime. |
| **Architecture neutral** | The class file format does not depend on CPU architecture. |

:::key
"Portable" and "platform independent" are related but not identical: *platform independent* is about bytecode running on any JVM; *portable* also covers fixed data-type sizes and consistent semantics, so a program **behaves** the same everywhere.
:::

## Real-life example

:::analogy A car's safety features
"Robust" in Java is like modern car safety: seat-belt reminders (compiler errors for uninitialised variables), ABS (array bounds checks stop you from skidding into memory you don't own), and an automatic maintenance schedule (garbage collection). You can still crash, but many classic accidents are prevented by design.
:::

## Code: robustness in action

```java title="RobustDemo.java"
public class RobustDemo {
    public static void main(String[] args) {
        int[] scores = {90, 85, 70};
        try {
            System.out.println(scores[3]);           // index 3 does not exist
        } catch (ArrayIndexOutOfBoundsException e) {
            System.out.println("Caught safely: " + e.getMessage());
        }
        // int total;  System.out.println(total);    // compile error: variable might not have been initialized
    }
}
```

In C, reading `scores[3]` silently reads whatever memory follows the array. In Java, the JVM checks the index on every array access and throws `ArrayIndexOutOfBoundsException`, so the bug surfaces immediately instead of corrupting data.

## Interview questions

:::qa basic
? What are the main features of Java?
Simple, object-oriented, platform independent, portable, robust, secure, multithreaded, high performance (via JIT), distributed and dynamic.
--- detail
To stand out, attach a mechanism to each: platform independence via bytecode and the JVM; robustness via static typing, exception handling and GC; security via the bytecode verifier and absence of pointer arithmetic; performance via JIT compilation; dynamism via runtime class loading and reflection.
--- followup Why doesn't Java support pointers?
Java has *references*, which are pointers you cannot do arithmetic on or forge. Removing pointer arithmetic prevents reading or writing arbitrary memory — improving security and robustness — and lets the garbage collector move objects in memory safely.
:::

:::qa tricky
? Java is "secure" — does that mean Java applications cannot have security vulnerabilities?
No. Java's platform prevents memory-corruption classes of bugs (buffer overflows, use-after-free), but applications can still suffer SQL injection, insecure deserialization, XXE, broken authentication or vulnerable dependencies (Log4Shell in 2021 is the famous example).
:::

:::quiz
? Which feature prevents a Java program from reading memory outside an array?
- The garbage collector
+ Runtime array bounds checking by the JVM
- The `final` keyword
- The JIT compiler
--- explain
Every array access is bounds-checked; an invalid index throws `ArrayIndexOutOfBoundsException`. (The JIT can remove checks it *proves* unnecessary, without changing behaviour.)
:::
</script>

<script type="text/x-java-topic">
@id: java-editions
@module: intro
@title: Java Editions (SE, EE / Jakarta EE, ME)
@level: 1
@time: 6
@prereq: what-is-java
@next: jdk-jre-jvm
@tags: se, ee, jakarta, me, javafx, editions
===
## Introduction

"Java" is delivered in several **editions**, each a specification of APIs for a different kind of software. Knowing them clarifies statements like "Spring Boot 3 moved to Jakarta EE 9+".

| Edition | Purpose | Examples of APIs |
|---|---|---|
| **Java SE** (Standard Edition) | The core platform: language, JVM, standard library. Everything in this course. | `java.lang`, `java.util`, `java.io`, `java.nio`, `java.time`, `java.util.concurrent`, JDBC |
| **Jakarta EE** (formerly Java EE / J2EE) | Specifications for enterprise server applications, built on top of SE. | Servlets, JPA, Bean Validation, JAX-RS, CDI, JMS |
| **Java ME** (Micro Edition) | Resource-constrained devices (older feature phones, embedded). | CLDC, MIDP |
| **JavaFX** | Rich-client UI toolkit, now a separate open-source project (OpenJFX). | Scenes, controls, CSS styling |

:::version javax → jakarta
In 2017 Oracle handed Java EE to the Eclipse Foundation, where it became **Jakarta EE**. Because Oracle kept the "java" trademark, Jakarta EE 9 (2020) renamed packages from `javax.*` to `jakarta.*`. That is why Spring Boot 3 code imports `jakarta.persistence.Entity` instead of `javax.persistence.Entity`. Note that `javax.sql`, `javax.crypto` and similar packages that belong to **Java SE** were *not* renamed.
:::

:::project
When you write `@Entity`, `@Valid` or `HttpServletRequest` in a Spring Boot app, you are using Jakarta EE specifications. When you write `List`, `Optional`, `ExecutorService` or `LocalDate`, you are using Java SE.
:::

:::qa intermediate
? What is the difference between Java SE and Jakarta EE?
Java SE is the core platform (language, JVM, standard library). Jakarta EE is a set of enterprise specifications — servlets, persistence, dependency injection, REST — implemented by servers and frameworks and running on top of Java SE.
--- followup Is Spring part of Jakarta EE?
No. Spring is an independent framework, but it *implements or integrates with* many Jakarta EE specifications (Servlet API via embedded Tomcat, JPA via Hibernate, Bean Validation via Hibernate Validator).
:::

:::quiz
? Why did many imports change from `javax.persistence` to `jakarta.persistence`?
- Java 17 removed JPA
+ Java EE moved to the Eclipse Foundation as Jakarta EE, and the namespace was renamed for trademark reasons
- `javax` packages are deprecated in Java SE
- Spring Boot renamed them
--- explain
The rename happened in Jakarta EE 9. Only the enterprise (EE) packages moved; Java SE `javax.*` packages such as `javax.crypto` are unchanged.
:::
</script>

<script type="text/x-java-topic">
@id: jdk-jre-jvm
@module: intro
@title: JDK vs JRE vs JVM
@level: 2
@time: 15
@prereq: what-is-java
@next: compilation-execution
@tags: jdk, jre, jvm, javac, hotspot, runtime, tools
===
## Introduction

These three acronyms are the most-asked Java fundamentals question. They are **nested layers**: the JDK contains a runtime, and the runtime contains the JVM. Understanding the boundary tells you what you need to *develop* versus what you need to *run* a program.

:::diagram JDK ⊃ JRE ⊃ JVM
[a] JDK — Java Development Kit :: javac, jar, javadoc, jshell, jdb, jcmd, jlink, jpackage, jconsole … + everything below
[g] JRE — Java Runtime Environment :: standard class libraries (java.base, java.sql …) + launcher (java) + everything below
[v] JVM — Java Virtual Machine :: class loader · bytecode verifier · runtime data areas · interpreter · JIT compiler · garbage collector
:::

## Technical explanation

### JVM — Java Virtual Machine
The JVM is an **abstract computing machine defined by a specification** (the JVM Specification) plus a concrete implementation (HotSpot is the most common). It:

1. **Loads** `.class` files via class loaders.
2. **Verifies** bytecode so malformed or malicious code cannot violate type safety.
3. **Executes** bytecode with an interpreter and a **JIT** compiler.
4. **Manages memory**: heap allocation, stacks per thread, and garbage collection.

The JVM does not know Java *source code* — only bytecode. That is why Kotlin, Scala, Groovy and Clojure also run on it.

### JRE — Java Runtime Environment
The JRE = **JVM + the standard class libraries + the `java` launcher**. It is everything needed to *run* an already-compiled program, but not to compile one.

### JDK — Java Development Kit
The JDK = **JRE + development tools**: `javac` (compiler), `jar`, `javadoc`, `jdb` (debugger), `jshell` (REPL), `jcmd`, `jstack`, `jmap` (diagnostics), `jlink` (custom runtime images) and more.

:::version What changed after Java 11
Since **Java 11**, Oracle and most vendors no longer ship a separate JRE download. You install a JDK, and for deployment you can build a trimmed runtime containing only the modules your application needs using `jlink`. Some vendors (e.g. Adoptium) still publish JRE packages for convenience, but conceptually the JRE is now "a runtime image".
:::

## Comparison table

| Aspect | JVM | JRE | JDK |
|---|---|---|---|
| What it is | Execution engine (spec + implementation) | Runtime = JVM + libraries | Development kit = JRE + tools |
| Needed to | Execute bytecode | Run Java applications | Write, compile, debug, package |
| Contains `javac`? | No | No | **Yes** |
| Platform dependent? | Yes | Yes | Yes |
| Example contents | Interpreter, JIT, GC, class loader | `java.base`, `java.sql`, `java` launcher | `javac`, `jar`, `jshell`, `jdb`, `jlink` |

## Real-life example

:::analogy A restaurant
- The **JVM** is the *kitchen equipment and chef* — it actually cooks (executes) the dish.
- The **JRE** is the *restaurant that can serve food*: kitchen plus pantry of standard ingredients (class libraries).
- The **JDK** is the *restaurant plus a recipe-development lab*: tools to create new recipes (compile), test them (debug) and package them.

A customer (end user) only needs a place that serves food — a runtime. A chef inventing new dishes (a developer) needs the lab — the JDK.
:::

## Seeing it on your machine

```bash
java -version        # runtime: which JVM will execute programs
javac -version       # compiler: only present if a JDK is installed
jshell               # interactive REPL shipped with the JDK (Java 9+)
```

```output
openjdk version "17.0.12" 2024-07-16
OpenJDK Runtime Environment Temurin-17.0.12+7 (build 17.0.12+7)
OpenJDK 64-Bit Server VM Temurin-17.0.12+7 (build 17.0.12+7, mixed mode, sharing)
```

The last line is informative: **64-Bit Server VM** is HotSpot; **mixed mode** means interpreter + JIT; **sharing** means Class Data Sharing (CDS) is on, which speeds start-up by memory-mapping pre-parsed core classes.

## Common mistakes

:::mistake
- Saying "the JVM is platform independent". The *bytecode* is; the JVM is a native program built per OS/CPU.
- Installing only a runtime on a CI build agent and then wondering why `javac` or Maven compilation fails.
- Confusing `JAVA_HOME` pointing at a JRE directory (old setups) — build tools need it to point at a **JDK**.
:::

## Interview questions

:::qa basic
? What is the difference between JDK, JRE and JVM?
The JVM executes bytecode. The JRE is the JVM plus the standard libraries needed to run programs. The JDK is the JRE plus development tools such as `javac`, `jar` and `jdb`, needed to write and compile programs.
--- detail
They are nested: JDK ⊃ JRE ⊃ JVM. End users historically installed a JRE; developers install a JDK. Since Java 11 separate JRE downloads are uncommon — you install a JDK and can create a minimal runtime with `jlink`. All three are platform specific, while the bytecode they operate on is platform neutral.
--- followup Can you run a Java program with only the JVM?
Not practically. The JVM alone cannot do anything useful without the core class library — even `String` and `System` live in `java.base`. You need a runtime image (JVM + at least `java.base`).
--- followup Is the JVM a compiler or an interpreter?
Both. It contains an interpreter for bytecode and one or more JIT compilers (HotSpot's C1 and C2) that compile hot methods to native code at runtime.
:::

:::qa intermediate
? What is HotSpot?
HotSpot is the JVM implementation shipped with OpenJDK and Oracle JDK. Its name comes from its strategy: profile the running program, detect "hot spots" (frequently executed methods and loops), and JIT-compile those to optimised native code while interpreting the rest.
--- followup Name another JVM implementation.
Eclipse OpenJ9 (from IBM), GraalVM (which also offers native-image ahead-of-time compilation), and Azul's Zing/Prime. Android uses ART, which runs DEX bytecode rather than JVM class files.
:::

:::trap Does installing the JDK also give me a JRE?
Yes — every JDK contains a complete runtime. Candidates sometimes claim you must install both. You only need the JDK on a development machine.
:::

:::quiz
? Which tool is part of the JDK but NOT the runtime?
- The garbage collector
- The class loader
+ `javac`
- `java.lang.String`
--- explain
`javac` compiles source code, which only developers need. The GC and class loader are part of the JVM; `String` is part of the class library.
:::

:::quiz
? Which is true?
- JDK ⊂ JRE ⊂ JVM
+ JVM ⊂ JRE ⊂ JDK
- JRE and JDK are unrelated
- The JVM contains the JDK
--- explain
The JVM is the innermost layer; the JRE wraps it with libraries; the JDK wraps the JRE with development tools.
:::
</script>

<script type="text/x-java-topic">
@id: compilation-execution
@module: intro
@title: Compilation & How a Java Program Executes
@level: 2
@time: 18
@java: 17
@prereq: jdk-jre-jvm
@next: setup-jdk, jvm-architecture
@tags: bytecode, javac, class file, class loader, jit, interpreter, wora, platform independence, javap
===
## Introduction

What really happens between typing `javac HelloWorld.java` and seeing output? Understanding this pipeline explains error messages, why `ClassNotFoundException` happens, why the first request to a server is slower than the next thousand, and how Java achieves platform independence.

## The pipeline end to end

:::flow
HelloWorld.java :: source code you write
javac :: lexing → parsing → type checking → bytecode generation
HelloWorld.class :: magic number CAFEBABE, constant pool, methods as bytecode
java HelloWorld :: launcher starts a JVM process
Class loading :: Bootstrap → Platform → Application class loaders
Linking :: verify → prepare (static defaults) → resolve symbolic references
Initialization :: static initialisers and static field assignments run
* Execution engine :: interpreter first, JIT compiles hot methods
Native instructions :: executed by the CPU; GC runs alongside
:::

## Step 1 — Compile time (`javac`)

`javac` reads your source, checks syntax and **types**, resolves symbols against the classes on the classpath, and generates one `.class` file **per class** (including nested and anonymous classes, e.g. `Outer$Inner.class`, `Outer$1.class`).

A class file contains:

- **Magic number** `0xCAFEBABE` and a **version number** (Java 17 = major version 61). A JVM refuses a class compiled for a newer version: `UnsupportedClassVersionError`.
- **Constant pool** — literals and symbolic references (class names, method signatures).
- **Fields and methods**, where method bodies are **bytecode**: compact stack-machine instructions such as `iload`, `iadd`, `invokevirtual`.

You can inspect bytecode with `javap`:

```java title="Add.java"
public class Add {
    static int add(int a, int b) {
        return a + b;
    }
    public static void main(String[] args) {
        System.out.println(add(2, 3));
    }
}
```

```bash
javac Add.java
javap -c Add
```

```output
static int add(int, int);
  Code:
     0: iload_0      // push local variable 0 (a) onto the operand stack
     1: iload_1      // push local variable 1 (b)
     2: iadd         // pop two ints, push their sum
     3: ireturn      // return the int on top of the stack
```

The JVM is a **stack machine**: instructions push and pop values on an *operand stack* inside the current stack frame rather than using CPU registers. That abstraction is what makes bytecode CPU-independent.

## Step 2 — Launch and class loading

`java Add` starts a JVM process, which:

1. Creates the runtime data areas (heap, metaspace, the main thread's stack).
2. Asks the **application class loader** to load `Add`. Loaders use **parent delegation**: the request goes up to the Platform loader and the Bootstrap loader first; only if the parents cannot find the class does the child load it. This guarantees `java.lang.String` always comes from the JDK, never from a rogue JAR.
3. **Links** the class: *verification* (bytecode is type-safe, stack usage is valid), *preparation* (static fields get default values), *resolution* (symbolic references become direct references, often lazily).
4. **Initialises** the class: runs `static {}` blocks and static field initialisers, exactly once, thread-safely.
5. Finds `public static void main(String[])` and invokes it on the main thread.

Classes are loaded **lazily** — `System.out` and other classes are loaded the first time they are actually needed.

## Step 3 — Execution: interpreter + JIT

HotSpot begins by **interpreting** bytecode, one instruction at a time, while collecting profiling data (how often a method runs, which branch is taken, which concrete types appear at a call site). When a method crosses an invocation or loop threshold:

- **C1 (client compiler)** quickly compiles it with light optimisation.
- If it stays hot, **C2 (server compiler)** recompiles it with aggressive optimisations: inlining, escape analysis, loop unrolling, dead-code elimination.

This is called **tiered compilation**. Compiled native code is stored in the **code cache**. If an optimistic assumption later breaks (e.g., a second implementation of an interface is loaded), the JVM **deoptimises** back to the interpreter.

:::info Why "warm-up" matters
The first requests to a freshly started service run largely interpreted and are slower. After warm-up, hot paths are native code. That is why load tests discard the first minutes, and why projects like CDS, AppCDS, CRaC and GraalVM native-image exist to reduce start-up time.
:::

## Platform independence, precisely

| Layer | Platform independent? |
|---|---|
| `.java` source | Yes |
| `.class` bytecode | **Yes** — identical on every OS |
| JVM | No — native executable per OS/CPU |
| JIT output | No — machine code for the current CPU |

## Real-life example

:::analogy An international conference with interpreters
A speaker writes a speech once in English (bytecode). At each venue, a local interpreter (JVM) translates it for the audience. At first they translate sentence by sentence (interpreting). For the phrases that come up again and again, they prepare polished, pre-translated versions (JIT-compiled code) and simply read those out — much faster.
:::

## Common mistakes

:::mistake
- Running `java Add.class` — the launcher expects a **class name**, not a file name: `java Add`.
- Compiling with a newer JDK and running on an older JVM → `UnsupportedClassVersionError`. Use `javac --release 17` to target 17 explicitly.
- Assuming `static` blocks run at compile time. They run at class **initialisation** in the JVM.
:::

:::version Single-file source launch (Java 11+)
Since Java 11 you can run a single source file directly: `java Add.java`. The launcher compiles it in memory and runs it — handy for scripts and learning, but no `.class` file is written.
:::

## Interview questions

:::qa basic
? What is bytecode?
Bytecode is the platform-neutral instruction set of the JVM, stored in `.class` files produced by `javac`. The JVM interprets it or JIT-compiles it into native machine code.
--- followup Why is it called "byte" code?
Each opcode is one byte long, so there are at most 256 opcodes (about 200 are defined).
:::

:::qa intermediate
? Walk me through what happens when you run `java HelloWorld`.
The launcher starts a JVM, which creates its memory areas, loads `HelloWorld` through the class-loader hierarchy using parent delegation, links it (verify, prepare, resolve), initialises it (static blocks), locates `public static void main(String[])` and invokes it on the main thread. Bytecode is interpreted first and hot code is JIT-compiled. When `main` returns and no non-daemon threads remain, the JVM exits.
--- followup What happens if main is not found?
The launcher prints: *Error: Main method not found in class HelloWorld, please define the main method as: public static void main(String[] args)*. It is a launcher error, not a compile error — the class compiles fine without `main`.
:::

:::qa advanced
? What is JIT compilation and why doesn't Java compile everything to native code up front?
JIT (Just-In-Time) compilation turns frequently executed bytecode into optimised native code at runtime. Doing it at runtime lets the JVM use real profiling data — actual types at call sites, branch frequencies — to make optimisations an ahead-of-time compiler cannot safely make, such as speculative inlining of virtual calls, with deoptimisation as a safety net.
--- detail
HotSpot uses tiered compilation: interpreter → C1 (fast compile, profiling) → C2 (slow compile, heavy optimisation). Compiled code lives in the code cache. Trade-off: start-up and warm-up time. Ahead-of-time approaches (GraalVM native-image) give instant start-up and lower memory at the cost of peak throughput and dynamic features like unrestricted reflection.
--- followup What is deoptimisation?
When a speculative assumption becomes invalid — for example the JIT inlined the only known implementation of an interface and a new implementation gets loaded — the JVM discards the compiled code and falls back to the interpreter for that method, recompiling later with updated profiles.
:::

:::qa tricky
? Can a `.class` file compiled on Windows run on Linux? Can one compiled with JDK 21 run on JDK 17?
Yes to the first — bytecode is OS-independent. The second depends on the target: by default JDK 21 emits class version 65, which a Java 17 JVM rejects with `UnsupportedClassVersionError`. Compiling with `--release 17` makes it run on 17.
:::

:::quiz
? What does `javac` produce from `Outer.java` containing a class `Outer` with a nested class `Inner`?
- One file, `Outer.class`
+ Two files, `Outer.class` and `Outer$Inner.class`
- `Outer.exe`
- `Outer.jar`
--- explain
Each class, including nested, local and anonymous classes, compiles to its own class file.
:::

:::quiz
? When does a class's `static {}` block run?
- When `javac` compiles it
- Every time an object is created
+ Once, when the JVM initialises the class (first active use)
- When the program exits
--- explain
Class initialisation happens lazily on first active use — creating an instance, calling a static method, or reading a non-constant static field.
:::

:::exercise beginner
? Inspect your own bytecode
Write a class with a method `int square(int x)` returning `x * x`. Compile it and view its bytecode.
--- expected
You should see instructions such as `iload_0`, `imul`, `ireturn`.
--- hints
- Use `javap -c ClassName` after compiling.
- For a static method, parameter `x` is local variable slot 0.
--- solution
```java title="Square.java"
public class Square {
    static int square(int x) {
        return x * x;
    }
    public static void main(String[] args) {
        System.out.println(square(7));
    }
}
```
```bash
javac Square.java && javap -c Square
```
--- explanation
`iload_0` pushes `x`, a second `iload_0` pushes it again, `imul` multiplies the top two values, and `ireturn` returns the result. For an instance method, slot 0 would hold `this` and `x` would be slot 1.
:::
</script>

<!-- ================= MODULE: Environment Setup ================= -->
<script type="text/x-java-topic">
@id: setup-jdk
@module: setup
@title: Installing the JDK, JAVA_HOME & PATH
@level: 1
@time: 15
@prereq: jdk-jre-jvm
@next: javac-java-commands
@tags: install, java_home, path, environment variable, sdkman, temurin, jdk 17
===
## Introduction

Before writing Java you need a **JDK** installed and your shell configured so that tools can find it. Two environment variables matter:

- **`PATH`** — the list of directories your shell searches when you type a command such as `java` or `javac`.
- **`JAVA_HOME`** — the root directory of the JDK. Build tools (Maven, Gradle), IDEs and servers (Tomcat) read it to find the JDK rather than relying on `PATH`.

Why both? `PATH` is for *you* typing commands; `JAVA_HOME` is a convention for *other programs* that need to know "which JDK should I use?".

## Step 1 — Choose and install a distribution

Any OpenJDK build works. Common choices: **Eclipse Temurin** (Adoptium), Amazon Corretto, Microsoft Build of OpenJDK, Oracle JDK. For this course install **JDK 17** (or 21 — everything here runs on both).

| OS | Typical installation |
|---|---|
| Windows | Run the `.msi` installer; tick "Set JAVA_HOME" and "Add to PATH" if offered. |
| macOS | `brew install --cask temurin@17`, or the `.pkg` installer. |
| Linux (Debian/Ubuntu) | `sudo apt install openjdk-17-jdk` |
| Any (multiple versions) | [SDKMAN!](https://sdkman.io): `sdk install java 17.0.12-tem` |

## Step 2 — Set JAVA_HOME and PATH

### Windows (Command Prompt / System settings)

```cmd
:: Permanently set JAVA_HOME for the current user (open a NEW terminal afterwards)
setx JAVA_HOME "C:\Program Files\Eclipse Adoptium\jdk-17.0.12.7-hotspot"

:: Then in System Properties → Environment Variables → Path → add:
::   %JAVA_HOME%\bin
```

:::warn setx and PATH
Avoid `setx PATH "%PATH%;..."` — it truncates PATH values over 1024 characters and merges system and user paths. Edit `Path` through the *Environment Variables* dialog instead.
:::

### macOS / Linux (bash or zsh)

```bash
# ~/.zshrc or ~/.bashrc
export JAVA_HOME=$(/usr/libexec/java_home -v 17)      # macOS helper
# export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 # typical Linux path
export PATH="$JAVA_HOME/bin:$PATH"
```

Putting `$JAVA_HOME/bin` **first** in `PATH` ensures this JDK wins if several are installed.

## Step 3 — Verify

```bash
java -version
javac -version
echo $JAVA_HOME        # Windows: echo %JAVA_HOME%
```

Both `java` and `javac` should report the same major version. If `javac` is "not recognised", `PATH` does not contain the JDK's `bin` folder (or you installed only a runtime).

## Real-life example

:::analogy
`PATH` is like the speed-dial list on your phone: when you say "call java", the phone searches the list in order and dials the first match. `JAVA_HOME` is like writing "Office: +91…" on a shared noticeboard — other people (Maven, IntelliJ, Tomcat) read it to know where to reach the JDK.
:::

:::project
On CI servers (GitHub Actions, Jenkins) you typically use a setup step such as `actions/setup-java` that downloads a JDK and sets `JAVA_HOME` and `PATH`. Docker images like `eclipse-temurin:17-jre` do the same inside the image.
:::

## Common mistakes

:::mistake
- `JAVA_HOME` pointing at `...\bin` instead of the JDK root. It must be the folder that *contains* `bin`.
- Forgetting to open a **new** terminal after changing environment variables.
- Two JDKs on `PATH` — `java -version` shows 21 while Maven uses 11 via `JAVA_HOME`, causing "invalid target release" errors.
- Quotes around paths with spaces missing on Windows.
:::

## Interview questions

:::qa basic
? What is the difference between PATH and JAVA_HOME?
`PATH` is an OS-level list of directories searched for executables, so you can type `java` anywhere. `JAVA_HOME` is a convention variable pointing to the JDK installation root, used by tools such as Maven, Gradle and application servers to locate the JDK.
--- followup What happens if JAVA_HOME points to a different version than the java on PATH?
The command line and your build tool use different JDKs. Typical symptoms: "invalid target release: 17" from Maven, or classes compiled for a newer version failing with `UnsupportedClassVersionError` when run.
:::

:::quiz
? JAVA_HOME should point to which directory?
- `C:\Program Files\Java\jdk-17\bin`
+ `C:\Program Files\Java\jdk-17`
- `C:\Program Files\Java`
- The folder that contains your project
--- explain
Tools append `\bin\java` themselves, so `JAVA_HOME` must be the JDK root directory.
:::
</script>

<script type="text/x-java-topic">
@id: javac-java-commands
@module: setup
@title: The javac and java Commands, Classpath & JAR
@level: 2
@time: 15
@prereq: setup-jdk
@next: hello-world
@tags: javac, java, classpath, cp, jar, -d, manifest, jshell
===
## Introduction

IDEs hide the build process, but interviewers — and production incidents — expect you to know what happens underneath. Two commands do the core work: **`javac`** compiles, **`java`** runs. The **classpath** tells both where to find classes.

## javac — the compiler

```bash
javac HelloWorld.java                  # produces HelloWorld.class in the same folder
javac -d out src/com/shop/Main.java    # -d: output folder; package folders are created under out/
javac --release 17 -d out $(find src -name "*.java")   # compile a whole tree targeting Java 17
```

| Option | Meaning |
|---|---|
| `-d dir` | Where to write `.class` files (package directories are created automatically). |
| `-cp` / `-classpath` | Where to look for classes your code depends on (folders and JARs). |
| `--release N` | Compile against the Java N API and emit class files for N. Safer than `-source`/`-target`. |
| `-Xlint:all` | Show all warnings (unchecked generics, deprecation…). |

## java — the launcher

```bash
java HelloWorld                       # run class HelloWorld (NOT HelloWorld.class)
java -cp out com.shop.Main            # fully qualified name when the class is in a package
java -cp "out:lib/*" com.shop.Main    # Linux/macOS: ':' separator, lib/* = all JARs in lib
java -cp "out;lib/*" com.shop.Main    # Windows uses ';'
java -jar app.jar                     # run an executable JAR (Main-Class in its manifest)
java HelloWorld.java                  # Java 11+: compile in memory and run a single source file
```

## The classpath

The **classpath** is a list of locations (directories and JAR files) where the application class loader looks for `.class` files. For a class `com.shop.Main`, the loader looks for `com/shop/Main.class` *relative to each classpath entry*.

:::mistake Classic error
```output
Error: Could not find or load main class Main
Caused by: java.lang.ClassNotFoundException: Main
```
Usual causes: running `java Main` when the class is declared in `package com.shop` (use `java com.shop.Main`), running from the wrong directory, or a missing `-cp`. If the default classpath is not set, it is the current directory `.`.
:::

## Packaging a JAR

A **JAR** (Java ARchive) is a ZIP file of classes and resources plus `META-INF/MANIFEST.MF`.

```bash
jar --create --file app.jar --main-class com.shop.Main -C out .
java -jar app.jar
```

:::project Spring Boot "fat JARs"
`mvn package` in a Spring Boot project produces an executable JAR containing your classes **and** all dependency JARs, plus a special launcher (`JarLauncher`) that knows how to load nested JARs. `java -jar target/app.jar` is how most Java microservices are started in Docker containers.
:::

## jshell — the REPL (Java 9+)

```bash
jshell
jshell> int x = 10 * 4
x ==> 40
jshell> "java".toUpperCase()
$2 ==> "JAVA"
```

Great for quickly testing a String method, an operator or a stream pipeline without a class and `main`.

## Interview questions

:::qa basic
? What is the classpath?
The classpath is the list of directories and JAR files the JVM's application class loader searches to find classes. It is set with `-cp`/`-classpath` or the `CLASSPATH` environment variable; by default it is the current directory.
--- followup ClassNotFoundException vs NoClassDefFoundError?
`ClassNotFoundException` is a checked exception thrown when code explicitly loads a class by name (`Class.forName`, `loadClass`) and it is not found. `NoClassDefFoundError` is an `Error` thrown when a class that *was present at compile time* cannot be found or initialised at runtime — e.g. a missing dependency JAR, or a static initialiser that previously failed.
:::

:::qa intermediate
? What is the difference between `--release 17` and `-source 17 -target 17`?
`-source/-target` only control language level and class-file version but still compile against the **current JDK's** API, so you can accidentally call a method that does not exist in Java 17. `--release 17` also uses the Java 17 API signatures, guaranteeing the output really runs on 17.
:::

:::quiz
? A class is declared `package com.shop;` and compiled into `out/com/shop/Main.class`. Which command runs it?
- `java out/com/shop/Main.class`
- `java -cp out Main`
+ `java -cp out com.shop.Main`
- `java com/shop/Main`
--- explain
The launcher takes the fully qualified class name; the classpath entry `out` is the root under which `com/shop/Main.class` is found.
:::
</script>

<!-- ================= MODULE: First Java Program ================= -->
<script type="text/x-java-topic">
@id: hello-world
@module: first
@title: Hello World, Line by Line
@level: 1
@time: 25
@prereq: javac-java-commands
@next: main-method, variables
@tags: hello world, public, class, static, void, main, string[], args, system.out.println, first program
===
## Introduction

"Hello World" is five lines long, but almost every word in it is a Java concept: access control, classes, the difference between class and instance, return types, arrays, the entry point, standard streams. Understanding it deeply gives you a mental map of the whole language.

```java title="HelloWorld.java"
public class HelloWorld {

    public static void main(String[] args) {

        System.out.println("Hello World");

    }
}
```

```bash
javac HelloWorld.java     # creates HelloWorld.class
java HelloWorld           # prints: Hello World
```

## Code breakdown at a glance

| Part | Meaning |
|---|---|
| `public` | Access modifier — visible to code in any package, including the JVM launcher. |
| `class` | Keyword that declares a new type (a blueprint). |
| `HelloWorld` | The class name; must match the file name `HelloWorld.java` because the class is `public`. |
| `{ … }` | The class body: fields, methods, constructors, nested types. |
| `public` (on main) | The launcher must be able to call `main` from outside the class. |
| `static` | `main` belongs to the class itself, so it can run without creating an object. |
| `void` | `main` returns nothing to its caller. |
| `main` | The name the launcher searches for — the program's entry point. |
| `String[]` | Parameter type: an array of `String` objects. |
| `args` | Parameter name holding command-line arguments. |
| `System.out.println(...)` | Calls `println` on the `PrintStream` stored in the static field `System.out`. |
| `;` | Terminates a statement. |

## public

**What it means:** `public` is an **access modifier**. A public class or member can be accessed from code in *any* package.

**Why here:** the `java` launcher is code outside your class, in a different package. For the launcher to find and invoke `main`, both the class and the method need to be accessible. (Technically the launcher can load a non-public top-level class, but `main` must be `public`.)

**What if it isn't public?**

```java
class HelloWorld {                              // package-private class: still runs
    static void main(String[] args) { }         // NOT public
}
```

```output
Error: Main method not found in class HelloWorld, please define the main method as:
   public static void main(String[] args)
```

**Where else is it used?** On classes, interfaces, constructors, methods and fields. The four access levels are `public`, `protected`, *package-private* (no keyword) and `private` — see [Packages & access modifiers](#packages-access).

## class

**What it is:** a class is a **blueprint** that defines the state (fields) and behaviour (methods) of objects. Every piece of executable Java code lives inside a class (or interface, enum, record).

**Why we need it:** Java is object-oriented; the class is its unit of organisation, encapsulation and compilation.

**What the JVM does with it:** `javac` compiles each class to a `.class` file. At runtime the class loader reads that file, creates a runtime representation of the class in **Metaspace** (method bytecode, constant pool, field layout) and a `java.lang.Class` object on the heap that represents it (`HelloWorld.class`).

## HelloWorld — the class name

- **Naming convention:** *PascalCase* (UpperCamelCase) — `HelloWorld`, `OrderService`, `HttpClient`.
- **File-name rule:** a file can contain **at most one public top-level class**, and that class must be named exactly like the file: `public class HelloWorld` → `HelloWorld.java`. Violation → compile error *class HelloWorld is public, should be declared in a file named HelloWorld.java*.
- A file may contain additional **non-public** top-level classes; each still compiles to its own `.class` file.
- Identifiers are case-sensitive: `helloworld` and `HelloWorld` are different names (and on Windows, whose filesystem is case-insensitive, that difference causes confusing errors).

## static

**What it means:** a `static` member belongs to the **class**, not to any particular object. There is exactly one copy, created when the class is initialised.

**Why is main static?** When the program starts, **no objects exist yet**. The launcher only has the class. If `main` were an instance method, the JVM would first have to construct a `HelloWorld` object — but which constructor? With what arguments? Making `main` static removes the question: the JVM calls `HelloWorld.main(args)` directly.

**How the JVM invokes a static method:** the launcher uses JNI to look up the method by name and descriptor `([Ljava/lang/String;)V` and calls it; in bytecode, static calls use the `invokestatic` instruction, which needs no `this` reference (instance calls use `invokevirtual`/`invokeinterface` and require an object).

**What if main isn't static?** In Java 17 the launcher reports *Main method is not static in class HelloWorld*.

:::version Java 21+ preview / Java 25: instance main methods
JEP 445 (preview in Java 21) and its successors let you write `void main() { … }` without `public`, `static` or `String[]`, and even omit the class declaration for small programs. This is finalised in **Java 25** as "compact source files and instance main methods". In **Java 17**, the classic signature is required.
:::

## void

`void` means the method **returns no value**. Why does `main` return `void`? Because the exit status of a Java program is not returned from `main`; the JVM exits when all non-daemon threads finish. To set an exit code, call `System.exit(status)` — for example `System.exit(1)` to signal failure to a shell script or CI pipeline.

## main

`main` is not a keyword — it is an ordinary identifier that the **launcher** looks for by convention. The JVM identifies the entry point by the exact combination:

- name `main`
- `public` and `static`
- return type `void`
- a single parameter of type `String[]` (or `String...` varargs, which compiles to the same thing)

Valid variations: `public static void main(String... args)`, `static public void main(String[] a)`, `public static void main(String args[])`, and `final` may be added. You can overload `main` with other parameter lists; the launcher only calls the `String[]` version.

**What happens when the application starts?** The launcher creates the JVM, loads and initialises the class (running any `static {}` blocks *before* `main`), creates the `args` array, then invokes `main` on a thread named `main`. See [Compilation & execution](#compilation-execution).

## String[]

- `String` is a class in `java.lang` representing an immutable sequence of characters. `java.lang` is imported automatically, which is why you don't write `import java.lang.String;`.
- `[]` makes it an **array** — a fixed-length, indexed container. `String[]` is "an array of references to `String` objects".
- **Why `String[]`?** Command-line arguments arrive from the operating system as text. An array can hold any number of them, and `args.length` tells you how many there are. It is never `null` — with no arguments, it is an empty array of length 0.

## args

`args` is simply the **parameter name**; you may call it anything (`String[] params`). It holds the command-line arguments.

```java title="Greet.java"
public class Greet {
    public static void main(String[] args) {
        System.out.println("Argument count: " + args.length);
        for (int i = 0; i < args.length; i++) {
            System.out.println("args[" + i + "] = " + args[i]);
        }
        String name = args.length > 0 ? args[0] : "stranger";
        System.out.println("Hello " + name);
    }
}
```

```bash
java Greet Mayur "Pune India" 3
```

```output
Argument count: 3
args[0] = Mayur
args[1] = Pune India
args[2] = 3
Hello Mayur
```

**What happens internally:** the OS shell splits the command line into tokens (quotes keep `Pune India` together). The launcher receives everything after the class name, creates a `String[]` of that length, and passes it to `main`. Note that `"3"` is a `String`; convert it with `Integer.parseInt(args[2])` if you need a number. The class name and JVM options (`-Xmx512m`) are **not** included in `args`.

## System.out.println("Hello World")

| Piece | What it is |
|---|---|
| `System` | A `final` class in `java.lang` giving access to system resources. |
| `out` | A `public static final PrintStream` field of `System` — the standard output stream. |
| `println` | An instance method of `PrintStream` that prints its argument followed by a line separator. |
| `"Hello World"` | A `String` literal. Literals are interned in the **string pool**. |

So the statement means: *take the static field `out` of class `System` (a `PrintStream` object) and call its `println` method with a `String` argument.* `System.err` is the error stream; `System.in` is standard input.

## Real-life example

:::analogy A building's main entrance
A class is a building; methods are rooms. `main` is the **public main entrance** that the building's owner registered with the city (the launcher). It must be *public* (visitors can use it), *static* (it exists even before anyone lives inside — no object needed), and return nothing (you walk in; the entrance does not hand you something back). The `args` array is the envelope of instructions the visitor carries in.
:::

## Common mistakes

:::mistake
- `public static void Main(String[] args)` — capital `M`: compiles, but the launcher cannot find `main`.
- File named `helloworld.java` while class is `public class HelloWorld`: compile error.
- `system.out.println` — `system` lowercase: *package system does not exist*.
- Running `java HelloWorld.class` instead of `java HelloWorld`.
- Accessing `args[0]` without checking `args.length` → `ArrayIndexOutOfBoundsException` when no arguments are passed.
- Missing semicolon — *';' expected*.
:::

## Interview questions

:::qa basic
? Explain `public static void main(String[] args)`.
`public` lets the launcher access it from outside; `static` lets the JVM call it without creating an object; `void` means it returns nothing; `main` is the name the launcher looks for; `String[] args` receives the command-line arguments.
--- followup Can we overload main?
Yes. `main(int x)` or `main()` are legal overloads, but the launcher only calls `public static void main(String[])`. Other overloads run only if you call them yourself.
--- followup Can main be declared final or synchronized?
Yes, both are allowed and have no effect on how the launcher starts it (`synchronized` would lock on `HelloWorld.class`).
:::

:::qa intermediate
? Why is main static? What would happen if it weren't?
At start-up no instance exists and the JVM would not know how to construct one, so the entry point must be callable on the class itself. In Java 17, a non-static `main` compiles but the launcher fails with "Main method is not static". (Java 25 finalised instance main methods for the simplified launch protocol.)
:::

:::qa tricky
? Can a Java program run without a main method?
A standard application needs `main` as its entry point. Before Java 7 a trick existed: a `static {}` block ran during class initialisation and could call `System.exit(0)` before the launcher looked for `main`. Since Java 7 the launcher checks for `main` first, so that trick no longer works. Frameworks (servlet containers, JUnit, Android) run code without *your* `main` because *they* have one and call your code.
:::

:::qa tricky
? What is printed when you run `java Greet` with no arguments and the code prints `args.length`? Is `args` null?
`0`. `args` is never null for a program started by the launcher; it is an empty array.
:::

:::quiz
? Which declaration will the Java 17 launcher accept as the entry point?
- `public void main(String[] args)`
- `public static int main(String[] args)`
+ `static public void main(String... params)`
- `public static void main(String args)`
--- explain
Modifier order does not matter, varargs `String...` is equivalent to `String[]`, and the parameter name is free. The others are non-static, return a value, or take a single `String`.
:::

:::quiz
? `java App one "two three" 4` — what is `args.length`?
- 4
+ 3
- 5
- 2
--- explain
The shell groups `"two three"` into one token, and the class name `App` is not part of `args`.
:::

:::exercise beginner
? Sum numbers from the command line
Write `SumArgs` that prints the sum of all integer arguments, e.g. `java SumArgs 4 5 6` prints `15`. Print a friendly message when no arguments are given.
--- hints
- Loop over `args`.
- `Integer.parseInt(String)` converts text to `int`; it throws `NumberFormatException` for non-numbers.
--- solution
```java title="SumArgs.java"
public class SumArgs {
    public static void main(String[] args) {
        if (args.length == 0) {
            System.out.println("Usage: java SumArgs <n1> <n2> ...");
            return;
        }
        long sum = 0;
        for (String a : args) {
            try {
                sum += Integer.parseInt(a.trim());
            } catch (NumberFormatException e) {
                System.out.println("Skipping non-number: " + a);
            }
        }
        System.out.println("Sum = " + sum);
    }
}
```
--- explanation
`return` in `main` simply ends the method (and therefore the program, since no other threads exist). The sum is a `long` so that adding many large `int` values does not overflow as quickly.
--- complexity
O(n) time for n arguments, O(1) extra space.
:::
</script>

<script type="text/x-java-topic">
@id: main-method
@module: first
@title: Program Structure, Statements & Comments
@level: 1
@time: 12
@prereq: hello-world
@next: naming-conventions
@tags: structure, package, import, statement, block, comment, javadoc, semicolon
===
## Introduction

Every Java source file follows the same order of parts. Knowing it prevents a whole class of compile errors and makes other people's code easier to read.

```java title="Invoice.java"
package com.shop.billing;               // 1. package declaration (optional, at most one, first)

import java.math.BigDecimal;            // 2. imports (zero or more)
import java.util.List;

/**                                     // 3. Javadoc comment for the class
 * Represents a customer invoice.
 */
public class Invoice {                  // 4. one public top-level type, named like the file

    private final List<BigDecimal> lines;   // field

    public Invoice(List<BigDecimal> lines) {  // constructor
        this.lines = lines;
    }

    /** Returns the sum of all invoice lines. */
    public BigDecimal total() {             // method
        BigDecimal sum = BigDecimal.ZERO;   // statement (local variable declaration)
        for (BigDecimal line : lines) {     // block { … } groups statements
            sum = sum.add(line);            // expression statement
        }
        return sum;
    }
}
```

## Building blocks

| Term | Meaning | Example |
|---|---|---|
| Statement | A complete instruction, usually ending with `;` | `int x = 5;` |
| Expression | Something that evaluates to a value | `a + b * 2`, `list.size()` |
| Block | Zero or more statements in `{ }`; defines a scope | method body, loop body |
| Declaration | Introduces a name | `class`, field, method, local variable |

## Comments

```java
// Single-line comment: until end of line

/* Multi-line comment:
   useful for temporarily disabling blocks */

/**
 * Javadoc comment: processed by the javadoc tool into HTML documentation.
 * @param amount the amount in rupees, must be positive
 * @return the amount including 18% GST
 * @throws IllegalArgumentException if amount is negative
 */
```

Comments are removed by the compiler — they have zero runtime cost. Javadoc is how the whole JDK API documentation is generated.

:::tip Write comments that explain *why*
`i++; // increment i` adds nothing. `// Retry once: the payment gateway returns 503 during failover` explains intent that the code cannot express.
:::

:::warn Unicode escapes are processed before comments
`// \u000A System.out.println("surprise");` — `\u000A` is a line break, translated *before* parsing, so the "comment" ends and the println actually runs. A classic trick question.
:::

## Interview questions

:::qa basic
? What is the order of elements in a Java source file?
Optional `package` statement first, then `import` statements, then type declarations (classes, interfaces, enums, records). At most one top-level type may be `public`, and it must match the file name.
--- followup Is `java.lang` imported automatically?
Yes. Every compilation unit implicitly imports `java.lang.*`, which is why `String`, `System`, `Math` and `Integer` need no import.
:::

:::quiz
? Which comment style is used to generate API documentation?
- `// …`
- `/* … */`
+ `/** … */`
- `# …`
--- explain
Javadoc comments start with `/**` and support tags such as `@param`, `@return`, `@throws`.
:::
</script>

<script type="text/x-java-topic">
@id: naming-conventions
@module: first
@title: Identifiers, Keywords & Naming Conventions
@level: 1
@time: 10
@prereq: main-method
@next: variables
@tags: identifier, keyword, reserved, camelcase, pascalcase, constants, naming
===
## Introduction

Names are how code communicates. Java has strict **rules** (enforced by the compiler) and widely followed **conventions** (enforced by code review). Following conventions makes Java code instantly readable to any Java developer in the world.

## Identifier rules (compiler-enforced)

- May contain letters, digits, `_` and `$`.
- Must **not start with a digit**: `2ndPlace` is illegal, `place2` is fine.
- Must not be a **reserved keyword** (`class`, `int`, `static`, …) or the literals `true`, `false`, `null`.
- Case-sensitive: `total`, `Total` and `TOTAL` are three different identifiers.
- Since Java 9, a single underscore `_` alone is not a valid identifier.
- No length limit.

:::info Contextual keywords
`var` (10), `record` (16), `sealed`, `permits`, `non-sealed` (17) and `yield` (14) are **contextual**: they are special only in certain positions, so old code using `var` as a variable name still compiles. You cannot, however, name a *class* `var` or `record`.
:::

## Conventions (community-enforced)

| Element | Convention | Examples |
|---|---|---|
| Class, interface, enum, record | PascalCase noun | `Customer`, `PaymentGateway`, `OrderStatus` |
| Method | camelCase verb | `calculateTotal()`, `isActive()`, `getName()` |
| Variable / parameter | camelCase noun | `orderCount`, `customerName` |
| Constant (`static final`) | UPPER_SNAKE_CASE | `MAX_RETRIES`, `DEFAULT_TIMEOUT_MS` |
| Package | all lowercase, reverse domain | `com.incluziv.erp.purchase` |
| Type parameter | single capital letter | `T`, `E`, `K`, `V`, `R` |
| Boolean methods | `is`/`has`/`can` prefix | `isEmpty()`, `hasNext()` |

:::tip
Prefer meaningful names over short ones: `retryCount` beats `rc`. Loop counters `i`, `j` are fine within small loops.
:::

## Interview questions

:::qa basic
? Is `$amount` a valid identifier? What about `_count` and `2count`?
`$amount` and `_count` are valid (though `$` is conventionally reserved for generated code). `2count` is invalid because identifiers cannot start with a digit.
:::

:::qa tricky
? Are `true`, `false` and `null` keywords?
Technically they are **literals**, not keywords, but they are reserved and cannot be used as identifiers. `goto` and `const` are keywords that are reserved but unused.
:::

:::quiz
? Which name follows Java conventions for a constant?
- `maxRetries`
- `MaxRetries`
+ `MAX_RETRIES`
- `max_retries`
--- explain
`static final` constants use UPPER_SNAKE_CASE.
:::
</script>
