<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   JAVA MASTER COURSE — design tokens
   Light palette on bare :root, dark palette under the media query
   (system setting) and again under [data-theme="dark"] (explicit toggle).
   ===================================================================== */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef1f5; --surface-3:#e4e8ef;
  --border:#dce1e9; --border-strong:#c5ccd8;
  --text:#18202e; --text-2:#465267; --text-3:#6a7589;
  --accent:#2350b5; --accent-hover:#1b4196; --accent-soft:#e7edfa; --accent-ink:#1a3d8f;
  --ok:#1f7a49; --ok-soft:#e2f2e9; --warn:#935d0f; --warn-soft:#fbf0db;
  --danger:#b03535; --danger-soft:#fbe6e6; --violet:#6a45b8; --violet-soft:#efe9fa;
  --teal:#0f6f76; --teal-soft:#e0f1f2; --star:#c98a12;
  --code-bg:#f2f4f8; --code-border:#dfe3ea; --code-text:#1d2533; --code-head:#e8ebf1;
  --sx-kw:#0b3aa8; --sx-str:#0a7324; --sx-com:#7d8594; --sx-num:#1750eb; --sx-ann:#8a7400;
  --sx-ty:#00697a; --sx-fn:#7a3e9d; --sx-var:#a0460e;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);
  --radius:10px; --radius-sm:6px;
  --sidebar-w:304px; --topbar-h:60px;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1218; --surface:#151a22; --surface-2:#1b212b; --surface-3:#232a36;
    --border:#29313d; --border-strong:#39424f;
    --text:#e3e8ef; --text-2:#aeb8c6; --text-3:#8893a4;
    --accent:#86a8ff; --accent-hover:#a3bdff; --accent-soft:#1c2947; --accent-ink:#b0c6ff;
    --ok:#5dc48d; --ok-soft:#14301f; --warn:#e6ad52; --warn-soft:#33270f;
    --danger:#f28383; --danger-soft:#3b1b1c; --violet:#b9a0ff; --violet-soft:#2a2144;
    --teal:#5cc7cf; --teal-soft:#10302f; --star:#e8b040;
    --code-bg:#0b0e13; --code-border:#252c37; --code-text:#d5dbe4; --code-head:#141920;
    --sx-kw:#e38b45; --sx-str:#8fbd6c; --sx-com:#76808f; --sx-num:#79a7d6; --sx-ann:#cbbd4e;
    --sx-ty:#6fc3cc; --sx-fn:#f0c878; --sx-var:#e59a6a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1218; --surface:#151a22; --surface-2:#1b212b; --surface-3:#232a36;
  --border:#29313d; --border-strong:#39424f;
  --text:#e3e8ef; --text-2:#aeb8c6; --text-3:#8893a4;
  --accent:#86a8ff; --accent-hover:#a3bdff; --accent-soft:#1c2947; --accent-ink:#b0c6ff;
  --ok:#5dc48d; --ok-soft:#14301f; --warn:#e6ad52; --warn-soft:#33270f;
  --danger:#f28383; --danger-soft:#3b1b1c; --violet:#b9a0ff; --violet-soft:#2a2144;
  --teal:#5cc7cf; --teal-soft:#10302f; --star:#e8b040;
  --code-bg:#0b0e13; --code-border:#252c37; --code-text:#d5dbe4; --code-head:#141920;
  --sx-kw:#e38b45; --sx-str:#8fbd6c; --sx-com:#76808f; --sx-num:#79a7d6; --sx-ann:#cbbd4e;
  --sx-ty:#6fc3cc; --sx-fn:#f0c878; --sx-var:#e59a6a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topbar-h) + 16px)}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.65;min-height:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- Sidebar ---------- */
.sidebar{position:fixed;top:0;bottom:0;left:0;width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sb-head{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;flex:none}
:root[data-theme="dark"] .brand-mark{color:#0e1218}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand-mark{color:#0e1218}}
.brand-name{font-family:var(--f-head);font-weight:700;font-size:17px;line-height:1.15}
.brand-sub{font-size:12px;color:var(--text-3);font-family:var(--f-mono)}
.sb-progress{margin-top:14px}
.sb-progress-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);margin-bottom:6px}
.sb-progress-row b{color:var(--text);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.sb-scroll{flex:1;overflow-y:auto;padding:10px 10px 24px;overscroll-behavior:contain}
.sb-link{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--radius-sm);border:0;background:none;cursor:pointer;text-align:left;font-size:14px;color:var(--text-2)}
.sb-link:hover{background:var(--surface-2);color:var(--text)}
.sb-link.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.sb-link svg{flex:none}
.sb-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);font-weight:600;padding:14px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.sb-bm-empty{font-size:13px;color:var(--text-3);padding:2px 10px 6px}
.sb-bm{font-size:13.5px;padding:6px 10px}
.sb-bm .bm-dot{color:var(--star)}
.stage-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);padding:16px 10px 4px;font-weight:600}
.mod{margin:1px 0}
.mod-btn{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:0;background:none;border-radius:var(--radius-sm);cursor:pointer;text-align:left;font-size:14px;font-weight:500;color:var(--text)}
.mod-btn:hover{background:var(--surface-2)}
.mod-num{font-family:var(--f-mono);font-size:11px;color:var(--text-3);width:20px;flex:none}
.mod-title{flex:1;min-width:0}
.mod-count{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.mod-count.done{color:var(--ok)}
.chev{flex:none;transition:transform .15s;color:var(--text-3)}
.mod.open .chev{transform:rotate(90deg)}
.mod-topics{display:none;padding:2px 0 6px 20px;margin-left:10px;border-left:1px solid var(--border)}
.mod.open .mod-topics{display:block}
.t-link{display:flex;align-items:flex-start;gap:8px;width:100%;padding:5px 8px;border:0;background:none;border-radius:var(--radius-sm);cursor:pointer;text-align:left;font-size:13.5px;line-height:1.4;color:var(--text-2)}
.t-link:hover{background:var(--surface-2);color:var(--text)}
.t-link.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.t-status{flex:none;width:14px;height:14px;margin-top:2px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center}
.t-link.done .t-status{background:var(--ok);border-color:var(--ok)}
.t-link.done .t-status::after{content:"";width:6px;height:3px;border-left:1.5px solid var(--surface);border-bottom:1.5px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.t-link .t-bm{margin-left:auto;color:var(--star);flex:none;margin-top:1px}

/* ---------- Main + topbar ---------- */
.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding-inline:clamp(16px,3vw,32px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text-2);flex:none}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
.menu-btn{display:none}
.crumbs{font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.crumbs b{color:var(--text-2);font-weight:500}
.search{position:relative;width:min(420px,100%);flex:none}
.search input{width:100%;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--surface);padding:0 64px 0 36px;font:inherit;font-size:14px;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .s-ico{position:absolute;left:11px;top:11px;color:var(--text-3);pointer-events:none}
.search kbd{position:absolute;right:9px;top:9px;font-family:var(--f-mono);font-size:11px;color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:1px 6px;background:var(--surface-2)}
.results{position:absolute;top:44px;left:0;right:0;max-height:min(70vh,560px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px;z-index:50}
.res{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer}
.res:hover,.res.sel{background:var(--accent-soft)}
.res-kind{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--text-3);margin-right:6px}
.res-title{font-size:14px;font-weight:600;color:var(--text)}
.res-sub{font-size:12.5px;color:var(--text-3);margin-top:1px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res mark{background:var(--warn-soft);color:inherit;border-radius:2px;padding:0 1px}
.res-empty{padding:14px;font-size:14px;color:var(--text-3)}

.page{display:flex;gap:40px;padding:32px clamp(16px,4vw,48px) 80px;flex:1;justify-content:center}
.article{width:100%;max-width:800px;min-width:0}
.toc{width:220px;flex:none;position:sticky;top:calc(var(--topbar-h) + 28px);align-self:flex-start;max-height:calc(100vh - var(--topbar-h) - 56px);overflow-y:auto;font-size:13px;display:none}
.toc h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin:0 0 8px}
.toc a{display:block;padding:4px 0 4px 12px;border-left:2px solid var(--border);color:var(--text-3);text-decoration:none;line-height:1.35}
.toc a:hover{color:var(--text)}
.toc a.on{border-color:var(--accent);color:var(--accent-ink);font-weight:500}
@media (min-width:1320px){.toc{display:block}}

/* ---------- Topic header ---------- */
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--accent);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow span.sep{color:var(--text-3)}
.t-title{font-family:var(--f-head);font-size:clamp(30px,4.2vw,42px);line-height:1.12;margin:8px 0 16px;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--text-2);margin-bottom:14px}
.meta-item{display:flex;align-items:center;gap:7px}
.meta-item .k{color:var(--text-3)}
.stars{color:var(--star);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--border-strong)}
.prereq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--text-3);margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);text-decoration:none;cursor:default}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip.ver{background:var(--teal-soft);border-color:transparent;color:var(--teal);font-family:var(--f-mono);font-size:11.5px;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--border);margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;color:var(--text)}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
:root[data-theme="dark"] .btn.primary{color:#0e1218}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0e1218}}
.btn.on-bm{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn.on-done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn svg{flex:none}

/* ---------- Prose ---------- */
.prose{font-size:16.5px}
.prose h2{font-family:var(--f-head);font-size:26px;line-height:1.25;margin:44px 0 12px;padding-top:6px;text-wrap:balance;font-weight:700}
.prose h3{font-size:19px;margin:30px 0 8px;line-height:1.35;font-weight:600}
.prose h4{font-size:16px;margin:22px 0 6px;font-weight:600;color:var(--text)}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 16px;padding-left:24px}
.prose li{margin:4px 0}
.prose li > ul,.prose li > ol{margin:4px 0}
.prose hr{border:0;border-top:1px solid var(--border);margin:32px 0}
.prose blockquote{margin:0 0 16px;padding:10px 16px;border-left:3px solid var(--border-strong);color:var(--text-2);background:var(--surface-2);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.prose blockquote p:last-child{margin:0}
.prose strong{font-weight:600;color:var(--text)}
.prose :not(pre) > code,.prose code.ic{font-family:var(--f-mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--border);padding:1px 5px;border-radius:4px;color:var(--text);word-break:break-word}
.prose a.xl{color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.h-anchor{scroll-margin-top:calc(var(--topbar-h) + 20px)}

.table-wrap{overflow-x:auto;margin:0 0 20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.prose table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.5}
.prose th{text-align:left;font-weight:600;background:var(--surface-2);color:var(--text);padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.prose td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:top}
.prose tr:last-child td{border-bottom:0}
.prose td:first-child{font-weight:500}

/* code */
.code{margin:0 0 20px;border:1px solid var(--code-border);border-radius:var(--radius);background:var(--code-bg);overflow:hidden}
.code-head{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;background:var(--code-head);border-bottom:1px solid var(--code-border);font-size:12px;font-family:var(--f-mono);color:var(--text-3)}
.code-head .lang{text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.code-head .file{color:var(--text-2)}
.copy-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--code-border);background:var(--code-bg);cursor:pointer;font-family:var(--f-body);font-size:12px;color:var(--text-2)}
.copy-btn:hover{color:var(--text)}
.copy-btn.ok{color:var(--ok);border-color:var(--ok)}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:13.5px;line-height:1.6;color:var(--code-text);tab-size:4}
.code.out pre{color:var(--text-2)}
.sx-kw{color:var(--sx-kw);font-weight:500}.sx-str{color:var(--sx-str)}.sx-com{color:var(--sx-com);font-style:italic}
.sx-num{color:var(--sx-num)}.sx-ann{color:var(--sx-ann)}.sx-ty{color:var(--sx-ty)}.sx-fn{color:var(--sx-fn)}.sx-var{color:var(--sx-var)}

/* callouts */
.callout{margin:0 0 20px;padding:14px 16px 4px;border-radius:var(--radius);border:1px solid transparent;background:var(--c-soft);--c:var(--accent);--c-soft:var(--accent-soft)}
.callout-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--c);margin-bottom:6px}
.callout-title svg{flex:none}
.callout > .cb > :last-child{margin-bottom:10px}
.callout.tip{--c:var(--ok);--c-soft:var(--ok-soft)}
.callout.warn{--c:var(--warn);--c-soft:var(--warn-soft)}
.callout.mistake,.callout.danger{--c:var(--danger);--c-soft:var(--danger-soft)}
.callout.analogy{--c:var(--violet);--c-soft:var(--violet-soft)}
.callout.project{--c:var(--teal);--c-soft:var(--teal-soft)}
.callout.version{--c:var(--teal);--c-soft:var(--surface-2);border-color:var(--border)}
.callout.trap{--c:var(--danger);--c-soft:var(--surface);border:1px solid var(--danger);border-left-width:4px}
.callout.key{--c:var(--accent-ink);--c-soft:var(--surface);border-color:var(--border);border-left:4px solid var(--accent)}

/* flow + cards */
.flow{display:flex;flex-direction:column;align-items:center;gap:0;margin:4px 0 22px}
.flow-step{width:min(100%,440px);text-align:center;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.flow-step b{display:block;font-size:14.5px}
.flow-step span{display:block;font-size:12.5px;color:var(--text-3);line-height:1.4}
.flow-step.hl{border-color:var(--accent);background:var(--accent-soft)}
.flow-arrow{height:22px;width:2px;background:var(--border-strong);position:relative}
.flow-arrow::after{content:"";position:absolute;bottom:-1px;left:-4px;border:5px solid transparent;border-top:6px solid var(--border-strong)}
.flow.row{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:8px}
.flow.row .flow-step{width:auto;flex:1 1 130px;max-width:220px}
.flow.row .flow-arrow{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:0 0 20px}
.card{padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:14px;line-height:1.5}
.card b{display:block;margin-bottom:3px;font-size:14.5px}
.card span{color:var(--text-2)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:0 0 20px}
.col{padding:14px 16px 4px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.col h5{margin:0 0 8px;font-size:14px;font-weight:600}
.col:first-child h5{color:var(--ok)}
.col:nth-child(2) h5{color:var(--danger)}
.col ul{padding-left:18px}

/* layers diagram (JVM memory etc.) */
.diagram{margin:0 0 22px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow-x:auto}
.dg-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);font-weight:600;margin-bottom:10px}
.dg-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
