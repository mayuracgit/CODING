@id: hashmap-internals
@module: collections
@title: HashMap Internal Working
@level: 4
@time: 35
@java: 8+
@prereq: equals-hashcode, collections-overview
@next: linkedhashmap-treemap, concurrent-collections
@tags: hashmap, hashing, hashcode, equals, bucket, collision, treeify, red black tree, load factor, resize, rehash, capacity, null key, put, get
===
## Introduction

`HashMap<K,V>` stores key–value pairs and finds a value by key in **O(1) average time**, regardless of how many entries it holds. It's used everywhere: caches, lookups by id, grouping, counting, JSON objects, request parameters.

How does it find a key among a million entries without searching? By **hashing** — turning the key into a number that directly tells it where to look.

## The data structure

```java
transient Node<K,V>[] table;     // the bucket array; length is always a power of two
transient int size;              // number of key-value mappings
int threshold;                   // resize when size exceeds this (capacity × loadFactor)
final float loadFactor;          // default 0.75

static class Node<K,V> {         // each entry
    final int hash;              // cached (spread) hash of the key
    final K key;
    V value;
    Node<K,V> next;              // next node in the same bucket (collision chain)
}
```

:::diagram table (capacity 16) after a few puts
[a] [0] :: null || [g] [1] :: ("Pune",1) || [a] [2] :: null || [w] [3] :: ("Aa",7) → ("BB",9) — collision chain || [a] … || [g] [15] :: ("Delhi",4)
:::

## Step 1 — hashCode() and the spreading function

```java
static final int hash(Object key) {
    int h;
    return (key == null) ? 0 : (h = key.hashCode()) ^ (h >>> 16);
}
```

- `null` keys always hash to 0 — so a `HashMap` allows **one null key** (in bucket 0).
- `h ^ (h >>> 16)` mixes the high 16 bits into the low 16 bits. Why? The bucket index uses only the low bits; without spreading, keys whose hash codes differ only in high bits would all collide.

## Step 2 — index = (n − 1) & hash

Because the table length `n` is a power of two, `(n - 1) & hash` keeps the low bits of the hash — the same as `hash % n` for non-negative numbers, but a single fast AND instruction (and never negative).

```
n = 16 → n - 1 = 0b1111
hash   = 0b...1011_0110
index  = 0b0110 = 6
```

## Step 3 — put(key, value)

:::flow
compute hash :: hash(key) → spread hashCode
table empty? :: lazily allocate table (default capacity 16) on first put
index = (n-1) & hash :: locate bucket
bucket empty? :: place new Node → done
* bucket occupied :: walk nodes: same hash AND (same reference OR equals) → REPLACE value, return old
not found :: append new Node at the tail (tree insert if the bucket is a tree)
chain length > 8 :: treeifyBin: convert to red-black tree (only if capacity ≥ 64, else resize)
++size > threshold :: resize(): double capacity, redistribute nodes
:::

Notice that `equals` is only called for entries with the **same hash** in the **same bucket** — this is why hash codes must be consistent with `equals`.

## Step 4 — get(key)

1. Compute the hash, find the bucket.
2. Check the first node: same hash and `==` or `equals` → return its value.
3. Otherwise walk the chain (or search the tree) comparing hash then `equals`.
4. Not found → `null`.

:::warn get() returning null is ambiguous
`null` means either "no mapping" or "mapped to null". Use `containsKey`, `getOrDefault`, or avoid storing null values.
:::

## Collisions and treeification (Java 8)

A **collision** happens when different keys map to the same bucket (different hash codes landing on the same index, or genuinely equal hash codes like `"Aa"`/`"BB"`).

- Colliding entries form a **linked list** in the bucket — lookup degrades to O(k) for k entries in that bucket.
- **Java 8+:** when a bucket's list exceeds **8** nodes (`TREEIFY_THRESHOLD`) *and* the table has at least **64** buckets (`MIN_TREEIFY_CAPACITY`), the bucket is converted into a **red-black tree** (`TreeNode`), making worst-case lookup **O(log n)**. With fewer than 64 buckets, the map resizes instead.
- If a tree shrinks to **6** or fewer nodes (`UNTREEIFY_THRESHOLD`), typically during resize, it converts back to a list. The gap (8 vs 6) prevents flip-flopping.
- Tree ordering uses the hash, then `compareTo` if keys are `Comparable`, then a tie-breaking identity comparison.

Why did Java 8 add this? **Hash-flooding DoS attacks**: an attacker sends many HTTP parameters with colliding hash codes, turning each request into O(n²) work. Trees cap the damage at O(log n).

## Load factor and resizing

- **Capacity**: number of buckets (default 16, always a power of two; `new HashMap<>(20)` rounds up to 32).
- **Load factor**: how full the table may get before growing (default **0.75**).
- **Threshold** = capacity × load factor (16 × 0.75 = **12**).
- When `size` exceeds the threshold, `resize()` **doubles** the capacity and redistributes every node.

Resize trick (Java 8): because capacity doubles, each node either stays at index `i` or moves to `i + oldCapacity`, depending on a single bit of its hash (`hash & oldCap`). No rehashing of keys is needed, and the order within each split list is preserved.

Why 0.75? A trade-off between memory (lower factor = more empty buckets) and time (higher = more collisions). With a good hash function, at 0.75 the expected chain lengths stay very short.

:::tip Pre-size when you know the count
To hold 1,000 entries without resizing: capacity ≥ 1000 / 0.75 ≈ 1334 → `new HashMap<>(1334)` (rounded up to 2048). Java 19 added `HashMap.newHashMap(1000)`, which does this calculation for you.
:::

## Complete example

```java title="HashMapDemo.java"
import java.util.HashMap;
import java.util.Map;

public class HashMapDemo {
    public static void main(String[] args) {
        Map<String, Integer> stock = new HashMap<>();
        stock.put("SKU-1", 50);
        stock.put("SKU-2", 10);
        stock.put("SKU-1", 45);                 // same key → value replaced, size unchanged
        stock.put(null, 0);                     // one null key allowed

        System.out.println(stock.get("SKU-1"));                 // 45
        System.out.println(stock.getOrDefault("SKU-9", 0));     // 0
        System.out.println(stock.size());                       // 3

        stock.merge("SKU-2", 5, Integer::sum);                  // 15 — atomic-looking update helper
        stock.computeIfAbsent("SKU-3", k -> 100);               // insert if missing
        stock.putIfAbsent("SKU-3", 999);                        // ignored: key present

        for (Map.Entry<String, Integer> e : stock.entrySet()) { // iterate entries, not keySet + get
            System.out.println(e.getKey() + " = " + e.getValue());
        }

        // Word frequency — a classic
        Map<String, Integer> freq = new HashMap<>();
        for (String w : "to be or not to be".split(" ")) freq.merge(w, 1, Integer::sum);
        System.out.println(freq);   // e.g. {not=1, or=1, be=2, to=2} — iteration order NOT guaranteed
    }
}
```

## Properties summary

| Property | HashMap |
|---|---|
| Ordering | None guaranteed (and may change after resize) |
| Null | One null key, any number of null values |
| Thread-safe | **No** — use `ConcurrentHashMap` |
| Iteration | Fail-fast |
| Average get/put | O(1) |
| Worst case | O(log n) per bucket with treeification (Java 8+), O(n) before |

:::warn HashMap is not thread-safe
Concurrent `put`s can lose updates or corrupt internal state. Before Java 8, a concurrent resize could even create a **cycle** in a bucket's linked list, making `get` loop forever at 100% CPU. Java 8's order-preserving resize fixed the loop, but data races remain. Use `ConcurrentHashMap`.
:::

## Real-life example

:::analogy A post office sorting room
Each letter's PIN code (hash code) decides its pigeonhole (bucket). To find a letter you go straight to the right pigeonhole, then read the names on the few letters there (`equals`). If one pigeonhole overflows (many collisions), the clerk arranges those letters alphabetically in a binder (treeification) to search faster. When the room gets 75% full, the post office moves to a room with twice as many pigeonholes and re-sorts (resize).
:::

:::project
Typical service code builds lookup maps to avoid N+1 queries: load 500 suppliers once, `Map<Long, Supplier> byId = suppliers.stream().collect(toMap(Supplier::getId, s -> s))`, then enrich 5,000 order lines with O(1) lookups instead of 5,000 database calls.
:::

## Common mistakes

:::mistake
- Mutable keys whose hash code changes after insertion.
- Custom key class without `hashCode` (or inconsistent with `equals`).
- Iterating `keySet()` and calling `get(key)` for every key — iterate `entrySet()` instead.
- Relying on iteration order.
- Sharing a `HashMap` across threads (e.g. a static cache in a web app).
:::

## Interview questions

:::qa advanced
? How does HashMap work internally?
It keeps an array of buckets (power-of-two length). For `put`, it spreads `key.hashCode()` (`h ^ h>>>16`), computes the index with `(n-1) & hash`, and either places a new node in an empty bucket or walks the bucket comparing hash and `equals` — replacing the value on a match or appending a node otherwise. Since Java 8, buckets with more than 8 entries become red-black trees when capacity ≥ 64. When size exceeds capacity × load factor (0.75), the table doubles and nodes are split between index i and i + oldCap. `get` follows the same path to find the node.
--- followup What happens if two keys have the same hashCode?
They go to the same bucket; `equals` distinguishes them. If they're equal, the value is replaced; if not, both entries coexist in the bucket's list or tree.
--- followup Why is capacity always a power of two?
So the index can be computed with a fast bitwise AND `(n-1) & hash` instead of modulo, and so that resizing can split each bucket into "stay" and "move by oldCap" using one bit.
--- followup Why is the threshold for treeification 8?
Under a reasonable hash function, bucket sizes follow a Poisson distribution with mean ~0.5 at load factor 0.75; the probability of 8 entries in one bucket is about 0.00000006. Reaching 8 therefore signals a poor hash function or an attack, which justifies the tree's extra memory.
:::

:::qa intermediate
? What is the load factor? What happens if you set it to 1.0 or 0.5?
The ratio of size to capacity at which the map resizes (default 0.75). At 1.0 the map uses less memory but has more collisions and slower lookups; at 0.5 lookups are slightly faster but twice as many buckets are allocated and resizes happen more often.
:::

:::qa tricky
? Why does HashMap allow one null key but ConcurrentHashMap and Hashtable don't?
`HashMap` special-cases null by giving it hash 0. `ConcurrentHashMap` forbids nulls because in a concurrent map `get(key) == null` would be ambiguous — you couldn't tell "absent" from "mapped to null" with a separate `containsKey` call, since another thread might change the map between the two calls. `Hashtable` calls `key.hashCode()` directly, so a null key throws NPE.
:::

:::qa scenario
? A HashMap with 10 million entries shows high CPU during puts. What could be wrong?
Likely causes: a poor `hashCode` producing many collisions (check the key class), repeated resizing because the map wasn't pre-sized, or boxing/garbage from keys. Also check whether multiple threads are writing to it (corruption, lost updates). Fixes: a good hash function (`Objects.hash` or records), pre-sizing, `ConcurrentHashMap` for concurrent writers.
:::

:::qa tricky
? Can a HashMap's get() ever run in O(n) in Java 8+?
Yes in two cases: when the table has fewer than 64 buckets (the map resizes instead of treeifying), and when colliding keys aren't `Comparable`, in which case tree searches may need to explore both subtrees. With sensible keys, worst case is O(log n).
:::

:::quiz
? Default initial capacity and load factor of HashMap?
- 10 and 0.5
+ 16 and 0.75
- 16 and 1.0
- 32 and 0.75
--- explain
Capacity 16 (allocated on first put) and load factor 0.75, so the first resize happens when the 13th entry is added.
:::

:::quiz
? What does `map.put(k, v)` return?
- Always null
- The new value
+ The previous value for that key, or null if there was none
- A boolean
--- explain
`put` returns the old value it replaced (or null), which lets you detect overwrites.
:::

:::exercise interview
? First non-repeating character
Given `"swiss"`, return the first character that appears exactly once (`w`). Use a map that preserves insertion order.
--- hints
- Count with a `LinkedHashMap<Character, Integer>`, then return the first entry with count 1.
--- solution
```java title="FirstUnique.java"
import java.util.LinkedHashMap;
import java.util.Map;

public class FirstUnique {
    static Character firstUnique(String s) {
        Map<Character, Integer> counts = new LinkedHashMap<>();
        for (char c : s.toCharArray()) counts.merge(c, 1, Integer::sum);
        for (Map.Entry<Character, Integer> e : counts.entrySet())
            if (e.getValue() == 1) return e.getKey();
        return null;
    }
    public static void main(String[] args) {
        System.out.println(firstUnique("swiss"));      // w
        System.out.println(firstUnique("aabb"));       // null
    }
}
```
--- explanation
`LinkedHashMap` keeps insertion order, so the second pass visits characters in their first-occurrence order.
--- complexity
O(n) time, O(k) space for k distinct characters.
:::
</script>

@id: linkedhashmap-treemap
@module: collections
@title: LinkedHashMap, TreeMap & LRU Cache
@level: 3
@time: 22
@prereq: hashmap-internals
@next: sets
@tags: linkedhashmap, treemap, red black tree, navigablemap, sortedmap, access order, lru cache, removeeldestentry, floorkey, ceilingkey
===
## LinkedHashMap — a HashMap that remembers order

`LinkedHashMap` extends `HashMap` and additionally threads every entry onto a **doubly linked list**. Lookup is still O(1) via hashing; iteration follows the list instead of the bucket array.

- **Insertion order** (default): iteration returns keys in the order they were first inserted. Re-putting an existing key does not change its position.
- **Access order** (`new LinkedHashMap<>(16, 0.75f, true)`): every `get`/`put` moves the entry to the end — the most recently used is last, the least recently used is first.
- `removeEldestEntry(eldest)` is called after each insertion; return `true` to evict the eldest entry.

### LRU cache in ten lines

```java title="LruCache.java"
import java.util.LinkedHashMap;
import java.util.Map;

public class LruCache<K, V> extends LinkedHashMap<K, V> {
    private final int maxEntries;

    public LruCache(int maxEntries) {
        super(16, 0.75f, true);            // accessOrder = true
        this.maxEntries = maxEntries;
    }

    @Override
    protected boolean removeEldestEntry(Map.Entry<K, V> eldest) {
        return size() > maxEntries;        // evict least-recently-used when over capacity
    }

    public static void main(String[] args) {
        LruCache<String, String> cache = new LruCache<>(3);
        cache.put("a", "A"); cache.put("b", "B"); cache.put("c", "C");
        cache.get("a");                    // a becomes most recently used
        cache.put("d", "D");               // evicts b (least recently used)
        System.out.println(cache.keySet());  // [c, a, d]
    }
}
```

:::warn Not thread-safe
In access-order mode even `get` is a structural modification (it moves an entry). Concurrent reads need external synchronisation. For production caches use Caffeine or a similar library.
:::

## TreeMap — a sorted map

`TreeMap` is a **red-black tree** (a self-balancing binary search tree). Keys are kept sorted by natural ordering (`Comparable`) or a supplied `Comparator`.

- `get`, `put`, `remove`, `containsKey` — **O(log n)** guaranteed.
- Iteration in sorted key order.
- Rich navigation (`NavigableMap`): `firstKey`, `lastKey`, `floorKey(k)` (≤ k), `ceilingKey(k)` (≥ k), `headMap`, `tailMap`, `subMap`, `descendingMap`, `pollFirstEntry`.
- No `null` keys with natural ordering (`compareTo` on null throws NPE); null values are fine.
- Uses `compareTo`/`compare` — **not `equals`** — to decide whether keys are the same. They should be consistent.

```java title="TaxSlabs.java"
import java.util.TreeMap;

public class TaxSlabs {
    public static void main(String[] args) {
        // income lower bound → tax rate %
        TreeMap<Integer, Integer> slabs = new TreeMap<>();
        slabs.put(0, 0);
        slabs.put(300_000, 5);
        slabs.put(700_000, 10);
        slabs.put(1_000_000, 15);
        slabs.put(1_200_000, 20);

        int income = 850_000;
        System.out.println(slabs.floorEntry(income));            // 700000=10  → applicable slab
        System.out.println(slabs.headMap(700_000));               // {0=0, 300000=5}
        System.out.println(slabs.descendingKeySet());             // [1200000, 1000000, 700000, 300000, 0]
    }
}
```

The slab boundaries above are illustrative. `floorEntry` answers "which band does this value fall in?" in O(log n) — a very common pattern for price tiers, rate cards, time windows and IP ranges.

## HashMap vs LinkedHashMap vs TreeMap

| | HashMap | LinkedHashMap | TreeMap |
|---|---|---|---|
| Structure | Hash table | Hash table + doubly linked list | Red-black tree |
| Order | None | Insertion (or access) | Sorted by key |
| get/put | O(1) avg | O(1) avg | O(log n) |
| Null key | One | One | No (natural ordering) |
| Memory | Lowest | + 2 references per entry | Node with parent/left/right/colour |
| Key requirement | `hashCode`/`equals` | Same | `Comparable` or `Comparator` |
| Use when | Pure lookup | Predictable order, LRU | Sorted data, range queries |

## Interview questions

:::qa intermediate
? How would you implement an LRU cache in Java?
Extend `LinkedHashMap` with `accessOrder = true` and override `removeEldestEntry` to return `size() > capacity`. Access order moves each accessed entry to the tail; the head is the least recently used and is evicted on insertion. For thread safety, synchronise access or use a concurrent cache library.
--- followup How would you implement it without LinkedHashMap?
A `HashMap<K, Node>` for O(1) lookup plus a hand-written doubly linked list of nodes: on access, unlink the node and move it to the head; on insert beyond capacity, remove the tail node and its map entry.
:::

:::qa intermediate
? What is the time complexity of TreeMap operations, and how does it decide key equality?
O(log n) for get/put/remove because the red-black tree stays balanced (height ≤ 2 log(n+1)). It decides equality with `compareTo`/`compare` returning 0 — not `equals` — so a comparator inconsistent with `equals` can make distinct keys collapse into one.
:::

:::quiz
? Which map returns keys in sorted order?
- `HashMap`
- `LinkedHashMap`
+ `TreeMap`
- `Hashtable`
--- explain
TreeMap maintains keys in sorted order in a red-black tree; LinkedHashMap maintains insertion order.
:::
</script>

@id: sets
@module: collections
@title: HashSet, LinkedHashSet & TreeSet
@level: 2
@time: 15
@prereq: hashmap-internals, linkedhashmap-treemap
@next: queues
@tags: set, hashset, linkedhashset, treeset, duplicates, present, navigableset, uniqueness
===
## Sets are maps in disguise

Each JDK set is backed by the corresponding map, using the element as the **key** and a shared dummy object as the value:

```java
// inside java.util.HashSet
private transient HashMap<E, Object> map;
private static final Object PRESENT = new Object();

public boolean add(E e) {
    return map.put(e, PRESENT) == null;   // null → key was new → element added
}
```

So a set's behaviour mirrors its map: `HashSet` ↔ `HashMap`, `LinkedHashSet` ↔ `LinkedHashMap`, `TreeSet` ↔ `TreeMap`.

| | HashSet | LinkedHashSet | TreeSet |
|---|---|---|---|
| Backed by | `HashMap` | `LinkedHashMap` | `TreeMap` (via `NavigableMap`) |
| Order | None | Insertion | Sorted |
| add/contains/remove | O(1) avg | O(1) avg | O(log n) |
| Null | One | One | No (natural ordering) |
| Uniqueness by | `hashCode` + `equals` | `hashCode` + `equals` | `compareTo` / comparator |

```java title="SetDemo.java"
import java.util.*;

public class SetDemo {
    public static void main(String[] args) {
        List<String> skus = List.of("B-2", "A-1", "B-2", "C-3", "A-1");
        System.out.println(new HashSet<>(skus));          // unique, unpredictable order
        System.out.println(new LinkedHashSet<>(skus));    // [B-2, A-1, C-3] — first-seen order
        System.out.println(new TreeSet<>(skus));          // [A-1, B-2, C-3] — sorted

        Set<String> seen = new HashSet<>();
        for (String s : skus) {
            if (!seen.add(s)) System.out.println("duplicate: " + s);   // add returns false if present
        }

        TreeSet<Integer> slots = new TreeSet<>(List.of(9, 11, 14, 16));
        System.out.println(slots.ceiling(12));             // 14 — next available slot ≥ 12
        System.out.println(slots.headSet(14));             // [9, 11]

        Set<String> a = new HashSet<>(Set.of("java", "sql", "aws"));
        Set<String> b = Set.of("java", "react");
        a.retainAll(b);                                    // intersection → [java]
        System.out.println(a);
    }
}
```

:::trap TreeSet with an inconsistent comparator
```java
Set<String> s = new TreeSet<>(Comparator.comparing(String::length));
s.add("pune"); s.add("goa"); s.add("agra");
System.out.println(s);    // [goa, pune] — "agra" was treated as a DUPLICATE of "pune" (same length)
```
TreeSet considers elements equal when the comparator returns 0. Break ties: `comparing(String::length).thenComparing(Comparator.naturalOrder())`.
:::

## Interview questions

:::qa intermediate
? How does HashSet ensure uniqueness?
It stores elements as keys in an internal `HashMap`. `add` calls `map.put(e, PRESENT)`; if the key already exists (same hash bucket and `equals`), `put` returns the old value and `add` returns false.
--- followup What if you add a mutable object and then change it?
Its hash code may change, so the set can no longer find it: `contains` returns false, `remove` fails, and adding an equal object creates an apparent duplicate.
:::

:::qa basic
? HashSet vs TreeSet?
HashSet: hash table, O(1) average operations, no ordering, allows one null, uniqueness by `hashCode`/`equals`. TreeSet: red-black tree, O(log n), sorted order with navigation methods, no null (natural order), uniqueness by `compareTo`/comparator.
:::

:::quiz
? `new HashSet<>(List.of(1, 2, 2, 3)).add(3)` returns?
- true
+ false
- throws an exception
- 3
--- explain
3 is already present, so `add` returns false and the set is unchanged.
:::
</script>

@level: 3

===
## Queue and Deque

A **Queue** processes elements typically **FIFO** (first in, first out). A **Deque** (double-ended queue, pronounced "deck") supports insertion and removal at **both** ends, so it can act as a queue *or* a stack.

Each operation comes in two flavours:

| Operation | Throws on failure | Returns special value |
|---|---|---|
| Insert | `add(e)` | `offer(e)` → false |
| Remove head | `remove()` | `poll()` → null |
| Examine head | `element()` | `peek()` → null |

```java
Queue<String> tasks = new ArrayDeque<>();
tasks.offer("email"); tasks.offer("sms");
tasks.poll();                      // "email" — FIFO

Deque<String> history = new ArrayDeque<>();
history.push("/home"); history.push("/orders");
history.pop();                     // "/orders" — LIFO (stack)
```

**`ArrayDeque`** is a resizable **circular array** with head and tail indexes: O(1) amortised at both ends, no node allocation, excellent locality. It does not allow `null` elements (null is used as the "empty" signal by `poll`).

## PriorityQueue — a binary heap

`PriorityQueue` always yields the **smallest** element (by natural order or comparator) from `poll()`/`peek()`. Internally it is a **binary min-heap** stored in an array: the element at index `i` has children at `2i+1` and `2i+2`, and every parent ≤ its children.

| Operation | Complexity |
|---|---|
| `offer` | O(log n) — add at the end, sift up |
| `poll` | O(log n) — move last to root, sift down |
| `peek` | O(1) |
| `contains`, `remove(Object)` | O(n) |

:::warn Iteration order is not sorted
`System.out.println(pq)` or a for-each loop shows the heap's array order, not priority order. Only repeated `poll()` returns elements in order.
:::

```java title="PriorityDemo.java"
import java.util.*;

public class PriorityDemo {
    record Ticket(String id, int severity, long createdAt) {}

    public static void main(String[] args) {
        // Highest severity first, then oldest first
        PriorityQueue<Ticket> pq = new PriorityQueue<>(
            Comparator.comparingInt(Ticket::severity).reversed()
                      .thenComparingLong(Ticket::createdAt));
        pq.offer(new Ticket("T1", 2, 100));
        pq.offer(new Ticket("T2", 5, 200));
        pq.offer(new Ticket("T3", 5, 150));
        while (!pq.isEmpty()) System.out.print(pq.poll().id() + " ");   // T3 T2 T1
        System.out.println();

        // Top-3 largest numbers using a MIN-heap of size 3: O(n log k)
        int[] data = {5, 1, 9, 3, 7, 8, 2};
        PriorityQueue<Integer> top = new PriorityQueue<>();
        for (int x : data) {
            top.offer(x);
            if (top.size() > 3) top.poll();          // drop the smallest
        }
        System.out.println(top);                      // contains 7, 8, 9 (heap order)
    }
}
```

:::project
Priority queues power job schedulers (`ScheduledThreadPoolExecutor` uses a heap-based `DelayedWorkQueue`), rate limiters, Dijkstra's shortest path in routing, and "process urgent orders first" batch jobs. For producer/consumer between threads, use a `BlockingQueue` (`LinkedBlockingQueue`, `ArrayBlockingQueue`, `PriorityBlockingQueue`).
:::

## Interview questions

:::qa intermediate
? How does PriorityQueue work internally?
It is a binary heap backed by a resizable array. `offer` appends and sifts the element up until its parent is smaller; `poll` removes the root, moves the last element to the root and sifts it down. Both are O(log n); `peek` is O(1). Ordering comes from `Comparable` or a supplied `Comparator`.
--- followup Is PriorityQueue thread-safe?
No. Use `PriorityBlockingQueue` for concurrent access.
:::

:::qa coding
? How do you find the k largest elements in a stream of n numbers efficiently?
Maintain a min-heap (`PriorityQueue`) of size k: add each number and poll when size exceeds k. The heap then holds the k largest. O(n log k) time, O(k) space — better than sorting (O(n log n)) when k ≪ n.
:::

:::quiz
? What does `poll()` return on an empty `ArrayDeque`?
+ null
- throws `NoSuchElementException`
- 0
- blocks until an element arrives
--- explain
`poll()` returns null when empty; `remove()` would throw `NoSuchElementException`. Blocking behaviour belongs to `BlockingQueue.take()`.
:::
</script>

<script type="text/x-java-topic">
@id: comparable-comparator
@module: collections
@title: Comparable vs Comparator
@level: 3
@time: 18
@java: 8+
@prereq: interfaces, sets
@next: iterators
@tags: comparable, comparator, compareto, compare, sorting, natural ordering, comparing, thencomparing, reversed, nullsfirst
===
## Two ways to define order

| | `Comparable<T>` | `Comparator<T>` |
|---|---|---|
| Package | `java.lang` | `java.util` |
| Method | `int compareTo(T other)` | `int compare(T a, T b)` |
| Where defined | Inside the class being sorted | Separately (class, lambda, method reference) |
| How many | One **natural ordering** per class | As many orderings as you need |
| Used by | `Collections.sort(list)`, `TreeMap`, `Arrays.sort(objs)` without a comparator | `list.sort(cmp)`, `new TreeMap<>(cmp)`, `stream.sorted(cmp)` |
| Examples | `String`, `Integer`, `LocalDate`, `BigDecimal` | `Comparator.comparing(Order::getTotal)` |

Contract: return a **negative** number if the first is smaller, **zero** if equal, **positive** if greater. It must be consistent (antisymmetric, transitive), and ideally consistent with `equals`.

## Example

```java title="Sorting.java"
import java.math.BigDecimal;
import java.util.*;

public class Sorting {
    static class Employee implements Comparable<Employee> {
        final String name; final String dept; final BigDecimal salary;
        Employee(String n, String d, String s) { name = n; dept = d; salary = new BigDecimal(s); }

        @Override
        public int compareTo(Employee o) {            // natural order: by name
            return name.compareTo(o.name);
        }
        String getName() { return name; }
        String getDept() { return dept; }
        BigDecimal getSalary() { return salary; }
        @Override public String toString() { return name + "(" + dept + "," + salary + ")"; }
    }

    public static void main(String[] args) {
        List<Employee> list = new ArrayList<>(List.of(
            new Employee("Ravi", "IT", "90000"),
            new Employee("Asha", "HR", "70000"),
            new Employee("Meera", "IT", "120000"),
            new Employee("Kiran", "HR", "80000")));

        Collections.sort(list);                                   // natural (Comparable): by name
        System.out.println(list);   // [Asha(HR,70000), Kiran(HR,80000), Meera(IT,120000), Ravi(IT,90000)]

        list.sort(Comparator.comparing(Employee::getDept)         // Java 8 comparator combinators
                            .thenComparing(Employee::getSalary, Comparator.reverseOrder())
                            .thenComparing(Employee::getName));
        System.out.println(list);   // [Kiran(HR,80000), Asha(HR,70000), Meera(IT,120000), Ravi(IT,90000)]
    }
}
```

## The subtraction bug

```java
// WRONG: overflows for large values of opposite sign
Comparator<Integer> bad = (a, b) -> a - b;
// Integer.MIN_VALUE - 1 overflows to a large positive number → wrong order
Comparator<Integer> good = Integer::compare;          // or Comparator.naturalOrder()
```

## Useful Comparator factory methods (Java 8)

| Method | Purpose |
|---|---|
| `Comparator.comparing(keyExtractor)` | Compare by a derived key |
| `comparingInt/Long/Double` | Avoid boxing for primitive keys |
| `thenComparing(...)` | Tie-breakers |
| `reversed()` | Reverse the whole comparator |
| `Comparator.naturalOrder()` / `reverseOrder()` | Natural ordering |
| `Comparator.nullsFirst(cmp)` / `nullsLast(cmp)` | Handle null values safely |

:::warn reversed() applies to everything before it
`comparing(A).thenComparing(B).reversed()` reverses both A and B. To reverse only B, pass a reversed comparator to `thenComparing`, as in the example.
:::

## Real-life example

:::analogy
`Comparable` is the default way a library shelves books (by title) — built into how books are handled. `Comparator` is a temporary sort requested by a reader: "show me these by author, then by year". Same books, many possible orderings.
:::

## Interview questions

:::qa basic
? Difference between Comparable and Comparator?
`Comparable` defines a class's single natural ordering via `compareTo` inside the class. `Comparator` defines external, alternative orderings via `compare`, and can be created with lambdas and combinators (`comparing`, `thenComparing`, `reversed`).
--- followup When would you use Comparator even if the class is Comparable?
When you need a different order (by salary instead of name), when you can't modify the class (third-party), or for multi-field and null-safe sorting.
:::

:::qa tricky
? Why is `(a, b) -> a - b` a bad comparator?
Integer subtraction can overflow for large magnitudes of opposite sign, producing the wrong sign and violating the contract. Use `Integer.compare(a, b)`.
:::

:::qa intermediate
? What does "consistent with equals" mean for compareTo?
`a.compareTo(b) == 0` exactly when `a.equals(b)`. If not consistent, sorted collections (TreeSet/TreeMap), which rely on `compareTo`, behave differently from hash-based ones, which rely on `equals`. `BigDecimal` is a known example: `2.0` and `2.00` are not `equals`, but `compareTo` returns 0.
:::

:::quiz
? Which sorts strings by length, and alphabetically for equal lengths?
- `Comparator.comparing(String::length).reversed()`
+ `Comparator.comparing(String::length).thenComparing(Comparator.naturalOrder())`
- `Comparator.naturalOrder().thenComparing(String::length)`
- `(a, b) -> a.length() - b.compareTo(a)`
--- explain
`comparing` sets the primary key; `thenComparing` supplies a tie-breaker.
:::
</script>

@id: iterators
@module: collections
@title: Iterators, Fail-Fast & Fail-Safe
@level: 3
@time: 15
@prereq: arraylist
@next: concurrent-collections
@tags: iterator, listiterator, fail fast, fail safe, concurrentmodificationexception, modcount, removeif, weakly consistent
===
## Iterator

`Iterator<E>` is the standard way to traverse any collection: `hasNext()`, `next()`, and optionally `remove()` (removes the last returned element safely). The for-each loop uses it under the hood. `ListIterator` adds bidirectional traversal, `set`, `add` and index information.

## ConcurrentModificationException

```java title="CmeDemo.java"
import java.util.*;

public class CmeDemo {
    public static void main(String[] args) {
        List<String> names = new ArrayList<>(List.of("asha", "ravi", "meera", "ravi"));

        try {
            for (String n : names) {
                if (n.equals("ravi")) names.remove(n);      // structural change behind the iterator's back
            }
        } catch (ConcurrentModificationException e) {
            System.out.println("CME!");
        }

        Iterator<String> it = names.iterator();              // correct way 1
        while (it.hasNext()) {
            if (it.next().equals("ravi")) it.remove();
        }
        names.removeIf(n -> n.startsWith("m"));              // correct way 2 (Java 8)
        System.out.println(names);                            // [asha]
    }
}
```

### How fail-fast works

Collections like `ArrayList` and `HashMap` keep an `int modCount` incremented on every **structural** modification (add/remove, not `set`). An iterator records `expectedModCount` when created; each `next()` checks `modCount == expectedModCount`, throwing `ConcurrentModificationException` on mismatch. `it.remove()` updates both counts, so it's allowed.

It's called **fail-fast** because it fails immediately instead of risking undefined behaviour later. It's **best-effort**: it detects single-threaded misuse reliably but is not a thread-safety mechanism.

:::trap The second-to-last element
Removing the **second-to-last** element inside a for-each loop over an `ArrayList` does *not* throw: after removal, `size` drops, `hasNext()` (which checks `cursor != size`) returns false, and the loop simply ends — silently skipping the last element. A favourite trick question.
:::

## Fail-fast vs fail-safe (weakly consistent)

| | Fail-fast | Fail-safe / weakly consistent |
|---|---|---|
| Examples | `ArrayList`, `HashMap`, `HashSet` iterators | `ConcurrentHashMap`, `CopyOnWriteArrayList`, `ConcurrentLinkedQueue` iterators |
| On concurrent modification | Throws `ConcurrentModificationException` | Never throws |
| Sees modifications? | N/A | CopyOnWrite: iterates a **snapshot** (sees none); CHM: **weakly consistent** — may or may not reflect changes made after creation |
| Overhead | Very low | Copy on every write (COW) or more complex structure |

## Interview questions

:::qa intermediate
? What is a fail-fast iterator? How does it detect modification?
An iterator that throws `ConcurrentModificationException` if the collection is structurally modified after the iterator was created, except through the iterator itself. It compares the collection's `modCount` with the `expectedModCount` it captured.
--- followup How do you remove elements while iterating?
Use `Iterator.remove()`, `Collection.removeIf(predicate)`, iterate over a copy, or collect items to remove and call `removeAll` afterwards.
:::

:::qa intermediate
? Difference between fail-fast and fail-safe iterators?
Fail-fast iterators (most `java.util` collections) throw CME on concurrent structural modification. Fail-safe iterators (concurrent collections) don't throw: `CopyOnWriteArrayList` iterates over an immutable snapshot; `ConcurrentHashMap` provides weakly consistent iteration that tolerates concurrent updates.
:::

:::quiz
? Does `list.set(0, "x")` during iteration of an ArrayList cause CME?
- Yes
+ No — `set` is not a structural modification
- Only for LinkedList
- Only in multi-threaded code
--- explain
Only changes to the list's size/structure increment `modCount`. Replacing an element in place does not.
:::
</script>

<script type="text/x-java-topic">
@id: concurrent-collections
@module: collections
@title: Hashtable vs synchronizedMap vs ConcurrentHashMap
@level: 4
@time: 25
@prereq: hashmap-internals, iterators
@next: generics-basics, synchronization
@tags: concurrenthashmap, hashtable, synchronizedmap, copyonwritearraylist, blockingqueue, cas, lock striping, segment, compute, putifabsent
===
## The problem

A plain `HashMap` shared between threads loses updates and can corrupt its structure. There are three ways to get a thread-safe map, with very different performance.

## Comparison

| | `Hashtable` | `Collections.synchronizedMap(m)` | `ConcurrentHashMap` |
|---|---|---|---|
| Locking | Every method `synchronized` on the table | Every method synchronised on a mutex (the wrapper) | Fine-grained: CAS for empty bins, `synchronized` on the **first node of a bin** for updates |
| Reads | Locked | Locked | **Lock-free** (volatile reads) |
| Concurrency | One thread at a time | One thread at a time | Many readers and writers in parallel |
| Null keys/values | No | Depends on wrapped map | **No** |
| Iteration | Fail-fast (Enumeration not) | Fail-fast; you must synchronise manually while iterating | Weakly consistent, never throws CME |
| Atomic compound ops | No | No | `putIfAbsent`, `compute`, `computeIfAbsent`, `merge` |
| Status | Legacy | For wrapping other maps | **Default choice** |

## How ConcurrentHashMap works (Java 8+)

- Same basic structure as `HashMap`: an array of bins, linked lists, red-black trees for large bins.
- **Reads** (`get`) take no lock: the table and node fields are read with volatile semantics.
- **Insert into an empty bin**: a lock-free **CAS** (compare-and-swap) installs the node.
- **Update a non-empty bin**: `synchronized` on that bin's first node only — other bins remain available.
- **Resizing** is cooperative: threads that encounter a resize in progress help transfer bins (marked by `ForwardingNode`s).
- **Size** is maintained with striped counters (`LongAdder`-style `CounterCell`s) to avoid contention; `mappingCount()` returns a `long`.

:::version Java 7 vs Java 8
Up to Java 7, `ConcurrentHashMap` used **segments** — 16 independent `ReentrantLock`-protected sub-tables by default (the `concurrencyLevel`). Java 8 removed segments in favour of per-bin locking and CAS, improving scalability and memory use. The constructor parameter survives only for compatibility.
:::

## Atomic compound operations — the real reason to use it

```java title="Counter.java"
import java.util.concurrent.ConcurrentHashMap;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;
import java.util.concurrent.TimeUnit;

public class Counter {
    public static void main(String[] args) throws InterruptedException {
        ConcurrentHashMap<String, Integer> hits = new ConcurrentHashMap<>();
        ExecutorService pool = Executors.newFixedThreadPool(8);
        for (int i = 0; i < 10_000; i++) {
            String page = (i % 2 == 0) ? "/home" : "/orders";
            pool.submit(() -> hits.merge(page, 1, Integer::sum));   // atomic read-modify-write
            // WRONG: hits.put(page, hits.get(page) + 1);           // check-then-act race: lost updates
        }
        pool.shutdown();
        pool.awaitTermination(10, TimeUnit.SECONDS);
        System.out.println(hits);   // {/home=5000, /orders=5000} — every time
    }
}
```

Even with a thread-safe map, `get` followed by `put` is two operations — another thread can interleave between them. `merge`, `compute`, `computeIfAbsent` and `putIfAbsent` perform the whole read-modify-write atomically for that key.

:::warn Keep compute functions short
The mapping function runs while the bin is locked. Long computations block other updates to that bin, and modifying the same map from inside the function can deadlock or throw `IllegalStateException` ("Recursive update").
:::

## Other concurrent collections

| Collection | Use case |
|---|---|
| `CopyOnWriteArrayList` / `CopyOnWriteArraySet` | Read-mostly lists such as listener registries — every write copies the array; iteration uses a snapshot |
| `ConcurrentLinkedQueue` / `ConcurrentLinkedDeque` | Lock-free unbounded queues |
| `LinkedBlockingQueue`, `ArrayBlockingQueue` | Producer/consumer: `put` blocks when full, `take` blocks when empty |
| `PriorityBlockingQueue`, `DelayQueue` | Priority / delayed task scheduling |
| `ConcurrentSkipListMap` / `Set` | Concurrent **sorted** map/set (lock-free skip list) |

## Real-life example

:::analogy A bank with many counters
`Hashtable` is a bank with one teller — everyone queues, even to check a balance. `ConcurrentHashMap` is a bank where anyone can read the public rate board without queuing, and each counter (bin) serves its own customers independently; only people needing the *same* counter wait for each other.
:::

:::project
In-memory caches in services (`ConcurrentHashMap<String, Token>`), per-tenant rate-limit counters (`computeIfAbsent(tenant, t -> new AtomicLong())`), and deduplication of in-flight requests. Spring's own bean registries and caches use `ConcurrentHashMap` internally.
:::

## Interview questions

:::qa advanced
? How does ConcurrentHashMap achieve thread safety and high concurrency?
In Java 8+, reads are lock-free using volatile reads; inserts into empty bins use CAS; updates to occupied bins lock only that bin's head node with `synchronized`; resizing is shared among threads; and size is tracked with striped counters. So threads working on different bins never block each other.
--- followup Why doesn't it allow null keys or values?
Because `get` returning null must unambiguously mean "absent". In a concurrent map you can't reliably call `containsKey` afterwards to disambiguate, since another thread may modify the map in between.
--- followup Is `if (!map.containsKey(k)) map.put(k, v);` safe on a ConcurrentHashMap?
No — it's a check-then-act race. Use `putIfAbsent` or `computeIfAbsent`.
:::

:::qa intermediate
? HashMap vs Hashtable?
`HashMap` is unsynchronised, allows one null key and null values, and has fail-fast iterators. `Hashtable` is legacy, synchronises every method, disallows nulls, and is slower. For thread safety, use `ConcurrentHashMap` rather than `Hashtable`.
:::

:::qa scenario
? Your Spring service caches exchange rates in a static `HashMap` that a scheduled job refreshes every minute while request threads read it. Users occasionally see stale or missing rates, and once the service hung. What's wrong and how do you fix it?
Unsynchronised concurrent reads and writes on a `HashMap` (data races, possible structural corruption). Fix: use `ConcurrentHashMap`, or better, build a new immutable map in the job and publish it by assigning a `volatile` reference (copy-on-write), so readers always see a complete, consistent snapshot.
:::

:::quiz
? Which method atomically increments a counter in a `ConcurrentHashMap<String,Integer>`?
- `map.put(k, map.get(k) + 1)`
+ `map.merge(k, 1, Integer::sum)`
- `map.get(k) + 1`
- `map.putIfAbsent(k, 1)`
--- explain
`merge` performs the read-modify-write atomically per key. `put(get()+1)` is two separate operations and loses updates under contention.
:::
</script>

<script type="text/x-java-topic">
@id: generics-basics
@module: generics
@title: Generics: Classes, Methods & Type Safety
@level: 3
@time: 22
@java: 5+
@prereq: collections-overview
@next: generics-wildcards
@tags: generics, type parameter, generic class, generic method, diamond, raw type, type safety, bounded type, extends
===
## Introduction

**Generics** (Java 5) let classes, interfaces and methods be **parameterised by type**: `List<String>`, `Map<Long, Order>`, `Optional<User>`.

Why were they introduced? Before Java 5, collections held `Object`:

```java
List names = new ArrayList();          // raw, pre-generics style
names.add("Asha");
names.add(42);                          // compiles — nothing stops it
String n = (String) names.get(1);       // ClassCastException at RUNTIME
```

Generics move that error to **compile time**, remove casts, and let you write reusable, type-safe code once for many types.

```java
List<String> names = new ArrayList<>();   // diamond operator (Java 7) infers <String>
names.add("Asha");
// names.add(42);                         // compile error
String n = names.get(0);                   // no cast
```

## Generic classes

```java title="ApiResponse.java"
import java.util.List;

public class ApiResponse<T> {                 // T = type parameter
    private final boolean success;
    private final T data;
    private final String error;

    private ApiResponse(boolean success, T data, String error) {
        this.success = success; this.data = data; this.error = error;
    }

    public static <T> ApiResponse<T> ok(T data) {            // generic static factory
        return new ApiResponse<>(true, data, null);
    }

    public static <T> ApiResponse<T> fail(String error) {
        return new ApiResponse<>(false, null, error);
    }

    public T getData() { return data; }
    public boolean isSuccess() { return success; }
    @Override public String toString() { return success ? "OK " + data : "FAIL " + error; }

    public static void main(String[] args) {
        ApiResponse<List<String>> r1 = ApiResponse.ok(List.of("PO-1", "PO-2"));
        ApiResponse<Integer> r2 = ApiResponse.fail("Supplier not found");
        List<String> ids = r1.getData();          // typed: no cast
        System.out.println(r1 + " | " + r2 + " | first=" + ids.get(0));
    }
}
```

Naming conventions: `T` type, `E` element, `K` key, `V` value, `R` result, `N` number, `S`/`U` second/third types.

## Generic methods

A method can declare its own type parameters before the return type, independent of the class:

```java
public static <T extends Comparable<T>> T max(List<T> items) {   // bounded type parameter
    T best = items.get(0);
    for (T item : items) if (item.compareTo(best) > 0) best = item;
    return best;
}

max(List.of(3, 9, 4));            // 9 — T inferred as Integer
max(List.of("pune", "agra"));     // "pune"
```

## Bounded type parameters

- `<T extends Number>` — T must be `Number` or a subclass; inside, you can call `Number` methods (`doubleValue()`).
- `<T extends Comparable<T>>` — T must be comparable to itself.
- Multiple bounds: `<T extends Number & Comparable<T>>` — a class bound first, then interfaces.
- `extends` is used for both classes and interfaces in bounds.

```java
static <N extends Number> double sum(List<N> nums) {
    double s = 0;
    for (N n : nums) s += n.doubleValue();
    return s;
}
```

## Generics don't work with primitives

`List<int>` is illegal — type arguments must be reference types. Use wrappers (`List<Integer>`) or primitive-specialised APIs (`IntStream`, `int[]`). Project Valhalla aims to change this in future Java versions.

## Real-life example

:::analogy A labelled container
A generic class is like a storage box with a label slot. `Box<Shoes>` and `Box<Books>` are built the same way, but the label is enforced at the warehouse door (compile time): you can't put books in the shoe box, and when you take something out, you know exactly what it is without inspecting it.
:::

:::project Generics in Spring code
`JpaRepository<PurchaseOrder, Long>` (entity type, id type), `ResponseEntity<OrderDto>`, `Page<Supplier>`, `RestTemplate.getForObject(url, Invoice.class)`, `Optional<User>`, and your own `ApiResponse<T>` wrapper for consistent JSON responses. Generics are how frameworks provide type-safe APIs for *your* types.
:::

## Common mistakes

:::mistake
- Using **raw types** (`List list = new ArrayList();`) — disables type checking; the compiler warns about "unchecked" operations.
- Expecting `List<Object>` to accept a `List<String>` — generics are invariant (next topic).
- Trying `new T()`, `new T[10]` or `instanceof List<String>` — impossible because of type erasure.
:::

## Interview questions

:::qa basic
? What are generics and why were they introduced?
Generics parameterise types by other types (`List<String>`). They provide compile-time type safety, eliminate explicit casts, and enable reusable algorithms and data structures. Introduced in Java 5 to replace `Object`-based collections that failed with `ClassCastException` at runtime.
--- followup What is the diamond operator?
`<>` in `new ArrayList<>()` (Java 7) lets the compiler infer the type arguments from the target type, reducing repetition. Since Java 9 it also works with anonymous classes when the inferred type is denotable.
:::

:::qa intermediate
? What is a raw type? Why avoid it?
Using a generic type without type arguments, e.g. `List` instead of `List<String>`. It exists for backward compatibility with pre-Java-5 code. It turns off generic type checking, so type errors surface as runtime `ClassCastException`s and the compiler emits unchecked warnings.
:::

:::quiz
? Which declaration is illegal?
- `List<Integer> l;`
+ `List<int> l;`
- `Map<String, List<Integer>> m;`
- `Optional<int[]> o;`
--- explain
Type arguments must be reference types; `int` is primitive. (`int[]` is an array — a reference type — so `Optional<int[]>` is fine.)
:::

:::exercise intermediate
? Generic Pair and swap
Write `Pair<A, B>` with `first()`, `second()` and a method `Pair<B, A> swap()`.
--- solution
```java title="Pair.java"
public final class Pair<A, B> {
    private final A first;
    private final B second;

    public Pair(A first, B second) { this.first = first; this.second = second; }
    public A first() { return first; }
    public B second() { return second; }
    public Pair<B, A> swap() { return new Pair<>(second, first); }
    @Override public String toString() { return "(" + first + ", " + second + ")"; }

    public static void main(String[] args) {
        Pair<String, Integer> p = new Pair<>("stock", 42);
        Pair<Integer, String> s = p.swap();
        System.out.println(p + " → " + s);   // (stock, 42) → (42, stock)
    }
}
```
--- explanation
The class has two independent type parameters; `swap` returns a pair with them reversed, and the compiler tracks the types exactly. With Java 16+, `record Pair<A, B>(A first, B second)` is even shorter.
:::
</script>

<script type="text/x-java-topic">
@id: generics-wildcards
@module: generics
@title: Wildcards, PECS & Variance
@level: 4
@time: 25
@prereq: generics-basics
@next: type-erasure
@tags: wildcard, ? extends, ? super, pecs, producer extends consumer super, invariance, covariance, contravariance, upper bound, lower bound
===
## Generics are invariant

Even though `Integer` is a subtype of `Number`, `List<Integer>` is **not** a subtype of `List<Number>`:

```java
List<Integer> ints = new ArrayList<>(List.of(1, 2));
// List<Number> nums = ints;       // compile error
// If it were allowed:
// nums.add(3.14);                  // a Double inside a List<Integer>! heap pollution
```

Arrays made the opposite choice (covariant) and pay for it with runtime `ArrayStoreException`s. Generics are invariant so these errors are caught at compile time. **Wildcards** add controlled flexibility.

## The three wildcards

| Wildcard | Name | Accepts | Can read as | Can write |
|---|---|---|---|---|
| `List<?>` | Unbounded | A list of anything | `Object` | Only `null` |
| `List<? extends Number>` | Upper-bounded (covariant) | `List<Number>`, `List<Integer>`, `List<Double>`… | `Number` | Only `null` |
| `List<? super Integer>` | Lower-bounded (contravariant) | `List<Integer>`, `List<Number>`, `List<Object>` | `Object` | `Integer` (and subtypes) |

Why can't you add to `List<? extends Number>`? The compiler doesn't know the actual element type — it could be a `List<Double>` — so adding an `Integer` could corrupt it. Why can you add an `Integer` to `List<? super Integer>`? Whatever the actual type is (`Integer`, `Number`, `Object`), an `Integer` fits.

## PECS — Producer Extends, Consumer Super

Joshua Bloch's rule of thumb (Effective Java):

- If a parameter **produces** values you read → `? extends T`.
- If a parameter **consumes** values you write into it → `? super T`.
- If it does both → use the exact type `T`.

```java title="Pecs.java"
import java.util.*;

public class Pecs {
    // src PRODUCES Ts (we read), dest CONSUMES Ts (we write)
    static <T> void copy(List<? super T> dest, List<? extends T> src) {
        for (T item : src) dest.add(item);
    }

    static double total(Collection<? extends Number> amounts) {   // producer → extends
        double sum = 0;
        for (Number n : amounts) sum += n.doubleValue();
        return sum;
    }

    static void addDefaults(List<? super Integer> sink) {          // consumer → super
        sink.add(0);
        sink.add(100);
    }

    static void printAll(List<?> anything) {                       // only Object-level reads needed
        for (Object o : anything) System.out.print(o + " ");
        System.out.println();
    }

    public static void main(String[] args) {
        List<Integer> ints = List.of(1, 2, 3);
        List<Double> doubles = List.of(1.5, 2.5);
        System.out.println(total(ints) + " " + total(doubles));      // 6.0 4.0

        List<Number> numbers = new ArrayList<>();
        copy(numbers, ints);                                          // T = Integer
        addDefaults(numbers);
        List<Object> objects = new ArrayList<>();
        addDefaults(objects);
        printAll(numbers);                                            // 1 2 3 0 100
        printAll(objects);                                            // 0 100
    }
}
```

The JDK uses PECS everywhere: `Collections.copy(List<? super T> dest, List<? extends T> src)`, `addAll(Collection<? extends E>)`, `Comparator<? super T>` in `sort`, and `Function<? super T, ? extends R>` in `Stream.map`.

## Wildcard vs type parameter

```java
static void printList(List<?> list) { … }            // don't care about the type
static <T> void swap(List<T> list, int i, int j) { … } // need to relate types: the same T in and out
```

Use a type parameter when you must refer to the type more than once (tie input and output together); use a wildcard when the type is used once.

## Real-life example

:::analogy Fruit baskets
A basket declared "some kind of fruit" (`? extends Fruit`) can be *read from* — whatever you take out is a fruit — but you can't put an apple in, because it might be the mango basket. A bin labelled "accepts apples or anything more general" (`? super Apple`) can *receive* apples — whether it's the apple bin, the fruit bin or the general compost bin — but when you pull something out, all you know is that it's *some thing*.
:::

## Interview questions

:::qa advanced
? What is the difference between `List<? extends T>` and `List<? super T>`?
`? extends T` accepts lists of T or any subtype; you can safely read elements as T but not add (except null) — use it for producers. `? super T` accepts lists of T or any supertype; you can add T values but only read as `Object` — use it for consumers. This is the PECS principle.
--- followup Why is `List<Integer>` not a subtype of `List<Number>`?
Because a `List<Number>` reference would allow adding a `Double`, corrupting the `List<Integer>`. Invariance catches that at compile time; wildcards provide safe covariance/contravariance where needed.
:::

:::qa intermediate
? What's the difference between `List<?>`, `List<Object>` and raw `List`?
`List<?>` is a list of some unknown type — type-safe, read as `Object`, can't add (except null). `List<Object>` is a list that holds any objects; you can add anything, but a `List<String>` can't be assigned to it. Raw `List` disables generic checks entirely — unsafe, for legacy code only.
:::

:::quiz
? Which method signature lets you pass both `List<Integer>` and `List<Double>` and sum them?
- `double sum(List<Number> l)`
+ `double sum(List<? extends Number> l)`
- `double sum(List<? super Number> l)`
- `double sum(List<Object> l)`
--- explain
Upper-bounded wildcards accept lists of any subtype of `Number`, and elements can be read as `Number`.
:::
</script>

<script type="text/x-java-topic">
@id: type-erasure
@module: generics
@title: Type Erasure & Its Consequences
@level: 4
@time: 18
@prereq: generics-wildcards
@next: threads-basics
@tags: type erasure, bridge method, reifiable, heap pollution, typetoken, class literal, generic array, overload clash
===
## What is type erasure?

Generics exist only at **compile time**. After checking types, `javac` **erases** them:

- Type parameters are replaced by their **bound** (`T` → `Object`; `T extends Number` → `Number`).
- Casts are inserted where values come out (`String s = (String) list.get(0)`).
- **Bridge methods** are generated to keep polymorphism working with erased signatures.

At runtime, a `List<String>` and a `List<Integer>` are both just `ArrayList` objects of the same class.

```java
List<String> a = new ArrayList<>();
List<Integer> b = new ArrayList<>();
System.out.println(a.getClass() == b.getClass());   // true — both are java.util.ArrayList
```

### Why erasure?

**Backward compatibility (migration compatibility).** Java 5 had to run with millions of lines of existing non-generic code and libraries, and old bytecode had to interoperate with new generic code without recompilation. Erasure meant no JVM changes were required. C# chose *reified* generics instead (type information kept at runtime) because it could afford a clean break.

## Consequences — things you cannot do

| Not allowed | Why | Workaround |
|---|---|---|
| `new T()` | No `T` at runtime | Pass a `Supplier<T>` or `Class<T>` |
| `new T[10]` / `new List<String>[10]` | Arrays need a runtime component type | `(T[]) new Object[n]` with care, or use a `List<T>` |
| `obj instanceof List<String>` | Type argument unknown at runtime | `obj instanceof List<?>` |
| `static T field` | Static members are shared across all parameterisations | Make the method generic instead |
| Overloads `m(List<String>)` and `m(List<Integer>)` | Both erase to `m(List)` → clash | Different method names |
| Primitive type arguments | Erasure to `Object` needs references | Wrappers |
| Catching `T` / generic exception classes | Catch needs a runtime type | — |

```java
class Repo<T> {
    private final Class<T> type;                 // "type token" keeps runtime type info
    Repo(Class<T> type) { this.type = type; }
    T create() throws ReflectiveOperationException {
        return type.getDeclaredConstructor().newInstance();
    }
}
```

## Bridge methods

```java
class Node<T> { void set(T v) { } }            // erased: set(Object)
class IntNode extends Node<Integer> {
    @Override void set(Integer v) { }           // erased: set(Integer) — doesn't override set(Object)!
}
// javac generates in IntNode:  void set(Object v) { set((Integer) v); }   ← synthetic bridge method
```

## Heap pollution

A variable of a parameterised type refers to an object that isn't of that type — possible through raw types, unchecked casts or generic varargs. The error surfaces later as a `ClassCastException` far from the cause. That's why the compiler warns about "unchecked" operations and why `@SafeVarargs` exists for generic varargs methods proven safe.

:::info Where generic info *does* survive
Erasure removes type arguments from **objects**, but declarations keep signatures in class-file metadata. Reflection can read `Field.getGenericType()` or a superclass's type arguments — which is how Jackson's `TypeReference<List<Order>>(){}` and Spring's `ParameterizedTypeReference` recover `List<Order>` at runtime (via an anonymous subclass).
:::

## Interview questions

:::qa advanced
? What is type erasure?
The compiler removes generic type information after type checking: type parameters become their bounds (usually `Object`), casts are inserted at use sites, and bridge methods are generated. At runtime there's only one class per generic type (`ArrayList`), which keeps compatibility with pre-generics code.
--- followup What problems does it cause?
You can't create instances or arrays of `T`, use `instanceof` with type arguments, overload methods differing only in type arguments, or use primitives as type arguments; unchecked casts can cause heap pollution.
--- followup How do libraries like Jackson know it's a `List<Order>`?
Through "super type tokens": you create an anonymous subclass such as `new TypeReference<List<Order>>() {}`; the subclass's generic superclass signature is stored in the class file and readable via reflection.
:::

:::qa tricky
? Will `void process(List<String> l)` and `void process(List<Integer> l)` compile in the same class?
No. Both erase to `process(List)`, a "name clash: have the same erasure" compile error.
:::

:::quiz
? What does `new ArrayList<String>().getClass() == new ArrayList<Integer>().getClass()` return?
+ true
- false
- compile error
- It depends on the JVM
--- explain
Due to erasure both are instances of the same runtime class, `java.util.ArrayList`.
:::
</script>
