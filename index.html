@id: enums
@module: core
@title: Enums
@level: 2
@time: 18
@java: 5+
@prereq: static-keyword, switch
@next: nested-classes
@tags: enum, constants, values, valueof, ordinal, enummap, enumset, singleton, constant-specific methods
===
## Introduction

An **enum** is a type with a fixed set of named instances: order statuses, days of the week, GST slabs, user roles. Before Java 5, developers used `public static final int` constants — nothing stopped a method from receiving `status = 42`, and printing a status showed a meaningless number. Enums are **type-safe**, readable, and full classes that can carry fields and behaviour.

## Basic and rich enums

```java title="OrderFlow.java"
public class OrderFlow {
    enum Status {
        DRAFT("Draft", false),
        SUBMITTED("Submitted", false),
        APPROVED("Approved", true),
        REJECTED("Rejected", true);

        private final String label;       // enums can have fields…
        private final boolean terminal;

        Status(String label, boolean terminal) {   // …and constructors (always private)
            this.label = label;
            this.terminal = terminal;
        }

        String label() { return label; }
        boolean isTerminal() { return terminal; }

        boolean canMoveTo(Status next) {           // …and behaviour
            return switch (this) {
                case DRAFT -> next == SUBMITTED;
                case SUBMITTED -> next == APPROVED || next == REJECTED;
                case APPROVED, REJECTED -> false;
            };
        }
    }

    enum GstSlab {
        EXEMPT { double tax(double v) { return 0; } },
        STANDARD { double tax(double v) { return v * 0.18; } },   // constant-specific body
        LUXURY { double tax(double v) { return v * 0.28; } };
        abstract double tax(double v);
    }

    public static void main(String[] args) {
        Status s = Status.SUBMITTED;
        System.out.println(s + " → approved? " + s.canMoveTo(Status.APPROVED));  // SUBMITTED → approved? true
        System.out.println(Status.valueOf("DRAFT").label());                      // Draft
        for (Status st : Status.values()) System.out.print(st.ordinal() + ":" + st + " ");
        System.out.println();
        System.out.println(GstSlab.STANDARD.tax(1000));                            // 180.0
    }
}
```

## How enums work internally

`enum Status { DRAFT, … }` compiles roughly to:

```java
public final class Status extends java.lang.Enum<Status> {
    public static final Status DRAFT = new Status("DRAFT", 0, "Draft", false);
    // … one static final instance per constant, created during class initialisation
    private static final Status[] $VALUES = { DRAFT, SUBMITTED, APPROVED, REJECTED };
    public static Status[] values() { return $VALUES.clone(); }
    public static Status valueOf(String name) { … }
}
```

Consequences:

- Each constant is a **singleton** created once, thread-safely, when the class initialises — so `==` is the correct way to compare enums (and is null-safe).
- Enums implicitly extend `java.lang.Enum`, so they **cannot extend another class**, but they **can implement interfaces**.
- Constructors are implicitly `private`; you cannot `new` an enum.
- `values()` returns a fresh copy of the array each call.
- `valueOf("X")` throws `IllegalArgumentException` for unknown names.
- Enums are `Comparable` (by ordinal) and `Serializable` (by name — safe across versions).

## EnumMap and EnumSet

```java
EnumMap<Status, Integer> counts = new EnumMap<>(Status.class);  // array indexed by ordinal: very fast
EnumSet<Status> open = EnumSet.of(Status.DRAFT, Status.SUBMITTED);   // bit vector internally
```

## Real-life example

:::analogy Traffic lights
A traffic light can be RED, AMBER or GREEN — never "purple" or 42. Each state knows what comes next. An enum captures exactly that closed set and its rules.
:::

:::project
In Spring/JPA, map enums with `@Enumerated(EnumType.STRING)`. The default `ORDINAL` stores 0, 1, 2… — inserting a new constant in the middle silently corrupts existing data. Jackson serialises enums by name in JSON (`"status": "APPROVED"`).
:::

:::mistake
- Persisting `ordinal()` values.
- Using `valueOf` on user input without handling `IllegalArgumentException`.
- Giant switch statements over an enum in many places instead of putting behaviour in the enum itself.
:::

## Interview questions

:::qa basic
? What is an enum and why use it instead of int constants?
A special class with a fixed set of named instances. It gives compile-time type safety (a method taking `Status` can't receive 42), readable names in logs, a namespace, the ability to add fields and methods, switch support, and efficient `EnumSet`/`EnumMap`.
:::

:::qa intermediate
? Can an enum have a constructor, extend a class, or implement an interface?
It can have constructors (always private), fields and methods. It cannot extend a class because it already extends `java.lang.Enum`. It can implement interfaces.
--- followup Why is an enum a good way to implement a singleton?
`enum Registry { INSTANCE; … }` is thread-safe by class-initialisation rules, handles serialisation correctly (no second instance on deserialisation), and resists reflection attacks — `Constructor.newInstance` refuses to create enum instances.
:::

:::qa tricky
? Should you compare enums with == or equals?
`==`. Each constant is a single instance, so identity comparison is correct, faster, and null-safe (`status == Status.DRAFT` doesn't throw if `status` is null); `Enum.equals` is final and itself uses `==`.
:::

:::quiz
? What does `Status.valueOf("draft")` do for constant `DRAFT`?
- Returns `DRAFT`
- Returns null
+ Throws `IllegalArgumentException`
- Compile error
--- explain
`valueOf` matches names exactly (case-sensitive) and throws for unknown names.
:::
</script>

<script type="text/x-java-topic">
@id: nested-classes
@module: core
@title: Nested, Inner, Local & Anonymous Classes
@level: 3
@time: 20
@prereq: static-keyword, interfaces
@next: immutability
@tags: nested class, inner class, static nested class, local class, anonymous class, outer.this, memory leak, builder
===
## Introduction

Java lets you declare a class inside another class (or even inside a method). Nested classes group helper types with the only class that uses them, can access the enclosing class's private members, and are the foundation for iterators, builders and — historically — event listeners.

| Kind | Declared | Needs an outer instance? | Typical use |
|---|---|---|---|
| **Static nested class** | `static class Inner` inside a class | No | Builders, `Map.Entry`-like helpers, grouping |
| **Inner class** (non-static) | `class Inner` inside a class | **Yes** — holds hidden `Outer.this` | Iterators tied to one collection instance |
| **Local class** | Inside a method body | Yes if in an instance method | One-off helper with a name |
| **Anonymous class** | `new Interface() { … }` expression | Yes if in an instance context | One-off implementations (pre-lambda callbacks) |

## Examples of each

```java title="Library.java"
import java.util.ArrayList;
import java.util.Comparator;
import java.util.Iterator;
import java.util.List;

public class Library implements Iterable<String> {
    private final List<String> books = new ArrayList<>();
    private int borrowCount;

    // 1. Static nested class: independent of any Library instance
    public static class Stats {
        public final int size;
        Stats(int size) { this.size = size; }
    }

    // 2. Inner class: each instance is bound to a Library and can read its private fields
    private class BookIterator implements Iterator<String> {
        private int index;
        public boolean hasNext() { return index < books.size(); }     // accesses Library.this.books
        public String next() { borrowCount++; return books.get(index++); }
    }

    public Iterator<String> iterator() { return new BookIterator(); }

    public void add(String b) { books.add(b); }

    public List<String> sorted() {
        // 3. Local class
        class ByLength implements Comparator<String> {
            public int compare(String a, String b) { return Integer.compare(a.length(), b.length()); }
        }
        List<String> copy = new ArrayList<>(books);
        copy.sort(new ByLength());

        // 4. Anonymous class (a lambda would be shorter: (a, b) -> a.compareTo(b))
        copy.sort(new Comparator<String>() {
            @Override public int compare(String a, String b) { return a.compareTo(b); }
        });
        return copy;
    }

    public static void main(String[] args) {
        Library lib = new Library();
        lib.add("Effective Java");
        lib.add("Clean Code");
        for (String b : lib) System.out.println(b);           // uses the inner class iterator
        Library.Stats s = new Library.Stats(2);                // no Library instance needed
        Library.BookIterator it = lib.new BookIterator();      // inner: created FROM an instance
        System.out.println(s.size + " " + it.hasNext() + " " + lib.sorted());
    }
}
```

## Inner classes hold a hidden reference

The compiler gives every inner-class instance a synthetic field `this$0` pointing to the outer object. Consequences:

- It can use the outer instance's fields directly (`books`, `borrowCount`).
- **Memory leak risk**: if an inner-class object (e.g. a listener, a `Runnable` submitted to a long-lived executor, a cached callback) outlives the outer object, it keeps the whole outer object — and everything *it* references — reachable.

:::tip Default to static nested
If the nested class doesn't need the outer instance, make it `static`. It's smaller, clearer and can't leak the outer object. (Effective Java, Item 24.)
:::

## Anonymous classes vs lambdas

| | Anonymous class | Lambda |
|---|---|---|
| Implements | Any interface or abstract class, any number of methods | Only functional interfaces |
| `this` refers to | The anonymous class instance | The enclosing instance |
| State | Can have fields | Stateless (captures effectively final locals) |
| Compiled to | A separate `Outer$1.class` | `invokedynamic` + generated method, no extra class file |

## Interview questions

:::qa intermediate
? What is the difference between a static nested class and an inner class?
A static nested class is like a top-level class scoped inside another; it doesn't need or hold an outer instance. An inner class is associated with an instance of the outer class, holds a hidden reference to it, can access its instance members, and must be created via `outer.new Inner()`.
--- followup Why can inner classes cause memory leaks?
The hidden `Outer.this` reference keeps the outer object alive as long as the inner object is reachable — e.g. an anonymous listener registered with a long-lived service retains its enclosing activity, controller or large object graph.
:::

:::qa tricky
? Can an inner class have static members?
Before Java 16, only `static final` compile-time constants. Since **Java 16** (JEP 395, alongside records), inner classes may declare static members, including static methods and nested records.
:::

:::quiz
? How do you instantiate a non-static inner class `Inner` of `Outer` from outside?
- `new Outer.Inner()`
+ `outerInstance.new Inner()`
- `Outer.new Inner()`
- `new Inner(Outer.class)`
--- explain
An inner class instance must be bound to an outer instance, hence the `outer.new Inner()` syntax.
:::
</script>

<script type="text/x-java-topic">
@id: immutability
@module: core
@title: Designing Immutable Classes
@level: 3
@time: 18
@prereq: final-keyword, equals-hashcode
@next: exception-hierarchy
@tags: immutable, immutability, defensive copy, final class, thread safe, record, value object, unmodifiable
===
## Introduction

An **immutable** object's state cannot change after construction. `String`, `Integer`, `BigDecimal`, `LocalDate`, `UUID` and `List.of(...)` are immutable. They are:

- **Thread-safe** by nature — no locks needed for sharing.
- **Safe keys** in maps and sets (hash codes never change).
- **Easy to reason about** — no "who changed this?" debugging.
- **Freely shareable and cacheable** — no defensive copying when passing them around.

The cost: every "change" creates a new object (usually negligible thanks to young-generation GC).

## The recipe

1. Declare the class **`final`** (or make constructors private with static factories) so subclasses can't add mutability.
2. Make all fields **`private final`**.
3. Provide **no setters** or other mutators.
4. **Defensively copy** mutable inputs in the constructor and mutable outputs in getters.
5. Don't let `this` escape during construction.

```java title="PurchaseOrder.java"
import java.time.LocalDate;
import java.util.ArrayList;
import java.util.Collections;
import java.util.Date;
import java.util.List;

public final class PurchaseOrder {                        // 1. final
    private final String number;                          // 2. private final
    private final LocalDate date;                         //    LocalDate is already immutable
    private final List<String> items;                     //    List is mutable → needs care
    private final Date legacyApproval;                    //    java.util.Date is mutable → needs care

    public PurchaseOrder(String number, LocalDate date, List<String> items, Date approval) {
        this.number = number;
        this.date = date;
        this.items = List.copyOf(items);                  // 4. defensive, unmodifiable copy (rejects nulls)
        this.legacyApproval = new Date(approval.getTime());   // 4. copy the mutable Date
    }

    public String getNumber() { return number; }
    public LocalDate getDate() { return date; }
    public List<String> getItems() { return items; }      // already unmodifiable
    public Date getLegacyApproval() { return new Date(legacyApproval.getTime()); }  // 4. copy on the way out

    public PurchaseOrder withItem(String item) {          // 3. "wither": returns a NEW object
        List<String> next = new ArrayList<>(items);
        next.add(item);
        return new PurchaseOrder(number, date, next, legacyApproval);
    }

    public static void main(String[] args) {
        List<String> src = new ArrayList<>(List.of("Cement"));
        PurchaseOrder po = new PurchaseOrder("PO-1", LocalDate.of(2026, 9, 1), src, new Date());
        src.add("Hacked");                                 // no effect on po
        PurchaseOrder po2 = po.withItem("Steel");
        System.out.println(po.getItems() + " " + po2.getItems());   // [Cement] [Cement, Steel]
        System.out.println(Collections.emptyList().equals(List.of()));  // true
    }
}
```

:::version Records (Java 16+)
`record Money(BigDecimal amount, String currency) {}` gives `private final` fields, a canonical constructor, accessors, `equals`, `hashCode` and `toString`. Records are **shallowly** immutable — a `List` component still needs `List.copyOf` in a compact constructor. See [Records](#records).
:::

## Unmodifiable vs immutable

| | `Collections.unmodifiableList(list)` | `List.copyOf(list)` / `List.of(...)` |
|---|---|---|
| What it is | A read-only **view** of the original | An independent immutable **copy** |
| Original changes visible? | **Yes** | No |
| Nulls | Allowed | Rejected (`NullPointerException`) |

## Interview questions

:::qa intermediate
? How do you create an immutable class in Java?
Make the class final, fields private and final, provide no setters, initialise everything in the constructor, defensively copy mutable inputs and outputs (collections, `Date`, arrays), and return new instances for modifications.
--- followup Why must the class be final?
A subclass could add mutable fields or override methods to expose changing state, so a reference of the parent type could no longer be trusted to be immutable.
--- followup Is a class with only final fields immutable?
Not necessarily — a final field may reference a mutable object (a `List`, an array, a `Date`) that can still be changed through a leaked reference.
:::

:::qa scenario
? Your immutable `Config` class holds a `Map<String,String>`. A caller modifies the map they passed in, and your config "changes". Fix it.
Copy the map in the constructor with `Map.copyOf(input)` (or `Collections.unmodifiableMap(new HashMap<>(input))` if nulls are needed), and return that unmodifiable copy from the getter.
:::

:::quiz
? `List<String> view = Collections.unmodifiableList(src); src.add("x");` — does `view` contain "x"?
+ Yes
- No
- An exception is thrown
- Only after refresh
--- explain
An unmodifiable list is a read-only view over the original; changes to `src` show through. `List.copyOf` creates an independent copy.
:::
</script>

<script type="text/x-java-topic">
@id: exception-hierarchy
@module: exceptions
@title: Exceptions & the Throwable Hierarchy
@level: 2
@time: 20
@prereq: methods, inheritance
@next: try-catch-finally
@tags: exception, error, throwable, runtimeexception, stack trace, hierarchy, outofmemoryerror, stackoverflowerror
===
## Introduction

An **exception** is an event that disrupts the normal flow of a program — a file that doesn't exist, a network timeout, a null reference, invalid user input. Before exceptions, languages like C signalled failure through return codes (`-1`, `NULL`) that callers could silently ignore, mixing error handling into every line of business logic.

Java's exception mechanism:

- **Separates** error-handling code from normal logic.
- **Propagates** errors up the call stack automatically until someone handles them.
- **Carries information**: type, message, cause, and a full **stack trace**.
- Uses the type system — for **checked exceptions** the compiler forces callers to acknowledge failure.

## The hierarchy

:::diagram java.lang.Throwable
[v] Throwable :: message · cause · stack trace · suppressed exceptions
[w] Error (unchecked) :: serious JVM/system problems — OutOfMemoryError, StackOverflowError, NoClassDefFoundError, ExceptionInInitializerError || [a] Exception (checked) :: recoverable conditions — IOException, SQLException, InterruptedException, ClassNotFoundException
[g] RuntimeException (unchecked, extends Exception) :: programming errors & validation — NullPointerException, IllegalArgumentException, IllegalStateException, ArithmeticException, IndexOutOfBoundsException, ClassCastException, NumberFormatException, ConcurrentModificationException
:::

| Branch | Checked? | Meaning | Should you catch it? |
|---|---|---|---|
| `Error` | Unchecked | The JVM or environment is in trouble | Almost never (maybe log at the top level) |
| `Exception` (not Runtime) | **Checked** | Anticipated external failures a caller can reasonably recover from | Yes, or declare with `throws` |
| `RuntimeException` | Unchecked | Bugs or violated preconditions | Usually fix the bug; catch at boundaries |

## What happens when an exception is thrown

```java title="Propagation.java"
public class Propagation {
    static int parseQty(String s) {
        return Integer.parseInt(s);            // throws NumberFormatException for "ten"
    }
    static int total(String[] qtys) {
        int sum = 0;
        for (String q : qtys) sum += parseQty(q);
        return sum;
    }
    public static void main(String[] args) {
        try {
            System.out.println(total(new String[]{"4", "ten"}));
        } catch (NumberFormatException e) {
            System.out.println("Bad quantity: " + e.getMessage());
            e.printStackTrace();
        }
    }
}
```

```output
Bad quantity: For input string: "ten"
java.lang.NumberFormatException: For input string: "ten"
    at java.base/java.lang.NumberFormatException.forInputString(NumberFormatException.java:67)
    at java.base/java.lang.Integer.parseInt(Integer.java:668)
    at Propagation.parseQty(Propagation.java:3)
    at Propagation.total(Propagation.java:7)
    at Propagation.main(Propagation.java:12)
```

1. `Integer.parseInt` creates an exception object (capturing the stack trace) and **throws** it.
2. The JVM looks for a matching `catch` in the current method using the method's **exception table**. None in `parseInt`, `parseQty`, or `total`, so each frame is **popped** (stack unwinding).
3. `main` has a matching `catch`; control jumps there.
4. If nothing catches it, the thread terminates and the default handler prints the stack trace. If that thread is `main` and no other non-daemon threads are running, the JVM exits.

**Reading a stack trace:** the top line is the exception type and message; the first frame is where it was thrown; read downward to find the first frame in *your* code. `Caused by:` sections show wrapped root causes — the last `Caused by` is usually the real problem.

## Real-life example

:::analogy Escalation at a company
A junior employee hits a problem they can't solve (throw). They escalate to their team lead (the calling method). If the lead can't resolve it, it goes to the manager, then the director — each level either handles it (catch) or passes it up (propagate). If it reaches the CEO unresolved, the whole operation stops (thread dies). The written incident report is the stack trace.
:::

:::project
In a Spring Boot API, exceptions thrown anywhere in controllers/services propagate up to the framework. A `@RestControllerAdvice` with `@ExceptionHandler` methods converts them into consistent HTTP responses — `404` for `EntityNotFoundException`, `400` for validation errors, `500` for the unexpected — so business code simply throws meaningful exceptions.
:::

## Interview questions

:::qa basic
? What is the difference between Error and Exception?
Both extend `Throwable`. `Error` indicates serious problems in the JVM or environment (out of memory, stack overflow, class loading failures) that applications generally shouldn't try to recover from. `Exception` represents conditions an application may anticipate and handle.
--- followup Can you catch an Error?
Syntactically yes (`catch (OutOfMemoryError e)`), but it is rarely appropriate — the JVM may be in an inconsistent state. Top-level handlers sometimes catch `Throwable` just to log before exiting.
:::

:::qa intermediate
? What happens if an exception is not caught?
It propagates up the call stack, popping frames. If no handler is found, the thread's uncaught exception handler runs (by default, printing the stack trace to `System.err`) and the thread terminates. The JVM exits when no non-daemon threads remain.
:::

:::qa tricky
? Is NullPointerException checked or unchecked? What about ClassNotFoundException and NoClassDefFoundError?
NPE is unchecked (`RuntimeException`). `ClassNotFoundException` is a **checked** exception (thrown by `Class.forName` and friends). `NoClassDefFoundError` is an `Error` — a class available at compile time is missing or failed to initialise at runtime.
:::

:::quiz
? Which is a checked exception?
- `IllegalArgumentException`
- `ArithmeticException`
+ `IOException`
- `StackOverflowError`
--- explain
`IOException` extends `Exception` but not `RuntimeException`, so it's checked. The first two are runtime exceptions; `StackOverflowError` is an `Error`.
:::
</script>

<script type="text/x-java-topic">
@id: try-catch-finally
@module: exceptions
@title: try, catch, finally & Multi-catch
@level: 2
@time: 20
@prereq: exception-hierarchy
@next: throw-throws
@tags: try, catch, finally, multi-catch, catch order, return in finally, system.exit
===
## Syntax and flow

```java
try {
    // code that may throw
} catch (FileNotFoundException e) {        // most specific first
    // handle
} catch (IOException | SQLException e) {   // multi-catch (Java 7)
    // handle either
} catch (Exception e) {                    // most general last
    // fallback
} finally {
    // ALWAYS runs: after try, after a catch, even after return
}
```

Rules:

- `try` must be followed by at least one `catch` or a `finally` (or be try-with-resources).
- Catch blocks are checked **top to bottom**; the first matching type wins. A superclass catch before a subclass catch makes the latter unreachable → **compile error**.
- In multi-catch the alternatives must not be subclasses of one another, and `e` is implicitly `final`.

## Example

```java title="ReadConfig.java"
import java.io.BufferedReader;
import java.io.FileNotFoundException;
import java.io.FileReader;
import java.io.IOException;

public class ReadConfig {
    static String firstLine(String path) {
        BufferedReader reader = null;
        try {
            reader = new BufferedReader(new FileReader(path));
            return reader.readLine();
        } catch (FileNotFoundException e) {
            System.out.println("Missing file: " + path);
            return "";
        } catch (IOException e) {
            throw new IllegalStateException("Could not read " + path, e);   // wrap with cause
        } finally {
            System.out.println("finally runs");      // runs before the return value is handed back
            if (reader != null) {
                try { reader.close(); } catch (IOException ignored) { }
            }
        }
    }
    public static void main(String[] args) {
        System.out.println("[" + firstLine("does-not-exist.cfg") + "]");
    }
}
```

The verbose `finally` + nested `try` for closing is exactly what [try-with-resources](#try-with-resources) removes.

## When does finally NOT run?

`finally` runs after normal completion, after `return`, `break`, `continue`, and after exceptions. It does **not** run if:

- `System.exit()` is called (or `Runtime.halt()`),
- the JVM crashes or is killed (`kill -9`),
- the thread is a daemon thread and the JVM exits,
- an infinite loop or deadlock occurs inside `try`.

## finally and return — the trick questions

```java title="FinallyReturn.java"
public class FinallyReturn {
    @SuppressWarnings("finally")
    static int a() {
        try { return 1; }
        finally { return 2; }          // overrides the return — and would swallow any exception!
    }
    static int b() {
        int x = 10;
        try { return x; }              // the VALUE 10 is saved for return
        finally { x = 20; }            // changing x doesn't affect the saved value
    }
    static StringBuilder c() {
        StringBuilder sb = new StringBuilder("A");
        try { return sb; }             // the saved value is a REFERENCE
        finally { sb.append("B"); }    // mutating the object IS visible
    }
    public static void main(String[] args) {
        System.out.println(a() + " " + b() + " " + c());   // 2 10 AB
    }
}
```

:::warn Never return (or throw) from finally
A `return` in `finally` discards any exception thrown in `try`/`catch` — the error disappears silently. javac warns about it (`-Xlint:finally`).
:::

## Real-life example

:::analogy Cooking with the gas on
`try` is cooking; `catch` is handling a burnt dish or a spill; `finally` is **turning off the gas** — you do it whether the meal succeeded, failed, or you were called away mid-way (return). The only time it doesn't happen is if the building's power fails completely (`System.exit`, JVM crash).
:::

## Common mistakes

:::mistake
- Empty catch blocks — `catch (Exception e) {}` — swallow failures and make debugging impossible. At minimum log with the exception object.
- `catch (Exception e)` everywhere, hiding bugs like NPEs as "handled".
- Logging **and** rethrowing at every layer → the same stack trace logged five times.
- Losing the cause: `throw new ServiceException("failed")` instead of `throw new ServiceException("failed", e)`.
- `e.printStackTrace()` in server code instead of a logger.
:::

## Interview questions

:::qa basic
? Can a try block exist without catch?
Yes, with `finally` (`try { … } finally { … }`) or as a try-with-resources statement, which may have neither catch nor finally.
:::

:::qa tricky
? What is returned: `try { return 1; } finally { return 2; }`?
2. The `finally` block's `return` replaces the pending return value. It would also discard an exception thrown in the try — which is why returning from `finally` is considered a bug.
--- followup `int x = 1; try { return x; } finally { x = 5; }` returns?
1. The return value is evaluated and stored before `finally` runs; reassigning the local variable later doesn't change it. (If the value were a reference to a mutable object, mutations would be visible.)
:::

:::qa tricky
? Will finally execute if System.exit(0) is called in try?
No. `System.exit` starts JVM shutdown (running shutdown hooks) and never returns, so the `finally` block is not executed.
:::

:::qa intermediate
? Why does the compiler reject catching `Exception` before `IOException`?
The `IOException` catch would be unreachable — every `IOException` is already caught by the earlier `Exception` block. Javac reports "exception IOException has already been caught".
:::

:::quiz
? What prints? `try { throw new RuntimeException("x"); } catch (Exception e) { System.out.print("C"); } finally { System.out.print("F"); } System.out.print("E");`
- C
- CF
+ CFE
- FCE
--- explain
The exception is caught (C), finally runs (F), then normal execution continues after the try statement (E).
:::
</script>

<script type="text/x-java-topic">
@id: throw-throws
@module: exceptions
@title: throw vs throws & Exception Chaining
@level: 2
@time: 15
@prereq: try-catch-finally
@next: checked-unchecked
@tags: throw, throws, rethrow, exception chaining, cause, getcause, overriding exceptions
===
## throw — raise an exception now

`throw` is a **statement** that throws one exception object:

```java
if (quantity <= 0) {
    throw new IllegalArgumentException("Quantity must be positive, got " + quantity);
}
```

## throws — declare what may escape

`throws` is part of a **method declaration** listing checked exceptions the method doesn't handle and passes to its callers:

```java
public String load(Path file) throws IOException {   // callers must handle or declare IOException
    return Files.readString(file);
}
```

| | `throw` | `throws` |
|---|---|---|
| Where | Inside a method body | In a method/constructor signature |
| Followed by | One exception **instance** | One or more exception **types** |
| Purpose | Actually raise an exception | Declare possible exceptions to callers |
| Required for | — | Checked exceptions not handled locally |
| Example | `throw new IOException("x");` | `void read() throws IOException, SQLException` |

## Exception chaining — keep the root cause

When translating a low-level exception into a higher-level one, pass the original as the **cause**:

```java title="Chaining.java"
public class Chaining {
    static class InvoiceServiceException extends RuntimeException {
        InvoiceServiceException(String msg, Throwable cause) { super(msg, cause); }
    }

    static int loadInvoiceTotal(String id) {
        try {
            return Integer.parseInt(id.substring(4));           // simulate a low-level failure
        } catch (NumberFormatException e) {
            throw new InvoiceServiceException("Cannot load invoice " + id, e);   // chain
        }
    }

    public static void main(String[] args) {
        try {
            loadInvoiceTotal("INV-ABC");
        } catch (InvoiceServiceException e) {
            System.out.println(e.getMessage());                  // Cannot load invoice INV-ABC
            System.out.println("root: " + e.getCause());         // java.lang.NumberFormatException: …
        }
    }
}
```

The stack trace then shows `Caused by: java.lang.NumberFormatException…`. Without the cause, the most useful diagnostic information is lost.

## Overriding and throws

An overriding method may declare **the same, narrower, or no** checked exceptions, but not new or broader ones. It may add any unchecked exceptions. This preserves substitutability: code calling the parent method is prepared only for the parent's checked exceptions.

## Rethrowing precisely (Java 7)

```java
void process() throws IOException, SQLException {
    try {
        doIo();            // throws IOException
        doSql();           // throws SQLException
    } catch (Exception e) {
        log(e);
        throw e;           // compiler knows e can only be IOException or SQLException ("precise rethrow")
    }
}
```

## Interview questions

:::qa basic
? Difference between throw and throws?
`throw` is a statement that raises a specific exception instance inside a method. `throws` is a clause in a method signature declaring the checked exception types the method may propagate to callers.
--- followup Can you throw a non-Throwable object?
No. Only instances of `Throwable` or its subclasses can be thrown; `throw "error";` does not compile.
:::

:::qa intermediate
? What is exception chaining and why is it important?
Wrapping a caught exception as the *cause* of a new, more meaningful exception (`new ServiceException("msg", e)`). It lets each layer speak its own vocabulary while preserving the original stack trace for debugging.
:::

:::quiz
? Parent method: `void save() throws IOException`. Which override compiles?
- `void save() throws Exception`
+ `void save() throws FileNotFoundException`
- `void save() throws SQLException`
- `void save() throws Throwable`
--- explain
`FileNotFoundException` is a subclass of `IOException` — narrower is allowed. Broader or unrelated checked exceptions are not.
:::
</script>

<script type="text/x-java-topic">
@id: checked-unchecked
@module: exceptions
@title: Checked vs Unchecked Exceptions
@level: 3
@time: 15
@prereq: throw-throws
@next: custom-exceptions
@tags: checked, unchecked, runtimeexception, compile time, lambdas, spring rollback, design debate
===
## The distinction

| | Checked | Unchecked |
|---|---|---|
| Types | `Exception` and subclasses **except** `RuntimeException` | `RuntimeException`, `Error` and their subclasses |
| Compiler | Enforces "catch or declare" | No enforcement |
| Intended for | Recoverable conditions outside the program's control (I/O, network, DB) | Programming errors and violated preconditions |
| Examples | `IOException`, `SQLException`, `InterruptedException`, `TimeoutException` | `NullPointerException`, `IllegalArgumentException`, `IllegalStateException`, `IndexOutOfBoundsException` |

"Checked" refers to **compile-time checking**. At runtime, the JVM treats them identically — the distinction exists only in the Java language, which is why Kotlin (also on the JVM) has no checked exceptions at all.

## Why checked exceptions exist — and the debate

The idea: if a method can fail in ways a caller should plan for (file missing, network down), make that failure part of its **API contract** so it can't be ignored.

Criticism in practice:

- They leak implementation details up through layers (`throws SQLException` from a service interface).
- They don't compose with lambdas: `Function<T,R>` can't throw checked exceptions, so `list.stream().map(p -> Files.readString(p))` doesn't compile.
- Developers often swallow them (`catch (Exception e) {}`) just to satisfy the compiler — worse than not having them.

Modern frameworks (Spring, Hibernate/JPA) mostly use **unchecked** exceptions and translate checked ones: Spring's `JdbcTemplate` converts `SQLException` into the unchecked `DataAccessException` hierarchy.

:::project Why it matters for @Transactional
By default, Spring rolls back a transaction only for **unchecked** exceptions (`RuntimeException`, `Error`). A checked exception thrown from a `@Transactional` method **commits** the transaction unless you specify `@Transactional(rollbackFor = Exception.class)`. This surprises many developers and is a frequent interview question.
:::

## Guidelines

:::tip
- Throw **unchecked** exceptions for programming errors and business-rule violations (`IllegalArgumentException`, custom `BusinessException extends RuntimeException`).
- Use **checked** exceptions only when the caller can realistically do something specific to recover (retry, prompt the user for a different file).
- Translate low-level checked exceptions at layer boundaries into meaningful domain exceptions, with the cause attached.
- Don't catch `InterruptedException` and ignore it — restore the interrupt flag with `Thread.currentThread().interrupt()`.
:::

## Interview questions

:::qa basic
? What is the difference between checked and unchecked exceptions?
Checked exceptions (subclasses of `Exception` excluding `RuntimeException`) must be caught or declared, enforced by the compiler; they represent recoverable external conditions. Unchecked exceptions (`RuntimeException`, `Error` and subclasses) need not be declared and usually indicate programming errors.
--- followup Are checked exceptions checked at runtime?
No. "Checked" means checked by the compiler. The JVM makes no distinction, and tricks like sneaky throws can throw checked exceptions without declaring them.
:::

:::qa scenario
? A `@Transactional` service method throws a custom checked `InsufficientStockException`. Is the transaction rolled back?
Not by default — Spring rolls back only on unchecked exceptions and errors. Either make the exception extend `RuntimeException` or declare `@Transactional(rollbackFor = InsufficientStockException.class)`.
:::

:::qa intermediate
? How do you handle checked exceptions inside a lambda passed to `stream().map()`?
Standard functional interfaces don't declare checked exceptions. Options: catch inside the lambda and wrap in an unchecked exception (`UncheckedIOException` exists for I/O), extract to a helper method that does the wrapping, or use a loop when checked-exception handling is important.
:::

:::quiz
? `InterruptedException` is:
+ Checked
- Unchecked
- An Error
- Not an exception
--- explain
It extends `Exception` directly, so callers of `Thread.sleep`, `join`, `wait` and `BlockingQueue.take` must handle or declare it.
:::
</script>

<script type="text/x-java-topic">
@id: custom-exceptions
@module: exceptions
@title: Custom Exceptions & Best Practices
@level: 3
@time: 18
@prereq: checked-unchecked
@next: try-with-resources
@tags: custom exception, business exception, error code, global exception handler, controlleradvice, logging, best practices
===
## Why create your own exception types?

Built-in exceptions describe *technical* failures. A domain exception names the *business* problem — `InsufficientStockException`, `SupplierBlockedException`, `InvoiceAlreadyApprovedException` — carries domain data (SKU, available quantity), and lets handlers react precisely.

## Designing a custom exception

```java title="Stock.java"
import java.util.HashMap;
import java.util.Map;

class BusinessException extends RuntimeException {               // base for all domain errors
    private final String errorCode;
    BusinessException(String errorCode, String message) {
        super(message);
        this.errorCode = errorCode;
    }
    BusinessException(String errorCode, String message, Throwable cause) {
        super(message, cause);
        this.errorCode = errorCode;
    }
    String getErrorCode() { return errorCode; }
}

class InsufficientStockException extends BusinessException {
    private final String sku;
    private final int requested, available;

    InsufficientStockException(String sku, int requested, int available) {
        super("STOCK_001", String.format("SKU %s: requested %d, only %d available", sku, requested, available));
        this.sku = sku;
        this.requested = requested;
        this.available = available;
    }
    int getAvailable() { return available; }
}

public class Stock {
    private final Map<String, Integer> levels = new HashMap<>(Map.of("SKU-1", 5));

    void reserve(String sku, int qty) {
        int available = levels.getOrDefault(sku, 0);
        if (qty > available) throw new InsufficientStockException(sku, qty, available);
        levels.put(sku, available - qty);
    }

    public static void main(String[] args) {
        try {
            new Stock().reserve("SKU-1", 8);
        } catch (InsufficientStockException e) {
            System.out.println(e.getErrorCode() + " → " + e.getMessage());
            // STOCK_001 → SKU SKU-1: requested 8, only 5 available
        }
    }
}
```

Checklist:

- Extend `RuntimeException` (or `Exception` if callers genuinely must handle it).
- Provide constructors that accept a **message** and a **cause**.
- Use a clear name ending in `Exception`.
- Include context (ids, values) in the message and as fields — but never secrets (passwords, card numbers, tokens).
- Optionally a machine-readable **error code** for API clients.
- Keep them immutable (final fields).

## Turning exceptions into API responses

```java
@RestControllerAdvice
public class GlobalExceptionHandler {

    @ExceptionHandler(InsufficientStockException.class)
    public ResponseEntity<ApiError> stock(InsufficientStockException e) {
        return ResponseEntity.status(HttpStatus.CONFLICT)
                .body(new ApiError(e.getErrorCode(), e.getMessage()));
    }

    @ExceptionHandler(Exception.class)
    public ResponseEntity<ApiError> unexpected(Exception e) {
        log.error("Unhandled error", e);                        // log once, at the boundary
        return ResponseEntity.internalServerError()
                .body(new ApiError("GEN_500", "Something went wrong"));   // don't leak internals
    }
}
```

## Best practices summary

| Do | Don't |
|---|---|
| Throw early (validate at entry), catch late (at a boundary that can act) | Catch just to rethrow unchanged |
| Catch the most specific type you can handle | `catch (Exception e)` deep in business logic |
| Preserve the cause when wrapping | `throw new X(e.getMessage())` (loses the stack trace) |
| Log once, with the exception object: `log.error("msg", e)` | Log and rethrow at every layer |
| Use try-with-resources for anything closeable | Close resources manually in `finally` |
| Use exceptions for exceptional situations | Use exceptions for normal control flow (e.g. loop termination) — they are expensive to create |
| Restore interrupt status after `InterruptedException` | Swallow `InterruptedException` |

:::info Exceptions are relatively expensive
Creating an exception captures the stack trace (`fillInStackTrace`), which walks the stack. For very high-frequency, expected "failures" (e.g. parsing validation in a tight loop), return a result/`Optional` instead. Some frameworks override `fillInStackTrace` for pre-allocated control-flow exceptions.
:::

## Interview questions

:::qa intermediate
? How do you create a custom exception? Checked or unchecked?
Extend `Exception` (checked) or `RuntimeException` (unchecked), add constructors taking a message and a cause, and optionally domain fields like an error code. Most modern applications use unchecked domain exceptions handled centrally, reserving checked exceptions for conditions the immediate caller must handle.
--- followup How would you return proper HTTP status codes for them in Spring Boot?
A `@RestControllerAdvice` class with `@ExceptionHandler` methods mapping each exception type to a status and error body — or annotate the exception with `@ResponseStatus`. Spring 6 also supports RFC 7807 `ProblemDetail` responses.
:::

:::qa scenario
? Your logs show the same stack trace printed four times for one failed request. What's wrong?
Each layer (repository, service, controller, filter) catches, logs and rethrows. Fix by logging only where the exception is finally handled (typically the global handler), and wrapping with context rather than logging at intermediate layers.
:::

:::quiz
? Which wrapping preserves the original stack trace?
- `throw new AppException(e.getMessage());`
+ `throw new AppException("Loading failed", e);`
- `throw new AppException(e.toString());`
- `throw e.getCause();`
--- explain
Passing the caught exception as the cause keeps its stack trace in the chain (`Caused by:`).
:::
</script>

<script type="text/x-java-topic">
@id: try-with-resources
@module: exceptions
@title: try-with-resources & Suppressed Exceptions
@level: 3
@time: 15
@java: 7+ / 9+
@prereq: try-catch-finally
@next: collections-overview
@tags: try with resources, autocloseable, closeable, suppressed exception, resource leak, close order
===
## Introduction

Files, sockets, database connections, statements and streams hold **operating-system or pool resources** that must be released. Before Java 7, correctly closing them required nested `try/finally` blocks — and even then, an exception thrown by `close()` could **mask** the original exception.

**try-with-resources** (Java 7) closes resources automatically and correctly.

```java title="TwrDemo.java"
import java.io.BufferedReader;
import java.io.IOException;
import java.io.StringReader;

public class TwrDemo {
    static class Resource implements AutoCloseable {
        private final String name;
        Resource(String name) { this.name = name; System.out.println("open " + name); }
        void use() { System.out.println("use " + name); }
        @Override public void close() { System.out.println("close " + name); }
    }

    public static void main(String[] args) throws IOException {
        try (Resource a = new Resource("A");
             Resource b = new Resource("B")) {       // multiple resources separated by ;
            a.use();
            b.use();
        }                                           // closed automatically in REVERSE order: B, then A

        BufferedReader br = new BufferedReader(new StringReader("line1"));
        try (br) {                                  // Java 9: effectively final variable
            System.out.println(br.readLine());
        }
    }
}
```

```output
open A
open B
use A
use B
close B
close A
line1
```

## Rules

- Any object implementing **`AutoCloseable`** (or its subinterface `Closeable`) can be a resource.
- Resources are closed in **reverse order** of declaration, after the try block, and **before** any `catch` or `finally` block runs.
- Resource variables are implicitly `final`.
- A resource whose initialiser returned `null` is simply not closed (no NPE).

## Suppressed exceptions

If the try block throws exception **E1** and `close()` then throws **E2**, E1 is the one propagated, and E2 is attached to it as a **suppressed** exception (`e1.getSuppressed()`). With manual `finally`, E2 would have replaced E1 and the real error would be lost.

```java
try (Resource r = new FailingResource()) {
    throw new IllegalStateException("business failure");       // primary
} catch (IllegalStateException e) {
    for (Throwable s : e.getSuppressed()) System.out.println("suppressed: " + s);  // close() failure
}
```

## Real-life example

:::analogy A hotel key card
When you check out, the hotel deactivates your key card automatically — you don't have to remember. Even if your checkout goes wrong (dispute over the bill — an exception), the card is still deactivated, and the dispute remains the main issue on record; the "card reader beeped oddly" note (suppressed exception) is attached to it rather than replacing it.
:::

:::project
JDBC is the classic case: `try (Connection c = ds.getConnection(); PreparedStatement ps = c.prepareStatement(sql); ResultSet rs = ps.executeQuery()) { … }`. With a connection pool, `close()` returns the connection to the pool; forgetting it **leaks connections** until the pool is exhausted and every request hangs.
:::

## Interview questions

:::qa basic
? What is try-with-resources?
A form of `try` (Java 7) that declares resources implementing `AutoCloseable`; they are closed automatically in reverse order when the block exits, normally or by exception, eliminating boilerplate and resource leaks.
--- followup Difference between AutoCloseable and Closeable?
`Closeable` (in `java.io`) extends `AutoCloseable`; its `close()` throws `IOException` and must be idempotent. `AutoCloseable.close()` throws `Exception` and isn't required to be idempotent.
:::

:::qa intermediate
? What are suppressed exceptions?
When an exception is thrown in the try block and closing a resource also throws, the close exception is added to the primary exception via `addSuppressed` rather than replacing it. Retrieve them with `getSuppressed()`.
:::

:::quiz
? In `try (A a = …; B b = …) { }`, what is the closing order?
- A then B
+ B then A
- Undefined
- Only the last resource is closed
--- explain
Resources are closed in reverse order of creation, since later resources may depend on earlier ones (a statement depends on its connection).
:::
</script>

<script type="text/x-java-topic">
@id: collections-overview
@module: collections
@title: Collections Framework Overview
@level: 2
@time: 22
@prereq: interfaces, arrays
@next: arraylist
@tags: collection, list, set, map, queue, deque, hierarchy, iterable, collections class, list.of, choosing a collection
===
## Introduction

The **Java Collections Framework** (Java 1.2) is a unified architecture of **interfaces** (what a collection can do), **implementations** (how it stores data) and **algorithms** (sorting, searching, shuffling) for storing and manipulating groups of objects.

Before it existed, Java had only arrays, `Vector` and `Hashtable`, each with its own API. The framework lets you write code against an interface (`List<Order>`) and swap the implementation (`ArrayList`, `LinkedList`) without touching the calling code.

## The hierarchy

:::diagram Core interfaces (java.util)
[v] Iterable<T> :: iterator(), forEach() — enables the for-each loop
[a] Collection<E> :: add, remove, contains, size, isEmpty, stream …
[g] List<E> :: ordered, indexed, duplicates OK — ArrayList, LinkedList, (Vector, Stack) || [g] Set<E> :: no duplicates — HashSet, LinkedHashSet, TreeSet (SortedSet/NavigableSet) || [g] Queue<E> :: FIFO / priority — PriorityQueue, ArrayDeque; Deque<E> — ArrayDeque, LinkedList
[w] Map<K,V> (NOT a Collection) :: key → value pairs, unique keys — HashMap, LinkedHashMap, TreeMap (SortedMap/NavigableMap), Hashtable, ConcurrentHashMap
:::

`Map` does not extend `Collection` because its elements are key–value pairs; operations like `add(E)` don't make sense. It offers collection **views** instead: `keySet()`, `values()`, `entrySet()`.

## List vs Set vs Map

| | List | Set | Map |
|---|---|---|---|
| Stores | Elements | Unique elements | Key → value pairs |
| Duplicates | Allowed | Not allowed (by `equals`) | Keys unique, values may repeat |
| Order | Insertion order, index-based | Depends: none (`HashSet`), insertion (`LinkedHashSet`), sorted (`TreeSet`) | Same three options for keys |
| Access by | Index `get(i)` | Membership `contains(x)` | Key `get(k)` |
| `null` | Allowed | One null in `HashSet`; none in `TreeSet` (natural order) | One null key in `HashMap`; none in `TreeMap`/`ConcurrentHashMap` |
| Typical use | Order lines, search results | Unique tags, visited ids | Lookup by id, caches, grouping |

## Choosing an implementation

| Need | Choose | Why |
|---|---|---|
| General-purpose list | `ArrayList` | Fast random access, cache-friendly |
| Queue / stack | `ArrayDeque` | Faster than `LinkedList` and `Stack` |
| Fast lookup by key | `HashMap` | O(1) average |
| Keys in insertion order | `LinkedHashMap` | Predictable iteration; LRU caches |
| Keys sorted / range queries | `TreeMap` | O(log n), `floorKey`, `subMap` |
| Unique elements | `HashSet` / `LinkedHashSet` / `TreeSet` | Same trade-offs as the maps (they're built on them) |
| Priority processing | `PriorityQueue` | Binary heap, O(log n) insert/poll |
| Concurrent access | `ConcurrentHashMap`, `CopyOnWriteArrayList`, `BlockingQueue` | Designed for multithreading |
| Enum keys | `EnumMap` / `EnumSet` | Array/bit-vector backed |

## Big-O cheat sheet

| Operation | ArrayList | LinkedList | HashMap/HashSet | TreeMap/TreeSet | PriorityQueue |
|---|---|---|---|---|---|
| get by index | O(1) | O(n) | — | — | — |
| add at end | O(1) amortised | O(1) | O(1) avg | O(log n) | O(log n) |
| add/remove at front | O(n) | O(1) | — | — | — |
| contains / lookup | O(n) | O(n) | O(1) avg | O(log n) | O(n) |
| remove by value | O(n) | O(n) | O(1) avg | O(log n) | O(n) |
| min / max | O(n) | O(n) | O(n) | O(log n) | O(1) peek |

## Immutable factory methods (Java 9+) and the Collections class

```java
List<String> roles = List.of("ADMIN", "USER");          // immutable; nulls rejected
Set<Integer> codes = Set.of(200, 201, 204);             // immutable; duplicates rejected at creation
Map<String, Integer> gst = Map.of("food", 5, "electronics", 18);
List<String> copy = List.copyOf(mutableList);           // Java 10: immutable copy

Collections.sort(list);                                 // algorithms
Collections.unmodifiableList(list);                     // read-only view
Collections.synchronizedList(list);                     // coarse-grained locking wrapper
Collections.emptyList();  Collections.singletonList(x);
Collections.frequency(list, "x");  Collections.reverse(list);  Collections.shuffle(list);
```

:::warn List.of vs Arrays.asList
`List.of` is fully immutable and rejects `null`. `Arrays.asList` is fixed-size but **allows `set`**, is backed by the array, and allows nulls. `List.of(...).contains(null)` even throws `NullPointerException`.
:::

## Real-life example

:::analogy Storage in a kitchen
A **List** is a numbered spice rack — order matters and you can have two jars of chilli. A **Set** is a guest list — each name once. A **Map** is a labelled drawer cabinet — find things by label. A **Queue** is the order ticket rail — first order in, first cooked; a **PriorityQueue** is the same rail where VIP orders jump ahead.
:::

:::project Collections in API code
A controller returns `List<OrderDto>` (serialised to a JSON array); a service groups lines by supplier into `Map<Long, List<Line>>`; a validator keeps `Set<String>` of seen SKUs to reject duplicates; a scheduler uses a `BlockingQueue` of jobs. Always declare variables and return types as **interfaces** (`List`, `Map`), not implementations.
:::

## Interview questions

:::qa basic
? What is the difference between List, Set and Map?
A List is an ordered, index-based collection allowing duplicates. A Set holds unique elements (by `equals`), with ordering depending on implementation. A Map stores key–value pairs with unique keys and is not a subtype of `Collection`.
--- followup Why doesn't Map extend Collection?
A map's element is a key-value mapping, not a single object. Methods like `add(E)` or `iterator()` over single elements don't fit; instead Map offers `keySet()`, `values()` and `entrySet()` views that are collections.
:::

:::qa intermediate
? What's the difference between Collection and Collections?
`Collection` is the root interface of the collection hierarchy (List, Set, Queue). `Collections` is a utility class with static methods — sorting, searching, synchronised and unmodifiable wrappers, empty/singleton collections.
:::

:::qa scenario
? You need to store user sessions, look them up by session id, and evict the least recently used when there are more than 10,000. Which collection?
A `LinkedHashMap` constructed with `accessOrder = true` and an overridden `removeEldestEntry` returning `size() > 10_000` — an LRU cache in a few lines. If multiple threads access it, wrap it in `Collections.synchronizedMap` or use a concurrent cache library such as Caffeine.
:::

:::quiz
? Which collection allows duplicate elements?
+ `ArrayList`
- `HashSet`
- `TreeSet`
- The keys of a `HashMap`
--- explain
Lists allow duplicates. Sets and map keys are unique by `equals` (or by `compareTo` for tree-based collections).
:::
</script>

<script type="text/x-java-topic">
@id: arraylist
@module: collections
@title: ArrayList Internal Working
@level: 3
@time: 25
@prereq: collections-overview, arrays
@next: linkedlist
@tags: arraylist, capacity, size, resizing, grow, elementdata, amortized, modcount, randomaccess, trimtosize
===
## Introduction

`ArrayList` is the most used collection in Java: a **resizable array**. It gives array-speed random access plus automatic growth. Knowing how it grows explains its performance characteristics and why you sometimes pre-size it.

```java
ArrayList<Integer> list = new ArrayList<>();
```

## What happens internally

`ArrayList` holds two key fields:

```java
transient Object[] elementData;   // the backing array (Object[] — generics are erased)
private int size;                 // number of elements actually stored
```

### Creation

- `new ArrayList<>()` — `elementData` points to a shared, empty array constant (`DEFAULTCAPACITY_EMPTY_ELEMENTDATA`). **No 10-element array is allocated yet** (lazy since Java 7u40/8).
- `new ArrayList<>(100)` — allocates `Object[100]` immediately.
- `new ArrayList<>(collection)` — copies the collection's elements into a new array.

**Capacity** = length of `elementData`; **size** = elements in use. `size() <= capacity` always.

### Adding elements

```java
public boolean add(E e) {
    modCount++;                         // for fail-fast iterators
    if (size == elementData.length)     // full?
        elementData = grow(size + 1);   // allocate a bigger array and copy
    elementData[size] = e;
    size = size + 1;
    return true;
}
```

- **First add** on a default list: capacity becomes **10**.
- When full, the new capacity is **old + old/2** (≈ 1.5×): 10 → 15 → 22 → 33 → 49 → 73 …
- Growth uses `Arrays.copyOf` → `System.arraycopy`, an O(n) native memory copy.

:::flow
add() on a full list :: size == elementData.length
grow() :: newCapacity = old + (old >> 1)
Arrays.copyOf :: allocate new Object[newCapacity], copy n references
* store element :: elementData[size++] = e
old array :: becomes garbage for the GC
:::

### Why add is "amortised O(1)"

Copying is O(n), but because capacity grows geometrically, copies happen rarely. Summed over n adds, total copying work is O(n), so the **average** cost per add is O(1).

### Insert and remove in the middle

`add(index, e)` and `remove(index)` shift all following elements with `System.arraycopy` — O(n). `remove(Object)` first searches linearly with `equals`, then shifts. The vacated last slot is set to `null` so the GC can collect the removed object.

## Complexity

| Operation | Cost | Why |
|---|---|---|
| `get(i)`, `set(i, e)` | O(1) | Direct array index |
| `add(e)` at end | O(1) amortised | Occasional O(n) grow |
| `add(i, e)`, `remove(i)` | O(n) | Shift elements |
| `contains`, `indexOf`, `remove(Object)` | O(n) | Linear search with `equals` |
| Iteration | O(n) | Contiguous array — very cache-friendly |

## Memory considerations

- The array stores **references**; each `Integer` is a separate object (16 bytes each, outside the −128..127 cache). A million-element `ArrayList<Integer>` uses far more memory than an `int[]`.
- After growth there may be up to ~33% unused capacity. `trimToSize()` shrinks it; `ensureCapacity(n)` pre-grows.
- If you know the final size — e.g. mapping 5,000 database rows to DTOs — `new ArrayList<>(rows.size())` avoids ~15 intermediate grow-and-copy cycles.

## Other internals worth knowing

- Implements the marker interface **`RandomAccess`**, telling algorithms (`Collections.binarySearch`) that index access is fast.
- `modCount` increments on every structural change; iterators compare it to detect concurrent modification → `ConcurrentModificationException`.
- **Not thread-safe.** Concurrent `add`s can lose elements or throw `ArrayIndexOutOfBoundsException` during a grow.
- `elementData` is `transient`; `writeObject` serialises only the `size` used elements, not the empty capacity.

## Real-life example

:::analogy A theatre that moves to bigger halls
A theatre group books a hall with 10 seats. When the 11th person arrives, it moves everyone to a 15-seat hall (copying each person over). Moves are disruptive but rare, and each new hall is 50% bigger, so on average admitting a person is cheap. Seat numbers let you find anyone instantly — but seating someone in row 2 means everyone behind shifts back a seat.
:::

:::project
Repository methods (`findAll`, `findByStatus`) return `ArrayList`s; API responses serialise them to JSON arrays. When transforming a known-size list in a loop, pre-size the target. For large reporting exports, avoid building a giant list in memory — stream/page the results.
:::

## Common mistakes

:::mistake
- `list.remove(1)` on a `List<Integer>` removes the element at **index 1**, not the value 1. Use `list.remove(Integer.valueOf(1))`.
- Removing inside a for-each loop → `ConcurrentModificationException`. Use `removeIf` or an `Iterator`.
- Sharing an `ArrayList` between threads without synchronisation.
- Using `contains` repeatedly on a large list (O(n) each) — use a `HashSet` for membership checks.
:::

## Interview questions

:::qa advanced
? How does ArrayList work internally?
It wraps an `Object[] elementData` and an `int size`. `get`/`set` index directly into the array (O(1)). `add` stores at `elementData[size]`; when the array is full it grows to ~1.5× the old capacity and copies elements with `System.arraycopy`, making appends amortised O(1). Inserts/removes in the middle shift elements (O(n)). A default-constructed list starts with a shared empty array and allocates capacity 10 on the first add. Structural changes increment `modCount`, which iterators use to fail fast.
--- followup What is the difference between size and capacity?
Size is the number of elements stored; capacity is the length of the internal array — how many elements fit before the next resize.
--- followup Why 1.5× and not 2×?
It's a trade-off: smaller growth wastes less memory per resize, larger growth means fewer copies. 1.5× keeps waste under 50% while retaining amortised O(1) appends.
:::

:::qa intermediate
? ArrayList vs array?
Arrays are fixed-size, can hold primitives, have `length` and covariant typing. `ArrayList` is resizable, holds objects only (boxing for primitives), provides rich methods and is type-safe via generics — internally it is just a managed array.
:::

:::qa tricky
? Given `List<Integer> list = new ArrayList<>(List.of(10, 20, 30)); list.remove(1);` what remains?
`[10, 30]`. The call binds to `remove(int index)` (exact primitive match) rather than `remove(Object)` (which would need boxing).
:::

:::quiz
? Capacity of `new ArrayList<>()` right after construction (Java 8+)?
+ 0 (a shared empty array); it becomes 10 on the first add
- 10
- 16
- 1
--- explain
Since Java 7u40 the default constructor uses a shared empty array and allocates lazily, saving memory for the many lists that stay empty.
:::

:::exercise advanced
? Build a mini dynamic array
Implement `IntList` with `add(int)`, `get(int)`, `size()` growing by 1.5×, starting at capacity 4. Throw `IndexOutOfBoundsException` for bad indexes.
--- solution
```java title="IntList.java"
import java.util.Arrays;

public class IntList {
    private int[] data = new int[4];
    private int size;

    public void add(int value) {
        if (size == data.length) {
            int newCap = data.length + (data.length >> 1);
            data = Arrays.copyOf(data, newCap);
        }
        data[size++] = value;
    }

    public int get(int index) {
        if (index < 0 || index >= size) throw new IndexOutOfBoundsException("Index " + index + ", size " + size);
        return data[index];
    }

    public int size() { return size; }

    public static void main(String[] args) {
        IntList l = new IntList();
        for (int i = 0; i < 20; i++) l.add(i * i);
        System.out.println(l.size() + " " + l.get(19) + " capacity=" + l.data.length);  // 20 361 capacity=28
    }
}
```
--- explanation
Capacity grows 4 → 6 → 9 → 13 → 19 → 28: the array is full at 19 elements, so the 20th `add` triggers a grow to 28. Using `int[]` avoids boxing entirely — this is exactly why primitive-specialised collections (Eclipse Collections, fastutil) exist.
--- complexity
`add` amortised O(1), `get` O(1).
:::
</script>

<script type="text/x-java-topic">
@id: linkedlist
@module: collections
@title: LinkedList & ArrayList vs LinkedList
@level: 3
@time: 18
@prereq: arraylist
@next: vector-stack, hashmap-internals
@tags: linkedlist, doubly linked, node, arraylist vs linkedlist, deque, cache locality
===
## Internal structure

`LinkedList` is a **doubly linked list**: each element lives in its own `Node` object with references to the previous and next nodes. The list keeps `first`, `last` and `size`.

```java
private static class Node<E> {
    E item;
    Node<E> next;
    Node<E> prev;
}
```

:::diagram LinkedList of [A, B, C]
[a] first → || [g] Node(prev=null, item=A, next→) || [g] Node(←prev, item=B, next→) || [g] Node(←prev, item=C, next=null) || [a] ← last
:::

- `addFirst`/`addLast`/`removeFirst`/`removeLast` just relink a few pointers → **O(1)**.
- `get(i)` must walk from the nearer end (`first` or `last`) → **O(n)**.
- `add(i, e)` is O(1) *once you are at the position*, but reaching it is O(n).
- It implements both `List` and `Deque`.

## ArrayList vs LinkedList

| Aspect | ArrayList | LinkedList |
|---|---|---|
| Structure | Resizable array | Doubly linked nodes |
| `get(i)` | **O(1)** | O(n) |
| Add/remove at end | O(1) amortised | O(1) |
| Add/remove at front | O(n) (shift) | **O(1)** |
| Insert/remove in middle via index | O(n) shift | O(n) to find + O(1) relink |
| Remove during iteration via `Iterator.remove` | O(n) shift | O(1) |
| Memory per element | One reference (4–8 bytes) + spare capacity | Node object ≈ 24–32 bytes (header + 3 references) |
| CPU cache behaviour | Excellent (contiguous) | Poor (pointer chasing) |
| Implements | `List`, `RandomAccess` | `List`, `Deque` |

:::key Reality check
In practice `ArrayList` beats `LinkedList` for almost all workloads, even many with insertions, because shifting contiguous memory with `System.arraycopy` is extremely fast and linked nodes cause cache misses and GC overhead. For a queue or stack, `ArrayDeque` is better than `LinkedList` too. Joshua Bloch, who wrote `LinkedList`, has joked that he never uses it.
:::

## The O(n²) trap

```java
List<Integer> list = new LinkedList<>(/* 100_000 elements */);
for (int i = 0; i < list.size(); i++) {
    total += list.get(i);          // each get walks the list → O(n²) overall
}
for (int x : list) total += x;     // iterator walks once → O(n)
```

## Interview questions

:::qa basic
? When would you use LinkedList over ArrayList?
Rarely: when you frequently add/remove at both ends or remove via an iterator while traversing, and never need index access. Even then `ArrayDeque` is usually faster for pure queue/stack use. For general lists, `ArrayList` wins due to O(1) random access, lower memory use and cache locality.
--- followup Why is LinkedList memory-hungry?
Every element needs a separate `Node` object with an object header and three references, plus allocation/GC overhead — several times the memory of an array slot.
:::

:::qa tricky
? Is inserting into the middle of a LinkedList O(1)?
Only if you already hold a reference to the position (e.g. via a `ListIterator`). `list.add(index, e)` first traverses to the index — O(n).
:::

:::quiz
? Which operation is faster on LinkedList than ArrayList?
- `get(5000)`
+ `removeFirst()` / `addFirst(e)`
- Iteration with for-each
- `contains(x)`
--- explain
Removing or adding at the head only relinks nodes in LinkedList; ArrayList must shift every element.
:::
</script>

<script type="text/x-java-topic">
@id: vector-stack
@module: collections
@title: Legacy Collections: Vector, Stack & Hashtable
@level: 2
@time: 10
@prereq: linkedlist
@next: hashmap-internals
@tags: vector, stack, hashtable, enumeration, legacy, synchronized, arraydeque
===
## Introduction

`Vector`, `Stack`, `Hashtable` and `Enumeration` predate the Collections Framework (Java 1.0). They were retrofitted to implement `List`/`Map` in 1.2, but their design choices — **every method synchronised**, and `Stack extends Vector` — make them poor choices for new code. Interviewers ask about them to check that you know the modern replacements.

| Legacy | Characteristics | Modern replacement |
|---|---|---|
| `Vector` | Synchronised resizable array; grows 2× by default | `ArrayList` (single thread) / `CopyOnWriteArrayList` or explicit locking |
| `Stack` | Extends `Vector` (so it exposes `add(index)`, `get(i)` — not stack-like) | `Deque<E> stack = new ArrayDeque<>();` with `push`/`pop`/`peek` |
| `Hashtable` | Synchronised hash map; no null keys or values | `HashMap` / `ConcurrentHashMap` |
| `Enumeration` | Old iterator (`hasMoreElements`, `nextElement`), no remove | `Iterator` |

```java
Deque<String> stack = new ArrayDeque<>();
stack.push("page1");
stack.push("page2");
System.out.println(stack.pop());    // page2 — LIFO
System.out.println(stack.peek());   // page1
```

## Why "synchronised everything" isn't enough

Each method call on `Vector` is atomic, but **compound actions** are not:

```java
if (!vector.contains(x)) vector.add(x);   // two separate locks: another thread can add x in between
```

You still need external synchronisation for check-then-act sequences — while paying the locking cost on every single call even in single-threaded code. Concurrent collections (`ConcurrentHashMap.putIfAbsent`, `computeIfAbsent`) provide atomic compound operations instead.

:::qa basic
? ArrayList vs Vector?
Both are resizable arrays. Vector's methods are synchronised (thread-safe per call, slower) and it grows by 100% by default; ArrayList is unsynchronised, faster, and grows by 50%. Vector is legacy; use ArrayList, or concurrent collections when thread safety is needed.
:::

:::qa intermediate
? Why is java.util.Stack discouraged?
It extends `Vector`, so it inherits synchronisation overhead and index-based methods that break LIFO semantics (you can insert anywhere). The Javadoc itself recommends `Deque` implementations such as `ArrayDeque`.
:::

:::quiz
? The recommended stack implementation in modern Java is:
- `java.util.Stack`
- `Vector`
+ `ArrayDeque` used via the `Deque` interface
- `LinkedList` used via `List`
--- explain
`ArrayDeque` is a resizable circular array: fast, unsynchronised, and its `push`/`pop`/`peek` follow LIFO semantics.
:::
</script>
