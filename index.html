<script type="text/x-java-topic">
@id: java8-overview
@module: java8
@title: Java 8 Overview & Functional Programming
@level: 2
@time: 12
@java: 8
@prereq: interfaces
@next: lambdas
@tags: java 8, functional programming, declarative, imperative, pure function, immutability, higher order function
===
## Why Java 8 was a turning point

Java 8 (March 2014) introduced **functional programming** features into an object-oriented language. Before it, passing behaviour meant verbose anonymous classes, and processing collections meant hand-written loops. Multi-core CPUs also made it attractive to express data processing in a way the library could parallelise.

| Feature | What it gives you |
|---|---|
| **Lambda expressions** | Pass behaviour as a concise value: `x -> x * 2` |
| **Functional interfaces** | Types for lambdas: `Function`, `Predicate`, `Supplier`, `Consumer`… |
| **Method references** | `String::toUpperCase`, `System.out::println` |
| **Stream API** | Declarative pipelines: filter → map → collect |
| **Default & static interface methods** | Evolve interfaces (added `forEach`, `stream`, `removeIf`) |
| **`Optional`** | Explicit "maybe a value" return type |
| **`java.time`** | Immutable, thread-safe date/time API |
| `CompletableFuture` | Composable async programming |
| Others | `StringJoiner`, `Base64`, `Map.merge/compute`, repeatable & type annotations, Metaspace replaced PermGen |

## Imperative vs declarative

```java
// Imperative: HOW to do it, step by step
List<String> result = new ArrayList<>();
for (Order o : orders) {
    if (o.getTotal() > 10_000) {
        result.add(o.getCustomer().toUpperCase());
    }
}
Collections.sort(result);

// Declarative (Java 8): WHAT you want
List<String> result = orders.stream()
        .filter(o -> o.getTotal() > 10_000)
        .map(o -> o.getCustomer().toUpperCase())
        .sorted()
        .toList();                          // Java 16; use collect(Collectors.toList()) on Java 8
```

## Functional programming ideas in Java

- **Functions as values** — lambdas and method references can be stored, passed and returned.
- **Pure functions** — output depends only on input, no side effects; easy to test and parallelise.
- **Immutability** — transform data into new values instead of mutating in place.
- **Higher-order functions** — functions that take or return functions (`map`, `filter`, `Comparator.comparing`).
- **Lazy evaluation** — streams do no work until a terminal operation asks for results.

Java stays object-oriented: lambdas are implemented as objects of functional interfaces. Java adopts the useful parts of FP without becoming a purely functional language.

:::qa basic
? What are the main features introduced in Java 8?
Lambda expressions, functional interfaces (`java.util.function`), method references, the Stream API, default and static methods in interfaces, `Optional`, the `java.time` Date/Time API, `CompletableFuture`, and Metaspace replacing PermGen, plus smaller additions like `Map.merge`, `StringJoiner` and `Base64`.
--- followup Why were default methods necessary for streams?
To add `stream()`, `forEach()` and `removeIf()` to existing interfaces like `Collection` and `Iterable` without breaking every existing implementation.
:::

:::quiz
? Which is the best description of declarative code?
- Code that uses many loops
+ Code that states what result is wanted, leaving how to the library
- Code without methods
- Code that runs in parallel
--- explain
Declarative code (e.g., a stream pipeline) expresses the transformation; iteration details are handled by the library.
:::
</script>

<script type="text/x-java-topic">
@id: lambdas
@module: java8
@title: Lambda Expressions
@level: 3
@time: 22
@java: 8
@prereq: java8-overview, interfaces
@next: functional-interfaces
@tags: lambda, arrow, anonymous function, effectively final, capture, invokedynamic, lambdametafactory, this in lambda, closure
===
## Introduction

A **lambda expression** is an anonymous function — a block of behaviour you can pass around as a value. It removes the boilerplate of anonymous classes whenever an interface has a single abstract method.

```java
// Before Java 8
Collections.sort(names, new Comparator<String>() {
    @Override
    public int compare(String a, String b) {
        return a.length() - b.length();
    }
});

// Java 8
names.sort((a, b) -> Integer.compare(a.length(), b.length()));
```

## Syntax

```java
() -> System.out.println("no params")               // no parameters
x -> x * 2                                           // one param: parentheses optional
(x, y) -> x + y                                      // several params, types inferred
(int x, int y) -> x + y                              // explicit types
(var x, var y) -> x + y                              // Java 11: var (allows annotations)
(order) -> {                                          // block body: braces + explicit return
    BigDecimal tax = order.total().multiply(GST);
    return order.total().add(tax);
}
```

| Part | Meaning |
|---|---|
| Parameter list | Types usually inferred from the target functional interface |
| `->` | Separates parameters from body |
| Expression body | Its value is returned automatically |
| Block body | Needs `return` if a value is expected |

## Target typing

A lambda has no type on its own. Its type comes from the **context** — the functional interface expected there:

```java
Runnable r = () -> System.out.println("run");       // Runnable: () → void
Callable<String> c = () -> "done";                   // Callable<String>: () → String
Comparator<String> cmp = (a, b) -> a.compareTo(b);  // (String, String) → int
// var f = x -> x + 1;                              // error: no target type to infer from
```

## Capturing variables — effectively final

Lambdas can use local variables from the enclosing scope only if they are **final or effectively final**:

```java
int minQty = 10;                                  // effectively final
orders.removeIf(o -> o.qty() < minQty);           // OK
// minQty = 5;                                     // would make the lambda above illegal

int[] counter = {0};                               // workaround people use… but not thread-safe
list.forEach(x -> counter[0]++);
```

Why? The lambda captures a **copy of the value**. Lambdas can run later or on another thread; allowing the local variable to change would create confusing, racy semantics. Fields (instance/static) are not copied — they're accessed through `this` or the class — so they can be modified (with the usual thread-safety caveats).

## `this` inside a lambda

A lambda does **not** introduce a new scope: `this` refers to the enclosing instance. In an anonymous class, `this` refers to the anonymous object itself.

## How lambdas work internally

Lambdas are **not** compiled to anonymous inner classes. `javac`:

1. Moves the lambda body into a private synthetic method (e.g. `lambda$main$0`).
2. Emits an **`invokedynamic`** instruction at the creation site.
3. On first execution, the JVM calls the bootstrap method `LambdaMetafactory.metafactory`, which generates a lightweight class implementing the functional interface at runtime and links the call site.

Non-capturing lambdas are typically created once and reused (a singleton); capturing lambdas allocate an object holding the captured values (which escape analysis may eliminate). No extra `.class` files appear in your JAR, unlike anonymous classes.

## Real-life example

:::analogy Instructions on a sticky note
Instead of hiring a named contractor company to do "tell me which parcels are fragile" (an anonymous class with ceremony), you hand the warehouse worker a sticky note: `parcel -> parcel.isFragile()`. The worker (a library method like `filter`) knows when to apply it; you only supply the rule.
:::

:::project
Lambdas are everywhere in Spring code: `repository.findById(id).orElseThrow(() -> new NotFoundException(id))`, `list.stream().map(mapper::toDto).toList()`, Spring Security configuration (`http.authorizeHttpRequests(auth -> auth.requestMatchers("/admin/**").hasRole("ADMIN"))`), `@Bean` definitions returning lambdas for small strategy interfaces, and `CompletableFuture` pipelines.
:::

## Common mistakes

:::mistake
- Trying to modify a captured local variable.
- Long multi-line lambdas with complex logic — extract a named method and use a method reference.
- Side effects in stream lambdas (adding to external lists) — use collectors instead.
- Swallowing checked exceptions inside lambdas.
:::

## Interview questions

:::qa basic
? What is a lambda expression?
An anonymous function that implements the single abstract method of a functional interface, written as `(params) -> body`. It lets you pass behaviour as data with much less code than an anonymous class.
--- followup Can any interface be implemented with a lambda?
Only functional interfaces — those with exactly one abstract method (default and static methods don't count, nor do methods matching public `Object` methods like `equals`).
:::

:::qa intermediate
? Why must captured variables be effectively final?
The lambda captures the variable's value, not the variable itself, and may execute later or on another thread. Requiring effectively final variables keeps the copy and the original consistent and avoids data races on stack-local variables.
:::

:::qa advanced
? How are lambdas implemented by the JVM? Are they anonymous inner classes?
No. The body is compiled into a private synthetic method, and the creation site uses `invokedynamic` bootstrapped by `LambdaMetafactory`, which spins up an implementation class at runtime. This avoids a class file per lambda, allows the JVM to optimise (e.g. caching non-capturing lambdas), and makes `this` refer to the enclosing instance.
--- followup Lambda vs anonymous class?
Lambdas work only for functional interfaces, have no state of their own, don't shadow names or redefine `this`, and don't generate separate class files. Anonymous classes can implement any interface or abstract class, have fields, and `this` refers to themselves.
:::

:::quiz
? What does `this` refer to inside a lambda written in an instance method of `OrderService`?
+ The enclosing `OrderService` instance
- The lambda object
- The functional interface
- `null`
--- explain
Lambdas are lexically scoped; `this` means the same as it does in the surrounding code.
:::
</script>

<script type="text/x-java-topic">
@id: functional-interfaces
@module: java8
@title: Functional Interfaces & Method References
@level: 3
@time: 22
@java: 8
@prereq: lambdas
@next: optional
@tags: functional interface, @functionalinterface, predicate, function, consumer, supplier, bifunction, unaryoperator, binaryoperator, method reference, compose, andthen
===
## Functional interfaces

A **functional interface** has exactly **one abstract method** (a SAM — Single Abstract Method type). It may also have default and static methods. `@FunctionalInterface` is optional but makes the compiler enforce the rule.

```java
@FunctionalInterface
interface PriceRule {
    BigDecimal apply(BigDecimal price);                          // the single abstract method
    default PriceRule then(PriceRule next) {                     // defaults are fine
        return p -> next.apply(apply(p));
    }
}
```

Pre-Java-8 examples: `Runnable`, `Callable`, `Comparator`, `ActionListener`.

## The core interfaces in `java.util.function`

| Interface | Method | Signature | Example use |
|---|---|---|---|
| `Predicate<T>` | `test` | T → boolean | `filter(o -> o.isPaid())` |
| `Function<T,R>` | `apply` | T → R | `map(Order::getId)` |
| `Consumer<T>` | `accept` | T → void | `forEach(System.out::println)` |
| `Supplier<T>` | `get` | () → T | `orElseGet(() -> loadDefault())` |
| `UnaryOperator<T>` | `apply` | T → T | `replaceAll(String::trim)` |
| `BinaryOperator<T>` | `apply` | (T, T) → T | `reduce(0, Integer::sum)` |
| `BiFunction<T,U,R>` | `apply` | (T, U) → R | `map.merge(k, v, (a, b) -> a + b)` |
| `BiConsumer<T,U>` | `accept` | (T, U) → void | `map.forEach((k, v) -> …)` |
| `BiPredicate<T,U>` | `test` | (T, U) → boolean | |
| Primitive variants | e.g. `IntPredicate`, `ToIntFunction`, `IntBinaryOperator`, `LongSupplier` | avoid boxing | `mapToInt(String::length)` |

## Composing functions

```java title="Compose.java"
import java.util.List;
import java.util.function.*;

public class Compose {
    public static void main(String[] args) {
        Predicate<String> notBlank = s -> !s.isBlank();
        Predicate<String> isSku = s -> s.startsWith("SKU-");
        Predicate<String> valid = notBlank.and(isSku);            // and / or / negate
        System.out.println(valid.test("SKU-9") + " " + valid.negate().test("x"));   // true true

        Function<String, String> trim = String::trim;
        Function<String, String> upper = String::toUpperCase;
        Function<String, Integer> length = String::length;
        System.out.println(trim.andThen(upper).apply("  pune "));  // PUNE   (trim first, then upper)
        System.out.println(length.compose(trim).apply("  goa  ")); // 3      (trim first, then length)

        Supplier<List<String>> fresh = java.util.ArrayList::new;   // constructor reference
        Consumer<String> log = s -> System.out.println("LOG " + s);
        log.andThen(s -> System.out.println("AUDIT " + s)).accept("order created");

        BinaryOperator<Integer> max = BinaryOperator.maxBy(Integer::compare);
        System.out.println(max.apply(4, 9) + " " + fresh.get().size());   // 9 0
    }
}
```

## Method references

A **method reference** is shorthand for a lambda that only calls an existing method.

| Kind | Syntax | Equivalent lambda |
|---|---|---|
| Static method | `Integer::parseInt` | `s -> Integer.parseInt(s)` |
| Instance method of a particular object | `System.out::println`, `validator::isValid` | `x -> System.out.println(x)` |
| Instance method of an arbitrary object of a type | `String::toUpperCase` | `s -> s.toUpperCase()` |
| Constructor | `ArrayList::new`, `Order::new` | `() -> new ArrayList<>()` |
| Array constructor | `String[]::new` | `n -> new String[n]` |

For the "arbitrary object" form, the first lambda parameter becomes the receiver: `String::compareToIgnoreCase` as a `Comparator<String>` means `(a, b) -> a.compareToIgnoreCase(b)`.

:::tip When to use which
Use a method reference when it reads more clearly (`map(Order::getId)`), a lambda when you need extra logic or parameter reordering (`map(o -> o.getId() + ":" + o.getStatus())`).
:::

## Real-life example

:::analogy Job roles
The functional interfaces are standard job descriptions: a **Predicate** is an inspector (yes/no), a **Function** a translator (input → output), a **Consumer** a recipient who acts on what you give them, and a **Supplier** a vending machine that produces something on request. Any lambda that fits the description can fill the role.
:::

## Interview questions

:::qa basic
? What is a functional interface? Give examples.
An interface with exactly one abstract method, which lambdas and method references can implement. Examples: `Runnable`, `Callable`, `Comparator`, and `java.util.function`'s `Predicate`, `Function`, `Consumer`, `Supplier`.
--- followup Is @FunctionalInterface mandatory?
No. Any interface with one abstract method is functional. The annotation just makes the compiler reject additions of a second abstract method.
--- followup Comparator has two abstract methods, compare and equals — why is it functional?
`equals(Object)` is a public method of `Object`, so it doesn't count towards the abstract-method total.
:::

:::qa intermediate
? Difference between Function, Consumer, Supplier and Predicate?
Function takes a value and returns a result (T → R); Consumer takes a value and returns nothing (T → void, for side effects); Supplier takes nothing and returns a value (() → T, for lazy creation); Predicate takes a value and returns a boolean (T → boolean, for filtering).
:::

:::qa intermediate
? What are the four kinds of method references?
Static method (`Math::abs`), bound instance method of a specific object (`printer::print`), unbound instance method of an arbitrary object of a type (`String::length`), and constructor references (`ArrayList::new`, `int[]::new`).
:::

:::quiz
? `Function<Integer,Integer> f = x -> x + 1, g = x -> x * 2;` What is `f.andThen(g).apply(3)`?
- 7
+ 8
- 6
- 9
--- explain
`andThen` applies f first (3 + 1 = 4) then g (4 × 2 = 8). `f.compose(g)` would apply g first: 3 × 2 + 1 = 7.
:::
</script>

@id: optional
@module: java8
@title: Optional
@level: 3
@time: 18
@java: 8+
@prereq: functional-interfaces
@next: date-time
@tags: optional, null, nullpointerexception, orelse, orelseget, orelsethrow, map, flatmap, ifpresent, empty
===
## Introduction

`Optional<T>` is a container that holds either **one non-null value** or **nothing**. Its purpose (per its designers) is to be a **return type** that makes "there may be no result" explicit in the API, forcing callers to handle the empty case instead of discovering `null` via a `NullPointerException` in production.

```java
Optional<User> findByEmail(String email);    // the signature itself says: might not exist
```

## Creating and consuming

```java title="OptionalDemo.java"
import java.util.Map;
import java.util.NoSuchElementException;
import java.util.Optional;

public class OptionalDemo {
    record User(String email, String city) {}
    static final Map<String, User> DB = Map.of("a@x.com", new User("a@x.com", "Pune"));

    static Optional<User> find(String email) {
        return Optional.ofNullable(DB.get(email));        // null → Optional.empty()
    }

    public static void main(String[] args) {
        String city = find("a@x.com")
                .map(User::city)                           // transform if present
                .filter(c -> !c.isBlank())
                .orElse("Unknown");                        // default value
        System.out.println(city);                          // Pune

        System.out.println(find("b@x.com").map(User::city).orElse("Unknown"));  // Unknown

        find("a@x.com").ifPresentOrElse(                   // Java 9
                u -> System.out.println("Found " + u.email()),
                () -> System.out.println("Not found"));

        try {
            find("nobody").orElseThrow(() -> new NoSuchElementException("User not found"));
        } catch (NoSuchElementException e) {
            System.out.println(e.getMessage());
        }
    }
}
```

| Method | Purpose |
|---|---|
| `Optional.of(v)` | Wrap a non-null value (throws NPE if null) |
| `Optional.ofNullable(v)` | Wrap a possibly-null value |
| `Optional.empty()` | No value |
| `map(fn)` / `flatMap(fn)` | Transform; `flatMap` when `fn` already returns an `Optional` |
| `filter(pred)` | Keep the value only if it matches |
| `orElse(v)` | Value or default (default is **always evaluated**) |
| `orElseGet(supplier)` | Value or lazily computed default |
| `orElseThrow()` / `orElseThrow(supplier)` | Value or exception (no-arg form Java 10) |
| `ifPresent(consumer)` / `ifPresentOrElse` (9) | Act on the value |
| `isPresent()` / `isEmpty()` (11) | Test |
| `or(supplier)` (9), `stream()` (9) | Fallback Optional; convert to 0/1-element stream |

## orElse vs orElseGet

```java
User u = cache.find(id).orElse(loadFromDatabase(id));        // DB call happens EVEN IF the cache hit!
User u = cache.find(id).orElseGet(() -> loadFromDatabase(id)); // DB call only when empty
```

`orElse`'s argument is an ordinary method argument, evaluated before `orElse` runs. Use `orElseGet` for anything expensive or with side effects.

## Best practices

:::cols
--- col Do
- Use it as a **method return type** for "may be absent" results.
- Chain `map`/`filter`/`orElse…` instead of `isPresent()` + `get()`.
- Use `orElseThrow` for "must exist" lookups in services.
- Return empty collections instead of `Optional<List<…>>`.
--- col Don't
- Use it for fields, method parameters, or collection elements (it's not `Serializable` and adds allocation).
- Call `get()` without checking — that's just a new way to throw.
- Return `null` from a method declared to return `Optional`.
- Wrap everything; plain non-null values don't need it.
:::

:::project
Spring Data's `CrudRepository.findById(id)` returns `Optional<T>`. The idiomatic service code is `return repo.findById(id).orElseThrow(() -> new ResourceNotFoundException("Supplier", id));`, which a `@RestControllerAdvice` turns into a 404.
:::

## Interview questions

:::qa basic
? What is Optional and why was it introduced?
A container that may or may not hold a non-null value. It was introduced in Java 8 as a return type that makes absence explicit, reducing `NullPointerException`s and replacing null checks with a fluent API (`map`, `orElse`, `orElseThrow`).
--- followup Should Optional be used for fields or parameters?
Generally no. It's designed for return values; for fields it adds overhead and isn't serialisable, and for parameters it complicates callers (overloads or nullable parameters are clearer).
:::

:::qa tricky
? Difference between orElse and orElseGet?
`orElse(value)` always evaluates its argument, even when the Optional has a value. `orElseGet(supplier)` invokes the supplier only if the Optional is empty. With an expensive default (a DB call, object creation with side effects), `orElse` silently does unnecessary work.
:::

:::qa intermediate
? map vs flatMap on Optional?
`map` applies a function returning a plain value and wraps it (`Optional<U>`). `flatMap` applies a function that already returns `Optional<U>` and avoids nesting (`Optional<Optional<U>>`).
:::

:::quiz
? What does `Optional.of(null)` do?
- Returns `Optional.empty()`
+ Throws `NullPointerException`
- Returns an Optional containing null
- Compile error
--- explain
`of` requires a non-null value. Use `ofNullable` when the value may be null.
:::
</script>

@id: date-time
@module: java8
@title: Date & Time API (java.time)
@level: 3
@time: 20
@java: 8
@prereq: immutability
@next: streams-intro
@tags: localdate, localdatetime, zoneddatetime, instant, duration, period, datetimeformatter, zoneid, timezone, simpledateformat, date, calendar
===
## Why a new API?

The old `java.util.Date` and `Calendar` were notoriously bad:

- **Mutable** — a `Date` field can be changed by anyone holding a reference; not thread-safe.
- Confusing design — `Date` is actually an instant with a misleading `toString`; months in `Calendar` are **0-based** (January = 0); years in the `Date` constructor are offset from 1900.
- `SimpleDateFormat` is **not thread-safe** — shared instances in web apps corrupt dates.
- Weak time-zone support.

Java 8's `java.time` (JSR-310, inspired by Joda-Time) is **immutable, thread-safe, and explicit** about what a value represents.

## The main types

| Type | Represents | Example |
|---|---|---|
| `LocalDate` | Date without time or zone | Birthday, invoice date: `2026-09-23` |
| `LocalTime` | Time without date or zone | Shop opening time `09:30` |
| `LocalDateTime` | Date + time without zone | Appointment "as written" |
| `ZonedDateTime` | Date + time + zone rules (`Asia/Kolkata`) | Meeting across time zones |
| `OffsetDateTime` | Date + time + fixed offset (`+05:30`) | Timestamps in APIs/DBs |
| `Instant` | A point on the UTC timeline (epoch nanos) | Event/audit timestamps |
| `Duration` | Time-based amount (hours, seconds) | Timeout of 30 s |
| `Period` | Date-based amount (years, months, days) | Warranty of 1 year 6 months |
| `DateTimeFormatter` | Formatting/parsing (thread-safe) | `dd-MM-yyyy` |

```java title="TimeDemo.java"
import java.time.*;
import java.time.format.DateTimeFormatter;
import java.time.temporal.ChronoUnit;
import java.time.temporal.TemporalAdjusters;

public class TimeDemo {
    public static void main(String[] args) {
        LocalDate invoiceDate = LocalDate.of(2026, Month.SEPTEMBER, 23);
        LocalDate due = invoiceDate.plusDays(30);                       // returns a NEW object
        System.out.println(due);                                        // 2026-10-23
        System.out.println(due.getDayOfWeek());                         // FRIDAY
        System.out.println(invoiceDate.with(TemporalAdjusters.lastDayOfMonth())); // 2026-09-30

        long days = ChronoUnit.DAYS.between(invoiceDate, due);          // 30
        Period age = Period.between(LocalDate.of(1995, 6, 15), invoiceDate);
        System.out.println(days + " days; age " + age.getYears() + "y " + age.getMonths() + "m");

        DateTimeFormatter f = DateTimeFormatter.ofPattern("dd-MM-yyyy");
        System.out.println(invoiceDate.format(f));                       // 23-09-2026
        LocalDate parsed = LocalDate.parse("01-04-2026", f);             // financial year start
        System.out.println(parsed.isBefore(invoiceDate));                 // true

        ZonedDateTime ist = ZonedDateTime.of(LocalDateTime.of(2026, 9, 23, 18, 0), ZoneId.of("Asia/Kolkata"));
        ZonedDateTime ny = ist.withZoneSameInstant(ZoneId.of("America/New_York"));
        System.out.println(ny.toLocalTime());                             // 08:30 (EDT, UTC-4)

        Instant start = Instant.now();
        Duration timeout = Duration.ofSeconds(30);
        System.out.println(start.plus(timeout).isAfter(start));            // true
    }
}
```

## Design principles in java.time

- **Immutable**: every "modification" (`plusDays`, `withYear`) returns a new object — so you must use the return value.
- **Thread-safe**: share `DateTimeFormatter` constants freely (unlike `SimpleDateFormat`).
- **Fluent, explicit**: `Month.SEPTEMBER`, 1-based months, clear type names.
- **ISO-8601 by default**: `toString()` and `parse()` use `2026-09-23`, `2026-09-23T18:00:00+05:30`.

## Converting from legacy types

```java
Instant i = legacyDate.toInstant();
Date d = Date.from(instant);
LocalDate ld = LocalDate.ofInstant(legacyDate.toInstant(), ZoneId.of("Asia/Kolkata"));   // Java 9
```

:::project Dates in back-end services
Store timestamps as UTC (`Instant`/`OffsetDateTime`, DB `TIMESTAMP WITH TIME ZONE`) and convert to the user's zone only for display. Use `LocalDate` for business dates (invoice date, due date). JPA 2.2+/Hibernate map `java.time` types natively; Jackson needs the `jackson-datatype-jsr310` module (included by Spring Boot) and `WRITE_DATES_AS_TIMESTAMPS=false` for ISO strings. Inject a `java.time.Clock` into services so tests can fix "now".
:::

## Interview questions

:::qa basic
? Why was the java.time API introduced?
The old `Date`/`Calendar` classes were mutable, not thread-safe, poorly designed (0-based months, misleading `Date` semantics) and had weak time-zone support; `SimpleDateFormat` was not thread-safe. `java.time` offers immutable, thread-safe, clearly separated types (`LocalDate`, `ZonedDateTime`, `Instant`, `Duration`, `Period`) and a thread-safe formatter.
:::

:::qa intermediate
? LocalDateTime vs ZonedDateTime vs Instant?
`LocalDateTime` has no zone — it can't identify a unique moment. `ZonedDateTime` adds a region zone with DST rules, identifying a moment and how it looks locally. `Instant` is a moment on the UTC timeline, ideal for machine timestamps.
--- followup Duration vs Period?
`Duration` measures time-based amounts (seconds/nanos) and suits `Instant`s and times; `Period` measures date-based amounts (years, months, days) and suits `LocalDate`s — adding `Period.ofMonths(1)` respects month lengths.
:::

:::quiz
? `LocalDate d = LocalDate.of(2026, 1, 31); d.plusMonths(1);` — what is `d` afterwards?
+ 2026-01-31 (unchanged — the result was discarded)
- 2026-02-28
- 2026-03-03
- An exception
--- explain
`LocalDate` is immutable; `plusMonths` returns a new object (2026-02-28, clamped to the month's last day) that this code throws away.
:::
</script>

<script type="text/x-java-topic">
@id: streams-intro
@module: streams
@title: Stream API: Concepts & How Pipelines Execute
@level: 3
@time: 25
@java: 8+
@prereq: functional-interfaces
@next: stream-operations
@tags: stream, pipeline, lazy evaluation, intermediate, terminal, short circuit, stream vs collection, spliterator, one-time use
===
## Introduction

A **Stream** is a sequence of elements supporting **declarative, pipelined** aggregate operations: filter, map, sort, group, reduce. It is not a data structure — it doesn't store elements; it **pulls** them from a source (a collection, array, file, generator) and pushes them through a chain of operations.

Why was it introduced? To express data-processing *intent* (`filter paid orders, sum totals by customer`) instead of loop mechanics, to make code composable and less error-prone, and to allow parallel execution by changing one call.

## Anatomy of a pipeline

```java title="StreamPipeline.java"
import java.util.List;

public class StreamPipeline {
    record Order(String id, String customer, double total, boolean paid) {}

    public static void main(String[] args) {
        List<Order> orders = List.of(
            new Order("O1", "asha", 12_000, true),
            new Order("O2", "ravi", 800, true),
            new Order("O3", "meera", 25_000, false),
            new Order("O4", "kiran", 15_500, true));

        List<String> bigPaidCustomers = orders.stream()   // 1. source
            .filter(Order::paid)                             // 2. intermediate (lazy)
            .filter(o -> o.total() > 10_000)                 //    intermediate
            .map(o -> o.customer().toUpperCase())            //    intermediate
            .sorted()                                        //    intermediate (stateful)
            .toList();                                       // 3. terminal — triggers execution

        System.out.println(bigPaidCustomers);                // [ASHA, KIRAN]
    }
}
```

1. **Source** — `collection.stream()`, `Arrays.stream(arr)`, `Stream.of(...)`, `IntStream.range(0, 10)`, `Files.lines(path)`, `Stream.iterate`, `Stream.generate`.
2. **Intermediate operations** — return a new stream; **lazy** (nothing happens yet): `filter`, `map`, `flatMap`, `distinct`, `sorted`, `peek`, `limit`, `skip`, `takeWhile`/`dropWhile` (9).
3. **Terminal operation** — produces a result or side effect and **starts** processing: `collect`, `toList` (16), `forEach`, `reduce`, `count`, `min`/`max`, `anyMatch`/`allMatch`/`noneMatch`, `findFirst`/`findAny`, `toArray`.

## How it executes: laziness and vertical processing

Streams don't run each operation over the whole collection in turn. Each element flows **vertically** through the entire pipeline before the next element starts (except where a stateful operation such as `sorted` must see everything first).

```java title="Laziness.java"
import java.util.stream.Stream;

public class Laziness {
    public static void main(String[] args) {
        Stream<String> s = Stream.of("a", "bb", "ccc", "dddd")
            .filter(x -> { System.out.println("filter " + x); return x.length() > 1; })
            .map(x -> { System.out.println("map " + x); return x.toUpperCase(); });
        System.out.println("nothing has run yet");

        String first = s.findFirst().orElse("none");     // short-circuits after the first match
        System.out.println("result " + first);
    }
}
```

```output
nothing has run yet
filter a
filter bb
map bb
result BB
```

"ccc" and "dddd" were never touched: `findFirst` is **short-circuiting**, and laziness means no work was wasted. Internally, the stream builds a chain of `Sink`s and drives the source's `Spliterator` element by element.

## Streams are single-use

```java
Stream<String> names = list.stream();
names.forEach(System.out::println);
names.count();   // IllegalStateException: stream has already been operated upon or closed
```

Create a new stream from the source (or keep a `Supplier<Stream<T>>`) to process again.

## Stream vs Collection

| | Collection | Stream |
|---|---|---|
| Purpose | Store and manage data | Compute over data |
| Storage | Holds elements in memory | No storage; elements flow through |
| Evaluation | Eager — elements exist up front | **Lazy** — computed on demand |
| Traversal | Many times | **Once** |
| Iteration | External (`for`, iterator — you drive) | Internal (the library drives) |
| Size | Finite | Can be infinite (`Stream.iterate`, `generate`) with `limit` |
| Modification | `add`/`remove` | Never modifies its source |
| Parallelism | Manual | `parallelStream()` |

## Primitive streams

`IntStream`, `LongStream`, `DoubleStream` avoid boxing and provide `sum()`, `average()`, `summaryStatistics()`, `range()`:

```java
double avg = orders.stream().mapToDouble(Order::total).average().orElse(0);
int total = IntStream.rangeClosed(1, 100).sum();            // 5050
List<Integer> boxed = IntStream.of(3, 1, 2).boxed().toList();
```

## Real-life example

:::analogy An assembly line
The source is a conveyor belt of parts; each intermediate operation is a station (inspect → paint → label); the terminal operation is the packing station at the end. Nothing moves until the packing station is switched on (laziness), each part travels through all stations one at a time, and if the order is "pack the first good part", the line stops as soon as one arrives (short-circuiting).
:::

:::project
Service layers use streams to map entities to DTOs (`entities.stream().map(mapper::toDto).toList()`), to aggregate report data, to validate batches (`anyMatch(line -> line.qty() <= 0)`), and to build lookup maps. Keep database filtering in the database (WHERE clauses, pagination) — streaming over `findAll()` to filter in memory is a common performance anti-pattern.
:::

## Interview questions

:::qa basic
? What is the difference between intermediate and terminal operations?
Intermediate operations (`filter`, `map`, `sorted`…) return a new stream and are lazy — they only describe the computation. Terminal operations (`collect`, `forEach`, `reduce`, `count`…) produce a result or side effect and trigger the whole pipeline; after that the stream is consumed.
--- followup What happens if a pipeline has no terminal operation?
Nothing executes. The lambdas in the intermediate operations are never called.
:::

:::qa intermediate
? Stream vs Collection?
A collection is an in-memory data structure you can traverse repeatedly and modify. A stream is a lazily evaluated, single-use view of a sequence of elements for computation; it doesn't store data, doesn't modify its source, uses internal iteration, can be infinite, and can run in parallel.
:::

:::qa tricky
? Is `peek()` a good place for logic?
No — it's intended for debugging. Since streams are lazy and may be optimised, `peek` may not run for every element (e.g. `count()` on a sized stream can skip the pipeline in Java 9+). Put real side effects in terminal operations.
:::

:::quiz
? `Stream.of(1,2,3).map(x -> x * 2);` — how many times does the lambda execute?
+ 0
- 1
- 3
- 6
--- explain
No terminal operation was called, so the lazy pipeline never executes.
:::
</script>

<script type="text/x-java-topic">
@id: stream-operations
@module: streams
@title: Stream Operations: map, flatMap, reduce & More
@level: 3
@time: 25
@java: 8+
@prereq: streams-intro
@next: collectors
@tags: filter, map, flatmap, distinct, sorted, limit, skip, reduce, anymatch, findfirst, min, max, count, takewhile, mapmulti
===
## Intermediate operations reference

| Operation | Purpose | Stateful? |
|---|---|---|
| `filter(Predicate)` | Keep matching elements | No |
| `map(Function)` | Transform each element 1 → 1 | No |
| `mapToInt/Long/Double/Obj` | Switch between object and primitive streams | No |
| `flatMap(Function<T, Stream<R>>)` | Transform each element to 0..n elements and flatten | No |
| `distinct()` | Remove duplicates (`equals`/`hashCode`) | **Yes** |
| `sorted()` / `sorted(Comparator)` | Sort | **Yes** (needs all elements) |
| `limit(n)` / `skip(n)` | Truncate / skip | Yes (short-circuit for limit) |
| `peek(Consumer)` | Debug hook | No |
| `takeWhile` / `dropWhile` (9) | Take/drop while a predicate holds (ordered streams) | — |
| `mapMulti` (16) | Imperative alternative to flatMap | No |

## Terminal operations reference

| Operation | Returns |
|---|---|
| `forEach` / `forEachOrdered` | void |
| `collect(Collector)` / `toList()` (16) | A collection or other container |
| `reduce(identity, accumulator)` / `reduce(accumulator)` | A value / `Optional` |
| `count()`, `min(cmp)`, `max(cmp)` | long / `Optional` |
| `anyMatch`, `allMatch`, `noneMatch` | boolean (short-circuit) |
| `findFirst`, `findAny` | `Optional` (short-circuit) |
| `toArray()` / `toArray(String[]::new)` | Array |

## Worked examples

```java title="StreamOps.java"
import java.util.*;
import java.util.stream.*;

public class StreamOps {
    record Line(String sku, int qty, double price) {}
    record Order(String id, String customer, List<Line> lines) {}

    public static void main(String[] args) {
        List<Order> orders = List.of(
            new Order("O1", "asha", List.of(new Line("PEN", 10, 12.5), new Line("BOOK", 2, 250))),
            new Order("O2", "ravi", List.of(new Line("PEN", 5, 12.5))),
            new Order("O3", "asha", List.of(new Line("BAG", 1, 1499), new Line("BOOK", 1, 250))));

        // flatMap: Stream<Order> → Stream<Line>
        List<String> skus = orders.stream()
            .flatMap(o -> o.lines().stream())
            .map(Line::sku)
            .distinct()
            .sorted()
            .toList();
        System.out.println(skus);                                 // [BAG, BOOK, PEN]

        // reduce: total revenue
        double revenue = orders.stream()
            .flatMap(o -> o.lines().stream())
            .mapToDouble(l -> l.qty() * l.price())
            .sum();                                               // specialised reduction
        System.out.println(revenue);                              // 2436.5

        int totalQty = orders.stream()
            .flatMap(o -> o.lines().stream())
            .map(Line::qty)
            .reduce(0, Integer::sum);                             // identity + accumulator
        System.out.println(totalQty);                             // 19

        // matching and finding
        boolean anyBag = orders.stream().anyMatch(o -> o.lines().stream().anyMatch(l -> l.sku().equals("BAG")));
        Optional<Order> firstRavi = orders.stream().filter(o -> o.customer().equals("ravi")).findFirst();
        System.out.println(anyBag + " " + firstRavi.map(Order::id).orElse("-"));   // true O2

        // max with comparator
        Order biggest = orders.stream()
            .max(Comparator.comparingDouble(o -> o.lines().stream().mapToDouble(l -> l.qty() * l.price()).sum()))
            .orElseThrow();
        System.out.println(biggest.id());                          // O3

        // pagination-like slicing
        System.out.println(IntStream.rangeClosed(1, 20).skip(10).limit(5).boxed().toList());  // [11, 12, 13, 14, 15]

        // infinite stream + takeWhile (Java 9)
        System.out.println(Stream.iterate(1, x -> x * 2).takeWhile(x -> x < 100).toList());  // [1, 2, 4, …, 64]
    }
}
```

## map vs flatMap

| | `map` | `flatMap` |
|---|---|---|
| Function returns | A value `R` | A `Stream<R>` |
| Elements out per element in | Exactly 1 | 0 to many |
| Result for `List<List<X>>` | `Stream<List<X>>` | `Stream<X>` (flattened) |
| Typical use | Entity → DTO | Order → its lines; sentence → words |

## reduce rules

`reduce(identity, accumulator)` requires the accumulator to be **associative** and the identity to be a true identity (`0` for sum, `1` for product, `""` for concatenation). Otherwise parallel execution gives wrong results. For building collections, use `collect` (mutable reduction), not `reduce`.

## Interview questions

:::qa intermediate
? Difference between map and flatMap?
`map` transforms each element into exactly one element. `flatMap` transforms each element into a stream of zero or more elements and flattens those streams into one — used for nested structures (orders → lines, lines → words).
:::

:::qa intermediate
? findFirst vs findAny?
`findFirst` returns the first element in encounter order — deterministic even in parallel, but can be more expensive to coordinate. `findAny` may return any element; in parallel streams it returns whichever is found first, allowing better performance when order doesn't matter.
:::

:::qa coding
? Using streams, find the second highest salary from a list of employees.
```java
Optional<Double> second = employees.stream()
    .map(Employee::salary)
    .distinct()
    .sorted(Comparator.reverseOrder())
    .skip(1)
    .findFirst();
```
`distinct` handles duplicate top salaries; `skip(1)` drops the highest.
--- followup Complexity?
O(n log n) due to sorting. A single pass tracking the top two values is O(n) if performance matters.
:::

:::quiz
? `Stream.of("a,b", "c").flatMap(s -> Arrays.stream(s.split(","))).count()` equals?
- 2
+ 3
- 4
- 1
--- explain
"a,b" becomes a stream of 2 elements, "c" a stream of 1; flattened there are 3 elements.
:::

:::exercise interview
? Word frequency, top 3
Given a paragraph, return the three most frequent words (case-insensitive), with counts, most frequent first.
--- solution
```java title="TopWords.java"
import java.util.*;
import java.util.function.Function;
import java.util.stream.*;

public class TopWords {
    public static void main(String[] args) {
        String text = "Java is great and Java is fast and Java is everywhere";
        List<Map.Entry<String, Long>> top = Arrays.stream(text.toLowerCase().split("\\W+"))
            .collect(Collectors.groupingBy(Function.identity(), Collectors.counting()))
            .entrySet().stream()
            .sorted(Map.Entry.<String, Long>comparingByValue().reversed()
                    .thenComparing(Map.Entry.comparingByKey()))
            .limit(3)
            .toList();
        System.out.println(top);   // [is=3, java=3, and=2]
    }
}
```
--- explanation
Split on non-word characters, count with `groupingBy(identity, counting())`, then sort entries by count descending and by word ascending for ties (so "is" comes before "java"), and take three. Result: `[is=3, java=3, and=2]`.
--- complexity
O(n + k log k) for n words and k distinct words.
:::
</script>

@id: collectors
@module: streams
@title: Collectors: groupingBy, partitioningBy, toMap & More
@level: 4
@time: 25
@java: 8+
@prereq: stream-operations
@next: parallel-streams
@tags: collectors, groupingby, partitioningby, tomap, joining, counting, summingint, averaging, mapping, teeing, duplicate key, downstream collector
===
## What is a Collector?

`collect(Collector)` performs a **mutable reduction** — accumulating elements into a container (list, map, string builder). A `Collector` bundles four functions: *supplier* (new container), *accumulator* (add element), *combiner* (merge containers for parallel streams), and *finisher* (final transformation). `java.util.stream.Collectors` provides ready-made ones.

```java title="CollectorsDemo.java"
import java.util.*;
import java.util.stream.*;

public class CollectorsDemo {
    record Emp(String name, String dept, double salary, String city) {}

    public static void main(String[] args) {
        List<Emp> emps = List.of(
            new Emp("Asha", "IT", 90_000, "Pune"),
            new Emp("Ravi", "IT", 70_000, "Mumbai"),
            new Emp("Meera", "HR", 60_000, "Pune"),
            new Emp("Kiran", "Sales", 55_000, "Pune"),
            new Emp("Neha", "HR", 65_000, "Delhi"));

        // 1. group by department
        Map<String, List<Emp>> byDept = emps.stream().collect(Collectors.groupingBy(Emp::dept));

        // 2. group + downstream collector: count per dept (sorted map)
        Map<String, Long> countByDept = emps.stream()
            .collect(Collectors.groupingBy(Emp::dept, TreeMap::new, Collectors.counting()));
        System.out.println(countByDept);            // {HR=2, IT=2, Sales=1}

        // 3. average salary per dept
        Map<String, Double> avg = emps.stream()
            .collect(Collectors.groupingBy(Emp::dept, Collectors.averagingDouble(Emp::salary)));

        // 4. names per city, joined
        Map<String, String> namesByCity = emps.stream().collect(Collectors.groupingBy(
            Emp::city, Collectors.mapping(Emp::name, Collectors.joining(", "))));
        System.out.println(namesByCity.get("Pune"));   // Asha, Meera, Kiran

        // 5. highest paid per dept
        Map<String, Optional<Emp>> top = emps.stream().collect(Collectors.groupingBy(
            Emp::dept, Collectors.maxBy(Comparator.comparingDouble(Emp::salary))));
        System.out.println(top.get("IT").map(Emp::name).orElse("-"));   // Asha

        // 6. partition into two groups (always has true and false keys)
        Map<Boolean, List<String>> highEarners = emps.stream().collect(Collectors.partitioningBy(
            e -> e.salary() >= 65_000, Collectors.mapping(Emp::name, Collectors.toList())));
        System.out.println(highEarners);           // {false=[Meera, Kiran], true=[Asha, Ravi, Neha]}

        // 7. toMap with merge function and map type
        Map<String, Double> payrollByDept = emps.stream().collect(
            Collectors.toMap(Emp::dept, Emp::salary, Double::sum, LinkedHashMap::new));
        System.out.println(payrollByDept);         // {IT=160000.0, HR=125000.0, Sales=55000.0}

        // 8. statistics
        DoubleSummaryStatistics stats = emps.stream().collect(Collectors.summarizingDouble(Emp::salary));
        System.out.printf("min %.0f max %.0f avg %.0f%n", stats.getMin(), stats.getMax(), stats.getAverage());

        // 9. teeing (Java 12): two collectors, one pass
        String range = emps.stream().collect(Collectors.teeing(
            Collectors.minBy(Comparator.comparingDouble(Emp::salary)),
            Collectors.maxBy(Comparator.comparingDouble(Emp::salary)),
            (min, max) -> min.get().name() + " → " + max.get().name()));
        System.out.println(range + " " + byDept.keySet().size() + " " + avg.get("HR"));
    }
}
```

## Cheat sheet

| Collector | Result |
|---|---|
| `toList()`, `toSet()`, `toCollection(TreeSet::new)` | Collections |
| `toUnmodifiableList/Set/Map` (10) | Immutable collections |
| `joining(", ", "[", "]")` | String |
| `counting()`, `summingInt`, `averagingDouble`, `summarizingInt` | Numbers / statistics |
| `minBy`, `maxBy` | `Optional<T>` |
| `groupingBy(classifier[, mapFactory][, downstream])` | `Map<K, List<T>>` or `Map<K, D>` |
| `partitioningBy(predicate[, downstream])` | `Map<Boolean, …>` |
| `toMap(keyFn, valueFn[, merge][, mapFactory])` | `Map<K, V>` |
| `mapping`, `filtering` (9), `flatMapping` (9) | Adapt a downstream collector |
| `collectingAndThen(c, finisher)` | Post-process, e.g. make unmodifiable |
| `teeing(c1, c2, merger)` (12) | Combine two collectors |

:::trap toMap and duplicate keys
`Collectors.toMap(Emp::dept, Emp::name)` throws **`IllegalStateException: Duplicate key IT`** when two employees share a department. Provide a merge function: `toMap(Emp::dept, Emp::name, (a, b) -> a + "," + b)`. Also, `toMap` throws NPE if a **value** is null (it uses `HashMap.merge`).
:::

### `Stream.toList()` vs `Collectors.toList()`

`stream.toList()` (Java 16) returns an **unmodifiable** list and allows nulls. `collect(Collectors.toList())` currently returns a modifiable `ArrayList` (not guaranteed by the spec). Code that later calls `add()` on the result behaves differently.

## Interview questions

:::qa intermediate
? How do you group employees by department and count them with streams?
`emps.stream().collect(Collectors.groupingBy(Emp::dept, Collectors.counting()))` — the classifier builds the key; the downstream collector reduces each group.
--- followup groupingBy vs partitioningBy?
`partitioningBy` splits by a predicate into exactly two groups keyed `true`/`false` (both always present). `groupingBy` groups by any classifier into as many keys as occur.
:::

:::qa tricky
? What happens with `Collectors.toMap` when two elements produce the same key?
It throws `IllegalStateException` (duplicate key) unless you supply a merge function as the third argument.
:::

:::quiz
? Which collector produces `Map<Boolean, List<T>>` with both keys always present?
- `groupingBy`
+ `partitioningBy`
- `toMap`
- `teeing`
--- explain
`partitioningBy` always contains entries for both `true` and `false`, even if one list is empty.
:::
</script>

@id: parallel-streams
@module: streams
@title: Parallel Streams: When They Help & When They Hurt
@level: 4
@time: 15
@java: 8+
@prereq: collectors, executors
@next: io-streams
@tags: parallel stream, forkjoinpool, common pool, spliterator, thread safety, ordering, nq model, side effects
===
## How they work

`collection.parallelStream()` or `stream.parallel()` splits the source using its **`Spliterator`** into chunks, processes them on the **common `ForkJoinPool`** (size = cores − 1, plus the calling thread), and combines partial results (e.g. with a collector's *combiner*). Work-stealing keeps threads busy.

```java
long primes = LongStream.rangeClosed(2, 5_000_000)
        .parallel()
        .filter(ParallelDemo::isPrime)     // CPU-heavy, independent per element
        .count();
```

## When parallel helps

- **Large** data (tens of thousands of elements or more) — or less if each element is expensive.
- **CPU-bound**, independent, stateless operations.
- Sources that **split well**: arrays, `ArrayList`, `IntStream.range`, `HashMap` (good), vs `LinkedList`, `Stream.iterate`, I/O-backed streams (poor).
- Associative reductions (`sum`, `max`, well-behaved collectors).

A rough rule (Brian Goetz's NQ model): parallelism pays off when N (elements) × Q (cost per element) is large — roughly over 10,000.

## When it hurts

- Small data sets — splitting and merging overhead dominates.
- **Blocking I/O** inside the pipeline (HTTP/DB calls) — ties up the shared common pool, starving other parallel streams and `CompletableFuture`s in the JVM.
- Order-sensitive operations (`forEachOrdered`, `findFirst`, `limit` on ordered streams, `sorted`) — extra coordination.
- **Shared mutable state** — data races:

```java
List<Integer> result = new ArrayList<>();
IntStream.range(0, 10_000).parallel().forEach(result::add);   // BUG: ArrayList isn't thread-safe
// lost elements or ArrayIndexOutOfBoundsException
List<Integer> safe = IntStream.range(0, 10_000).parallel().boxed().toList();   // correct
```

- Inside a web server where all request threads already keep the CPU busy — parallel streams compete with request handling.

:::tip Measure before and after
Always benchmark (JMH) with realistic data. Parallel streams are a performance tool, not a default. To isolate a parallel stream from the common pool, run it inside a custom `ForkJoinPool` via `pool.submit(() -> list.parallelStream()…).get()` (a widely used but implementation-dependent technique).
:::

## Interview questions

:::qa intermediate
? When should you use parallel streams?
For large, CPU-intensive, independent, stateless operations over sources that split efficiently (arrays, ArrayLists, ranges), with associative reductions — and only after measuring a benefit. Avoid them for small data, I/O or blocking work, order-dependent logic, and code with shared mutable state.
--- followup Which thread pool do they use?
`ForkJoinPool.commonPool()`, shared JVM-wide with `CompletableFuture` async methods that don't specify an executor; its parallelism defaults to cores − 1 (configurable via `java.util.concurrent.ForkJoinPool.common.parallelism`).
:::

:::qa scenario
? A developer made a report endpoint use `parallelStream()` to call a pricing API for each of 500 items. Under load, the whole service slows down. Why?
Every request's parallel stream shares the small common ForkJoinPool; blocking HTTP calls occupy its threads, so other requests' parallel streams and async tasks queue behind them. Use a dedicated bounded executor with `CompletableFuture`, a batch API, or virtual threads for concurrent I/O.
:::

:::quiz
? Which source splits worst for parallel streams?
- `int[]`
- `ArrayList`
+ `LinkedList`
- `IntStream.range`
--- explain
Splitting a linked list requires traversal, so the work can't be divided cheaply. Array-backed sources split in O(1).
:::
</script>

@id: io-streams
@module: io
@title: Java I/O: Byte & Character Streams
@level: 3
@time: 22
@prereq: try-with-resources
@next: nio
@tags: io, inputstream, outputstream, reader, writer, bufferedreader, bufferedwriter, filereader, file, decorator, charset, utf-8
===
## Introduction

`java.io` (Java 1.0) models input and output as **streams** — sequential flows of data from a source (file, socket, memory, console) or to a destination. (These are unrelated to the Java 8 Stream API.)

There are two families:

| | Byte streams | Character streams |
|---|---|---|
| Base classes | `InputStream` / `OutputStream` | `Reader` / `Writer` |
| Unit | 8-bit bytes | 16-bit `char`s (text), decoded using a **charset** |
| Use for | Images, PDFs, ZIPs, any binary data | Text files, CSV, JSON, logs |
| File classes | `FileInputStream`, `FileOutputStream` | `FileReader`, `FileWriter` |
| Buffered | `BufferedInputStream` / `BufferedOutputStream` | `BufferedReader` (`readLine`) / `BufferedWriter` |
| Bridge | `InputStreamReader` / `OutputStreamWriter` convert bytes ⇄ chars with a charset | |

## The decorator design

Java I/O classes are **decorators**: you wrap a basic stream with others that add features. Each layer implements the same abstract type.

:::flow row
FileInputStream :: raw bytes from disk
InputStreamReader :: bytes → chars (UTF-8)
BufferedReader :: 8 KB buffer + readLine()
:::

```java title="CsvCopy.java"
import java.io.*;
import java.nio.charset.StandardCharsets;

public class CsvCopy {
    public static void main(String[] args) throws IOException {
        File in = File.createTempFile("suppliers", ".csv");
        try (Writer w = new BufferedWriter(new OutputStreamWriter(new FileOutputStream(in), StandardCharsets.UTF_8))) {
            w.write("id,name,city\n1,Tata Steel,Mumbai\n2,Ambuja,Ahmedabad\n");
        }

        File out = File.createTempFile("suppliers-upper", ".csv");
        int lines = 0;
        try (BufferedReader reader = new BufferedReader(
                 new InputStreamReader(new FileInputStream(in), StandardCharsets.UTF_8));
             PrintWriter writer = new PrintWriter(
                 new BufferedWriter(new OutputStreamWriter(new FileOutputStream(out), StandardCharsets.UTF_8)))) {
            String line;
            while ((line = reader.readLine()) != null) {        // null signals end of file
                writer.println(line.toUpperCase());
                lines++;
            }
        }
        System.out.println("copied " + lines + " lines to " + out.getName());

        byte[] buffer = new byte[8192];                          // binary copy with a manual buffer
        try (InputStream is = new FileInputStream(out); OutputStream os = new ByteArrayOutputStream()) {
            int n;
            while ((n = is.read(buffer)) != -1) os.write(buffer, 0, n);   // -1 signals end of stream
        }
        in.delete(); out.delete();
    }
}
```

## Why buffering matters

`FileInputStream.read()` without a buffer can mean one system call per byte. `BufferedReader`/`BufferedInputStream` read large chunks (8 KB by default) into memory and serve subsequent reads from there — often 10–100× faster for small reads.

## Charsets

Characters must be **encoded** into bytes. `FileReader`/`FileWriter` historically used the platform default charset (e.g. Windows-1252 on Windows), causing garbled `₹` or Hindi text across machines. Always specify `StandardCharsets.UTF_8` (Java 11 added `FileReader(File, Charset)`). Since **Java 18 (JEP 400)**, the default charset is UTF-8 everywhere.

## The File class

`java.io.File` represents a path (not file contents): `exists()`, `isDirectory()`, `length()`, `listFiles()`, `mkdirs()`, `delete()`. Its methods return `boolean`s without explaining failures. The NIO.2 `Path`/`Files` API is preferred for new code.

:::project
In Spring applications you'll handle `MultipartFile.getInputStream()` for uploads (Excel/CSV imports), write report bytes to `HttpServletResponse.getOutputStream()` for downloads, and read classpath resources via `getResourceAsStream`. Always close streams (try-with-resources) and stream large files rather than loading them entirely with `readAllBytes()`.
:::

## Interview questions

:::qa basic
? Byte streams vs character streams?
Byte streams (`InputStream`/`OutputStream`) handle raw 8-bit data — suitable for binary files. Character streams (`Reader`/`Writer`) handle text as 16-bit chars and perform charset encoding/decoding. `InputStreamReader`/`OutputStreamWriter` bridge the two.
--- followup Why use BufferedReader?
It reduces expensive system calls by reading large blocks into a buffer and provides `readLine()`.
:::

:::qa intermediate
? Which design pattern is java.io based on?
The Decorator pattern: wrappers such as `BufferedInputStream`, `DataInputStream`, `GZIPInputStream`, `InputStreamReader` add behaviour to an underlying stream while presenting the same abstract type.
:::

:::quiz
? What does `BufferedReader.readLine()` return at end of file?
- An empty string
+ `null`
- -1
- Throws `EOFException`
--- explain
`readLine` returns null when no more lines are available. Byte-level `read()` methods return -1.
:::
</script>

<script type="text/x-java-topic">
@id: nio
@module: io
@title: NIO & NIO.2: Path, Files, Buffers & Channels
@level: 3
@time: 22
@java: 7+ / 11+
@prereq: io-streams
@next: serialization
@tags: nio, nio.2, path, paths, files, channel, buffer, bytebuffer, filechannel, selector, non-blocking, walk, lines, memory mapped
===
## Two generations of "new I/O"

| | NIO (Java 1.4) | NIO.2 (Java 7) |
|---|---|---|
| Package | `java.nio`, `java.nio.channels` | `java.nio.file` |
| Key types | `Buffer`, `Channel`, `Selector` | `Path`, `Files`, `FileSystem`, `WatchService` |
| Purpose | High-performance, block-oriented and non-blocking I/O | Modern file-system API replacing `java.io.File` |

## Path and Files — the everyday API

```java title="NioFiles.java"
import java.io.IOException;
import java.nio.charset.StandardCharsets;
import java.nio.file.*;
import java.util.List;
import java.util.stream.Stream;

public class NioFiles {
    public static void main(String[] args) throws IOException {
        Path dir = Files.createTempDirectory("reports");
        Path file = dir.resolve("summary.txt");                        // dir/summary.txt

        Files.writeString(file, "PO-1,5000\nPO-2,7500\n");              // Java 11
        Files.write(file, List.of("PO-3,1200"), StandardCharsets.UTF_8, StandardOpenOption.APPEND);

        String all = Files.readString(file);                            // small files only
        List<String> lines = Files.readAllLines(file);
        System.out.println(lines.size() + " lines; " + Files.size(file) + " bytes");

        try (Stream<String> s = Files.lines(file)) {                    // lazy: large files; MUST close
            int total = s.mapToInt(l -> Integer.parseInt(l.split(",")[1])).sum();
            System.out.println("total = " + total);                    // 13700
        }

        Path copy = Files.copy(file, dir.resolve("backup.txt"), StandardCopyOption.REPLACE_EXISTING);
        try (Stream<Path> entries = Files.walk(dir)) {                  // recursive listing
            entries.filter(Files::isRegularFile).forEach(p -> System.out.println(p.getFileName()));
        }
        System.out.println(file.getParent().equals(dir) + " " + copy.toString().endsWith(".txt") + " " + all.length());

        Files.delete(copy); Files.delete(file); Files.delete(dir);       // throws with a reason if it fails
    }
}
```

Advantages over `java.io.File`: meaningful exceptions (`NoSuchFileException`, `AccessDeniedException`), symbolic-link awareness, file attributes and permissions, atomic moves, directory walking/streams, and a pluggable `FileSystem` (ZIP files as file systems, in-memory file systems for tests).

## Buffers and channels (NIO)

- A **Channel** (`FileChannel`, `SocketChannel`) is a bidirectional connection to an I/O entity that reads into and writes from **buffers**.
- A **ByteBuffer** is a fixed-capacity container with `position`, `limit` and `capacity`. You write into it, `flip()` it to read, then `clear()`/`compact()` it.
- **Direct buffers** (`ByteBuffer.allocateDirect`) live outside the Java heap so the OS can do I/O without an extra copy.
- `FileChannel.transferTo` can use OS **zero-copy** (e.g. `sendfile`) — how Kafka and Netty move data efficiently.
- **Memory-mapped files** (`channel.map(...)`) map a file into memory for fast random access.

```java
try (FileChannel ch = FileChannel.open(path, StandardOpenOption.READ)) {
    ByteBuffer buf = ByteBuffer.allocate(4096);
    while (ch.read(buf) != -1) {
        buf.flip();                 // switch from writing into the buffer to reading from it
        while (buf.hasRemaining()) process(buf.get());
        buf.clear();                // ready for the next read
    }
}
```

## Non-blocking I/O and selectors

With classic `java.io` sockets, each connection needs its own thread blocked on `read()`. NIO's **`Selector`** lets one thread monitor many non-blocking channels and react only to those that are ready (readable/writable/acceptable). This event-loop model underlies **Netty**, **Tomcat's NIO connector**, and Spring **WebFlux**.

## IO vs NIO

| | java.io | java.nio |
|---|---|---|
| Model | Stream-oriented | Buffer/channel-oriented |
| Blocking | Blocking | Blocking or non-blocking |
| Threads per connection | Typically one | One thread can serve many (selectors) |
| API style | Simple, sequential | Lower-level, more control |

:::info Virtual threads change the calculus
With Java 21 virtual threads, simple blocking-style code scales to many thousands of concurrent connections, reducing the need to hand-write selector-based non-blocking code for many applications.
:::

## Interview questions

:::qa intermediate
? What's the difference between IO and NIO?
Classic IO is stream-oriented and blocking: a thread reads byte-by-byte or line-by-line and blocks until data arrives. NIO is buffer- and channel-oriented, supports non-blocking mode and selectors so one thread can multiplex many channels, and offers direct buffers, memory mapping and zero-copy transfers. NIO.2 adds the modern `Path`/`Files` file-system API.
:::

:::qa intermediate
? Why must `Files.lines()` be closed?
It returns a lazily populated stream backed by an open file handle. Without closing it (try-with-resources), the file descriptor leaks until GC — which may exhaust OS file handles on a busy server.
:::

:::quiz
? What does `ByteBuffer.flip()` do?
- Reverses the bytes
+ Sets limit to the current position and position to 0, preparing to read what was written
- Clears the buffer
- Converts to a direct buffer
--- explain
`flip` switches the buffer from "being filled" mode to "being drained" mode.
:::
</script>

@id: serialization
@module: io
@title: Serialization, transient & serialVersionUID
@level: 3
@time: 20
@prereq: io-streams
@next: jdbc-basics
@tags: serialization, deserialization, serializable, transient, serialversionuid, externalizable, objectoutputstream, readresolve, security, json
===
## Introduction

**Serialization** converts an object graph into a byte stream so it can be stored or sent over a network; **deserialization** rebuilds the objects. Java's built-in mechanism (`java.io.Serializable`, Java 1.1) was used for RMI, HTTP session replication, caching and messaging.

```java title="SerializeDemo.java"
import java.io.*;

public class SerializeDemo {
    static class Customer implements Serializable {
        private static final long serialVersionUID = 1L;       // version of the serialised form
        private final String name;
        private final String email;
        private transient String password;                      // NOT serialised
        private static int instances;                            // static: belongs to class, not serialised

        Customer(String name, String email, String password) {
            this.name = name; this.email = email; this.password = password; instances++;
        }
        @Override public String toString() { return name + " <" + email + "> pwd=" + password; }
    }

    public static void main(String[] args) throws Exception {
        Customer c = new Customer("Asha", "asha@example.com", "s3cret");
        ByteArrayOutputStream bytes = new ByteArrayOutputStream();
        try (ObjectOutputStream out = new ObjectOutputStream(bytes)) {
            out.writeObject(c);
        }
        try (ObjectInputStream in = new ObjectInputStream(new ByteArrayInputStream(bytes.toByteArray()))) {
            Customer copy = (Customer) in.readObject();          // constructor NOT called
            System.out.println(copy);                             // Asha <asha@example.com> pwd=null
            System.out.println(copy != c);                         // true — a new object
        }
    }
}
```

## Key rules

- A class must implement the **marker interface `Serializable`**; otherwise `NotSerializableException`. All non-transient fields must be serialisable too (or the whole graph fails).
- **`transient`** fields are skipped and get default values (`null`, `0`) after deserialisation. Use for passwords, caches, derived values, non-serialisable resources (connections, threads).
- **`static`** fields aren't serialised — they belong to the class.
- Deserialisation **does not call the class's constructor**. It calls the no-arg constructor of the **first non-serialisable superclass** (which must exist and be accessible), and restores fields directly.
- Object identity is preserved within one stream: shared references and cycles are written once and restored as shared.

## serialVersionUID

A version number checked during deserialisation. If the stream's UID differs from the class's, deserialisation fails with **`InvalidClassException`**. If you don't declare one, the JVM computes it from class details (fields, methods, interfaces) — so trivial changes like adding a method can break compatibility and the value can differ across compilers. **Always declare it explicitly** in serialisable classes.

## Customising

- `private void writeObject(ObjectOutputStream)` / `readObject(ObjectInputStream)` — custom encoding, validation, or restoring transient fields.
- `readResolve()` — replace the deserialised object (used to keep **singletons** unique).
- `Externalizable` — full manual control via `writeExternal`/`readExternal`; requires a public no-arg constructor.

## Security: why modern Java discourages it

Deserialising untrusted data is a notorious attack vector: crafted byte streams can trigger "gadget chains" of existing library classes that execute arbitrary code (the 2015 Apache Commons Collections exploits, among many others). Mitigations: never deserialise untrusted input; use **serialisation filters** (`ObjectInputFilter`, Java 9, and context-specific filters in Java 17, JEP 415); prefer data formats such as **JSON** (Jackson), Protocol Buffers or Avro that map data to explicit schemas.

:::project
In Spring Boot, "serialisation" almost always means **JSON via Jackson** (`@RequestBody`/`@ResponseBody`), not `Serializable`. `Serializable` still appears in JPA entities (the spec recommends it for detached entities and composite keys), HTTP session attributes when sessions are replicated, and some caches.
:::

## Interview questions

:::qa basic
? What is serialization and how do you make a class serializable?
Converting an object's state into a byte stream for storage or transmission, and back. Implement `java.io.Serializable` (a marker interface), ensure fields are serialisable or `transient`, and declare a `serialVersionUID`.
--- followup What is the transient keyword?
It marks fields excluded from default serialisation; after deserialisation they have default values.
:::

:::qa intermediate
? What is serialVersionUID and what happens if you don't define it?
A version identifier for the serialised form of a class. On deserialisation, mismatched UIDs cause `InvalidClassException`. If not defined, one is computed from the class structure, so harmless code changes can break reading old data.
:::

:::qa tricky
? Is the constructor called during deserialization?
Not the serialisable class's own constructor. The JVM allocates the object and invokes the no-arg constructor of the nearest non-serialisable superclass (often `Object`), then sets fields from the stream.
--- followup If the parent is not Serializable but the child is?
The parent's fields are not serialised; they're initialised by the parent's no-arg constructor during deserialisation — which must exist, or `InvalidClassException` is thrown.
:::

:::quiz
? After deserialisation, what is the value of a `transient int retries` field that was 5?
+ 0
- 5
- null
- An exception is thrown
--- explain
Transient fields are not written; they receive the default value for their type.
:::
</script>

@id: jdbc-basics
@module: jdbc
@title: JDBC Architecture, Statement & PreparedStatement
@level: 3
@time: 25
@prereq: try-with-resources
@next: jdbc-transactions
@tags: jdbc, driver, drivermanager, connection, statement, preparedstatement, resultset, sql injection, callablestatement, datasource
===
## Introduction

**JDBC** (Java Database Connectivity) is the standard Java API for relational databases. Your code talks to JDBC interfaces in `java.sql`/`javax.sql`; a vendor **driver** (MySQL Connector/J, PostgreSQL JDBC, Oracle ojdbc) implements them for a specific database. Every higher-level tool — Spring's `JdbcTemplate`, Hibernate/JPA, MyBatis, jOOQ — sits on top of JDBC.

## Architecture

:::flow
Your application code :: uses java.sql interfaces only
JDBC API :: Connection, PreparedStatement, ResultSet …
* JDBC driver (vendor JAR) :: implements the interfaces; speaks the DB's wire protocol
Database server :: MySQL, PostgreSQL, Oracle, SQL Server
:::

Modern drivers are "Type 4" (pure Java, network protocol). Since JDBC 4.0 (Java 6), drivers are discovered automatically via `ServiceLoader` — `Class.forName("com.mysql.cj.jdbc.Driver")` is no longer needed.

## Core interfaces

| Interface | Role |
|---|---|
| `DriverManager` / `DataSource` | Obtain connections (`DataSource` is preferred; enables pooling) |
| `Connection` | A session with the DB; controls transactions |
| `Statement` | Executes static SQL |
| `PreparedStatement` | Precompiled, parameterised SQL (`?` placeholders) |
| `CallableStatement` | Calls stored procedures |
| `ResultSet` | Cursor over query results |
| `ResultSetMetaData` / `DatabaseMetaData` | Column and database information |

## A complete example

```java
public Optional<Supplier> findById(long id) throws SQLException {
    String sql = "SELECT id, name, gstin FROM supplier WHERE id = ? AND active = ?";
    try (Connection con = dataSource.getConnection();
         PreparedStatement ps = con.prepareStatement(sql)) {
        ps.setLong(1, id);                 // parameter indexes start at 1
        ps.setBoolean(2, true);
        try (ResultSet rs = ps.executeQuery()) {
            if (rs.next()) {               // cursor starts BEFORE the first row
                return Optional.of(new Supplier(rs.getLong("id"), rs.getString("name"), rs.getString("gstin")));
            }
            return Optional.empty();
        }
    }
}

public int deactivate(long id) throws SQLException {
    try (Connection con = dataSource.getConnection();
         PreparedStatement ps = con.prepareStatement("UPDATE supplier SET active = false WHERE id = ?")) {
        ps.setLong(1, id);
        return ps.executeUpdate();         // number of rows affected
    }
}
```

| Method | Use |
|---|---|
| `executeQuery()` | SELECT → `ResultSet` |
| `executeUpdate()` | INSERT/UPDATE/DELETE/DDL → affected row count |
| `execute()` | Any SQL; returns true if the result is a `ResultSet` |

## Statement vs PreparedStatement — SQL injection

```java
// DANGEROUS: string concatenation
String sql = "SELECT * FROM users WHERE username = '" + username + "' AND password = '" + password + "'";
// username = admin' --     →  WHERE username = 'admin' --' AND password = '…'   (password check commented out)
```

```sql
SELECT * FROM users WHERE username = 'admin' --' AND password = 'anything'
```

With `PreparedStatement`, parameters are sent **separately** from the SQL text; the database treats them strictly as data, never as SQL syntax.

| | `Statement` | `PreparedStatement` |
|---|---|---|
| SQL injection | Vulnerable when concatenating input | **Safe** for values |
| Precompilation | Parsed every execution | Parsed/planned once, reused (DB and driver caching) |
| Readability | String building | `?` placeholders, typed setters |
| Binary/large data | Awkward | `setBlob`, `setBinaryStream` |
| Batching | `addBatch(String)` | `addBatch()` with parameters — efficient |

:::warn Placeholders can't replace identifiers
`?` works for **values** only — not table names, column names or `ORDER BY` directions. For dynamic sorting, map user input to a whitelist of allowed column names.
:::

## Interview questions

:::qa basic
? What are the steps to connect to a database using JDBC?
Obtain a `Connection` (from a `DataSource`/connection pool or `DriverManager.getConnection(url, user, pass)`), create a `PreparedStatement`, set parameters, execute (`executeQuery`/`executeUpdate`), process the `ResultSet`, and close resources — all in try-with-resources. The driver is auto-loaded via the service loader since JDBC 4.
:::

:::qa intermediate
? Statement vs PreparedStatement?
`PreparedStatement` is precompiled with parameter placeholders: it prevents SQL injection by binding values separately from the SQL, can be reused efficiently with different parameters, supports batching, and handles types cleanly. `Statement` executes a fixed SQL string and is vulnerable if input is concatenated into it.
--- followup Does PreparedStatement always prevent SQL injection?
Only for bound values. If you still concatenate user input into the SQL text (e.g. an `ORDER BY` column), you're vulnerable — whitelist such parts.
:::

:::quiz
? Where is a `ResultSet` cursor positioned initially?
+ Before the first row
- On the first row
- On the last row
- It depends on the driver
--- explain
You must call `next()` once to move to the first row; it returns false if there are no rows.
:::
</script>
