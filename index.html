<script type="text/x-java-topic">
@id: encapsulation
@module: pillars
@title: Encapsulation
@level: 2
@time: 18
@prereq: classes-objects
@next: abstraction, packages-access
@tags: encapsulation, data hiding, getters, setters, private, invariants, javabean
===
## Introduction

**Encapsulation** is bundling an object's data together with the methods that operate on it, and **restricting direct access** to that data so the object controls its own state.

Why does it exist? Without it, any code anywhere could set `account.balance = -5000` or `order.status = "SHIPPED"` without the corresponding checks and side effects. Encapsulation makes a class responsible for its own **invariants** (rules that must always hold) and lets you change its internals without breaking callers.

## Technical explanation

Encapsulation in Java is implemented with:

1. **`private` fields** — no outside code can read or write them directly.
2. **Public methods** that expose *operations* (`deposit`, `withdraw`) rather than raw data, validating inputs and keeping related fields consistent.
3. **Getters** that return data safely (defensive copies for mutable objects) and **setters only where changes are legitimate**.

Data hiding (making fields private) is the mechanism; encapsulation is the broader design goal of *protecting invariants behind a controlled interface*.

```java title="BankAccount.java"
import java.math.BigDecimal;
import java.util.ArrayList;
import java.util.Collections;
import java.util.List;

public class BankAccount {
    private final String accountNumber;
    private BigDecimal balance = BigDecimal.ZERO;               // hidden state
    private final List<String> transactions = new ArrayList<>();

    public BankAccount(String accountNumber) {
        this.accountNumber = accountNumber;
    }

    public void deposit(BigDecimal amount) {
        requirePositive(amount);
        balance = balance.add(amount);
        transactions.add("DEPOSIT " + amount);
    }

    public void withdraw(BigDecimal amount) {
        requirePositive(amount);
        if (balance.compareTo(amount) < 0) {
            throw new IllegalStateException("Insufficient funds");
        }
        balance = balance.subtract(amount);
        transactions.add("WITHDRAW " + amount);
    }

    public BigDecimal getBalance() { return balance; }            // BigDecimal is immutable: safe to return

    public List<String> getTransactions() {
        return Collections.unmodifiableList(transactions);       // read-only view: callers can't add fake entries
    }

    private static void requirePositive(BigDecimal amount) {     // private helper: implementation detail
        if (amount == null || amount.signum() <= 0) throw new IllegalArgumentException("Amount must be positive");
    }

    public static void main(String[] args) {
        BankAccount acc = new BankAccount("SB-001");
        acc.deposit(new BigDecimal("5000"));
        acc.withdraw(new BigDecimal("1200"));
        System.out.println(acc.getBalance() + " " + acc.getTransactions());   // 3800 [DEPOSIT 5000, WITHDRAW 1200]
        // acc.balance = new BigDecimal("-1");          // compile error: balance has private access
        // acc.getTransactions().add("FAKE");           // UnsupportedOperationException
    }
}
```

### Code breakdown

| Element | Why it is written this way |
|---|---|
| `private BigDecimal balance` | Only this class can change the balance, so the "never negative" invariant can't be bypassed. |
| No `setBalance` | Balance changes only through meaningful operations that also record a transaction. |
| `withdraw` validates first | Guard clauses keep the object valid; invalid requests throw instead of corrupting state. |
| `unmodifiableList` in getter | Returning the internal list would let callers mutate private state — "leaking" encapsulation. |
| `private static requirePositive` | Helpers are hidden; the public surface stays small. |

## Real-life example

:::analogy The ATM
You never touch the bank's database. The ATM exposes controlled operations — **Withdraw**, **Deposit**, **Check balance** — and enforces rules (PIN, daily limit, sufficient funds). The bank can replace its entire core system without changing how you use the ATM. That's encapsulation: controlled access to hidden state through a stable interface.
:::

:::project
JPA entities in a well-designed service expose domain methods (`purchaseOrder.addLine(item, qty)`, `order.approve(approver)`) that maintain totals and status transitions, rather than a setter for every column. DTOs are the exception: they are plain data carriers, often Java **records**.
:::

## Common mistakes

:::mistake
- Generating getters **and setters** for every field by reflex — that is just public fields with extra steps.
- Returning internal mutable collections or `Date` objects directly.
- Accepting mutable objects in constructors without copying them (the caller keeps a reference and can change your state later).
:::

## When to use / when not to use

:::cols
--- col When to use
- Any class with rules about its state (money, stock, status workflows).
- Public APIs and libraries where internals must be free to change.
- Shared objects accessed by multiple threads — one place to add synchronisation.
--- col When not to over-apply
- Simple data carriers (DTOs, events) — use records instead of hand-written getters.
- Private nested helper classes used only by the enclosing class.
:::

## Interview questions

:::qa basic
? What is encapsulation?
Bundling data and the methods that operate on it into a class, and restricting direct access to the data (typically with `private` fields) so that state changes happen only through methods that enforce the class's rules.
--- followup Difference between encapsulation and abstraction?
Encapsulation is about *hiding and protecting state* — how an object guards its data. Abstraction is about *hiding complexity* — exposing what an object does while hiding how. Encapsulation is one of the tools used to achieve abstraction.
:::

:::qa intermediate
? Is a class with private fields and public getters/setters for all of them well encapsulated?
Not really. It hides the field names but not the ability to put the object into an invalid state. Good encapsulation exposes behaviour and validates changes; setters exist only where arbitrary changes are legitimate.
--- followup How do you return a collection without breaking encapsulation?
Return an unmodifiable view (`Collections.unmodifiableList`), an immutable copy (`List.copyOf`), or a stream; never the internal mutable list.
:::

:::quiz
? Which change best improves encapsulation of `public double balance;`?
- Make it `static`
- Make it `final`
+ Make it `private` and expose `deposit`/`withdraw` methods that validate
- Add a public setter
--- explain
The goal is to let the class enforce its rules; public operations with validation do that, while a setter would allow any value.
:::
</script>

<script type="text/x-java-topic">
@id: inheritance
@module: pillars
@title: Inheritance
@level: 3
@time: 25
@prereq: constructors, final-keyword
@next: super-keyword, polymorphism
@tags: inheritance, extends, is-a, subclass, superclass, single inheritance, multilevel, hierarchical, diamond problem, object class
===
## Introduction

**Inheritance** lets a class (the **subclass**/child) acquire the fields and methods of another class (the **superclass**/parent) and then add or change behaviour. It models an **IS-A** relationship: a `SavingsAccount` *is an* `Account`, a `Manager` *is an* `Employee`.

Why? To reuse common code and, more importantly, to enable **polymorphism**: code written against `Account` works with any kind of account.

## Syntax and what is inherited

```java title="Payroll.java"
class Employee {
    protected final String name;
    protected double baseSalary;

    Employee(String name, double baseSalary) {
        this.name = name;
        this.baseSalary = baseSalary;
    }

    double monthlyPay() {
        return baseSalary / 12;
    }

    String describe() {
        return name + " earns " + Math.round(monthlyPay()) + "/month";
    }
}

class Manager extends Employee {                // Manager IS-A Employee
    private final double bonus;

    Manager(String name, double baseSalary, double bonus) {
        super(name, baseSalary);                  // initialise the parent part first
        this.bonus = bonus;
    }

    @Override
    double monthlyPay() {                         // override: specialise behaviour
        return super.monthlyPay() + bonus / 12;   // reuse parent logic
    }
}

public class Payroll {
    public static void main(String[] args) {
        Employee e = new Employee("Asha", 600000);
        Employee m = new Manager("Ravi", 1200000, 240000);   // parent reference, child object
        System.out.println(e.describe());   // Asha earns 50000/month
        System.out.println(m.describe());   // Ravi earns 120000/month  ← Manager.monthlyPay() was used
    }
}
```

| Member | Inherited? |
|---|---|
| `public` / `protected` fields and methods | Yes |
| Package-private members | Yes, if the subclass is in the same package |
| `private` members | **Not accessible** (they exist inside the object, but the subclass can't see them) |
| Constructors | **No** — but the subclass must call one via `super(...)` |
| Static members | Accessible through the subclass, but belong to the parent class (hidden, not overridden) |

## Types of inheritance

:::cards
Single :: `B extends A`
Multilevel :: `C extends B`, `B extends A`
Hierarchical :: `B extends A`, `C extends A`
Multiple (classes) :: **Not allowed** — `class C extends A, B` is illegal
Multiple (interfaces) :: Allowed — `class C implements X, Y`
:::

### Why no multiple inheritance of classes? The diamond problem

If `C` extended both `A` and `B` and both defined `greet()` with different implementations (and fields with state), which would `C` inherit? C++ solves this with complex rules; Java avoids it by allowing only **one superclass**. Interfaces can be multiply implemented because, historically, they carried no state and no implementation. Since Java 8's **default methods**, a conflict *can* arise between two interfaces — and Java forces the class to resolve it explicitly (see [Interfaces](#interfaces)).

Every class ultimately extends **`java.lang.Object`** — if you write no `extends`, the compiler adds `extends Object`.

## Memory view

A `Manager` object is **one object** containing the fields of `Object`, `Employee` and `Manager` laid out together. `super(...)` does not create a separate parent object — it initialises the parent portion of the same object.

:::diagram new Manager("Ravi", 1200000, 240000)
[a] Object header :: mark word + class pointer → Manager
[g] Employee fields :: name → "Ravi" · baseSalary = 1200000.0
[w] Manager fields :: bonus = 240000.0
:::

## Composition over inheritance

Inheritance creates **tight coupling**: changes to the parent affect all children, and children depend on parent implementation details (the *fragile base class* problem). Prefer **composition** (HAS-A) unless there is a true IS-A relationship and the subclass honours the parent's contract (Liskov Substitution).

```java
// Wrong: a Stack IS NOT really a Vector, but java.util.Stack extends Vector,
// so callers can insert in the middle of a "stack" — a famous JDK design mistake.

// Better: composition
class OrderHistory {
    private final List<Order> orders = new ArrayList<>();  // HAS-A list, exposes only what makes sense
    void record(Order o) { orders.add(o); }
}
```

## Real-life example

:::analogy Vehicle types
Every car, bus and bike *is a* vehicle: they all have a registration number and can start and stop (inherited). A bus adds passenger capacity; an electric car overrides "refuel" to mean "recharge". But a car *has an* engine — you don't say "a car is an engine" — that's composition.
:::

:::project
In Spring/JPA projects, inheritance appears in a `BaseEntity` (`id`, `createdAt`, `updatedBy`) annotated `@MappedSuperclass`, extended by every entity; and in exception hierarchies (`BusinessException extends RuntimeException`). Business behaviour variation is usually modelled with interfaces and composition (strategy pattern), not deep class hierarchies.
:::

## Common mistakes

:::mistake
- Inheriting just to reuse a couple of methods (use composition or a helper).
- Deep hierarchies (5+ levels) that are hard to understand and change.
- Violating Liskov: `Square extends Rectangle` where `setWidth` must also change the height — code that works for rectangles breaks for squares.
- Forgetting that parent constructors run first and calling overridable methods from them.
:::

## Interview questions

:::qa basic
? What is inheritance? Which types does Java support?
Inheritance lets a class acquire members of another class using `extends`, modelling IS-A relationships and enabling reuse and polymorphism. Java supports single, multilevel and hierarchical inheritance for classes, and multiple inheritance of type through interfaces.
--- followup Why doesn't Java support multiple inheritance of classes?
To avoid the diamond problem — ambiguity and complexity when two parents provide conflicting implementations and state. Interfaces give multiple inheritance of *type*; default-method conflicts must be resolved explicitly by the implementing class.
:::

:::qa intermediate
? Are private members inherited?
They are part of the subclass object's memory, but they are not *inherited* in the sense of being accessible or visible to the subclass. The JLS states that private members are not inherited. The subclass accesses them only through non-private methods of the parent.
:::

:::qa scenario
? You need `ReadOnlyList` behaviour on top of `ArrayList`. Would you extend `ArrayList`?
No. Extending would inherit `add`, `remove`, `set` and you'd have to override each to throw — easy to miss one (and new methods added in future JDKs). Wrap an existing list (composition) and expose only read operations, or return `List.copyOf(...)`/`Collections.unmodifiableList(...)`.
:::

:::trap Is a constructor inherited?
No. Many candidates say yes. Constructors are not members and are not inherited; a subclass must define its own and chain to a parent constructor via `super(...)` (explicitly or implicitly).
:::

:::quiz
? `class A {}` — what is A's superclass?
- None
+ `java.lang.Object`
- `java.lang.Class`
- It depends on the package
--- explain
Every class without an explicit `extends` implicitly extends `Object`.
:::
</script>

<script type="text/x-java-topic">
@id: super-keyword
@module: pillars
@title: The super Keyword
@level: 2
@time: 10
@prereq: inheritance
@next: polymorphism
@tags: super, super(), parent constructor, parent method, field hiding
===
## Introduction

`super` refers to the **parent-class part of the current object**. It has two forms:

| Form | Purpose |
|---|---|
| `super(args)` | Call a parent constructor — must be the first statement of a constructor. |
| `super.member` | Access a parent method or field that the subclass has overridden or hidden. |

```java title="SuperDemo.java"
class Notification {
    protected String channel = "GENERIC";
    Notification(String to) { System.out.println("Notification to " + to); }
    String format(String msg) { return "[" + channel + "] " + msg; }
}

class SmsNotification extends Notification {
    protected String channel = "SMS";        // HIDES the parent field (fields are not overridden)

    SmsNotification(String phone) {
        super(phone);                          // parent constructor first
    }

    @Override
    String format(String msg) {
        String base = super.format(msg);       // parent's implementation
        return base.length() > 30 ? base.substring(0, 30) + "…" : base;
    }

    void show() {
        System.out.println(channel + " / " + super.channel);   // SMS / GENERIC
    }
}

public class SuperDemo {
    public static void main(String[] args) {
        SmsNotification n = new SmsNotification("+91-98xxxxxx10");
        System.out.println(n.format("Your OTP is 482913. Do not share it."));
        // prints "[GENERIC] Your OTP is 482913. …" — Notification.format() reads Notification.channel:
        // fields are HIDDEN, not overridden, so the parent's code still sees the parent's field.
        n.show();
    }
}
```

## Rules

- If a constructor doesn't call `this(...)` or `super(...)`, the compiler inserts `super()`. If the parent has **no no-arg constructor**, that is a compile error: *constructor Parent in class Parent cannot be applied to given types*.
- `super` cannot be used in a static context.
- `super.super.method()` is not allowed — you can reach only the direct parent.
- Fields are **hidden**, not overridden: `parentRef.channel` uses the declared type. Avoid same-named fields in subclasses.

:::qa basic
? What is the difference between this and super?
`this` refers to the current object and its members (and `this(...)` calls another constructor of the same class). `super` refers to the parent-class portion of the current object (`super.method()` calls the parent's version, `super(...)` calls a parent constructor).
--- followup Can this() and super() both be used in one constructor?
No. Each must be the first statement, so only one of them can appear.
:::

:::quiz
? The parent class has only `Parent(int x)`. The child declares `Child() { }`. Result?
- Compiles; x defaults to 0
+ Compile error: implicit `super()` finds no no-arg constructor
- Runtime error
- The child inherits `Parent(int)`
--- explain
The compiler inserts `super();`, but `Parent` has no no-arg constructor. The child must call `super(someInt)` explicitly.
:::
</script>

<script type="text/x-java-topic">
@id: polymorphism
@module: pillars
@title: Polymorphism: Overloading, Overriding & Dynamic Dispatch
@level: 3
@time: 28
@prereq: inheritance, overloading-varargs
@next: abstraction, interfaces
@tags: polymorphism, overriding, dynamic method dispatch, runtime polymorphism, compile time, covariant return, vtable, @override, upcasting
===
## Introduction

**Polymorphism** ("many forms") means one interface — a method call — can trigger different behaviour depending on the object. It lets you write code against a general type (`PaymentMethod`) that keeps working when new specific types (`UpiPayment`, `WalletPayment`) are added, without changing that code.

Java has two kinds:

| | Compile-time (static) | Runtime (dynamic) |
|---|---|---|
| Mechanism | **Overloading** | **Overriding** |
| Decided by | Declared (static) types of arguments | Actual (runtime) class of the object |
| Decided when | By `javac` | By the JVM at each call |
| Bytecode | Exact method chosen in `invokevirtual`/`invokestatic` | `invokevirtual`/`invokeinterface` + dispatch |

## Runtime polymorphism in action

```java title="Checkout.java"
import java.util.List;

abstract class PaymentMethod {
    abstract String pay(double amount);
    String receipt(double amount) { return pay(amount) + " ✓"; }   // calls the overridden method
}

class UpiPayment extends PaymentMethod {
    private final String vpa;
    UpiPayment(String vpa) { this.vpa = vpa; }
    @Override String pay(double amount) { return "UPI " + vpa + " paid " + amount; }
}

class CardPayment extends PaymentMethod {
    private final String last4;
    CardPayment(String last4) { this.last4 = last4; }
    @Override String pay(double amount) { return "Card ****" + last4 + " charged " + amount; }
}

public class Checkout {
    public static void main(String[] args) {
        List<PaymentMethod> methods = List.of(new UpiPayment("mayur@upi"), new CardPayment("4242"));
        for (PaymentMethod m : methods) {                  // declared type: PaymentMethod
            System.out.println(m.receipt(499.0));          // actual type decides pay()
        }
    }
}
```

```output
UPI mayur@upi paid 499.0 ✓
Card ****4242 charged 499.0 ✓
```

`Checkout` never mentions `UpiPayment` inside the loop. Adding `NetBankingPayment` requires **zero changes** to the loop — this is the Open/Closed principle in practice.

## How dynamic dispatch works internally

For each class, HotSpot builds a **virtual method table (vtable)**: an array of pointers to the implementations of its overridable methods, with inherited slots in the same positions as in the parent. At an `invokevirtual` call, the JVM reads the object's class pointer from its header, looks up the method's slot in that class's vtable, and jumps to that implementation. Interfaces use itables (with more complex lookup).

In practice the **JIT** optimises this heavily: if profiling shows a call site only ever sees one or two classes (*monomorphic* / *bimorphic*), it inlines those implementations behind a cheap type check, so virtual calls often cost nothing.

## Overriding rules

| Rule | Detail |
|---|---|
| Same signature | Same name and parameter types. |
| Return type | Same, or a **subtype** (covariant return, Java 5). |
| Access | Same or **wider** (protected → public OK; public → protected not). |
| Checked exceptions | Same, narrower, or none — never new/broader checked exceptions. |
| Cannot override | `private` (not visible), `static` (hidden instead), `final` methods; constructors. |
| `@Override` | Optional but strongly recommended: the compiler errors if you don't actually override (typo, wrong parameter type). |

```java
class Animal {
    protected Animal reproduce() throws Exception { return new Animal(); }
}
class Dog extends Animal {
    @Override
    public Dog reproduce() { return new Dog(); }   // wider access, covariant return, no exception: all legal
}
```

## What is NOT polymorphic

- **Fields** — resolved by the declared type (hiding).
- **Static methods** — resolved at compile time (hiding).
- **Private methods** — not inherited, called directly.
- **Overload selection** — the *which-overload* decision uses declared types, even though the chosen method may then be dispatched dynamically.

```java
class Printer {
    void print(Object o) { System.out.println("Object"); }
    void print(String s) { System.out.println("String"); }
}
Object o = "text";
new Printer().print(o);    // "Object" — overload chosen by the DECLARED type of o
```

## Real-life example

:::analogy The word "open"
"Open" means different things for a door, a bank account, a file and a laptop lid. You issue the same instruction and the thing itself knows how to do it. The speaker (calling code) doesn't need a separate verb for each object — that's polymorphism.
:::

:::project Polymorphism is how Spring works
You inject `PaymentGateway gateway;` and call `gateway.charge(...)`. Depending on configuration, the object is a `RazorpayGateway`, a `StripeGateway` or a test mock. Spring even wraps beans in **proxies** (subclasses or interface implementations generated at runtime) that override your methods to add transactions (`@Transactional`) and security (`@PreAuthorize`) — dynamic dispatch routes your call through the proxy first.
:::

## Common mistakes

:::mistake
- Overloading when you meant to override: `public boolean equals(Product p)` **overloads** `equals(Object)`; collections will never call it. Use `@Override` to catch this.
- Long `if (x instanceof A) … else if (x instanceof B)` chains instead of an overridden method.
- Expecting field access or static methods to behave polymorphically.
:::

## Interview questions

:::qa basic
? What is polymorphism? What types does Java have?
The ability of one method call to behave differently depending on the object. Java has compile-time polymorphism (method overloading, resolved by the compiler from declared argument types) and runtime polymorphism (method overriding, resolved by the JVM from the object's actual class via dynamic dispatch).
--- followup What is dynamic method dispatch?
The runtime mechanism that selects which overridden method implementation to execute based on the actual object type, not the reference type — implemented with vtables/itables and heavily optimised by the JIT.
:::

:::qa intermediate
? What are the rules for method overriding?
Same name and parameter list; return type same or covariant; access modifier same or less restrictive; no new or broader checked exceptions; `final`, `static` and `private` methods cannot be overridden.
--- followup Can you override a method and throw a RuntimeException?
Yes. Unchecked exceptions are not restricted by overriding rules.
:::

:::qa tricky
? `Parent p = new Child(); p.x` — whose field `x` is read if both declare `x`? And `p.show()`?
`p.x` reads `Parent.x` (fields are resolved by declared type — hiding). `p.show()` runs `Child.show()` if it overrides it (dynamic dispatch).
:::

:::qa tricky
? Can we override a private method?
No. Private methods aren't visible to subclasses. A method with the same signature in the subclass is a completely separate method; calls from the parent class still invoke the parent's private method.
:::

:::qa scenario
? A colleague wrote a 200-line `switch (paymentType)` in `PaymentService` that grows every time a new payment type is added. How would you refactor?
Introduce a `PaymentProcessor` interface with `supports(type)` and `process(request)`, one implementation per type, and have the service select the implementation (e.g. from a `Map<PaymentType, PaymentProcessor>` built from injected beans). New types become new classes; the service doesn't change — runtime polymorphism plus the Strategy pattern.
:::

:::quiz
? Which override is legal for `protected Number value() throws IOException` in the parent?
- `private Number value()`
+ `public Integer value()`
- `protected Number value() throws Exception`
- `protected Object value()`
--- explain
Wider access (public) and a covariant return type (`Integer` is a `Number`) are allowed, and dropping the checked exception is fine. `Exception` is broader than `IOException`, `Object` is not a subtype of `Number`, and `private` narrows access.
:::

:::exercise intermediate
? Shapes with polymorphic area
Create an abstract `Shape` with `area()`, and `Circle`, `Rectangle`, `Triangle` subclasses. Given a list of shapes, print the total area and the largest shape — without any `instanceof`.
--- solution
```java title="Shapes.java"
import java.util.Comparator;
import java.util.List;

abstract class Shape {
    abstract double area();
    public String toString() { return getClass().getSimpleName() + String.format("(%.2f)", area()); }
}
class Circle extends Shape {
    final double r; Circle(double r) { this.r = r; }
    double area() { return Math.PI * r * r; }
}
class Rectangle extends Shape {
    final double w, h; Rectangle(double w, double h) { this.w = w; this.h = h; }
    double area() { return w * h; }
}
class Triangle extends Shape {
    final double b, h; Triangle(double b, double h) { this.b = b; this.h = h; }
    double area() { return 0.5 * b * h; }
}

public class Shapes {
    public static void main(String[] args) {
        List<Shape> shapes = List.of(new Circle(1), new Rectangle(2, 3), new Triangle(4, 5));
        double total = 0;
        for (Shape s : shapes) total += s.area();
        Shape largest = shapes.stream().max(Comparator.comparingDouble(Shape::area)).orElseThrow();
        System.out.printf("Total %.2f, largest %s%n", total, largest);
    }
}
```
--- explanation
Each subclass supplies its own `area()`; the loop and `max` work with the abstract type. Adding `Hexagon` needs no change to `main`.
:::
</script>

<script type="text/x-java-topic">
@id: abstraction
@module: pillars
@title: Abstraction & Abstract Classes
@level: 3
@time: 20
@prereq: polymorphism
@next: interfaces
@tags: abstraction, abstract class, abstract method, template method, partial implementation
===
## Introduction

**Abstraction** means exposing *what* something does while hiding *how* it does it. Callers depend on a simplified model — `sendNotification(user, message)` — not on SMTP handshakes or SMS gateway APIs.

In Java, abstraction is expressed with **abstract classes** and **interfaces**. This topic covers abstract classes; the next covers interfaces and compares the two.

## Abstract classes

An `abstract` class cannot be instantiated. It can contain:

- **abstract methods** — declared without a body; concrete subclasses must implement them;
- concrete methods, fields (including mutable state), constructors, static members.

```java title="Reports.java"
abstract class ReportGenerator {
    private final String title;

    protected ReportGenerator(String title) {       // constructors exist: they initialise the abstract part
        this.title = title;
    }

    // Template method: fixed algorithm skeleton, final so subclasses can't break the sequence
    public final String generate() {
        StringBuilder sb = new StringBuilder();
        sb.append(header()).append('\n');
        sb.append(body()).append('\n');
        sb.append(footer());
        return sb.toString();
    }

    protected String header() { return "== " + title + " =="; }   // default behaviour, may be overridden
    protected abstract String body();                               // the varying step
    protected String footer() { return "-- end --"; }
}

class SalesReport extends ReportGenerator {
    SalesReport() { super("Monthly Sales"); }
    @Override protected String body() { return "Total sales: 12,40,000"; }
}

class StockReport extends ReportGenerator {
    StockReport() { super("Low Stock"); }
    @Override protected String body() { return "SKU-17: 3 left"; }
    @Override protected String footer() { return "Reorder today"; }
}

public class Reports {
    public static void main(String[] args) {
        ReportGenerator r = new SalesReport();      // abstract type reference
        System.out.println(r.generate());
        System.out.println(new StockReport().generate());
        // new ReportGenerator("x");                // compile error: abstract class cannot be instantiated
    }
}
```

### Rules

- A class with **any** abstract method must be declared `abstract`.
- A subclass must implement **all** inherited abstract methods, or itself be abstract.
- `abstract` cannot combine with `final` (must be extended), `private` (must be visible to override) or `static` (static methods can't be overridden) on methods.
- An abstract class **may have zero abstract methods** — sometimes used just to prevent instantiation of a base type (`HttpServlet` is abstract but has no abstract methods).

## Real-life example

:::analogy Driving a car
The steering wheel, pedals and gear lever are the abstraction. Whether the car is petrol, diesel or electric, you drive it the same way. An abstract class is like a car platform shared by several models: the chassis and safety system are built (concrete methods), but each model must supply its own engine (abstract method).
:::

:::project
Frameworks are full of abstract classes that implement the Template Method pattern: `HttpServlet` (`service()` dispatches to your `doGet`/`doPost`), Spring's `OncePerRequestFilter` (you implement `doFilterInternal`), and `AbstractRoutingDataSource`.
:::

## Interview questions

:::qa basic
? What is abstraction and how is it achieved in Java?
Abstraction is hiding implementation details and exposing only essential behaviour. Java achieves it with abstract classes (partial implementations with abstract methods) and interfaces (contracts), used together with polymorphism.
:::

:::qa intermediate
? Can an abstract class have a constructor? Why, if it can't be instantiated?
Yes. The constructor runs when a concrete subclass is instantiated (via `super(...)`) to initialise the fields defined in the abstract class and enforce its invariants.
--- followup Can an abstract class have no abstract methods?
Yes. It is then simply a class that cannot be instantiated directly, forcing use through subclasses.
:::

:::qa tricky
? Can an abstract method be private, static or final?
No. Private methods can't be overridden (invisible), static methods are hidden rather than overridden, and final methods can't be overridden — all contradict "must be implemented by a subclass". (Interfaces, however, can have *private non-abstract* helper methods since Java 9.)
:::

:::quiz
? Which is allowed in an abstract class?
- Instantiating it with `new`
+ Declaring a constructor and instance fields
- Declaring an `abstract static` method
- Declaring an `abstract final` method
--- explain
Abstract classes can have constructors, state and concrete methods; they just can't be instantiated directly.
:::
</script>

<script type="text/x-java-topic">
@id: interfaces
@module: pillars
@title: Interfaces & Abstract Class vs Interface
@level: 3
@time: 28
@java: 8+ / 9+
@prereq: abstraction
@next: relationships, lambdas
@tags: interface, implements, default method, static method, private method, functional interface, marker interface, diamond, abstract class vs interface, contract
===
## Introduction

An **interface** is a **contract**: a named set of capabilities that any class can promise to provide, regardless of where it sits in the class hierarchy. `Comparable`, `Runnable`, `List`, `AutoCloseable` and Spring's `JpaRepository` are all interfaces.

Why do interfaces exist when abstract classes already allow abstraction?

1. A class can extend only one class but **implement many interfaces** — multiple inheritance of *type*.
2. Interfaces describe *roles* ("can be compared", "can be closed") that cut across unrelated hierarchies.
3. Coding to interfaces decouples callers from implementations, enabling testing with mocks, dependency injection and swapping implementations.

## What an interface can contain

```java title="Notifications.java"
import java.util.List;

interface Notifier {
    int MAX_LENGTH = 160;                          // implicitly public static final (a constant)

    void send(String to, String message);          // implicitly public abstract

    default void sendAll(List<String> recipients, String message) {   // Java 8: default method
        for (String r : recipients) send(r, truncate(message));
    }

    static Notifier console() {                    // Java 8: static factory method
        return (to, msg) -> System.out.println("to " + to + ": " + msg);
    }

    private String truncate(String m) {            // Java 9: private helper for default methods
        return m.length() <= MAX_LENGTH ? m : m.substring(0, MAX_LENGTH);
    }
}

interface Auditable {
    default String auditTag() { return getClass().getSimpleName(); }
}

class SmsNotifier implements Notifier, Auditable {    // implements multiple interfaces
    @Override
    public void send(String to, String message) {       // must be public
        System.out.println("[" + auditTag() + "] SMS to " + to + ": " + message);
    }
}

public class Notifications {
    public static void main(String[] args) {
        Notifier n = new SmsNotifier();
        n.sendAll(List.of("+91-90000", "+91-80000"), "Order #1001 shipped");
        Notifier.console().send("dev", "hello");        // lambda: Notifier has one abstract method
    }
}
```

| Member | Since | Implicit modifiers |
|---|---|---|
| Constants | 1.0 | `public static final` |
| Abstract methods | 1.0 | `public abstract` |
| Default methods | **8** | `public` — have a body, can be overridden |
| Static methods | **8** | `public` — called as `Interface.method()`, **not** inherited by implementing classes |
| Private methods | **9** | reusable helpers for default/static methods |
| Nested types | 1.0 | `public static` |

Interfaces have **no instance fields and no constructors** — they cannot hold per-object state.

## Why default methods were added (Java 8)

Java 8 needed to add `forEach`, `stream()`, `removeIf` to `Collection`/`Iterable`. Adding abstract methods would have broken every existing implementation in the world. **Default methods** let an interface evolve by providing an implementation that existing classes inherit automatically.

### The diamond with default methods

```java
interface A { default String hello() { return "A"; } }
interface B { default String hello() { return "B"; } }

class C implements A, B {
    @Override
    public String hello() {              // REQUIRED: otherwise compile error (inherits unrelated defaults)
        return A.super.hello() + B.super.hello();   // explicitly choose or combine
    }
}
```

Resolution rules: (1) a method from a **class** wins over interface defaults; (2) a more **specific** interface (sub-interface) wins; (3) otherwise the class must override and choose explicitly using `X.super.method()`.

## Special kinds of interfaces

- **Functional interface** — exactly one abstract method (`Runnable`, `Comparator`, `Function`); can be implemented with a lambda. See [Functional interfaces](#functional-interfaces).
- **Marker interface** — no methods; tags a class for special treatment: `Serializable`, `Cloneable`, `RandomAccess`. Annotations are the modern alternative, but markers give compile-time type checking.
- **Sealed interface** (Java 17) — restricts which classes may implement it. See [Sealed classes](#sealed-classes).

## Abstract class vs interface

| Aspect | Abstract class | Interface |
|---|---|---|
| Keyword | `extends` (one only) | `implements` (many) |
| State | Instance fields of any kind | Only `public static final` constants |
| Constructors | Yes | No |
| Methods | Abstract and concrete; any access modifier | Abstract, default, static, private (no protected) |
| Method access | Any | Public (except private helpers) |
| Relationship | IS-A — shared identity and code | CAN-DO — capability / role |
| Evolution | Add concrete methods freely | Add default methods |
| Use a lambda? | No | Yes, if functional |
| Typical example | `AbstractList`, `HttpServlet` | `List`, `Comparable`, `Runnable` |

### When to choose which

:::cols
--- col Choose an interface when
- You're defining a capability or contract (`PaymentGateway`, `Exporter`).
- Unrelated classes need the same role.
- You want to allow multiple implementations, mocks and dependency injection.
- A lambda implementation would be convenient.
--- col Choose an abstract class when
- Subclasses share **state** and substantial common code.
- You need constructors to enforce initialisation invariants.
- You want non-public (protected) hooks — the Template Method pattern.
- Often: **both** — an interface for the contract plus an abstract base class as a convenience (`List` + `AbstractList`).
:::

## Real-life example

:::analogy Power sockets and driving licences
An interface is like a **standard power socket**: any appliance with the right plug works, whatever brand or internals. Or a **driving licence**: a person can hold several licences (car, motorcycle) — capabilities — without them defining *who* the person is. An abstract class is more like a **family surname**: you inherit it from exactly one parent, along with the family business.
:::

:::project Interfaces in Spring Boot
- `interface SupplierRepository extends JpaRepository<Supplier, Long>` — you declare an interface; Spring Data generates the implementation at runtime.
- Service contracts: `interface InvoiceService` + `InvoiceServiceImpl` — callers (and tests) depend on the interface.
- Strategy beans: all `DiscountRule` implementations are injected as a `List<DiscountRule>` and applied in a loop.
:::

## Common mistakes

:::mistake
- Implementing an interface method with default (package-private) access: *attempting to assign weaker access privileges; was public*.
- Putting business logic in `default` methods that need state — interfaces can't hold instance state; you end up with awkward workarounds.
- "Constant interfaces" (an interface full of constants, implemented just to use the names) — an anti-pattern; use a final class or enum and static imports.
- Assuming static interface methods are inherited: `SmsNotifier.console()` does not compile; call `Notifier.console()`.
:::

## Interview questions

:::qa basic
? What is the difference between an abstract class and an interface?
An abstract class can have state, constructors and methods of any access level, and a class can extend only one. An interface defines a contract with abstract, default, static and private methods but no instance state or constructors, and a class can implement many. Abstract classes model IS-A with shared code; interfaces model capabilities.
--- followup After Java 8, interfaces can have method bodies — so what's the difference now?
State and constructors. Interfaces still cannot have instance fields or constructors, so default methods can only work through other interface methods. Also multiple inheritance of interfaces vs single inheritance of classes, and access modifiers (interfaces have no protected members).
:::

:::qa intermediate
? Why were default methods introduced?
To evolve interfaces without breaking existing implementations — mainly to add stream and lambda-friendly methods (`forEach`, `stream`, `removeIf`, `Comparator.thenComparing`) to the collections API in Java 8.
--- followup How does Java resolve a conflict when a class inherits the same default method from two interfaces?
The class must override the method; inside it can call a specific one with `InterfaceName.super.method()`. If a superclass declares the method, the class's version wins over interface defaults; a more specific sub-interface wins over its parent.
:::

:::qa tricky
? Can an interface extend a class? Can it extend multiple interfaces? Can it implement an interface?
An interface cannot extend a class. It can extend multiple interfaces (`interface C extends A, B`). It never "implements" — it extends other interfaces.
:::

:::qa tricky
? What is a marker interface and is it still relevant?
An interface with no methods used to tag classes (`Serializable`, `Cloneable`, `RandomAccess`). Annotations can mark classes too, but marker interfaces define a *type*, so misuse can be caught at compile time (e.g., a method parameter of type `Serializable`). Both are still used.
:::

:::qa scenario
? You're designing a file-export feature supporting CSV, Excel and PDF, and more formats later. Interface or abstract class?
An `Exporter` interface (`String format(); byte[] export(Report r)`) for the contract, so each format is independently implementable and injectable. If the formats share substantial logic (header rendering, pagination), add an `AbstractExporter` implementing the interface with template methods. Callers depend only on `Exporter`.
:::

:::quiz
? Which modifier combination is implicitly applied to a field declared in an interface?
- `private final`
- `public`
+ `public static final`
- `protected static`
--- explain
Interface fields are constants: implicitly public, static and final, and must be initialised.
:::

:::quiz
? `interface Greeter { static String hi() { return "hi"; } }` and `class G implements Greeter {}`. Which call compiles?
+ `Greeter.hi()`
- `G.hi()`
- `new G().hi()`
- All of them
--- explain
Static interface methods are not inherited by implementing classes; they must be called through the interface name.
:::
</script>

<script type="text/x-java-topic">
@id: relationships
@module: pillars
@title: Association, Aggregation & Composition
@level: 3
@time: 15
@prereq: inheritance, interfaces
@next: packages-access
@tags: association, aggregation, composition, has-a, is-a, uml, dependency, coupling
===
## Introduction

Inheritance models **IS-A**. Most relationships in real systems are **HAS-A** or **USES-A**. UML names three strengths:

| Relationship | Meaning | Lifetime | Example |
|---|---|---|---|
| **Association** | Objects know about / use each other | Independent | `Teacher` ↔ `Student` |
| **Aggregation** (weak HAS-A) | Whole contains parts that can exist independently | Parts outlive the whole | `Department` has `Employee`s |
| **Composition** (strong HAS-A) | Whole owns its parts; parts don't exist without it | Parts die with the whole | `Order` has `OrderLine`s; `House` has `Room`s |

```java title="Relationships.java"
import java.util.ArrayList;
import java.util.List;

class Employee {
    final String name;
    Employee(String name) { this.name = name; }
}

class Department {                                   // AGGREGATION: employees are created elsewhere
    private final List<Employee> members = new ArrayList<>();
    void add(Employee e) { members.add(e); }         // receives existing objects
}

class Order {                                        // COMPOSITION: order creates and owns its lines
    private final List<Line> lines = new ArrayList<>();

    void addLine(String sku, int qty) {
        lines.add(new Line(sku, qty));                // created inside, never shared outside
    }
    int totalQty() { return lines.stream().mapToInt(l -> l.qty).sum(); }

    private static final class Line {                // the part type isn't even visible outside
        final String sku; final int qty;
        Line(String sku, int qty) { this.sku = sku; this.qty = qty; }
    }
}

class Mailer {
    void notify(Employee e, String msg) { System.out.println("Mail " + e.name + ": " + msg); }  // ASSOCIATION (uses)
}

public class Relationships {
    public static void main(String[] args) {
        Employee asha = new Employee("Asha");
        Department it = new Department();
        it.add(asha);                    // if 'it' is deleted, asha still exists
        Order o = new Order();
        o.addLine("SKU-1", 2);
        o.addLine("SKU-2", 3);
        System.out.println(o.totalQty());  // 5 — lines exist only as part of this order
        new Mailer().notify(asha, "Welcome");
    }
}
```

## Why favour composition over inheritance

- **Looser coupling** — you depend on the part's public interface, not its internals.
- **Runtime flexibility** — swap the part (`new Car(new ElectricEngine())`); inheritance is fixed at compile time.
- **No fragile base class** — changes in a parent class can't silently break you.
- **Testability** — inject a mock collaborator.

:::project
JPA mappings mirror these relationships: `@OneToMany(mappedBy="order", cascade = ALL, orphanRemoval = true)` on `Order.lines` is **composition** (lines are saved and deleted with the order); a `@ManyToOne Supplier supplier` on a purchase order is **association/aggregation** — deleting the PO must not delete the supplier. Spring beans collaborate by **association** through constructor injection.
:::

:::qa intermediate
? What is the difference between aggregation and composition?
Both are HAS-A. In aggregation the part has an independent lifecycle and may be shared (a department and its employees). In composition the whole owns the part exclusively and the part's lifetime is bound to it (an order and its lines).
--- followup Why is "favour composition over inheritance" a common guideline?
Composition gives looser coupling, runtime flexibility, easier testing and avoids fragile base-class problems; inheritance should be reserved for genuine IS-A relationships that satisfy Liskov substitution.
:::

:::quiz
? A `Car` creates its own `Engine` in its constructor and never exposes it. This is:
- Association
- Aggregation
+ Composition
- Inheritance
--- explain
The whole creates and exclusively owns the part; the engine's lifetime is tied to the car.
:::
</script>

@id: packages-access
@module: core
@title: Packages & Access Modifiers
@level: 2
@time: 18
@prereq: encapsulation
@next: object-class
@tags: package, import, public, private, protected, default, package-private, access control, modules, static import
===
## Introduction

**Packages** group related types into namespaces (`java.util`, `com.incluziv.erp.purchase`). They prevent name clashes (two `Order` classes can coexist in different packages), organise large codebases, and form a boundary for **access control**.

**Access modifiers** decide who may see a class or member. They are Java's main tool for encapsulation.

## Packages

```java
package com.shop.billing;                 // must be the first statement; mirrors folder com/shop/billing/

import java.util.List;                    // single-type import
import java.util.*;                       // on-demand import (all public types in java.util, not sub-packages)
import static java.lang.Math.PI;          // static import

public class InvoiceService { … }
```

- The **fully qualified name** is `com.shop.billing.InvoiceService`.
- `java.lang` is imported automatically.
- Imports are purely compile-time conveniences; they don't load anything or affect performance.
- `java.util.*` does **not** import `java.util.concurrent.*` — packages are not hierarchical in Java; `java.util.concurrent` is a completely separate package.
- If two imports define the same simple name (`java.util.Date` and `java.sql.Date`), use a fully qualified name for one.

## The four access levels

| Modifier | Same class | Same package | Subclass (other package) | Everywhere |
|---|---|---|---|---|
| `private` | ✓ | ✗ | ✗ | ✗ |
| *(none)* — package-private | ✓ | ✓ | ✗ | ✗ |
| `protected` | ✓ | ✓ | ✓ (through inheritance) | ✗ |
| `public` | ✓ | ✓ | ✓ | ✓ |

- **Top-level classes** can only be `public` or package-private.
- **Members** (fields, methods, constructors, nested classes) can use all four.
- **Interface members** are implicitly `public` (except `private` methods).

### The protected subtlety

A subclass in a *different package* can access a `protected` member **only through references of its own type (or subtypes)**, not through a reference to the parent type:

```java
package a;  public class Parent { protected int x; }

package b;
public class Child extends a.Parent {
    void test(a.Parent p, Child c) {
        x = 1;        // OK: inherited member of this object
        c.x = 2;      // OK: accessed through a Child reference
        // p.x = 3;   // compile error: Parent reference from another package
    }
}
```

## Choosing access levels

:::tip Start as private as possible
Make fields `private`, helper methods `private`, classes package-private by default, and widen only when there's a real consumer. Every `public` member is a promise you'll have to keep.
:::

:::version Modules (Java 9+) add a level above packages
With the Java Platform Module System, a `module-info.java` declares which packages a module `exports`. A `public` class in a non-exported package is **not** accessible to other modules. This is how the JDK hides internals like `sun.misc` and `jdk.internal.*`; since Java 16/17, strong encapsulation of JDK internals is on by default (`--illegal-access` was removed in 17).
:::

## Real-life example

:::analogy An office building
`private` is your desk drawer; package-private is your department's floor (colleagues on the floor can enter); `protected` is the family business — relatives (subclasses) elsewhere may use certain things; `public` is the reception lobby open to everyone.
:::

:::project Package structure in a Spring Boot service
Two common layouts: **by layer** (`controller`, `service`, `repository`, `dto`) or **by feature** (`purchase`, `supplier`, `invoice`, each containing its own controller/service/repository). Package-by-feature lets you keep implementation classes package-private so other features can use only the public service — encapsulation at the package level.
:::

## Interview questions

:::qa basic
? What are the access modifiers in Java?
`private` (class only), package-private/default (same package), `protected` (same package plus subclasses elsewhere), and `public` (everywhere).
--- followup Can a top-level class be private or protected?
No. Top-level classes can only be public or package-private. Nested classes can use any modifier.
:::

:::qa tricky
? Does `import java.util.*;` import `java.util.function.Function`?
No. Wildcard imports cover only types directly in that package, not sub-packages; `java.util.function` is a distinct package.
:::

:::qa tricky
? What is the difference between protected and default access?
Default (package-private) grants access only within the same package. `protected` adds access for subclasses in other packages — via inheritance, and only through references of the subclass's own type.
:::

:::quiz
? A `protected` method is declared in `com.a.Base`. Which code can call `base.m()` where `base` is of type `Base`?
+ Any class in package `com.a`
- Any subclass of `Base` in any package
- Any class anywhere
- Only `Base` itself
--- explain
Within the same package, protected behaves like package-private. A subclass in another package can call it only via `this` or references of the subclass type.
:::
</script>

<script type="text/x-java-topic">
@id: object-class
@module: core
@title: The Object Class
@level: 2
@time: 15
@prereq: inheritance
@next: equals-hashcode
@tags: object, tostring, equals, hashcode, getclass, clone, finalize, wait, notify, root class
===
## Introduction

`java.lang.Object` is the root of the class hierarchy: every class, array and enum ultimately extends it. Its methods define behaviour that **every** object has, and several are contracts you're expected to override correctly.

## Methods of Object

| Method | Purpose | Override? |
|---|---|---|
| `boolean equals(Object o)` | Logical equality; default is identity (`==`) | Yes, for value types |
| `int hashCode()` | Hash for hash-based collections; must be consistent with `equals` | **Always together with equals** |
| `String toString()` | Human-readable representation; default `ClassName@hexHash` | Almost always |
| `Class<?> getClass()` | Runtime class object — `final`, can't override | No |
| `protected Object clone()` | Field-by-field copy if the class implements `Cloneable` | Rarely; prefer copy constructors |
| `wait()`, `wait(long)`, `notify()`, `notifyAll()` | Monitor-based thread coordination — `final` | No |
| `protected void finalize()` | GC cleanup hook — **deprecated for removal** | Never |

## A class that overrides the essentials

```java title="Point.java"
import java.util.Objects;

public final class Point {
    private final int x, y;

    public Point(int x, int y) { this.x = x; this.y = y; }

    @Override
    public boolean equals(Object o) {
        if (this == o) return true;                          // same object: fast path
        if (!(o instanceof Point)) return false;             // also handles null
        Point p = (Point) o;
        return x == p.x && y == p.y;                          // compare significant fields
    }

    @Override
    public int hashCode() {
        return Objects.hash(x, y);                            // equal objects → equal hash
    }

    @Override
    public String toString() {
        return "Point(" + x + ", " + y + ")";
    }

    public static void main(String[] args) {
        Point a = new Point(1, 2), b = new Point(1, 2);
        System.out.println(a == b);          // false — different objects
        System.out.println(a.equals(b));     // true  — same value
        System.out.println(a.hashCode() == b.hashCode());   // true
        System.out.println(a);               // Point(1, 2)
        System.out.println(a.getClass().getName());         // Point
    }
}
```

:::version Records do this for you
`public record Point(int x, int y) {}` (Java 16+) generates the constructor, accessors, `equals`, `hashCode` and `toString` automatically. See [Records](#records).
:::

## Interview questions

:::qa basic
? Name the methods of the Object class.
`equals`, `hashCode`, `toString`, `getClass`, `clone`, `finalize` (deprecated), and the monitor methods `wait` (three overloads), `notify` and `notifyAll`.
--- followup Why are wait/notify in Object and not in Thread?
Because every object can be used as a monitor (lock). Waiting and notifying are operations on a specific object's monitor, not on a thread.
:::

:::qa intermediate
? Why is getClass() final?
Its result must reliably identify the object's runtime class — used by the JVM, reflection, serialization and `equals` implementations. Allowing overrides would let a class lie about its type.
:::

:::quiz
? What does the default `equals` in `Object` compare?
- Field values
+ References (identity), like `==`
- Hash codes
- `toString()` output
--- explain
`Object.equals` returns `this == obj`. Classes like `String`, `Integer` and records override it to compare values.
:::
</script>

<script type="text/x-java-topic">
@id: equals-hashcode
@module: core
@title: equals() & hashCode() Contract
@level: 3
@time: 25
@prereq: object-class, string-equality
@next: wrapper-classes, hashmap-internals
@tags: equals, hashcode, contract, reflexive, symmetric, transitive, consistent, hashmap key, mutable key, objects.hash
===
## Introduction

`equals()` and `hashCode()` together decide how objects behave in `HashMap`, `HashSet`, `ConcurrentHashMap`, caches and JPA persistence contexts. Getting them wrong produces some of the most confusing bugs in Java: objects that are "in" a set but can't be found, duplicates in a set, or memory leaks from maps that grow forever.

## The equals contract (from `Object`'s Javadoc)

For non-null references x, y, z:

| Property | Rule |
|---|---|
| Reflexive | `x.equals(x)` is true |
| Symmetric | `x.equals(y)` ⇔ `y.equals(x)` |
| Transitive | `x.equals(y)` and `y.equals(z)` ⇒ `x.equals(z)` |
| Consistent | Repeated calls return the same result while the objects are unchanged |
| Null | `x.equals(null)` is false |

## The hashCode contract

1. Calling `hashCode()` repeatedly on an unchanged object returns the same value (within one run).
2. **If `a.equals(b)` then `a.hashCode() == b.hashCode()`.**
3. Unequal objects *may* share a hash code (a collision) — allowed, but many collisions hurt performance.

## Why the contract matters: how HashMap uses them

`HashMap.get(key)`:

1. Computes `key.hashCode()` → picks a **bucket**.
2. Within that bucket, compares entries with `equals()`.

If two equal objects have **different** hash codes, they land in different buckets and `equals` is never even called — the map can't find the key.

```java title="BrokenKey.java"
import java.util.HashSet;
import java.util.Set;

public class BrokenKey {
    static class Emp {
        final String id;
        Emp(String id) { this.id = id; }
        @Override public boolean equals(Object o) {
            return o instanceof Emp e && id.equals(e.id);
        }
        // hashCode NOT overridden → identity hash, different for each object
    }

    public static void main(String[] args) {
        Set<Emp> set = new HashSet<>();
        set.add(new Emp("E1"));
        System.out.println(set.contains(new Emp("E1")));   // false (almost always) — broken!
        set.add(new Emp("E1"));
        System.out.println(set.size());                      // 2 — a "duplicate" in a Set
    }
}
```

## A correct implementation

```java title="Employee.java"
import java.util.Objects;

public final class Employee {
    private final String id;          // business key: immutable
    private final String email;
    private String name;              // mutable, NOT part of equality

    public Employee(String id, String email, String name) {
        this.id = Objects.requireNonNull(id);
        this.email = email;
        this.name = name;
    }

    @Override
    public boolean equals(Object o) {
        if (this == o) return true;
        if (o == null || getClass() != o.getClass()) return false;   // strict class check
        Employee other = (Employee) o;
        return id.equals(other.id) && Objects.equals(email, other.email);
    }

    @Override
    public int hashCode() {
        return Objects.hash(id, email);   // SAME fields as equals
    }

    public void rename(String n) { this.name = n; }   // safe: name is not in equals/hashCode
}
```

### `getClass()` vs `instanceof` in equals

- `getClass() != o.getClass()` — subclasses are never equal to the parent; guarantees symmetry. Common for entities and value classes.
- `instanceof` — allows subclass instances to be equal, but symmetry breaks if a subclass adds fields to equality. Use it when the class is `final` or subclasses don't change equality (and with pattern matching it reads nicely).

## Mutable keys: the silent killer

```java
List<String> key = new ArrayList<>(List.of("a"));
Map<List<String>, Integer> map = new HashMap<>();
map.put(key, 1);
key.add("b");                       // hash code of the key changes
System.out.println(map.get(key));   // null — the entry is in the bucket for the OLD hash
System.out.println(map.size());     // 1 — the entry is still there, just unreachable: a leak
```

:::key
Fields used in `equals`/`hashCode` must not change while the object is inside a hash-based collection. Prefer immutable keys: `String`, `Integer`, enums, records with immutable components.
:::

## Real-life example

:::analogy A library with shelves
`hashCode` picks the **shelf**; `equals` checks the **exact book** on that shelf. If two copies of the same book are assigned different shelf numbers, the librarian searching the right shelf will never find the other copy. If you rewrite a book's title after shelving it (mutable key), it now "belongs" on a different shelf — but it's still sitting on the old one, lost.
:::

:::project JPA entities
For entities, basing `equals`/`hashCode` on a generated database `id` is tricky: the id is `null` before persisting, so the hash changes after `save()` — breaking `Set<OrderLine>` membership. Common approaches: use an immutable **business key** (SKU, email, UUID assigned at creation), or use `id`-based `equals` with a **constant `hashCode()`** (e.g. `getClass().hashCode()`), which is safe though less efficient for huge sets.
:::

## Common mistakes

:::mistake
- Overriding `equals` but not `hashCode` (or vice versa).
- Writing `public boolean equals(Employee e)` — an **overload**, not an override; collections call `equals(Object)`. Always use `@Override`.
- Including mutable fields that change while the object is in a set/map.
- Using `==` for `String`/wrapper fields inside `equals`.
- Violating symmetry with `instanceof` across a class hierarchy.
:::

## Interview questions

:::qa basic
? What is the contract between equals() and hashCode()?
If two objects are equal according to `equals`, they must return the same `hashCode`. Unequal objects may share a hash code. `hashCode` must be consistent across calls while the object's equality-relevant state is unchanged.
--- followup What happens if you override equals but not hashCode?
Equal objects get different identity-based hash codes, so hash-based collections put them in different buckets: `contains`/`get` fail to find logically equal keys and sets accept duplicates.
:::

:::qa scenario
? What happens if two objects have the same hashCode but are not equal?
It's a collision, and it's legal. Both are stored in the same `HashMap` bucket; lookups use `equals` to distinguish them. Correctness is preserved but performance degrades if many keys collide — the bucket becomes a linked list (O(n)) or, from Java 8, a red-black tree (O(log n)) once it holds more than 8 entries and the table has at least 64 buckets.
--- followup What if hashCode always returns 1?
Still correct, but every entry lands in one bucket, so `HashMap` degrades to O(n) lookups (O(log n) with treeification if keys are `Comparable`).
:::

:::qa tricky
? Can two unequal objects have the same hash code? Can two equal objects have different hash codes?
Yes to the first (collisions are allowed — `"Aa"` and `"BB"` both hash to 2112). No to the second — that would violate the contract.
:::

:::qa scenario
? A `HashSet<Order>` contains an order, but `set.contains(order)` returns false for the same object. What could cause it?
The order's hash code changed after insertion — a field used in `hashCode` was modified (e.g. status or a JPA id assigned on save). The object sits in the bucket for its old hash. Fix: base equality on immutable fields, or remove, modify, and re-add.
:::

:::quiz
? Which pair of strings has the same `hashCode()`?
+ "Aa" and "BB"
- "a" and "A"
- "ab" and "ba"
- None — String hashes are unique
--- explain
String hash = s[0]·31^(n−1) + … + s[n−1]. "Aa": 65·31 + 97 = 2112; "BB": 66·31 + 66 = 2112.
:::

:::exercise intermediate
? Implement equals/hashCode for a composite key
Create `OrderLineKey(String orderNo, int lineNo)` suitable as a `HashMap` key. Show that two separately created keys retrieve the same value.
--- solution
```java title="OrderLineKey.java"
import java.util.HashMap;
import java.util.Map;
import java.util.Objects;

public final class OrderLineKey {
    private final String orderNo;
    private final int lineNo;

    public OrderLineKey(String orderNo, int lineNo) {
        this.orderNo = Objects.requireNonNull(orderNo);
        this.lineNo = lineNo;
    }

    @Override public boolean equals(Object o) {
        if (this == o) return true;
        if (!(o instanceof OrderLineKey)) return false;
        OrderLineKey k = (OrderLineKey) o;
        return lineNo == k.lineNo && orderNo.equals(k.orderNo);
    }

    @Override public int hashCode() { return 31 * orderNo.hashCode() + lineNo; }

    public static void main(String[] args) {
        Map<OrderLineKey, String> m = new HashMap<>();
        m.put(new OrderLineKey("PO-7", 1), "Steel rods");
        System.out.println(m.get(new OrderLineKey("PO-7", 1)));   // Steel rods
    }
}
```
--- explanation
The class is final and immutable, so equality can't change while it's in a map, and `instanceof` is safe (no subclasses). In Java 16+, `record OrderLineKey(String orderNo, int lineNo) {}` gives the same result in one line.
:::
</script>

<script type="text/x-java-topic">
@id: wrapper-classes
@module: core
@title: Wrapper Classes, Autoboxing & the Integer Cache
@level: 2
@time: 18
@prereq: data-types
@next: enums
@tags: wrapper, integer, autoboxing, unboxing, integer cache, valueof, parseint, npe unboxing, boxing performance
===
## Introduction

Each primitive has a **wrapper class** in `java.lang` that represents it as an object:

| Primitive | Wrapper | Primitive | Wrapper |
|---|---|---|---|
| `byte` | `Byte` | `float` | `Float` |
| `short` | `Short` | `double` | `Double` |
| `int` | `Integer` | `char` | `Character` |
| `long` | `Long` | `boolean` | `Boolean` |

Why do they exist? Generics and collections work only with objects (`List<int>` is illegal), fields sometimes need to represent "no value" (`null`), and wrappers provide utilities: `Integer.parseInt`, `Integer.MAX_VALUE`, `Character.isDigit`, `Long.compare`.

## Autoboxing and unboxing (Java 5)

The compiler inserts conversions automatically:

```java
List<Integer> ids = new ArrayList<>();
ids.add(42);              // autoboxing:  ids.add(Integer.valueOf(42))
int first = ids.get(0);   // unboxing:    ids.get(0).intValue()
Integer total = 0;
total += 5;               // unbox, add, box a NEW Integer — wrappers are immutable
```

## The Integer cache — why `==` sometimes "works"

```java title="IntegerCache.java"
public class IntegerCache {
    public static void main(String[] args) {
        Integer a = 127, b = 127;
        System.out.println(a == b);        // true  — both from the cache
        Integer c = 128, d = 128;
        System.out.println(c == d);        // false — two different objects
        System.out.println(c.equals(d));   // true  — always compare values with equals
        Integer e = Integer.valueOf(100), f = Integer.valueOf(100);
        System.out.println(e == f);        // true — valueOf uses the cache
    }
}
```

`Integer.valueOf(int)` (used by autoboxing) returns cached instances for **−128 to 127**. The upper bound can be raised with `-XX:AutoBoxCacheMax=…`. `Short`, `Byte`, `Long` and `Character` (0–127) cache similar ranges; `Boolean.TRUE`/`FALSE` are singletons; `Float` and `Double` have no cache. `new Integer(5)` always creates a new object and is deprecated for removal.

## NullPointerException from unboxing

```java
Map<String, Integer> stock = new HashMap<>();
int qty = stock.get("SKU-404");   // get returns null → null.intValue() → NullPointerException
int safe = stock.getOrDefault("SKU-404", 0);
```

Also watch the ternary: `Integer x = flag ? someInteger : 0;` unboxes `someInteger` if the other operand is a primitive `int` — NPE if it is null.

## Performance

Boxing allocates objects (outside the cache), adds a header to each value and an indirection to access it. A `List<Integer>` with a million elements uses several times the memory of an `int[]`. In hot loops, prefer primitives and specialised streams (`IntStream`, `mapToInt`).

```java
Long sum = 0L;
for (long i = 0; i < 1_000_000; i++) sum += i;   // creates ~1 million Long objects
long fast = 0;                                   // use the primitive
```

:::project Primitives vs wrappers in entities and DTOs
Use wrappers (`Long id`, `Integer quantity`) for JPA entity fields and request DTOs when the column/field is nullable — `null` means "not provided", which a primitive can't express (it would silently become 0). Use primitives for values that always exist and for calculations.
:::

## Interview questions

:::qa basic
? What is autoboxing and unboxing?
Automatic conversion by the compiler between primitives and their wrapper types: `int` → `Integer` via `Integer.valueOf` (boxing) and `Integer` → `int` via `intValue()` (unboxing).
--- followup Where can unboxing cause problems?
Unboxing a `null` wrapper throws `NullPointerException`; repeated boxing in loops creates garbage; and `==` between wrappers compares references.
:::

:::qa tricky
? Why does `Integer a = 127, b = 127; a == b` print true but with 128 print false?
Autoboxing uses `Integer.valueOf`, which returns cached objects for values from −128 to 127. 127 comes from the cache (same object); 128 creates two distinct objects. `==` compares references — use `equals` or unbox first.
:::

:::qa tricky
? What does `Long l = 100L; l.equals(100)` return?
`false`. The argument `100` is boxed to an `Integer`, and `Long.equals` returns false for any non-`Long` argument. Use `l.equals(100L)` or `l == 100` (which unboxes).
:::

:::quiz
? `Integer x = null; int y = x;` — result?
- y = 0
- Compile error
+ NullPointerException at runtime
- y = null
--- explain
Unboxing calls `x.intValue()` on a null reference.
:::
</script>
