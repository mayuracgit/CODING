<script type="text/x-java-topic">
@id: interview-java8
@module: interview
@title: Java 8 & Stream API Interview Questions
@level: 3
@time: 40
@prereq: collectors, optional
@next: interview-jvm
@tags: interview, java 8, lambda, stream, functional interface, optional, method reference, collectors, groupingby, flatmap, parallel stream
===
## Java 8 concepts

:::qa basic
? What is a functional interface? Name the main ones.
An interface with exactly one abstract method, implementable by a lambda. Main ones: `Predicate` (T→boolean), `Function` (T→R), `Consumer` (T→void), `Supplier` (()→T), `BiFunction`, `UnaryOperator`, `BinaryOperator`; also `Runnable`, `Callable`, `Comparator`.
:::

:::qa intermediate
? What is a lambda and how is it different from an anonymous class?
A concise implementation of a functional interface. Unlike anonymous classes, lambdas have no own `this` (it refers to the enclosing instance), can't hold state, work only with functional interfaces, and are implemented via `invokedynamic` rather than separate class files.
:::

:::qa intermediate
? What are default methods and why were they added?
Interface methods with bodies (Java 8), added so interfaces like `Collection` could gain methods (`stream`, `forEach`, `removeIf`) without breaking existing implementations.
:::

:::qa intermediate
? Optional: purpose and best practices?
Represent a possibly-absent return value explicitly. Use it as a return type; chain `map`/`filter`/`orElse(Get/Throw)`; don't use it for fields or parameters; don't call `get()` blindly; prefer `orElseGet` for expensive defaults.
:::

## Streams

:::qa intermediate
? Intermediate vs terminal operations? What is lazy evaluation?
Intermediate operations return streams and don't execute until a terminal operation runs; the terminal operation triggers processing element by element and can short-circuit (`findFirst`, `anyMatch`, `limit`).
:::

:::qa intermediate
? map vs flatMap?
`map` is one-to-one; `flatMap` maps each element to a stream and flattens them — e.g. orders → order lines.
:::

:::qa intermediate
? Collection vs Stream?
A collection stores data and can be traversed many times; a stream computes over data lazily, once, without storage, can be infinite and parallel.
:::

:::qa intermediate
? findFirst vs findAny; reduce vs collect?
`findFirst` respects encounter order; `findAny` may return any element (faster in parallel). `reduce` combines into an immutable value with an associative operator; `collect` is mutable reduction into containers (lists, maps, strings).
:::

## Stream coding questions (answer with code)

:::qa coding
? Group employees by department and get the average salary of each.
```java
Map<String, Double> avg = employees.stream()
    .collect(Collectors.groupingBy(Employee::getDept, Collectors.averagingDouble(Employee::getSalary)));
```
:::

:::qa coding
? Find the highest-paid employee in each department.
```java
Map<String, Optional<Employee>> top = employees.stream()
    .collect(Collectors.groupingBy(Employee::getDept,
             Collectors.maxBy(Comparator.comparingDouble(Employee::getSalary))));
```
--- followup Without the Optional wrapper?
`Collectors.toMap(Employee::getDept, e -> e, BinaryOperator.maxBy(Comparator.comparingDouble(Employee::getSalary)))`.
:::

:::qa coding
? Count the frequency of each character in a string.
```java
Map<Character, Long> freq = "programming".chars()
    .mapToObj(c -> (char) c)
    .collect(Collectors.groupingBy(Function.identity(), LinkedHashMap::new, Collectors.counting()));
// {p=1, r=2, o=1, g=2, a=1, m=2, i=1, n=1}
```
:::

:::qa coding
? Find the first non-repeated character using streams.
```java
Optional<Character> first = s.chars().mapToObj(c -> (char) c)
    .collect(Collectors.groupingBy(Function.identity(), LinkedHashMap::new, Collectors.counting()))
    .entrySet().stream()
    .filter(e -> e.getValue() == 1)
    .map(Map.Entry::getKey)
    .findFirst();
```
:::

:::qa coding
? Find duplicate elements in a list.
```java
Set<Integer> seen = new HashSet<>();
Set<Integer> dups = list.stream().filter(n -> !seen.add(n)).collect(Collectors.toSet());
// or, side-effect free:
Set<Integer> dups2 = list.stream()
    .collect(Collectors.groupingBy(Function.identity(), Collectors.counting()))
    .entrySet().stream().filter(e -> e.getValue() > 1).map(Map.Entry::getKey).collect(Collectors.toSet());
```
--- followup Which version is safe for parallel streams?
The groupingBy version. The first uses a non-thread-safe `HashSet` as external state.
:::

:::qa coding
? Partition numbers into even and odd; sum each group.
```java
Map<Boolean, Integer> sums = nums.stream()
    .collect(Collectors.partitioningBy(n -> n % 2 == 0, Collectors.summingInt(Integer::intValue)));
```
:::

:::qa coding
? Flatten a list of lists and sort distinct values in reverse.
```java
List<Integer> result = listOfLists.stream()
    .flatMap(List::stream)
    .distinct()
    .sorted(Comparator.reverseOrder())
    .toList();
```
:::

:::qa coding
? Join names of employees older than 30 as a comma-separated string.
```java
String names = employees.stream().filter(e -> e.getAge() > 30)
    .map(Employee::getName).collect(Collectors.joining(", ", "[", "]"));
```
:::

:::qa tricky
? What happens with `Collectors.toMap` when two keys collide? And with null values?
Duplicate keys throw `IllegalStateException` unless a merge function is supplied; null values throw `NullPointerException` because it uses `HashMap.merge`.
:::

:::qa tricky
? When should you avoid parallel streams?
Small data, blocking I/O in the pipeline (common ForkJoinPool starvation), order-dependent operations, shared mutable state, sources that split poorly (LinkedList, iterate), and server code where cores are already busy — always measure.
:::

:::quiz
? `Stream.of("a","b").peek(System.out::print).count()` prints (Java 9+)?
+ Possibly nothing — `count()` may skip the pipeline for sized streams
- ab
- ba
- Throws an exception
--- explain
Since Java 9, `count()` can compute the size directly without traversing when it can be determined from the source, so `peek` may not run. Don't rely on `peek` for logic.
:::
</script>

<script type="text/x-java-topic">
@id: interview-jvm
@module: interview
@title: JVM, Memory & Garbage Collection Interview Questions
@level: 4
@time: 35
@prereq: jvm-architecture, garbage-collection
@next: interview-scenarios
@tags: interview, jvm, memory, heap, stack, metaspace, garbage collection, gc roots, g1, zgc, class loader, oom, memory leak, jit
===
:::qa intermediate
? Explain JVM architecture in one minute.
Class loader subsystem (load, link, initialise with parent delegation); runtime data areas — heap and Metaspace shared, and per-thread stacks, PC registers, native stacks; execution engine — interpreter, JIT (C1/C2) and GC; plus JNI for native code.
:::

:::qa intermediate
? Stack vs heap?
Stack: per thread, method frames with primitives and references, freed on return, `StackOverflowError`. Heap: shared, all objects, GC-managed, `OutOfMemoryError`.
:::

:::qa intermediate
? What replaced PermGen and why?
Metaspace (Java 8), in native memory, growing dynamically; PermGen's fixed size caused frequent `OutOfMemoryError: PermGen space`. Interned strings and static values live in the heap.
:::

:::qa advanced
? How does GC decide an object is garbage? What are GC roots?
By reachability tracing from GC roots — live thread stack variables, static fields, active threads, JNI references, monitors. Unreachable objects, including cycles, are garbage.
:::

:::qa advanced
? Explain generational GC and the object lifecycle.
Objects are allocated in Eden; minor GCs copy survivors to survivor spaces, ageing them; objects surviving enough collections are promoted to the old generation, which is collected less often by major/mixed or full GCs. It exploits the fact that most objects die young.
:::

:::qa intermediate
? Which GC would you choose and why?
G1 (default) for most services — balanced throughput and pause goals. ZGC (generational in 21+) for large heaps and strict latency needs. Parallel for batch throughput. Serial for tiny containers or CLIs. Always validate with GC logs and metrics.
:::

:::qa intermediate
? What are the types of OutOfMemoryError and how do you investigate one?
Java heap space, GC overhead limit exceeded, Metaspace, unable to create native thread, Direct buffer memory. Enable `-XX:+HeapDumpOnOutOfMemoryError`, analyse the dump with Eclipse MAT (dominators, paths to GC roots), check GC logs and class histograms.
:::

:::qa intermediate
? Can Java have memory leaks?
Yes — objects kept reachable unintentionally: static collections, caches without eviction, listeners, ThreadLocals in pools, inner classes capturing outer objects, class-loader leaks.
:::

:::qa advanced
? What is the parent delegation model? ClassNotFoundException vs NoClassDefFoundError?
Class loaders delegate to their parent first, so core classes always come from the bootstrap loader. CNFE is a checked exception for failed explicit loading by name; NCDFE is an Error when a class present at compile time is missing at runtime or failed initialisation.
:::

:::qa intermediate
? What is JIT and why does the first request take longer?
The JIT compiles hot bytecode into optimised native code using runtime profiling; initially code is interpreted or lightly compiled, so early requests are slower until warm-up completes.
:::

:::qa tricky
? What is the String pool's location and can pooled strings be garbage collected?
In the heap since Java 7; yes, unreferenced interned strings can be collected.
:::

:::qa experience
? Which JVM flags do you set for a containerised Spring Boot service?
Heap via `-XX:MaxRAMPercentage` (e.g. 70–75%) rather than a hard `-Xmx` tied to one container size; keep G1 (or ZGC for latency); `-XX:+HeapDumpOnOutOfMemoryError` with a mounted `HeapDumpPath`; GC logging (`-Xlog:gc*:file=…`); `-XX:+ExitOnOutOfMemoryError` so the orchestrator restarts a broken instance; optionally JFR for production profiling.
:::

:::quiz
? Which memory area stores class metadata in Java 8+?
- PermGen
+ Metaspace
- Young generation
- Code cache
--- explain
Metaspace replaced PermGen and lives in native memory.
:::
</script>

<script type="text/x-java-topic">
@id: interview-scenarios
@module: interview
@title: Scenario-Based & Cross-Concept Questions
@level: 4
@time: 40
@prereq: interview-multithreading, interview-collections
@next: interview-tricky
@tags: interview, scenario, design, concurrency, spring boot, performance, idempotency, caching, transactions, production
===
Scenario questions test whether you can **combine** concepts under real constraints. Structure your answer: clarify the requirement → identify the risk → name the Java concepts → propose a design → mention trade-offs and how you'd verify.

:::qa scenario
? You have a Spring Boot API receiving 10,000 requests concurrently. Which Java concepts would you consider for handling concurrency safely?
Keep beans stateless (thread confinement via local variables); immutable objects/records for shared data; thread-safe collections with atomic operations (`ConcurrentHashMap.compute`) for in-memory state; atomics/`LongAdder` for counters; bounded thread pools with back-pressure, or virtual threads for blocking I/O (Java 21); timeouts on all remote calls; `ThreadLocal` cleanup. Because multiple instances run behind a load balancer, JVM locks aren't enough for shared business data — use DB transactions with proper isolation, optimistic locking (`@Version`), unique constraints and idempotency keys.
--- detail
Also size the Tomcat thread pool and the DB connection pool coherently (10,000 threads contending for 20 connections just queue), add rate limiting/bulkheads, and verify with a load test while watching thread dumps, pool metrics and GC.
--- followup Two users try to buy the last unit of stock at the same moment. How do you prevent overselling?
An atomic conditional update (`UPDATE stock SET qty = qty - 1 WHERE sku = ? AND qty >= 1`, check rows affected), or optimistic locking with `@Version` and retry, or `SELECT … FOR UPDATE` in a short transaction. A Java `synchronized` block only protects one JVM instance.
:::

:::qa scenario
? A report endpoint builds a 200 MB list in memory and occasionally causes OutOfMemoryError. How do you redesign it?
Stream instead of materialising: paginate or use a JDBC/JPA streaming cursor (`fetchSize`, `Stream<T>` repository methods in a read-only transaction), write rows directly to the response output stream (CSV/Excel streaming writers like SXSSF), and process in chunks. Also consider generating large reports asynchronously and storing the file for download.
:::

:::qa scenario
? Users sometimes get duplicate invoices when they double-click "Generate". How do you fix it?
Make the operation idempotent: a client-generated idempotency key stored with a unique constraint, or a unique business key (order id + type); check-and-insert atomically in the database (not with a Java check-then-act). Optionally disable the button on the client, but never rely on it.
:::

:::qa scenario
? A cache of exchange rates is read by all requests and refreshed every 5 minutes. Design it thread-safely.
Build a new immutable `Map` in the refresh job and publish it by assigning a `volatile` field (or `AtomicReference`): readers see either the old or the new complete snapshot, with no locks. Alternatively Spring Cache with Caffeine and `refreshAfterWrite`.
:::

:::qa scenario
? An API that calls a slow third-party service is causing Tomcat threads to pile up. What do you do?
Add connect/read timeouts, limit concurrent calls (bulkhead via `Semaphore` or Resilience4j), add a circuit breaker with fallback, cache responses where possible, and consider async/virtual threads so waiting doesn't consume scarce platform threads.
:::

:::qa scenario
? After deployment CPU is at 100% with no traffic spike. How do you investigate?
Take several thread dumps a few seconds apart (`jcmd <pid> Thread.print`), find threads consistently RUNNABLE in the same frames (infinite loop, regex backtracking, a hot `HashMap` misuse); use `top -H` to map hot native thread ids to Java thread ids (hex `nid`); check GC logs — constant full GCs also burn CPU; profile with JFR/async-profiler.
:::

:::qa scenario
? A `HashMap` used as a cache inside a singleton service returns wrong values under load. Why?
`HashMap` isn't thread-safe: concurrent puts can lose entries or corrupt structure, and readers may see stale data. Use `ConcurrentHashMap` (with `computeIfAbsent` for loading), a proper cache library, or immutable snapshots.
:::

:::qa scenario
? Service A calls B, which calls C; one slow request in C makes A's latency explode. Which Java concepts help?
Timeouts at each hop, `CompletableFuture` with `orTimeout`/`completeOnTimeout`, bounded executors to isolate workloads (bulkheads), circuit breakers, and back-pressure via bounded queues and `CallerRunsPolicy`.
:::

:::qa scenario
? You must process a 2 GB CSV file line by line and insert rows into the database. Outline the Java approach.
Read lazily with `Files.newBufferedReader`/`Files.lines` in try-with-resources (never `readAllLines`), parse per line, validate, accumulate batches of ~500–1000 rows into a `PreparedStatement` batch within chunked transactions, collect errors per line for reporting, and optionally parallelise parsing with a bounded producer/consumer `BlockingQueue` while keeping DB writes within pool limits.
:::

:::qa scenario
? Why can `@Transactional` on a private method or a self-invoked method silently not work?
Spring implements it with proxies; only calls entering through the proxy are intercepted. Private methods can't be proxied, and `this.method()` bypasses the proxy.
:::

:::quiz
? Which reliably prevents two app instances from creating the same invoice number?
- A `synchronized` method
- A `static AtomicLong`
+ A database sequence or unique constraint
- A `volatile` counter
--- explain
JVM-level mechanisms only coordinate threads within one process; multiple instances need a shared authority such as the database.
:::
</script>

@id: interview-tricky
@module: interview
@title: Tricky Output Questions & Interview Traps
@level: 4
@time: 30
@prereq: interview-core
@next: interview-coding
@tags: interview, tricky, output, puzzle, integer cache, string pool, finally, static, overloading, null, char arithmetic
===
Predict the output, then open the answer. These appear in online tests and whiteboard rounds.

:::qa tricky
? `Integer a = 127, b = 127, c = 128, d = 128; System.out.println((a == b) + " " + (c == d));`
`true false` — `Integer.valueOf` caches −128..127; 128 creates distinct objects.
:::

:::qa tricky
? `String s1 = "Java"; String s2 = "Ja" + "va"; String s3 = "Ja"; String s4 = s3 + "va"; System.out.println((s1 == s2) + " " + (s1 == s4));`
`true false` — `"Ja" + "va"` is a compile-time constant folded into the pooled literal; `s3 + "va"` is computed at runtime.
--- followup What if `s3` were `final`?
Then `s3 + "va"` is a constant expression and `s1 == s4` is `true`.
:::

:::qa tricky
? `System.out.println(1 + 2 + "3" + 4 + 5);`
`3345` — left to right: 1 + 2 = 3, then string concatenation "33", "334", "3345".
:::

:::qa tricky
? `System.out.println('a' + 'b' + "c");`
`195c` — `'a' + 'b'` is int arithmetic (97 + 98) before meeting the string.
:::

:::qa tricky
? `int x = 5; x = x++ * 2 + x++; System.out.println(x);`
`16` — `x++` yields 5 (x=6), `* 2` = 10, next `x++` yields 6 (x=7), 10 + 6 = 16, assigned to x.
:::

:::qa tricky
? What does this print?
```java
static int f() {
    int i = 0;
    try { i = 1; return i; }
    finally { i = 2; }
}
```
`1` — the return value is captured before `finally` runs; changing `i` later doesn't affect it.
:::

:::qa tricky
? `Object o = null; System.out.println(o instanceof Object);`
`false` — `instanceof` is always false for null (no NPE).
:::

:::qa tricky
? Given `void m(Object o)` and `void m(String s)`, what does `m(null)` call?
`m(String)` — the most specific applicable overload. Adding `m(Integer)` makes the call ambiguous (compile error).
:::

:::qa tricky
? What does this print?
```java
class A { String name = "A"; String show() { return "A.show"; } }
class B extends A { String name = "B"; @Override String show() { return "B.show"; } }
A obj = new B();
System.out.println(obj.name + " " + obj.show());
```
`A B.show` — fields are hidden (resolved by declared type); methods are overridden (resolved at runtime).
:::

:::qa tricky
? `List<Integer> list = new ArrayList<>(List.of(1, 2, 3)); list.remove(1); System.out.println(list);`
`[1, 3]` — `remove(int index)` is chosen over `remove(Object)`.
:::

:::qa tricky
? `System.out.println(0.1 + 0.2 == 0.3);` and `System.out.println(Math.min(Double.MIN_VALUE, 0.0));`
`false` (binary floating point), and `0.0` — `Double.MIN_VALUE` is the smallest **positive** double (~4.9E-324), not the most negative.
:::

:::qa tricky
? `String s = null; s += "x"; System.out.println(s);`
`nullx` — string concatenation converts null to "null".
:::

:::qa tricky
? What happens?
```java
List<String> names = new ArrayList<>(List.of("a", "b", "c"));
for (String n : names) if (n.equals("b")) names.remove(n);
System.out.println(names);
```
Prints `[a, c]` without an exception: "b" is the second-to-last element, so after removal `hasNext()` returns false and the loop ends before the modification check. Removing "a" would throw `ConcurrentModificationException`.
:::

:::qa tricky
? `System.out.println(Math.round(-2.5) + " " + Math.round(2.5));`
`-2 3` — `Math.round` rounds half **up** (toward positive infinity): `floor(x + 0.5)`.
:::

:::qa tricky
? `char c = 'A'; c += 1; c = c + 1;` — compiles?
No: `c += 1` compiles (implicit cast), but `c = c + 1` fails because `c + 1` is an `int`.
:::

:::trap Classic conceptual traps
- "Java passes objects by reference" — wrong: pass-by-value of references.
- "String is thread-safe because its methods are synchronized" — wrong: because it's immutable.
- "`finalize()` is like a destructor" — wrong: unpredictable, deprecated.
- "`volatile` makes `count++` thread-safe" — wrong: visibility only.
- "HashMap is ordered by insertion" — wrong: use `LinkedHashMap`.
- "Private methods can be overridden" — wrong: they're not inherited.
- "Records are fully immutable" — only shallowly.
- "Java 17 has pattern matching for switch" — only as preview; standard in 21.
:::

:::quiz
? `System.out.println(10 == 10.0);`
+ true
- false
- compile error
- ClassCastException
--- explain
Binary numeric promotion converts `10` to `10.0` before comparing.
:::
</script>

@id: interview-coding
@module: interview
@title: Coding Interview Questions (with Solutions)
@level: 4
@time: 60
@prereq: hashmap-internals, stream-operations
@next: interview-3yr
@tags: interview, coding, algorithms, reverse string, palindrome, fibonacci, prime, two sum, anagram, missing number, lru, binary search, string compression
===
Try each problem first; open the hints, then the solution. Solutions favour clarity and include complexity.

:::exercise interview
? Reverse a string without using reverse()
Reverse `"Mayur"` → `"ruyaM"`.
--- hints
- Two pointers swapping characters in a `char[]`.
--- solution
```java title="ReverseString.java"
public class ReverseString {
    static String reverse(String s) {
        char[] a = s.toCharArray();
        for (int l = 0, r = a.length - 1; l < r; l++, r--) {
            char t = a[l]; a[l] = a[r]; a[r] = t;
        }
        return new String(a);
    }
    public static void main(String[] args) { System.out.println(reverse("Mayur")); }
}
```
--- complexity
O(n) time, O(n) space for the char array (strings are immutable).
:::

:::exercise interview
? Two Sum
Return indices of two numbers in `nums` adding up to `target`. Example: `[2, 7, 11, 15]`, target 9 → `[0, 1]`.
--- hints
- For each number, check whether `target - number` has been seen, using a HashMap from value to index.
--- solution
```java title="TwoSum.java"
import java.util.Arrays;
import java.util.HashMap;
import java.util.Map;

public class TwoSum {
    static int[] twoSum(int[] nums, int target) {
        Map<Integer, Integer> seen = new HashMap<>();
        for (int i = 0; i < nums.length; i++) {
            Integer j = seen.get(target - nums[i]);
            if (j != null) return new int[]{j, i};
            seen.put(nums[i], i);
        }
        return new int[0];
    }
    public static void main(String[] args) {
        System.out.println(Arrays.toString(twoSum(new int[]{2, 7, 11, 15}, 9)));   // [0, 1]
    }
}
```
--- complexity
O(n) time, O(n) space (vs O(n²) brute force).
:::

:::exercise interview
? Missing number in 1..n
An array holds n−1 distinct numbers from 1..n. Find the missing one.
--- solution
```java title="MissingNumber.java"
public class MissingNumber {
    static int missing(int[] a, int n) {
        long expected = (long) n * (n + 1) / 2;       // long avoids overflow
        long sum = 0;
        for (int x : a) sum += x;
        return (int) (expected - sum);
    }
    public static void main(String[] args) {
        System.out.println(missing(new int[]{1, 2, 4, 5, 6}, 6));   // 3
    }
}
```
--- explanation
XOR of 1..n with all elements also works and avoids overflow entirely.
--- complexity
O(n) time, O(1) space.
:::

:::exercise interview
? Check prime & print primes up to N (Sieve)
Write `isPrime(n)` and generate all primes ≤ 50.
--- solution
```java title="Primes.java"
import java.util.ArrayList;
import java.util.List;

public class Primes {
    static boolean isPrime(int n) {
        if (n < 2) return false;
        for (int i = 2; (long) i * i <= n; i++) if (n % i == 0) return false;   // check up to √n
        return true;
    }
    static List<Integer> sieve(int n) {
        boolean[] composite = new boolean[n + 1];
        List<Integer> primes = new ArrayList<>();
        for (int i = 2; i <= n; i++) {
            if (!composite[i]) {
                primes.add(i);
                for (long j = (long) i * i; j <= n; j += i) composite[(int) j] = true;
            }
        }
        return primes;
    }
    public static void main(String[] args) {
        System.out.println(isPrime(97) + " " + sieve(50));
    }
}
```
--- complexity
`isPrime`: O(√n). Sieve: O(n log log n) time, O(n) space.
:::

:::exercise interview
? Binary search
Return the index of `target` in a sorted array, or −1.
--- solution
```java title="BinarySearch.java"
public class BinarySearch {
    static int search(int[] a, int target) {
        int lo = 0, hi = a.length - 1;
        while (lo <= hi) {
            int mid = lo + (hi - lo) / 2;                 // avoids (lo + hi) overflow
            if (a[mid] == target) return mid;
            if (a[mid] < target) lo = mid + 1; else hi = mid - 1;
        }
        return -1;
    }
    public static void main(String[] args) {
        System.out.println(search(new int[]{3, 8, 15, 23, 42}, 23));   // 3
    }
}
```
--- explanation
`(lo + hi) / 2` overflows for very large arrays — a real bug that existed in the JDK's own binary search until 2006.
--- complexity
O(log n) time, O(1) space.
:::

:::exercise interview
? String compression
`"aaabccdddd"` → `"a3b1c2d4"`; return the original if the compressed form isn't shorter.
--- solution
```java title="Compress.java"
public class Compress {
    static String compress(String s) {
        if (s.isEmpty()) return s;
        StringBuilder sb = new StringBuilder();
        int count = 1;
        for (int i = 1; i <= s.length(); i++) {
            if (i < s.length() && s.charAt(i) == s.charAt(i - 1)) count++;
            else { sb.append(s.charAt(i - 1)).append(count); count = 1; }
        }
        return sb.length() < s.length() ? sb.toString() : s;
    }
    public static void main(String[] args) {
        System.out.println(compress("aaabccdddd"));   // a3b1c2d4
        System.out.println(compress("abc"));          // abc
    }
}
```
--- complexity
O(n) time and space.
:::

:::exercise interview
? Balanced brackets
Check whether `"{[()()]}"` is balanced.
--- hints
- Push opening brackets on a stack (`ArrayDeque`); on a closing bracket, pop and check it matches.
--- solution
```java title="Brackets.java"
import java.util.ArrayDeque;
import java.util.Deque;
import java.util.Map;

public class Brackets {
    static boolean balanced(String s) {
        Map<Character, Character> pairs = Map.of(')', '(', ']', '[', '}', '{');
        Deque<Character> stack = new ArrayDeque<>();
        for (char c : s.toCharArray()) {
            if (pairs.containsValue(c)) stack.push(c);
            else if (pairs.containsKey(c)) {
                if (stack.isEmpty() || stack.pop() != pairs.get(c)) return false;
            }
        }
        return stack.isEmpty();
    }
    public static void main(String[] args) {
        System.out.println(balanced("{[()()]}") + " " + balanced("([)]"));   // true false
    }
}
```
--- complexity
O(n) time, O(n) space.
:::

:::exercise interview
? LRU cache (O(1) get/put)
Implement `get(key)` and `put(key, value)` with a capacity, evicting the least recently used entry.
--- solution
```java title="Lru.java"
import java.util.LinkedHashMap;
import java.util.Map;

public class Lru<K, V> {
    private final Map<K, V> map;

    public Lru(int capacity) {
        this.map = new LinkedHashMap<>(16, 0.75f, true) {
            @Override protected boolean removeEldestEntry(Map.Entry<K, V> e) { return size() > capacity; }
        };
    }
    public V get(K k) { return map.get(k); }
    public void put(K k, V v) { map.put(k, v); }

    public static void main(String[] args) {
        Lru<Integer, String> c = new Lru<>(2);
        c.put(1, "one"); c.put(2, "two"); c.get(1); c.put(3, "three");   // evicts 2
        System.out.println(c.get(2) + " " + c.get(1) + " " + c.get(3));   // null one three
    }
}
```
--- explanation
Interviewers may ask for a manual version: a `HashMap<K, Node>` plus a doubly linked list, moving nodes to the head on access and removing the tail on overflow.
--- complexity
O(1) average for both operations.
:::

:::exercise interview
? Longest substring without repeating characters
`"abcabcbb"` → 3 (`"abc"`).
--- hints
- Sliding window with a map of last-seen indices.
--- solution
```java title="LongestUnique.java"
import java.util.HashMap;
import java.util.Map;

public class LongestUnique {
    static int longest(String s) {
        Map<Character, Integer> last = new HashMap<>();
        int best = 0, start = 0;
        for (int i = 0; i < s.length(); i++) {
            Integer prev = last.put(s.charAt(i), i);
            if (prev != null && prev >= start) start = prev + 1;     // shrink the window past the duplicate
            best = Math.max(best, i - start + 1);
        }
        return best;
    }
    public static void main(String[] args) {
        System.out.println(longest("abcabcbb") + " " + longest("pwwkew"));   // 3 3
    }
}
```
--- complexity
O(n) time, O(k) space for k distinct characters.
:::

:::exercise interview
? Producer–consumer with BlockingQueue
One producer generates 5 order ids; two consumers process them. Stop cleanly.
--- solution
```java title="ProducerConsumer.java"
import java.util.concurrent.*;

public class ProducerConsumer {
    private static final String POISON = "__STOP__";

    public static void main(String[] args) throws InterruptedException {
        BlockingQueue<String> queue = new ArrayBlockingQueue<>(3);
        ExecutorService pool = Executors.newFixedThreadPool(3);

        pool.submit(() -> {
            try {
                for (int i = 1; i <= 5; i++) queue.put("ORD-" + i);   // blocks when full
                queue.put(POISON); queue.put(POISON);                  // one stop signal per consumer
            } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
        });
        for (int c = 1; c <= 2; c++) {
            int id = c;
            pool.submit(() -> {
                try {
                    while (true) {
                        String order = queue.take();                  // blocks when empty
                        if (order.equals(POISON)) break;
                        System.out.println("consumer " + id + " processed " + order);
                    }
                } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
            });
        }
        pool.shutdown();
        pool.awaitTermination(5, TimeUnit.SECONDS);
    }
}
```
--- explanation
`BlockingQueue` handles waiting and signalling internally. "Poison pill" messages tell each consumer to exit.
:::
</script>

@id: interview-3yr
@module: interview
@title: 3-Year Experience Level Questions
@level: 4
@time: 40
@prereq: interview-scenarios
@tags: interview, 3 years experience, senior, design, spring boot, jpa, transactions, performance, code review, production issues
===
At around three years, interviewers expect you to go beyond definitions: explain **trade-offs**, **production experience**, **debugging**, and how Core Java shows up inside the frameworks you use daily. Answer with "In my project, we…" wherever you honestly can.

:::qa experience
? Walk me through what happens, at the Java level, when a request hits your Spring Boot endpoint.
A Tomcat worker thread (from its pool, or a virtual thread) accepts the request; filters run; `DispatcherServlet` finds the handler; Jackson deserialises JSON into a DTO (reflection); Bean Validation checks annotations; the controller calls a singleton service through a proxy (e.g. transactional interceptor binds a pooled JDBC connection to the thread via ThreadLocal); repositories execute SQL with PreparedStatements; entities are mapped to DTOs (often with streams); the response is serialised; the transaction commits; the connection returns to the pool; short-lived objects are collected by the next young GC.
:::

:::qa experience
? How do you make a service method thread-safe in a Spring application?
Keep the bean stateless — all per-request data in parameters and locals. Share only immutable objects or thread-safe collections; use atomics for counters; avoid static mutable state; make injected dependencies thread-safe (e.g. `DateTimeFormatter`, not `SimpleDateFormat`). For cross-instance consistency use DB transactions/locking, not JVM locks.
:::

:::qa experience
? Explain the N+1 problem and how you've solved it.
Loading N parents and then lazily loading each parent's children triggers N extra queries. Fix with fetch joins (`JOIN FETCH`), `@EntityGraph`, batch fetching (`hibernate.default_batch_fetch_size`), or DTO projections that select only needed columns. Detect it by logging SQL or counting statements in tests.
:::

:::qa experience
? When do you use checked vs unchecked exceptions in your projects?
Unchecked domain exceptions for business-rule violations and not-found cases, handled centrally in `@RestControllerAdvice`; checked exceptions only at integration boundaries where the caller must decide (and usually translated into unchecked ones with the cause preserved). I also keep in mind that `@Transactional` rolls back only on unchecked exceptions by default.
:::

:::qa experience
? How would you design equals/hashCode for a JPA entity?
Avoid all-fields equality (lazy associations, mutable fields). Use an immutable business key if one exists, or id-based equality with a constant `hashCode` so the hash doesn't change when the id is assigned on persist. Never include collections or lazy relations.
:::

:::qa experience
? What happens if you call an @Async or @Transactional method from the same class?
The call bypasses the Spring proxy, so no async execution or transaction is applied. Solutions: move the method to another bean, inject the bean's proxy, or use programmatic APIs (`TransactionTemplate`, an `Executor`).
:::

:::qa experience
? Tell me about a production issue you debugged involving the JVM.
Use STAR: situation (e.g. latency spikes every few hours), task, action (enabled GC logs, found long full GCs, heap dump showed an unbounded static map used as a cache, replaced it with Caffeine with max size and TTL, added metrics), result (p99 dropped, no more OOMs). Choose a real incident you can discuss in depth.
:::

:::qa experience
? How do you decide between a List, Set and Map when writing service code?
By access pattern: ordered sequences and duplicates → `List`; uniqueness/membership checks → `Set` (O(1) `contains`); lookup by key, grouping or counting → `Map`. I also pre-build lookup maps to avoid nested loops (O(n·m) → O(n + m)).
:::

:::qa experience
? What Java 8+ features do you use most, and where can they be misused?
Streams/collectors for mapping and aggregation, `Optional` for repository lookups, lambdas and method references, `java.time`, records for DTOs. Misuse: overly clever stream chains that are hard to debug, side effects inside streams, `Optional` as fields/parameters, `parallelStream()` in request code, `orElse` with expensive defaults.
:::

:::qa experience
? How do you size thread pools and connection pools?
Connection pool per database capacity (HikariCP defaults to 10; tune with load tests), thread pools per workload type (CPU-bound ≈ cores, I/O-bound larger or virtual threads), bounded queues with an explicit rejection policy, and separate pools to isolate slow dependencies. Validate with metrics (active/idle/pending) under realistic load.
:::

:::qa experience
? What do you look for in a Java code review?
Correctness (null handling, `equals`/`hashCode`, boundary cases), thread safety of shared state, resource handling (try-with-resources), exception handling (no swallowing, causes preserved), transactional boundaries, N+1 queries, input validation and SQL injection risks, readability (naming, method size), tests, and logging without leaking sensitive data.
:::

:::qa experience
? How do you keep up with Java versions, and which features would you adopt when moving from 8 to 17 or 21?
Follow release notes/JEPs. Moving to 17: records for DTOs, text blocks for SQL/JSON, switch expressions, `instanceof` patterns, `Stream.toList()`, sealed hierarchies for domain states, helpful NPEs, and updated GCs. Moving to 21: virtual threads (Spring Boot 3.2+), pattern matching for switch with record patterns, sequenced collections. Watch for removed/encapsulated internals affecting old libraries.
:::

:::quiz
? Which is the most effective first step when an endpoint is slow in production?
- Rewrite loops as parallel streams
- Increase the heap size
+ Measure: check SQL counts/timings, profiles and GC logs to find the actual bottleneck
- Switch to LinkedList
--- explain
Optimisation starts with evidence; most latency in back ends comes from database or remote I/O patterns.
:::
</script>

      let score = it.w;
      const tl = it.title.toLowerCase(); const full = terms.join(' ');
      if (tl === full) score += 80; else if (tl.startsWith(full)) score += 40; else if (tl.includes(full)) score += 20;
      if (it.body) {
        if (seenTopicText.has(it.t.id)) return; seenTopicText.add(it.t.id);
        const pos = it.plain.indexOf(terms[0]); const snip = it.plain.slice(Math.max(0, pos - 50), pos + 90);
        res.push({ it, score, sub: '…' + snip + '…' }); return;
      }
      res.push({ it, score, sub: it.sub });
    });
    // Drop plain-text hits for topics already represented by a stronger hit.
    const strong = new Set(res.filter(r => !r.it.body).map(r => r.it.t.id));
    return res.filter(r => !(r.it.body && strong.has(r.it.t.id))).sort((a, b) => b.score - a.score).slice(0, 40);
  }
  function showResults(q) {
    const box = $('#results'); const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    lastResults = search(q); selIdx = -1;
    box.innerHTML = lastResults.length ? lastResults.map((r, k) => '<button class="res" type="button" data-res="' + k + '"><span class="res-kind">' + (r.it.body ? 'Mentioned in' : r.it.kind) + '</span><span class="res-title">' + highlightTerms(r.it.title, terms) + '</span><span class="res-sub">' + highlightTerms(r.sub, terms) + '</span></button>').join('')
      : '<div class="res-empty">No matches for “' + esc(q) + '”. Try a shorter term such as <b>hashmap</b>, <b>volatile</b> or <b>stream</b>.</div>';
    box.hidden = false;
  }
  function openResult(k) { const r = lastResults[k]; if (!r) return; $('#searchInput').value = ''; $('#searchInput').blur(); go(r.it.t.id, r.it.anchor); }
  const si = $('#searchInput');
  si.addEventListener('input', () => { const q = si.value.trim(); if (q.length < 2) return hideResults(); showResults(q); });
  si.addEventListener('focus', () => { const q = si.value.trim(); if (q.length >= 2) showResults(q); });
  si.addEventListener('keydown', e => {
    const items = $$('#results .res');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!items.length) return;
      selIdx = (selIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((x, k) => x.classList.toggle('sel', k === selIdx)); items[selIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') { e.preventDefault(); openResult(selIdx >= 0 ? selIdx : 0); }
    else if (e.key === 'Escape') { hideResults(); si.blur(); }
  });
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if ((e.key === '/' && tag !== 'input' && tag !== 'textarea') || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); si.focus(); si.select(); }
  });

  /* ---------------- Mobile nav ---------------- */
  function closeNav() { document.body.classList.remove('nav-open'); }
  $('#menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('#scrim').addEventListener('click', closeNav);

  /* ---------------- Toast ---------------- */
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 1800); }

  /* ---------------- Copy ---------------- */
  function copyText(btn) {
    const pre = btn.closest('.code').querySelector('pre'); const text = pre.innerText;
    const ok = () => { btn.classList.add('ok'); btn.querySelector('span').textContent = 'Copied'; setTimeout(() => { btn.classList.remove('ok'); btn.querySelector('span').textContent = 'Copy'; }, 1500); };
    const fallback = () => {
      try {
        const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        const done = document.execCommand && document.execCommand('copy');
        if (done) { sel.removeAllRanges(); ok(); } else { btn.querySelector('span').textContent = 'Press Ctrl+C'; }
      } catch (e) { btn.querySelector('span').textContent = 'Press Ctrl+C'; }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  /* ---------------- Global click delegation ---------------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('button, a');
    if (!e.target.closest('.search')) hideResults();
    if (!el) return;
    if (el.hasAttribute('data-res')) { openResult(+el.dataset.res); return; }
    if (el.hasAttribute('data-copy')) { copyText(el); return; }
    if (el.dataset.toggle) {
      const m = el.closest('.mod'); const open = !m.classList.contains('open');
      m.classList.toggle('open', open); el.setAttribute('aria-expanded', open); state.open[el.dataset.toggle] = open; save(); return;
    }
    if (el.dataset.module) { go('module:' + el.dataset.module); return; }
    if (el.dataset.anchorLink) { e.preventDefault(); const tg = document.getElementById(el.dataset.anchorLink); if (tg) tg.scrollIntoView({ block: 'start' }); return; }
    if (el.dataset.nav) { e.preventDefault(); if (byId[el.dataset.nav] || el.dataset.nav === 'home') go(el.dataset.nav, el.dataset.anchor); return; }
    if (el.dataset.bookmark) {
      const id = el.dataset.bookmark; const k = state.bookmarks.indexOf(id);
      if (k >= 0) state.bookmarks.splice(k, 1); else state.bookmarks.push(id);
      save(true); toast(k >= 0 ? 'Bookmark removed' : 'Bookmarked — find it under My Bookmarks');
      const y = window.scrollY; go(id, null, { keepScroll: true }); window.scrollTo(0, y); return;
    }
    if (el.dataset.complete) {
      const id = el.dataset.complete; const was = isDone(id);
      if (was) delete state.completed[id]; else state.completed[id] = Date.now();
      save(true);
      const t = byId[id]; const nx = topics[t.index + 1];
      if (!was && el.dataset.advance && nx) { toast('Marked complete — moving to the next topic'); go(nx.id); return; }
      toast(was ? 'Marked as not complete' : 'Topic marked complete');
      const y = window.scrollY; go(id, null, { keepScroll: true }); window.scrollTo(0, y); return;
    }
    if (el.classList.contains('opt')) {
      const q = el.closest('.quiz'); if (el.disabled) return;
      q.dataset.choice = '1';
      if (state.quiz[q.dataset.qid] === undefined) { state.quiz[q.dataset.qid] = el.dataset.ok === '1' ? 1 : 0; save(); }
      showQuizResult(q, el, false); return;
    }
    if (el.classList.contains('quiz-reset')) {
      const q = el.closest('.quiz'); delete state.quiz[q.dataset.qid]; delete q.dataset.choice; save();
      $$('.opt', q).forEach(o => { o.disabled = false; o.classList.remove('right', 'wrong'); }); $('.quiz-exp', q).hidden = true; el.remove(); return;
    }
    if (el.dataset.reset === 'ask') {
      $('#resetRow').innerHTML = '<span>Clear completed topics, bookmarks, quiz answers and your saved position?</span><button class="linkish danger" type="button" data-reset="yes">Yes, reset everything</button><button class="linkish" type="button" data-reset="no">Cancel</button>'; return;
    }
    if (el.dataset.reset === 'yes') { state = DEFAULT_STATE(); save(true); toast('Progress reset'); go('home'); return; }
    if (el.dataset.reset === 'no') { go('home', null, { keepScroll: true }); return; }
  });

  /* ---------------- Scroll tracking: active heading + saved position ---------------- */
  let ticking = false;
  function updateActiveHeading() {
    ticking = false;
    const t = byId[current]; if (!t) return;
    const hs = $$('#view .prose > h2.h-anchor'); let active = '';
    for (const h of hs) { if (h.getBoundingClientRect().top < 200) active = h.id; else break; }
    $$('#toc a').forEach(a => a.classList.toggle('on', a.dataset.anchorLink === active));
    if (state.last && state.last.id === current && state.last.anchor !== active) { state.last.anchor = active; save(); }
  }
  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(updateActiveHeading); } }, { passive: true });

  /* ---------------- Boot ---------------- */
  let startId = 'home';
  try { const h = decodeURIComponent((location.hash || '').slice(1)); if (h && byId[h]) startId = h; else if (h && modById[h]) startId = 'module:' + h; } catch (e) { }
  go(startId, startId !== 'home' && state.last && state.last.id === startId ? state.last.anchor : null);
  window.JMC = { topics, byId, modules: MODULES, go }; // handy for debugging in the console
})();

</script>
