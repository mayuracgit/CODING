<script type="text/x-java-topic">
@id: threads-basics
@module: concurrency
@title: Processes, Threads & Creating Threads
@level: 3
@time: 25
@prereq: interfaces
@next: thread-lifecycle
@tags: thread, process, runnable, start, run, multithreading, concurrency, parallelism, daemon, main thread, callable
===
## Introduction

A **thread** is an independent path of execution within a program. Multithreading lets one Java process do several things at once: serve many HTTP requests, run a background job while the UI stays responsive, or split a CPU-heavy computation across cores.

Why does Java need it? Modern CPUs have many cores, and much of a server's time is spent **waiting** (for the database, the network, disk). Threads let the CPU do useful work for other tasks during those waits and use all cores for computation.

## Process vs thread

| | Process | Thread |
|---|---|---|
| What | A running program with its own address space | A unit of execution inside a process |
| Memory | Separate; isolated from other processes | **Shares the heap** and static data with other threads of the process; has its own **stack** and program counter |
| Creation cost | High (OS allocates memory, file tables…) | Lower |
| Communication | IPC: pipes, sockets, files | Directly through shared objects (needs synchronisation) |
| Failure impact | A crash usually affects only that process | An uncaught error kills the thread; memory corruption or `OutOfMemoryError` can affect all threads |
| Java | One JVM = one OS process | `java.lang.Thread` (a platform thread maps 1:1 to an OS thread) |

:::diagram One JVM process
[w] Shared by all threads :: Heap (objects) · Metaspace (class metadata) · static fields
[a] Thread "main" :: own stack · PC register || [a] Thread "http-nio-8080-exec-1" :: own stack · PC register || [a] Thread "scheduling-1" :: own stack · PC register
:::

**Concurrency** is dealing with multiple tasks whose executions overlap in time (possible even on one core via time slicing). **Parallelism** is literally executing multiple tasks at the same instant on multiple cores.

## Creating threads

```java title="CreateThreads.java"
import java.util.concurrent.*;

public class CreateThreads {
    // 1. Extend Thread (least flexible: uses up your single superclass)
    static class ReportThread extends Thread {
        @Override public void run() {
            System.out.println("Report on " + Thread.currentThread().getName());
        }
    }

    public static void main(String[] args) throws Exception {
        new ReportThread().start();

        // 2. Implement Runnable (preferred: separates the task from the thread)
        Runnable emailTask = () -> System.out.println("Email on " + Thread.currentThread().getName());
        Thread t = new Thread(emailTask, "email-sender");
        t.start();
        t.join();                                   // wait for t to finish

        // 3. Callable + ExecutorService: returns a result, can throw checked exceptions
        ExecutorService pool = Executors.newFixedThreadPool(2);
        Future<Integer> future = pool.submit(() -> 6 * 7);
        System.out.println("Result = " + future.get());   // blocks until done → 42
        pool.shutdown();
    }
}
```

| Approach | Returns a value? | Checked exceptions? | Recommended? |
|---|---|---|---|
| `extends Thread` | No | No | Rarely |
| `implements Runnable` | No | No | Yes, for simple tasks |
| `implements Callable<V>` | Yes (`Future<V>`) | Yes | Yes, with executors |
| Executor frameworks / `CompletableFuture` | Yes | Yes | **Yes — production default** |

## start() vs run()

```java
Thread t = new Thread(() -> System.out.println(Thread.currentThread().getName()));
t.run();     // prints "main" — just a normal method call on the CURRENT thread
t.start();   // prints "Thread-0" — asks the JVM to create a new thread that calls run()
t.start();   // IllegalThreadStateException — a thread can be started only once
```

`start()` registers the thread with the JVM/OS scheduler (a native call); the new thread then invokes `run()`. Calling `run()` directly creates **no** new thread.

## Daemon threads

A **daemon** thread doesn't keep the JVM alive: when only daemon threads remain, the JVM exits (without running their `finally` blocks). GC threads and JIT compiler threads are daemons. Set with `t.setDaemon(true)` **before** `start()`.

## Real-life example

:::analogy A restaurant kitchen
The restaurant is the **process**: one building, one pantry (heap), one set of recipes (code). The cooks are **threads**: each has their own workstation and notepad (stack), but they share the pantry and the fridge. More cooks let the kitchen prepare several orders at once — but if two cooks grab the last tomato at the same moment, you need rules (synchronisation).
:::

:::project Threads in a Spring Boot service
Embedded Tomcat serves each HTTP request on a thread from its pool (named `http-nio-8080-exec-N`, default max 200). `@Async` methods run on a task executor; `@Scheduled` jobs on a scheduler thread; Kafka listeners on consumer threads. Your singleton `@Service` beans are therefore called **concurrently** by many threads — which is why they should be stateless.
:::

## Interview questions

:::qa basic
? What is the difference between a process and a thread?
A process is an executing program with its own isolated memory space. A thread is a lightweight unit of execution within a process; threads of the same process share the heap and static data but each has its own stack and program counter. Threads are cheaper to create and communicate through shared memory, which requires synchronisation.
:::

:::qa basic
? What are the ways to create a thread?
Extend `Thread` and override `run()`; implement `Runnable` and pass it to a `Thread`; implement `Callable` and submit it to an `ExecutorService`; or use higher-level APIs like `CompletableFuture` (and virtual threads in Java 21). Implementing `Runnable`/`Callable` is preferred because it separates the task from the execution mechanism and doesn't consume the single inheritance slot.
--- followup Runnable vs Callable?
`Runnable.run()` returns nothing and can't throw checked exceptions. `Callable<V>.call()` returns a value and can throw checked exceptions; its result is obtained through a `Future<V>`.
:::

:::qa tricky
? What happens if you call run() instead of start()?
`run()` executes synchronously in the calling thread like any method; no new thread is created. Only `start()` creates a new thread of execution.
--- followup Can you start a thread twice?
No. The second `start()` throws `IllegalThreadStateException`, because a terminated thread cannot be restarted.
:::

:::quiz
? What does the JVM do when `main` finishes but a non-daemon thread is still running?
- Exits immediately
+ Keeps running until all non-daemon threads finish
- Kills the thread and exits
- Throws an exception
--- explain
The JVM exits only when all non-daemon threads have terminated (or `System.exit` is called).
:::
</script>

<script type="text/x-java-topic">
@id: thread-lifecycle
@module: concurrency
@title: Thread Lifecycle, sleep, join & interrupt
@level: 3
@time: 20
@prereq: threads-basics
@next: synchronization
@tags: thread states, new, runnable, blocked, waiting, timed_waiting, terminated, sleep, join, yield, interrupt, interruptedexception, priority
===
## Thread states (`Thread.State`)

:::flow
NEW :: created, start() not yet called
* RUNNABLE :: running or ready to run (the OS decides which runs on a core)
BLOCKED :: waiting to acquire a monitor lock (entering synchronized)
WAITING :: wait(), join(), LockSupport.park() — until notified/unparked
TIMED_WAITING :: sleep(ms), wait(ms), join(ms), parkNanos
TERMINATED :: run() completed or threw an uncaught exception
:::

Transitions: `NEW` → `start()` → `RUNNABLE`. From `RUNNABLE` a thread can move to `BLOCKED` (lock contention), `WAITING`/`TIMED_WAITING` (and back to `RUNNABLE` when notified, timed out or interrupted), and finally to `TERMINATED`. Java's `RUNNABLE` merges the OS states "ready" and "running" — and also covers threads blocked in native I/O.

You can see these states in a **thread dump** (`jstack <pid>` or `jcmd <pid> Thread.print`) — the first tool to reach for when a service hangs.

## Key methods

| Method | Effect | Releases locks? |
|---|---|---|
| `Thread.sleep(ms)` | Pause the current thread for at least ms | **No** |
| `t.join()` / `join(ms)` | Wait until thread t terminates | N/A (it's implemented with `wait` on the Thread object) |
| `Thread.yield()` | Hint to the scheduler to let others run | No; rarely useful |
| `t.interrupt()` | Set t's interrupt flag; wakes it from sleep/wait/join with `InterruptedException` | — |
| `Thread.currentThread().isInterrupted()` | Check the flag without clearing | — |
| `Thread.interrupted()` (static) | Check **and clear** the flag | — |
| `setPriority(1..10)` | Scheduling hint; OS-dependent, often ignored | — |

`stop()`, `suspend()` and `resume()` are deprecated (stop is unsafe — it releases locks mid-update, leaving objects corrupt; it throws `UnsupportedOperationException` since Java 20).

## Interruption: cooperative cancellation

Java has no safe way to force-kill a thread. Instead, you **ask** it to stop by interrupting it, and the task checks the flag or handles `InterruptedException`.

```java title="Interrupts.java"
public class Interrupts {
    public static void main(String[] args) throws InterruptedException {
        Thread worker = new Thread(() -> {
            int batches = 0;
            while (!Thread.currentThread().isInterrupted()) {     // check the flag regularly
                batches++;
                try {
                    Thread.sleep(100);                             // blocking call: responds to interrupt
                } catch (InterruptedException e) {
                    System.out.println("Interrupted during sleep after " + batches + " batches");
                    Thread.currentThread().interrupt();            // restore the flag (it was cleared)
                }
            }
            System.out.println("Worker cleaning up and exiting");
        }, "batch-worker");

        worker.start();
        Thread.sleep(350);
        worker.interrupt();          // polite request to stop
        worker.join();               // wait for it to finish cleanly
        System.out.println("state = " + worker.getState());        // TERMINATED
    }
}
```

:::key Never swallow InterruptedException
When `InterruptedException` is thrown, the flag is **cleared**. If you catch it and do nothing, the cancellation request is lost and the thread may never stop — thread pools then fail to shut down. Either rethrow it or call `Thread.currentThread().interrupt()`.
:::

## Real-life example

:::analogy A tap on the shoulder
Interrupting a thread is like tapping a colleague on the shoulder to say "please wrap up" — they finish the sentence they're writing, save their work and leave. `stop()` was like pulling the power cable on their computer mid-save.
:::

## Interview questions

:::qa intermediate
? Explain the thread lifecycle in Java.
NEW (created) → RUNNABLE after `start()` (ready or running) → it may become BLOCKED (waiting for a monitor), WAITING (`wait`, `join`, `park` without timeout) or TIMED_WAITING (`sleep`, timed `wait`/`join`) and return to RUNNABLE → TERMINATED when `run()` ends.
--- followup Difference between BLOCKED and WAITING?
BLOCKED means the thread is trying to enter a `synchronized` block whose monitor another thread holds. WAITING means it voluntarily waits for another thread's action — a notify, a thread finishing (`join`), or an unpark — without a timeout.
:::

:::qa intermediate
? How do you stop a thread safely?
Use interruption (or a volatile flag): the owner calls `interrupt()`, the task checks `isInterrupted()` and handles `InterruptedException` from blocking calls, cleans up and returns. With executors, `future.cancel(true)` or `shutdownNow()` interrupt the worker threads.
:::

:::qa tricky
? Does Thread.sleep() release the lock?
No. A thread sleeping inside a `synchronized` block keeps holding the monitor; other threads stay BLOCKED. `wait()` is the method that releases the monitor.
:::

:::quiz
? What happens to the interrupt flag when `InterruptedException` is thrown?
- It stays set
+ It is cleared
- The thread terminates
- It becomes true for all threads
--- explain
Throwing `InterruptedException` clears the interrupted status, which is why handlers should restore it with `Thread.currentThread().interrupt()` if they don't propagate the exception.
:::
</script>

<script type="text/x-java-topic">
@id: synchronization
@module: concurrency
@title: Race Conditions & synchronized
@level: 4
@time: 28
@prereq: thread-lifecycle
@next: volatile-jmm
@tags: synchronized, race condition, critical section, monitor, intrinsic lock, mutual exclusion, reentrant, class lock, object lock, atomicity
===
## Introduction

When threads **share mutable data**, their operations can interleave in ways that corrupt it. `synchronized` is Java's built-in mechanism to make a block of code execute by **one thread at a time** (mutual exclusion) and to make changes **visible** to other threads.

## The race condition

```java title="RaceCondition.java"
public class RaceCondition {
    static int unsafeCount = 0;
    static int safeCount = 0;
    static final Object lock = new Object();

    public static void main(String[] args) throws InterruptedException {
        Runnable task = () -> {
            for (int i = 0; i < 100_000; i++) {
                unsafeCount++;                       // NOT atomic: read → add → write
                synchronized (lock) {                // critical section
                    safeCount++;
                }
            }
        };
        Thread a = new Thread(task), b = new Thread(task);
        a.start(); b.start();
        a.join(); b.join();
        System.out.println("unsafe = " + unsafeCount);   // usually less than 200000
        System.out.println("safe   = " + safeCount);     // always 200000
    }
}
```

`count++` compiles to three steps: **read** the value, **add** one, **write** it back. Two threads can both read 41, both compute 42, and both write 42 — one increment is lost.

| Time | Thread A | Thread B | count |
|---|---|---|---|
| 1 | read 41 | | 41 |
| 2 | | read 41 | 41 |
| 3 | write 42 | | 42 |
| 4 | | write 42 | **42** (should be 43) |

A **race condition** is any bug where correctness depends on the timing of threads. Common forms: *read-modify-write* (`count++`) and *check-then-act* (`if (!map.containsKey(k)) map.put(k, v)`).

## How synchronized works

Every Java object has an associated **monitor** (intrinsic lock).

- Entering `synchronized (obj)` acquires `obj`'s monitor; if another thread holds it, the entering thread becomes **BLOCKED** until it's released.
- Leaving the block — normally or by exception — releases the monitor automatically (the compiler emits `monitorenter`/`monitorexit`, with an exception handler that also exits).
- **Visibility:** releasing a monitor *happens-before* every subsequent acquisition of the same monitor, so all writes made inside the block are visible to the next thread that locks it.

```java
public synchronized void deposit(long amt) { … }         // locks 'this'
public static synchronized void audit() { … }            // locks Account.class (the class object)
public void transfer(long amt) {
    validate(amt);                                        // no lock needed here
    synchronized (this) { balance -= amt; }               // lock only the critical section
}
```

| Form | Lock object |
|---|---|
| `synchronized` instance method | `this` |
| `static synchronized` method | The `Class` object (`Account.class`) |
| `synchronized (x) { }` block | `x` |

Instance and static synchronised methods use **different** locks, so they don't exclude each other.

## Reentrancy

Intrinsic locks are **reentrant**: a thread already holding a monitor can acquire it again (a hold count is kept). Without this, a synchronised method calling another synchronised method on the same object would deadlock itself.

## Performance notes

- Uncontended locking is cheap on modern JVMs; contention (many threads fighting for one lock) is what hurts.
- Keep critical sections short; never do I/O or remote calls while holding a lock.
- Biased locking was disabled by default in Java 15 and removed later; lightweight (thin) locks and lock inflation to heavyweight monitors remain.
- In Java 21 virtual threads, blocking inside `synchronized` **pins** the carrier thread (improved in Java 24, JEP 491).

## Real-life example

:::analogy A single-occupancy restroom
The key hangs by the door (the monitor). Whoever takes the key uses the room (critical section); others wait in line (BLOCKED). When the occupant leaves — even in a hurry (exception) — the key goes back on the hook. If the same person needs to step back in to grab their phone while still holding the key, they can (reentrancy).
:::

:::project Where race conditions hide in back-end code
- Singleton Spring beans with mutable instance fields (a `SimpleDateFormat` field is a classic — it isn't thread-safe; use `DateTimeFormatter`).
- "Generate next invoice number" with `max + 1` in Java — two requests get the same number. Use a database sequence, or a unique constraint plus retry.
- Check-then-act on stock: `if (stock >= qty) stock -= qty` across requests. Use DB row locks (`SELECT … FOR UPDATE`), optimistic locking (`@Version`), or atomic SQL updates (`UPDATE … SET qty = qty - ? WHERE qty >= ?`).

Remember that `synchronized` only protects within **one JVM**. With several service instances behind a load balancer you need database-level or distributed locking.
:::

## Common mistakes

:::mistake
- Synchronising on different objects for the same data (each thread locks something different → no exclusion).
- Locking on a publicly accessible object, a `String` literal, or a boxed `Integer` (shared/pooled objects → unexpected contention or deadlock).
- Synchronising writes but not reads — readers may see stale or partially updated state.
- Holding a lock while calling unknown code (callbacks, listeners) → deadlock risk.
:::

## Interview questions

:::qa basic
? What is a race condition?
A defect where the outcome depends on the unpredictable interleaving of threads accessing shared mutable state, e.g. two threads performing `count++` simultaneously and losing an update.
--- followup How do you prevent it?
Avoid shared mutable state (immutability, confinement to one thread), or protect it: `synchronized`/`Lock` for mutual exclusion, atomic classes for single variables, concurrent collections with atomic compound operations.
:::

:::qa intermediate
? What is the difference between a synchronized method and a synchronized block?
A synchronized method locks the whole method on `this` (or the Class object if static). A synchronized block locks only its body and lets you choose the lock object, enabling smaller critical sections and private lock objects that outside code can't interfere with.
--- followup Object-level lock vs class-level lock?
An object lock (`synchronized` instance method or `synchronized(this)`) is per instance: threads using different instances don't block each other. A class lock (`static synchronized` or `synchronized(X.class)`) is a single lock for the whole class.
:::

:::qa tricky
? Two threads call two different synchronized instance methods on the same object. Can they run concurrently? What if one method is static synchronized?
Not on the same object — both methods lock `this`. A static synchronized method locks the `Class` object instead, so it can run at the same time as an instance synchronized method.
:::

:::qa scenario
? Your service increments an in-memory `int requestCount` field from every request thread and the numbers are always lower than the access log. Why, and how do you fix it?
`requestCount++` is a non-atomic read-modify-write, so concurrent increments are lost (and without synchronisation, updates may not even be visible). Use an `AtomicLong`/`LongAdder`, or synchronise the increment. For metrics, Micrometer counters already handle this.
:::

:::quiz
? Which lock does `public static synchronized void f()` in class `Report` acquire?
- `this`
+ `Report.class`
- A new lock per call
- No lock
--- explain
Static synchronised methods lock on the `Class` object representing the class.
:::
</script>

<script type="text/x-java-topic">
@id: volatile-jmm
@module: concurrency
@title: volatile & the Java Memory Model
@level: 4
@time: 25
@prereq: synchronization
@next: wait-notify
@tags: volatile, visibility, java memory model, jmm, happens-before, reordering, cpu cache, double checked locking, safe publication
===
## Introduction

Synchronisation is about two different guarantees:

1. **Atomicity** — a group of operations happens as one indivisible step.
2. **Visibility and ordering** — when one thread writes a value, other threads actually **see** it, in the right order.

The **Java Memory Model (JMM)** (JSR-133, Java 5) defines the second. `volatile` is the lightest tool that provides visibility and ordering — but **not** atomicity.

## Why a thread might never see a write

CPUs have per-core caches and store buffers; compilers and the JIT reorder instructions and keep values in registers. Without synchronisation, the JMM allows a thread to keep reading a stale value forever.

```java title="VisibilityDemo.java"
public class VisibilityDemo {
    private static volatile boolean running = true;   // remove volatile and the loop may never stop

    public static void main(String[] args) throws InterruptedException {
        Thread worker = new Thread(() -> {
            long spins = 0;
            while (running) {          // without volatile, the JIT may hoist this read out of the loop
                spins++;
            }
            System.out.println("stopped after " + spins + " spins");
        });
        worker.start();
        Thread.sleep(500);
        running = false;               // volatile write: guaranteed to become visible to the worker
        worker.join();
    }
}
```

Without `volatile`, the JIT is allowed to transform `while (running)` into `if (running) while (true)` because nothing in the loop changes `running` from this thread's point of view.

## What volatile guarantees

- **Visibility:** a write to a volatile variable is visible to all subsequent reads of it by any thread.
- **Ordering (happens-before):** everything a thread did **before** writing a volatile variable is visible to another thread **after** it reads that variable. Volatile accesses cannot be reordered with surrounding reads/writes in ways that break this.
- **Atomic reads/writes of `long` and `double`:** non-volatile 64-bit writes may technically be split into two 32-bit halves ("word tearing"); volatile ones never are.

What volatile does **not** give: atomicity of compound actions. `volatileCount++` is still read-modify-write and still loses updates. Use `AtomicInteger` or a lock.

## Happens-before — the core rules

If action A *happens-before* B, B is guaranteed to see A's effects. Key rules:

| Rule | Meaning |
|---|---|
| Program order | Each action in a thread happens-before later actions in the same thread |
| Monitor lock | Unlocking a monitor happens-before every later lock of the same monitor |
| Volatile | A volatile write happens-before every later read of that variable |
| Thread start | `t.start()` happens-before any action in thread t |
| Thread join | All actions in t happen-before another thread returns from `t.join()` |
| Final fields | Constructor writes to final fields happen-before any thread sees the constructed object (if `this` didn't escape) |
| Transitivity | A hb B and B hb C ⇒ A hb C |
| Concurrency utilities | e.g. putting into a `BlockingQueue` or `ConcurrentHashMap` happens-before retrieving it |

## Double-checked locking — the classic

```java title="ConfigHolder.java"
public class ConfigHolder {
    private static volatile ConfigHolder instance;          // volatile is ESSENTIAL
    private final String region;

    private ConfigHolder() { region = System.getProperty("app.region", "ap-south-1"); }

    public static ConfigHolder getInstance() {
        ConfigHolder local = instance;                       // one volatile read in the fast path
        if (local == null) {                                 // 1st check: no locking
            synchronized (ConfigHolder.class) {
                local = instance;
                if (local == null) {                         // 2nd check: under the lock
                    instance = local = new ConfigHolder();
                }
            }
        }
        return local;
    }

    public static void main(String[] args) {
        System.out.println(getInstance().region + " " + (getInstance() == getInstance()));
    }
}
```

Why volatile? `instance = new ConfigHolder()` involves allocate → initialise fields → assign reference. Without volatile, the assignment can become visible to another thread **before** initialisation completes, so it could see a non-null but half-constructed object. The volatile write orders the construction before publication. (The holder-class idiom or an enum is simpler — see [Singleton](#pattern-singleton).)

## volatile vs synchronized vs atomic

| | `volatile` | `synchronized` | `AtomicXxx` |
|---|---|---|---|
| Visibility | ✓ | ✓ | ✓ |
| Atomic compound ops | ✗ | ✓ | ✓ (single variable, CAS) |
| Blocking | Never | Yes (BLOCKED) | Never (spin/CAS) |
| Good for | Flags, published references, status | Multi-variable invariants | Counters, sequences, single-variable state |

## Real-life example

:::analogy A shared whiteboard vs private notebooks
Each worker copies figures from the office whiteboard into a private notebook and works from it (CPU cache/registers). If the manager updates the whiteboard, workers may keep using their stale notebook numbers. Marking a figure `volatile` means "always look at the whiteboard for this one, and write changes straight to it". But if two workers both read "41", add one and write "42", the whiteboard still ends up wrong — volatile doesn't make the *update* atomic.
:::

## Interview questions

:::qa advanced
? What does volatile do? Is it enough for a counter?
It guarantees visibility — writes are seen by subsequent reads in other threads — and establishes happens-before ordering so writes before a volatile write are visible after the volatile read. It does not make compound actions atomic, so `count++` on a volatile is still a race. Use `AtomicInteger`/`LongAdder` or a lock for counters.
--- followup When is volatile the right tool?
For a single variable written by one thread and read by many (stop flags, configuration references), or for safely publishing an immutable object by swapping a volatile reference, and in double-checked locking.
:::

:::qa advanced
? What is the happens-before relationship?
The JMM's rule for when one action's effects are guaranteed visible to another. Established by program order, monitor unlock→lock, volatile write→read, thread start and join, final-field construction, and the concurrency utilities, and it's transitive. Without a happens-before chain between a write and a read, the read may see a stale value.
:::

:::qa tricky
? Why is `volatile` needed in double-checked locking?
Because object construction and publication can be reordered: another thread may observe the non-null reference before the constructor's writes are visible, and use a partially initialised object. The volatile write/read pair creates a happens-before edge that prevents this.
:::

:::quiz
? Two threads each run `v++` 1000 times on `volatile int v = 0`. Final value?
- Always 2000
+ Any value up to 2000 (often less)
- Always 1000
- Compile error
--- explain
Volatile provides visibility but `v++` is read-modify-write; interleavings lose increments.
:::
</script>

@id: wait-notify
@module: concurrency
@title: wait(), notify() & Producer–Consumer
@level: 4
@time: 20
@prereq: synchronization
@next: locks
@tags: wait, notify, notifyall, producer consumer, spurious wakeup, monitor, sleep vs wait, condition, blockingqueue
===
## Introduction

Mutual exclusion stops threads from interfering; sometimes threads also need to **coordinate** — a consumer must wait until a producer has put something in a buffer. `wait()`, `notify()` and `notifyAll()` are the low-level, monitor-based coordination primitives built into every object.

## Rules

- They must be called while **holding the object's monitor** (inside `synchronized (obj)`), otherwise `IllegalMonitorStateException`.
- `obj.wait()` **releases** the monitor and suspends the thread (WAITING) until notified, interrupted, or (rarely) a **spurious wakeup**. Before returning, it re-acquires the monitor.
- `obj.notify()` wakes **one** arbitrary waiting thread; `notifyAll()` wakes **all**. The woken threads compete for the monitor after the notifier releases it.
- Always wait in a **`while` loop** that re-checks the condition.

## Bounded buffer — producer/consumer

```java title="BoundedBuffer.java"
import java.util.ArrayDeque;
import java.util.Queue;

public class BoundedBuffer<T> {
    private final Queue<T> items = new ArrayDeque<>();
    private final int capacity;

    public BoundedBuffer(int capacity) { this.capacity = capacity; }

    public synchronized void put(T item) throws InterruptedException {
        while (items.size() == capacity) {   // WHILE, not if: re-check after every wakeup
            wait();                           // releases the monitor while waiting
        }
        items.add(item);
        notifyAll();                          // wake consumers (and producers) to re-check
    }

    public synchronized T take() throws InterruptedException {
        while (items.isEmpty()) {
            wait();
        }
        T item = items.remove();
        notifyAll();                          // space is available now
        return item;
    }

    public static void main(String[] args) throws InterruptedException {
        BoundedBuffer<Integer> buf = new BoundedBuffer<>(2);
        Thread producer = new Thread(() -> {
            try { for (int i = 1; i <= 5; i++) { buf.put(i); System.out.println("put " + i); } }
            catch (InterruptedException e) { Thread.currentThread().interrupt(); }
        });
        Thread consumer = new Thread(() -> {
            try { for (int i = 1; i <= 5; i++) System.out.println("took " + buf.take()); }
            catch (InterruptedException e) { Thread.currentThread().interrupt(); }
        });
        producer.start(); consumer.start();
        producer.join(); consumer.join();
    }
}
```

### Why `while` and not `if`?

1. **Spurious wakeups** — the JVM/OS may wake a waiting thread without a notify.
2. **Stolen conditions** — between being notified and re-acquiring the monitor, another thread may take the item.
3. With `notifyAll`, both producers and consumers wake; each must check whether *its* condition holds.

### notify vs notifyAll

`notify()` wakes one arbitrary thread. If producers and consumers wait on the same monitor, `notify()` may wake the "wrong kind" (a producer when a consumer was needed), which goes back to waiting — and the notification is lost, potentially stalling everyone. `notifyAll()` is safer; `notify()` is only correct when all waiters are equivalent and any one of them can make progress.

## sleep() vs wait()

| | `Thread.sleep(ms)` | `obj.wait()` |
|---|---|---|
| Defined in | `Thread` (static) | `Object` |
| Requires the monitor? | No | **Yes** |
| Releases locks? | **No** | **Yes** (that object's monitor) |
| Wakes up when | Time elapses or interrupted | `notify`/`notifyAll`, timeout, interrupt, spurious wakeup |
| Purpose | Pause execution | Wait for a condition to change |

:::tip Prefer higher-level tools
In real code use `BlockingQueue` (`put`/`take` do all of the above for you), `CountDownLatch`, `Semaphore` or `Condition` objects from `java.util.concurrent.locks`. Interviewers still ask for wait/notify to test your understanding of monitors.
:::

## Interview questions

:::qa intermediate
? Why must wait() be called inside a synchronized block?
Because waiting is tied to a condition protected by the monitor. Holding the lock ensures the condition check and the call to `wait` are atomic with respect to notifiers, preventing lost notifications. The JVM enforces it with `IllegalMonitorStateException`.
--- followup Why are wait/notify defined in Object rather than Thread?
Any object can serve as a monitor; threads wait on a particular object's condition, not on a thread.
:::

:::qa intermediate
? Difference between sleep() and wait()?
`sleep` pauses the current thread for a time without releasing any locks and needs no monitor. `wait` must be called while holding the object's monitor, releases that monitor, and waits until notified, interrupted or timed out.
:::

:::qa intermediate
? notify() vs notifyAll()?
`notify` wakes a single arbitrary thread waiting on the monitor; `notifyAll` wakes all of them to compete for the lock. `notifyAll` avoids lost wake-ups when different kinds of waiters share a monitor; `notify` is an optimisation valid only when any single waiter can proceed.
:::

:::quiz
? What happens if `wait()` is called without holding the object's lock?
- It waits anyway
- Compile error
+ `IllegalMonitorStateException` at runtime
- Deadlock
--- explain
The JVM checks monitor ownership at runtime and throws `IllegalMonitorStateException`.
:::

:::exercise advanced
? Print odd and even numbers alternately with two threads
Thread "odd" prints 1, 3, 5… and thread "even" prints 2, 4, 6… up to 10, strictly alternating.
--- hints
- Share a counter and a lock object.
- Each thread waits while it isn't its turn (`counter % 2`), prints, increments, then `notifyAll()`.
--- solution
```java title="OddEven.java"
public class OddEven {
    private int counter = 1;
    private final int max = 10;

    private void print(int remainder) {
        synchronized (this) {
            while (counter <= max) {
                while (counter <= max && counter % 2 != remainder) {
                    try { wait(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }
                }
                if (counter <= max) {
                    System.out.println(Thread.currentThread().getName() + ": " + counter++);
                    notifyAll();
                }
            }
        }
    }

    public static void main(String[] args) throws InterruptedException {
        OddEven p = new OddEven();
        Thread odd = new Thread(() -> p.print(1), "odd");
        Thread even = new Thread(() -> p.print(0), "even");
        odd.start(); even.start();
        odd.join(); even.join();
    }
}
```
--- explanation
The inner `while` re-checks whose turn it is after every wakeup. The outer loop ends when the counter passes the maximum; the final `notifyAll()` lets the other thread observe that and exit instead of waiting forever.
--- complexity
O(n) prints; each number causes one wait/notify round-trip.
:::
</script>

@id: locks
@module: concurrency
@title: Lock, ReentrantLock & ReadWriteLock
@level: 4
@time: 22
@java: 5+
@prereq: synchronization, wait-notify
@next: atomics
@tags: lock, reentrantlock, trylock, lockinterruptibly, fairness, condition, readwritelock, reentrantreadwritelock, stampedlock, synchronized vs lock
===
## Introduction

`java.util.concurrent.locks` (Java 5) provides explicit lock objects with capabilities `synchronized` lacks: **timed and interruptible** acquisition, **try-lock**, optional **fairness**, **multiple condition queues**, and **read/write** separation.

## ReentrantLock

```java title="Account.java"
import java.util.concurrent.TimeUnit;
import java.util.concurrent.locks.ReentrantLock;

public class Account {
    private final ReentrantLock lock = new ReentrantLock();   // new ReentrantLock(true) for fairness
    private long balance = 1_000;

    public boolean withdraw(long amount) throws InterruptedException {
        if (!lock.tryLock(500, TimeUnit.MILLISECONDS)) {     // give up instead of waiting forever
            return false;
        }
        try {                                                  // ALWAYS lock → try → finally unlock
            if (balance < amount) return false;
            balance -= amount;
            return true;
        } finally {
            lock.unlock();
        }
    }

    public long balance() {
        lock.lock();
        try { return balance; } finally { lock.unlock(); }
    }

    public static void main(String[] args) throws InterruptedException {
        Account acc = new Account();
        System.out.println(acc.withdraw(300) + " " + acc.balance());   // true 700
    }
}
```

:::warn Unlock in finally, always
Unlike `synchronized`, an explicit lock is **not** released automatically. If an exception escapes between `lock()` and `unlock()` without a `finally`, the lock is held forever and every other thread blocks.
:::

## Condition — multiple wait sets

A `Condition` (from `lock.newCondition()`) is the explicit-lock equivalent of `wait/notify`, but you can have several per lock — e.g. `notFull` and `notEmpty` in a bounded buffer — so you signal exactly the threads that care. Use `await()` / `signal()` / `signalAll()`, again inside a `while` loop. This is how `ArrayBlockingQueue` is implemented.

## ReadWriteLock

Many resources are read far more often than written. `ReentrantReadWriteLock` allows **many concurrent readers** or **one exclusive writer**.

```java
private final ReadWriteLock rw = new ReentrantReadWriteLock();
private Map<String, BigDecimal> rates = new HashMap<>();

public BigDecimal rate(String ccy) {
    rw.readLock().lock();
    try { return rates.get(ccy); } finally { rw.readLock().unlock(); }
}

public void refresh(Map<String, BigDecimal> fresh) {
    rw.writeLock().lock();
    try { rates = new HashMap<>(fresh); } finally { rw.writeLock().unlock(); }
}
```

Note: a read lock can't be upgraded to a write lock (attempting it deadlocks); downgrading (write → read) is allowed. `StampedLock` (Java 8) adds **optimistic reads** for even higher read throughput but is not reentrant.

## synchronized vs Lock

| Feature | `synchronized` | `ReentrantLock` |
|---|---|---|
| Acquire/release | Automatic (block structure) | Manual `lock()`/`unlock()` in `finally` |
| Reentrant | Yes | Yes |
| Try without blocking | No | `tryLock()` |
| Timeout | No | `tryLock(time, unit)` |
| Interruptible while waiting | No | `lockInterruptibly()` |
| Fairness option | No | `new ReentrantLock(true)` |
| Condition queues | One (`wait`/`notify`) | Many (`newCondition()`) |
| Lock across methods | No (block-scoped) | Yes (acquire in one method, release in another — use carefully) |
| Diagnostics | Thread dumps | `isLocked()`, `getQueueLength()`, `hasQueuedThreads()` |
| Simplicity / safety | Higher | Lower (easy to forget unlock) |

:::tip Rule of thumb
Use `synchronized` by default — it's simpler and can't leak a lock. Reach for `ReentrantLock` when you need tryLock/timeouts, interruptibility, fairness or multiple conditions. (Before Java 24, `ReentrantLock` was also preferred with virtual threads to avoid pinning.)
:::

## Interview questions

:::qa intermediate
? Difference between synchronized and ReentrantLock?
Both are reentrant mutual-exclusion locks with the same memory semantics. `ReentrantLock` adds `tryLock` (optionally timed), interruptible acquisition, a fairness policy, multiple `Condition`s and introspection, at the cost of manual unlocking in `finally`. `synchronized` is simpler and releases automatically.
--- followup What is a fair lock? Why not always use it?
A fair lock grants access in roughly FIFO order of requests, preventing starvation. It's significantly slower under contention because it prevents "barging" (a running thread grabbing a just-released lock), causing more context switches.
:::

:::qa intermediate
? When would you use a ReadWriteLock?
When a shared resource is read frequently and written rarely, and reads take long enough that letting them proceed in parallel matters — e.g. an in-memory configuration or reference-data cache. For very short reads, a `ConcurrentHashMap` or a volatile reference to an immutable snapshot is often simpler and faster.
:::

:::quiz
? Which feature is available with `ReentrantLock` but not with `synchronized`?
- Reentrancy
- Mutual exclusion
+ Timed `tryLock`
- Memory visibility guarantees
--- explain
Both provide reentrancy, exclusion and visibility; only explicit locks offer non-blocking and timed acquisition.
:::
</script>

@id: atomics
@module: concurrency
@title: Atomic Variables & CAS
@level: 4
@time: 15
@prereq: volatile-jmm
@next: executors
@tags: atomicinteger, atomiclong, atomicreference, cas, compare and swap, longadder, lock free, aba problem
===
## Introduction

For a **single variable**, locking is often overkill. The `java.util.concurrent.atomic` classes (`AtomicInteger`, `AtomicLong`, `AtomicBoolean`, `AtomicReference`, arrays and field updaters) provide **lock-free**, thread-safe operations built on the CPU's **compare-and-swap (CAS)** instruction.

## How CAS works

`compareAndSet(expected, newValue)` atomically: *if the current value equals `expected`, set it to `newValue` and return true; otherwise return false.* Higher-level operations retry in a loop:

```java
// conceptually, AtomicInteger.incrementAndGet()
int current, next;
do {
    current = get();              // volatile read
    next = current + 1;
} while (!compareAndSet(current, next));   // retry if another thread changed it meanwhile
return next;
```

No thread ever blocks; a thread that loses the race simply retries. On x86 this maps to `LOCK CMPXCHG` (increments often to `LOCK XADD`).

```java title="AtomicDemo.java"
import java.util.concurrent.atomic.AtomicInteger;
import java.util.concurrent.atomic.AtomicReference;
import java.util.concurrent.atomic.LongAdder;

public class AtomicDemo {
    record Config(String region, int timeoutMs) {}

    public static void main(String[] args) throws InterruptedException {
        AtomicInteger orderSeq = new AtomicInteger(1000);
        LongAdder requests = new LongAdder();                    // best for high-contention counters

        Runnable r = () -> {
            for (int i = 0; i < 10_000; i++) {
                orderSeq.incrementAndGet();
                requests.increment();
            }
        };
        Thread a = new Thread(r), b = new Thread(r);
        a.start(); b.start(); a.join(); b.join();
        System.out.println(orderSeq.get() + " " + requests.sum());   // 21000 20000

        AtomicReference<Config> cfg = new AtomicReference<>(new Config("ap-south-1", 3000));
        cfg.updateAndGet(c -> new Config(c.region(), c.timeoutMs() * 2));   // atomic functional update
        System.out.println(cfg.get());                                   // Config[region=ap-south-1, timeoutMs=6000]

        AtomicInteger max = new AtomicInteger();
        max.accumulateAndGet(42, Math::max);                             // atomic max
        System.out.println(max.get());
    }
}
```

## LongAdder vs AtomicLong

Under heavy contention, many threads CAS-ing one memory location keep failing and retrying. **`LongAdder`** (Java 8) spreads updates over multiple cells (one per contending thread, roughly) and sums them on `sum()`. Writes scale much better; reads are slightly more expensive and `sum()` is not an atomic snapshot. Use it for statistics and metrics; use `AtomicLong` when you need `compareAndSet` or exact sequential values (ID generation).

## The ABA problem

CAS checks only that the value is *the same*, not that it *hasn't changed*: a value A → B → A looks unchanged. This matters for lock-free data structures with reused nodes. `AtomicStampedReference` pairs the reference with a version stamp to detect it.

## Interview questions

:::qa intermediate
? How does AtomicInteger achieve thread safety without locks?
It stores the value in a volatile field and updates it with hardware compare-and-swap in a retry loop: read the current value, compute the new one, and CAS it in only if nobody changed it meanwhile. This is lock-free — no thread blocks — and provides visibility through volatile semantics.
--- followup When is CAS worse than a lock?
Under very high contention on one variable, threads waste CPU in repeated failed CAS attempts. `LongAdder` or reducing sharing helps; for multi-variable invariants you need a lock anyway.
:::

:::qa tricky
? What is the ABA problem?
A CAS succeeds because a value appears unchanged even though it changed from A to B and back to A in between, which can corrupt lock-free structures. Solved with version stamps (`AtomicStampedReference`) or GC-based memory safety.
:::

:::quiz
? Best choice for a hit counter incremented by hundreds of request threads and read once a minute?
- `volatile long`
- `synchronized` method
+ `LongAdder`
- `AtomicReference<Long>`
--- explain
`LongAdder` minimises contention by striping updates across cells; reading via `sum()` occasionally is cheap enough.
:::
</script>

@id: executors
@module: concurrency
@title: ExecutorService, Thread Pools, Callable & Future
@level: 4
@time: 30
@prereq: threads-basics, atomics
@next: completablefuture
@tags: executorservice, thread pool, threadpoolexecutor, callable, future, fixedthreadpool, cachedthreadpool, scheduledexecutorservice, rejectedexecutionhandler, shutdown, core pool size, queue
===
## Introduction

Creating a new thread per task is expensive (an OS thread plus a stack of ~1 MB) and dangerous (unbounded threads exhaust memory). The **Executor framework** (Java 5) separates **what** to run (tasks) from **how** it runs (a managed pool of reusable worker threads).

## Basic usage

```java title="PoolDemo.java"
import java.util.List;
import java.util.concurrent.*;

public class PoolDemo {
    public static void main(String[] args) throws Exception {
        ExecutorService pool = Executors.newFixedThreadPool(4);
        try {
            Future<String> f = pool.submit(() -> {             // Callable<String>
                Thread.sleep(200);
                return "invoice-pdf-ready";
            });
            System.out.println("submitted, doing other work…");
            System.out.println(f.get(2, TimeUnit.SECONDS));      // blocks with a timeout

            List<Callable<Integer>> jobs = List.of(() -> 1, () -> 2, () -> 3);
            int sum = 0;
            for (Future<Integer> r : pool.invokeAll(jobs)) sum += r.get();   // run all, wait for all
            System.out.println("sum = " + sum);
        } finally {
            pool.shutdown();                                     // stop accepting; finish queued tasks
            if (!pool.awaitTermination(5, TimeUnit.SECONDS)) {
                pool.shutdownNow();                              // interrupt running tasks
            }
        }
    }
}
```

## Future

`Future<V>` represents a pending result: `get()` (blocks), `get(timeout, unit)`, `isDone()`, `cancel(mayInterrupt)`. If the task threw, `get()` throws `ExecutionException` wrapping the cause. Its weakness: you can't attach callbacks or combine futures without blocking — solved by `CompletableFuture`.

## ThreadPoolExecutor — what the factory methods really create

```java
new ThreadPoolExecutor(
    corePoolSize,          // threads kept alive even when idle
    maximumPoolSize,       // upper limit of threads
    keepAliveTime, unit,   // idle time before non-core threads die
    workQueue,             // where tasks wait
    threadFactory,         // names threads, sets daemon status
    rejectedExecutionHandler);  // what to do when saturated
```

How a submitted task is handled:

:::flow
fewer than core threads running? :: start a new thread for the task
* otherwise :: offer the task to the queue
queue full? :: start a new thread if fewer than max threads
max reached and queue full :: reject → RejectedExecutionHandler
:::

:::warn Counter-intuitive consequence
Threads beyond the core size are created **only when the queue is full**. With an **unbounded** queue (`LinkedBlockingQueue` without capacity), the pool never grows past core size, and the queue can grow until `OutOfMemoryError`.
:::

| Factory | Configuration | Risk |
|---|---|---|
| `newFixedThreadPool(n)` | core = max = n, **unbounded** queue | Queue grows without limit under overload |
| `newCachedThreadPool()` | core 0, max `Integer.MAX_VALUE`, `SynchronousQueue` | Unbounded **threads** under load |
| `newSingleThreadExecutor()` | 1 thread, unbounded queue | Sequential; same queue risk |
| `newScheduledThreadPool(n)` | Delayed/periodic tasks | — |
| `newWorkStealingPool()` | `ForkJoinPool` | CPU-bound tasks |
| `newVirtualThreadPerTaskExecutor()` | **Java 21**: one virtual thread per task | Great for blocking I/O; not for CPU-bound work |

**Rejection policies:** `AbortPolicy` (default: throws `RejectedExecutionException`), `CallerRunsPolicy` (the submitting thread runs the task — natural back-pressure), `DiscardPolicy`, `DiscardOldestPolicy`.

## Sizing a pool

- **CPU-bound** work: about the number of cores (`Runtime.getRuntime().availableProcessors()`), maybe +1.
- **I/O-bound** work: more threads, roughly `cores × (1 + waitTime / computeTime)`. Then measure. Or use virtual threads (Java 21).

```java
ThreadPoolExecutor reportPool = new ThreadPoolExecutor(
    4, 8, 60, TimeUnit.SECONDS,
    new ArrayBlockingQueue<>(100),                      // bounded queue
    r -> { Thread t = new Thread(r, "report-" + System.nanoTime()); t.setDaemon(false); return t; },
    new ThreadPoolExecutor.CallerRunsPolicy());          // back-pressure instead of failure
```

## Real-life example

:::analogy A call centre
Creating a thread per task is hiring a new agent for every incoming call and firing them afterwards. A thread pool is a call centre with a fixed team (core), a waiting queue with hold music (work queue), temporary staff called in only when the queue overflows (max pool), and a message "all agents are busy, try later" when even that's full (rejection policy).
:::

:::project Executors in Spring Boot
`@Async` runs on a `ThreadPoolTaskExecutor` (configure core/max/queue in `application.yml` via `spring.task.execution.pool.*`); `@Scheduled` on a `ThreadPoolTaskScheduler`. Always give pools meaningful thread names (they appear in logs and thread dumps), bounded queues, and a rejection strategy; and propagate context (MDC, security) with a `TaskDecorator`. With Spring Boot 3.2+ on Java 21, `spring.threads.virtual.enabled=true` switches Tomcat and task executors to virtual threads.
:::

## Common mistakes

:::mistake
- Never calling `shutdown()` — non-daemon pool threads keep the JVM alive.
- `Executors.newFixedThreadPool` with an unbounded queue in a server under load → memory exhaustion instead of back-pressure.
- Calling `future.get()` without a timeout on a request thread.
- Submitting a `Runnable` whose exception disappears: exceptions from `submit()`-ed tasks are captured in the Future and only visible via `get()`. Use `execute()` (hits the uncaught-exception handler) or handle inside the task.
- Using a pool's threads to wait on tasks submitted to the same small pool → thread-starvation deadlock.
:::

## Interview questions

:::qa intermediate
? Why use a thread pool instead of creating threads?
Reusing threads avoids creation/destruction overhead, bounds the number of concurrent threads (protecting memory and CPU), provides queuing and rejection policies for overload, and centralises lifecycle management (shutdown) and monitoring.
--- followup What's the difference between submit() and execute()?
`execute(Runnable)` returns nothing; an exception goes to the thread's uncaught-exception handler. `submit()` accepts `Runnable` or `Callable`, returns a `Future`, and captures any exception inside it (thrown from `get()` as `ExecutionException`).
--- followup shutdown() vs shutdownNow()?
`shutdown()` stops accepting new tasks and lets queued and running tasks complete. `shutdownNow()` also attempts to interrupt running tasks and returns the list of tasks that never started.
:::

:::qa advanced
? Explain ThreadPoolExecutor's parameters and the order in which it uses threads and the queue.
core size, max size, keep-alive, work queue, thread factory and rejection handler. A new task starts a thread if fewer than core threads exist; otherwise it's queued; if the queue is full, a new thread is started up to max; if max is reached, the rejection handler runs. Non-core threads idle longer than keep-alive are terminated.
--- followup Why might a pool never exceed its core size even under heavy load?
Because its queue is unbounded — the queue never reports "full", so extra threads are never created.
:::

:::qa scenario
? A service calls three independent external APIs per request sequentially (300 ms each). How do you cut latency?
Run the calls concurrently on a bounded executor (or virtual threads) using `CompletableFuture.supplyAsync(…, executor)` for each, then `allOf(...).join()` and combine results — total ≈ the slowest call (~300 ms) instead of the sum (~900 ms). Add timeouts (`orTimeout`) and fallbacks for failures.
:::

:::quiz
? Default rejection policy of `ThreadPoolExecutor`?
+ `AbortPolicy` — throws `RejectedExecutionException`
- `CallerRunsPolicy`
- `DiscardPolicy`
- Blocks the caller until space frees up
--- explain
The default handler aborts by throwing. `CallerRunsPolicy` is a common choice when you want back-pressure instead.
:::
</script>

<script type="text/x-java-topic">
@id: completablefuture
@module: concurrency
@title: CompletableFuture & Asynchronous Pipelines
@level: 4
@time: 25
@java: 8+
@prereq: executors, lambdas
@next: synchronizers
@tags: completablefuture, supplyasync, thenapply, thencompose, thencombine, allof, anyof, exceptionally, handle, ortimeout, async, non-blocking
===
## Introduction

`CompletableFuture<T>` (Java 8) is a `Future` you can **compose**: attach callbacks, chain dependent steps, combine independent results and handle errors — without blocking a thread while waiting. It brings a functional, pipeline style to asynchronous code.

## Building pipelines

```java title="CfDemo.java"
import java.util.concurrent.*;

public class CfDemo {
    static String fetchUser(long id) { sleep(200); return "user-" + id; }
    static int fetchCredit(String user) { sleep(150); return 50_000; }
    static double fetchRate() { sleep(100); return 1.18; }
    static void sleep(long ms) { try { Thread.sleep(ms); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } }

    public static void main(String[] args) {
        ExecutorService io = Executors.newFixedThreadPool(4);   // don't rely on the common pool for blocking I/O
        try {
            CompletableFuture<String> user = CompletableFuture.supplyAsync(() -> fetchUser(7), io);

            CompletableFuture<Integer> credit = user
                .thenApplyAsync(String::toUpperCase, io)                              // transform
                .thenCompose(u -> CompletableFuture.supplyAsync(() -> fetchCredit(u), io));  // dependent async step

            CompletableFuture<Double> rate = CompletableFuture.supplyAsync(CfDemo::fetchRate, io);

            CompletableFuture<String> summary = credit
                .thenCombine(rate, (c, r) -> "limit incl. tax = " + c * r)          // combine two independent results
                .orTimeout(2, TimeUnit.SECONDS)                                     // Java 9
                .exceptionally(ex -> "fallback: " + ex.getClass().getSimpleName()); // recover

            System.out.println(summary.join());       // join(): like get() but throws unchecked CompletionException

            CompletableFuture<Void> all = CompletableFuture.allOf(user, rate);
            all.thenRun(() -> System.out.println("both done")).join();
        } finally {
            io.shutdown();
        }
    }
}
```

## Method families

| Method | Input → output | Analogy |
|---|---|---|
| `supplyAsync(supplier[, executor])` / `runAsync` | Start async work | — |
| `thenApply(fn)` | T → U | `map` |
| `thenCompose(fn)` | T → `CompletableFuture<U>` | `flatMap` (avoids nested futures) |
| `thenCombine(other, bifn)` | (T, U) → V | zip two independent results |
| `thenAccept(consumer)` / `thenRun(runnable)` | Consume / side effect | — |
| `allOf(...)` / `anyOf(...)` | Wait for all / first | — |
| `exceptionally(fn)` | Throwable → T | catch |
| `handle(bifn)` / `whenComplete(biconsumer)` | (T, Throwable) → U / observe | finally-like |
| `orTimeout` / `completeOnTimeout` (Java 9) | Timeouts | — |

**Async suffix:** `thenApply` runs the callback on whichever thread completes the previous stage (or the caller if already complete); `thenApplyAsync` submits it to an executor (the common `ForkJoinPool` unless you pass one).

:::warn The common pool and blocking calls
Without an explicit executor, async stages run on `ForkJoinPool.commonPool()`, sized to *cores − 1* and shared by parallel streams and the whole JVM. Blocking I/O there can starve everything else. Pass a dedicated executor for I/O-bound work.
:::

## Error handling

Exceptions skip subsequent `thenApply`/`thenCompose` stages and propagate to the first `exceptionally`/`handle`/`whenComplete`. `join()` wraps them in `CompletionException`; `get()` in `ExecutionException`.

## Real-life example

:::analogy Ordering at a food court
You order a burger, fries and a drink at three counters at once (supplyAsync ×3), get a buzzer for each (futures), and combine them on your tray when all buzz (allOf/thenCombine). If the fries counter runs out, you accept a salad instead (exceptionally). You don't stand frozen at one counter while the others finish.
:::

:::project
Aggregation endpoints (a dashboard needing orders, invoices and payments from three services) use `CompletableFuture` to fan out calls in parallel and combine results. Spring's `@Async` methods can return `CompletableFuture<T>`, and `WebClient` responses can be converted with `.toFuture()`.
:::

## Interview questions

:::qa intermediate
? Future vs CompletableFuture?
`Future` only lets you check or block for a result. `CompletableFuture` also implements `CompletionStage`: you can chain transformations, compose dependent async calls, combine independent ones, handle errors, apply timeouts, and complete it manually — all without blocking.
--- followup thenApply vs thenCompose?
`thenApply` maps the result with a synchronous function (T → U). `thenCompose` is for functions that themselves return a `CompletableFuture` (T → CF<U>) and flattens the result, avoiding `CompletableFuture<CompletableFuture<U>>`.
:::

:::qa advanced
? Which thread executes a CompletableFuture callback?
For non-async methods (`thenApply`), the thread that completes the previous stage, or the calling thread if it's already completed at registration time. For `*Async` methods, a thread from the given executor, or `ForkJoinPool.commonPool()` if none is given.
:::

:::quiz
? What does `CompletableFuture.allOf(a, b, c)` return?
- A future of a list of results
+ `CompletableFuture<Void>` that completes when all of them complete
- The first completed result
- A blocking call
--- explain
`allOf` returns `CompletableFuture<Void>`; read individual results from `a.join()`, `b.join()` etc. after it completes.
:::
</script>

@id: synchronizers
@module: concurrency
@title: CountDownLatch, CyclicBarrier, Semaphore & ThreadLocal
@level: 4
@time: 20
@prereq: executors
@next: concurrency-problems
@tags: countdownlatch, cyclicbarrier, semaphore, threadlocal, phaser, exchanger, rate limiting, memory leak, mdc
===
## Coordination utilities

| Utility | What it does | Reusable? | Typical use |
|---|---|---|---|
| `CountDownLatch(n)` | Threads `await()` until `countDown()` has been called n times | No (one-shot) | Wait for n services to initialise; start gate in tests |
| `CyclicBarrier(n)` | n threads wait for **each other** at a barrier, then all proceed (optional barrier action) | Yes | Phased parallel computations |
| `Semaphore(permits)` | Limits how many threads access a resource concurrently | Yes | Limit concurrent calls to a slow external API; connection limits |
| `Phaser` | Flexible, reusable barrier with dynamic parties | Yes | Multi-phase tasks |
| `Exchanger` | Two threads swap objects | Yes | Pipeline buffer swapping |

```java title="Coordination.java"
import java.util.concurrent.*;

public class Coordination {
    public static void main(String[] args) throws Exception {
        ExecutorService pool = Executors.newFixedThreadPool(4);

        // CountDownLatch: main waits until 3 warm-up tasks finish
        CountDownLatch ready = new CountDownLatch(3);
        for (String svc : new String[]{"cache", "db", "search"}) {
            pool.submit(() -> {
                System.out.println(svc + " warmed up");
                ready.countDown();
            });
        }
        ready.await(5, TimeUnit.SECONDS);
        System.out.println("all services ready");

        // Semaphore: at most 2 concurrent calls to a rate-limited partner API
        Semaphore permits = new Semaphore(2);
        for (int i = 1; i <= 4; i++) {
            int id = i;
            pool.submit(() -> {
                try {
                    permits.acquire();
                    try {
                        System.out.println("calling partner API #" + id);
                        Thread.sleep(100);
                    } finally {
                        permits.release();          // always release in finally
                    }
                } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
            });
        }

        // CyclicBarrier: 2 workers must both finish phase 1 before phase 2
        CyclicBarrier barrier = new CyclicBarrier(2, () -> System.out.println("--- phase 1 complete ---"));
        for (int w = 1; w <= 2; w++) {
            int id = w;
            pool.submit(() -> {
                try {
                    System.out.println("worker " + id + " phase 1");
                    barrier.await();
                    System.out.println("worker " + id + " phase 2");
                } catch (InterruptedException | BrokenBarrierException e) { Thread.currentThread().interrupt(); }
            });
        }
        pool.shutdown();
        pool.awaitTermination(5, TimeUnit.SECONDS);
    }
}
```

## ThreadLocal — per-thread variables

`ThreadLocal<T>` gives each thread its **own independent copy** of a value. Internally, each `Thread` has a `ThreadLocalMap` whose keys are (weak references to) `ThreadLocal` objects.

```java
private static final ThreadLocal<String> TENANT = new ThreadLocal<>();

void handle(Request r) {
    TENANT.set(r.header("X-Tenant"));
    try {
        service.process();            // deep code can read TENANT.get() without passing it around
    } finally {
        TENANT.remove();              // CRUCIAL in thread pools
    }
}
```

Uses: per-request context (user, tenant, correlation id), non-thread-safe objects cached per thread (historically `SimpleDateFormat`), transaction and security context in frameworks.

:::warn ThreadLocal leaks in thread pools
Pool threads live for the whole application. If you don't `remove()`, the value stays attached to the thread — leaking memory and, worse, **leaking one user's data into the next request** served by that thread. With application redeploys in servers, leaked values can also pin whole class loaders (metaspace leak).
:::

:::project
Spring's `SecurityContextHolder`, `TransactionSynchronizationManager`, `RequestContextHolder` and SLF4J's `MDC` (logging correlation ids) are all ThreadLocal-based — which is why the context "disappears" in `@Async` methods or `CompletableFuture` callbacks running on other threads unless you propagate it (e.g. `TaskDecorator`, `DelegatingSecurityContextExecutor`). Java 21 previews **Scoped Values** as a safer alternative, especially for virtual threads.
:::

## Interview questions

:::qa intermediate
? CountDownLatch vs CyclicBarrier?
A `CountDownLatch` lets one or more threads wait until a count reaches zero through `countDown()` calls from any threads; it's one-shot. A `CyclicBarrier` makes a fixed number of threads wait for each other at a common point, then releases them all; it resets and can be reused, and can run a barrier action.
:::

:::qa intermediate
? What is ThreadLocal and what's the risk of using it?
A variable with a separate value per thread, stored in the thread's own `ThreadLocalMap`. The risk is leaks in thread pools: without `remove()`, values persist across tasks on the same thread, leaking memory and possibly data between requests.
:::

:::quiz
? Which tool limits a resource to at most N concurrent users?
- `CountDownLatch`
- `CyclicBarrier`
+ `Semaphore`
- `ThreadLocal`
--- explain
A semaphore with N permits allows at most N threads past `acquire()` until they `release()`.
:::
</script>

@id: concurrency-problems
@module: concurrency
@title: Deadlock, Livelock & Starvation
@level: 4
@time: 20
@prereq: locks, synchronizers
@next: java8-overview
@tags: deadlock, livelock, starvation, lock ordering, coffman conditions, thread dump, jstack, trylock, thread safety checklist
===
## Deadlock

Two or more threads each hold a lock the other needs, and wait forever.

```java title="DeadlockDemo.java"
public class DeadlockDemo {
    static final Object ACCOUNT_A = new Object();
    static final Object ACCOUNT_B = new Object();

    static void transfer(Object from, Object to, String who) {
        synchronized (from) {
            sleep(50);                                    // widen the window
            synchronized (to) {
                System.out.println(who + " transferred");
            }
        }
    }

    static void sleep(long ms) { try { Thread.sleep(ms); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } }

    public static void main(String[] args) {
        // Thread 1 locks A then waits for B; thread 2 locks B then waits for A → deadlock
        Thread t1 = new Thread(() -> transfer(ACCOUNT_A, ACCOUNT_B, "T1"), "T1");
        Thread t2 = new Thread(() -> transfer(ACCOUNT_B, ACCOUNT_A, "T2"), "T2");
        t1.setDaemon(true); t2.setDaemon(true);           // so this demo can exit
        t1.start(); t2.start();
        sleep(500);
        System.out.println("T1 " + t1.getState() + ", T2 " + t2.getState());   // BLOCKED, BLOCKED
    }
}
```

### The four necessary conditions (Coffman)

1. **Mutual exclusion** — resources can't be shared.
2. **Hold and wait** — a thread holds one resource while waiting for another.
3. **No preemption** — locks can't be taken away.
4. **Circular wait** — T1 waits for T2 which waits for T1.

Break any one and deadlock is impossible.

### Prevention strategies

| Strategy | How |
|---|---|
| **Global lock ordering** (breaks circular wait) | Always acquire locks in a consistent order, e.g. by account id: `first = a.id < b.id ? a : b` |
| **Timeouts** (breaks hold-and-wait) | `tryLock(timeout)`; on failure release everything and retry with back-off |
| **Fewer locks / smaller scope** | Avoid nested locking; don't call external code while holding a lock |
| **Higher-level concurrency** | Concurrent collections, message passing, immutable data |
| **Database** | Update rows in a consistent order; keep transactions short (DBs detect deadlocks and abort one transaction) |

### Detecting a deadlock

Take a thread dump — `jstack <pid>`, `jcmd <pid> Thread.print`, or VisualVM/JMC. The JVM reports it directly:

```output
Found one Java-level deadlock:
=============================
"T2":
  waiting to lock monitor 0x... (object 0x..., a java.lang.Object),
  which is held by "T1"
"T1":
  waiting to lock monitor 0x... (object 0x..., a java.lang.Object),
  which is held by "T2"
```

Programmatically: `ManagementFactory.getThreadMXBean().findDeadlockedThreads()`.

## Livelock

Threads are not blocked — they keep **reacting to each other** and changing state, but no one makes progress. Example: two threads both detect a conflict, both back off and both retry at exactly the same moment, forever. Fix: add randomised back-off (jitter) or an ordering rule.

## Starvation

A thread never gets the resources it needs because others keep taking them: unfair locks under heavy contention, low priority threads, a long task hogging a single-threaded executor, or readers perpetually blocking a writer. Fixes: fair locks, bounded work per task, separate pools for different workloads.

## Comparison

| Problem | Threads state | Progress | Typical cause |
|---|---|---|---|
| Deadlock | Blocked forever | None | Circular lock wait |
| Livelock | Running (busy) | None | Symmetric retry/back-off |
| Starvation | Waiting / runnable | Some threads only | Unfair scheduling, greedy tasks |
| Race condition | Running | Wrong results | Unsynchronised shared state |

:::analogy
**Deadlock**: two cars meet on a one-lane bridge and neither will reverse. **Livelock**: two people in a corridor keep stepping to the same side to let each other pass. **Starvation**: a polite customer at a crowded counter who never gets served because others keep pushing ahead.
:::

## Interview questions

:::qa intermediate
? What is a deadlock and how do you prevent it?
A situation where threads wait forever for locks held by each other in a cycle. Prevent it by acquiring locks in a consistent global order, using `tryLock` with timeouts and backing off, minimising nested locks and lock scope, and preferring higher-level concurrency utilities.
--- followup How do you find one in production?
Take a thread dump (`jstack`/`jcmd Thread.print`) — the JVM detects Java-level monitor and `ReentrantLock` deadlocks and prints the involved threads and locks. Monitoring can call `ThreadMXBean.findDeadlockedThreads()`.
:::

:::qa intermediate
? Deadlock vs livelock vs starvation?
In a deadlock, threads are blocked waiting on each other permanently. In a livelock, threads are active but continually respond to each other without progress. In starvation, some threads are perpetually denied resources while others progress.
:::

:::qa experience
? You have a Spring Boot API receiving 10,000 concurrent requests. Which Java concepts would you consider for handling concurrency safely?
Keep beans stateless and use local variables (thread confinement); use immutable objects and records for shared data; `ConcurrentHashMap` with atomic `compute`/`merge` for in-memory caches; `AtomicLong`/`LongAdder` for counters; bounded, well-named thread pools with rejection/back-pressure for async work (or virtual threads on Java 21 for blocking I/O); timeouts on every remote call; `ThreadLocal` context cleaned in `finally`. Since `synchronized` only protects within one JVM and there are multiple instances, protect shared business data with database transactions, row locks or optimistic locking (`@Version`), unique constraints and idempotency keys. Finally, size the DB connection pool to the database's capacity, not the thread count.
:::

:::quiz
? Which strategy eliminates the circular-wait condition?
- Using more threads
+ Acquiring locks in a globally consistent order
- Making fields volatile
- Increasing the thread priority
--- explain
If every thread acquires locks in the same order, no cycle of waiting can form.
:::

:::exercise advanced
? Fix the deadlocking transfer
Rewrite `transfer(from, to, amount)` for accounts with numeric ids so that concurrent transfers A→B and B→A can never deadlock.
--- solution
```java title="SafeTransfer.java"
public class SafeTransfer {
    static class Account {
        final long id; long balance;
        Account(long id, long balance) { this.id = id; this.balance = balance; }
    }

    static void transfer(Account from, Account to, long amount) {
        Account first = from.id < to.id ? from : to;      // global order: lower id first
        Account second = from.id < to.id ? to : from;
        synchronized (first) {
            synchronized (second) {
                if (from.balance < amount) throw new IllegalStateException("insufficient");
                from.balance -= amount;
                to.balance += amount;
            }
        }
    }

    public static void main(String[] args) throws InterruptedException {
        Account a = new Account(1, 1000), b = new Account(2, 1000);
        Thread t1 = new Thread(() -> { for (int i = 0; i < 1000; i++) transfer(a, b, 1); });
        Thread t2 = new Thread(() -> { for (int i = 0; i < 1000; i++) transfer(b, a, 1); });
        t1.start(); t2.start(); t1.join(); t2.join();
        System.out.println(a.balance + " " + b.balance);   // 1000 1000
    }
}
```
--- explanation
Both threads lock the lower-id account first, so a cycle can't form. The business logic inside is unchanged.
:::
</script>
